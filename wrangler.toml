name = "libanapps"
main = "worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# الرابط الأساسي يبقى مفعّلاً مع كل نشر
workers_dev = true
preview_urls = false

# ملفات الموقع
[assets]
directory = "./public"
binding = "ASSETS"

# مهم: بدون هذين السطرين يصير تحويل لا نهائي
# لأن Cloudflare يحوّل /menu.html إلى /menu تلقائياً،
# والـworker يعيد menu.html لأي مسار غير موجود.
html_handling = "none"
not_found_handling = "none"

# المتغيرات (SUPABASE_URL / SUPABASE_SERVICE_KEY / WEBSITE_URL)
# تُضاف من لوحة Cloudflare ← Settings ← Variables and Secrets
# ولا تُكتب هنا أبداً، لأن هذا الملف يُرفع على GitHub.

# ============================================================
#  المتغيرات العادية — جزء من الكود، فما بتضيع مع أي نشر جديد
#  ملاحظة: SUPABASE_SERVICE_KEY ما بينحط هون أبداً.
#  هو Secret ومكانه لوحة Cloudflare فقط، لأن هذا الملف على GitHub.
# ============================================================
[vars]
SUPABASE_URL = "https://moriwmhlgugmjzddwfgv.supabase.co"
WEBSITE_URL  = "https://libanapps.com"
WHISH_ENV    = "production"

# الدخول بكود واتس اب (WHATSAPP-SETUP.md)
# WA_API_TOKEN ما بينحط هون أبداً — Secret بلوحة Cloudflare بس.
WA_PROVIDER  = "zavu"
WA_TEMPLATE  = "ks7e9y41mmj2gj90f50bv46s6x8f5yt4"   # ID قالب الكود بـZavu (AUTHENTICATION)
