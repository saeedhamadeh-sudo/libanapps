name = "libanapps"
main = "worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# الرابط الأساسي يبقى مفعّلاً مع كل نشر
workers_dev = true
preview_urls = false

# ملفات الموقع
[assets]
directory = "./public"
binding = "ASSETS"

# مهم: بدون هذين السطرين يصير تحويل لا نهائي
# لأن Cloudflare يحوّل /menu.html إلى /menu تلقائياً،
# والـworker يعيد menu.html لأي مسار غير موجود.
html_handling = "none"
not_found_handling = "none"

# المتغيرات (SUPABASE_URL / SUPABASE_SERVICE_KEY / WEBSITE_URL)
# تُضاف من لوحة Cloudflare ← Settings ← Variables and Secrets
# ولا تُكتب هنا أبداً، لأن هذا الملف يُرفع على GitHub.

# ============================================================
#  المتغيرات العادية — جزء من الكود، فما بتضيع مع أي نشر جديد
#  ملاحظة: SUPABASE_SERVICE_KEY ما بينحط هون أبداً.
#  هو Secret ومكانه لوحة Cloudflare فقط، لأن هذا الملف على GitHub.
# ============================================================
[vars]
SUPABASE_URL = "https://moriwmhlgugmjzddwfgv.supabase.co"
WEBSITE_URL  = "https://libanapps.com"
WHISH_ENV    = "production"
CF_ACCOUNT_ID = "08e240ed50582459acd86770aff8e187"   # للأنفاق (الوصول من برّا للنسخة المحلية) — مش سر

# الدخول بكود واتس اب عبر VerifyWay (api.verifyway.com)
# المفتاح VERIFYWAY_API_KEY ما بينحط هون أبداً — Secret بلوحة Cloudflare بس.
# تبويب الواتس اب بصفحة الدخول ما بيظهر قبل ما ينحط المفتاح.
WA_ENABLED   = "1"
WA_PROVIDER  = "verifyway"
WA_CHANNEL   = "whatsapp"

# إعلانات Meta (ads_read) — معرّف التطبيق مش سر.
# السر META_APP_SECRET ما بينحط هون أبداً — Secret بلوحة Cloudflare بس.
# بطاقة الإعلانات بتظهر برابط /account?ads=1 لحين موافقة Meta؛ بعدها: META_ADS_PUBLIC = "1"
META_APP_ID = "2480939732712696"
META_ADS_PUBLIC = "0"

# نسخ احتياطي تلقائي على Google Drive (موقع واحد كل ساعة إذا آخر نسخة أقدم من 20 ساعة)
[triggers]
crons = ["17 * * * *", "*/15 * * * *"]
