<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="flame">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم الرئيسية — itech</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Lalezar&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/themes.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;
  background-image:var(--glow);background-attachment:fixed}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:0}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 70px}
.bar{display:flex;align-items:center;gap:10px;padding:14px 0;flex-wrap:wrap}
.bar h1{font-size:26px;color:var(--accent);margin-inline-end:auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px}
.panel h3{font-size:20px;color:var(--accent);margin-bottom:10px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;outline:0}
input:focus,select:focus{border-color:var(--accent)}
.g2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.g3{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.btn{background:var(--brand);color:var(--brand-ink);border-radius:11px;padding:11px 18px;font-weight:800}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.y{background:var(--accent);color:#111}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.dg{background:transparent;border:1px solid rgba(228,20,27,.55);color:#FF7A7E}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px}
.tab{white-space:nowrap;background:var(--bg-2);border:1px solid var(--line);padding:8px 14px;
  border-radius:10px;font-weight:600;font-size:14px}
.tab[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--muted);font-size:12.5px;font-weight:600}
.key{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.5px;
  background:var(--bg-2);padding:3px 8px;border-radius:7px;display:inline-block;direction:ltr}
.tag{font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px;display:inline-block}
.ok{background:rgba(74,222,128,.15);color:#4ADE80}
.warn{background:rgba(255,212,0,.15);color:var(--accent)}
.bad{background:rgba(228,20,27,.15);color:#FF7A7E}
.muted{color:var(--muted);font-size:12.5px}
.msg{margin-top:10px;font-size:13.5px}
.msg.e{color:#FF7A7E}.msg.s{color:#4ADE80}
.login{max-width:360px;margin:12vh auto}
.hidden{display:none!important}
.copyrow{display:flex;gap:8px;align-items:center;margin-top:8px;background:var(--bg-2);
  border:1px dashed var(--line);border-radius:11px;padding:10px}
.copyrow b{flex:1;font-family:ui-monospace,monospace;direction:ltr;font-size:15px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters select,.filters input{width:auto;flex:1;min-width:130px}
</style>
</head>
<body>

<!-- login -->
<div class="wrap login" id="login">
  <div class="panel">
    <h3>لوحة التحكم الرئيسية</h3>
    <label>البريد الإلكتروني</label><input type="email" id="em" autocomplete="username">
    <label>كلمة المرور</label><input type="password" id="pw" autocomplete="current-password">
    <div class="acts"><button class="btn" id="loginBtn">دخول</button></div>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<!-- app -->
<div class="wrap hidden" id="app">
  <div class="bar">
    <h1>لوحة التحكم الرئيسية</h1>
    <span class="muted" id="who"></span>
    <button class="btn alt sm" id="outBtn">خروج</button>
  </div>

  <div class="tabs">
    <button class="tab" data-t="subs" aria-pressed="true">الاشتراكات</button>
    <button class="tab" data-t="clients" aria-pressed="false">الزبائن</button>
    <button class="tab" data-t="new" aria-pressed="false">إصدار ترخيص جديد</button>
  </div>

  <!-- SUBS -->
  <section data-p="subs">
    <div class="panel">
      <h3>الاشتراكات</h3>
      <div class="filters">
        <select id="fProd"><option value="">كل البرامج</option></select>
        <select id="fState">
          <option value="">كل الحالات</option>
          <option value="active">سارية</option>
          <option value="soon">تنتهي خلال ١٥ يوم</option>
          <option value="expired">منتهية</option>
          <option value="suspended">موقوفة</option>
        </select>
        <input type="text" id="fQ" placeholder="بحث باسم الزبون أو المفتاح">
      </div>
      <div style="overflow-x:auto">
        <table id="subsTbl"><tbody></tbody></table>
      </div>
    </div>
  </section>

  <!-- CLIENTS -->
  <section data-p="clients" class="hidden">
    <div class="panel">
      <h3>إضافة زبون</h3>
      <div class="g2">
        <div><label>الاسم</label><input type="text" id="cName"></div>
        <div><label>اسم المحل / المؤسسة</label><input type="text" id="cBiz"></div>
      </div>
      <div class="g2">
        <div><label>الهاتف</label><input type="text" id="cPhone"></div>
        <div><label>المنطقة</label><input type="text" id="cCity"></div>
      </div>
      <label>ملاحظات</label><input type="text" id="cNotes">
      <div class="acts"><button class="btn" id="addClient">حفظ الزبون</button></div>
      <div class="msg" id="cMsg"></div>
    </div>
    <div class="panel">
      <h3>الزبائن</h3>
      <div style="overflow-x:auto"><table id="clientsTbl"><tbody></tbody></table></div>
    </div>
  </section>

  <!-- NEW LICENSE -->
  <section data-p="new" class="hidden">
    <div class="panel">
      <h3>إصدار ترخيص جديد</h3>
      <div class="g2">
        <div><label>الزبون</label><select id="nClient"></select></div>
        <div><label>البرنامج</label><select id="nProd"></select></div>
      </div>
      <div class="g3">
        <div><label>المدة</label>
          <select id="nPlan">
            <option value="3">تجربة ٣ أيام</option>
            <option value="7">تجربة ٧ أيام</option>
            <option value="30">شهر</option>
            <option value="90">٣ أشهر</option>
            <option value="180">٦ أشهر</option>
            <option value="365" selected>سنة</option>
            <option value="730">سنتين</option>
          </select>
        </div>
        <div><label>السعر ($)</label><input type="number" id="nPrice" step="0.5" value="0"></div>
        <div><label>ملاحظة</label><input type="text" id="nNote"></div>
      </div>

      <!-- menu only -->
      <div id="menuBox" class="hidden">
        <div class="panel" style="background:var(--bg-2);margin-top:14px">
          <h3 style="font-size:17px">بيانات المطعم</h3>
          <div class="g2">
            <div><label>الرابط (بالإنكليزي، بدون مسافات)</label>
              <input type="text" id="rSlug" placeholder="hotzone">
              <div class="muted" id="slugPrev">libanapps.com/…</div></div>
            <div><label>الثيم</label>
              <select id="rTheme">
                <option value="flame">Flame — أسود وأحمر</option>
                <option value="clean">Clean — أبيض هادئ</option>
                <option value="wood">Wood — بني دافئ</option>
                <option value="neon">Neon — ألوان صارخة</option>
              </select></div>
          </div>
          <div class="g2">
            <div><label>اسم المطعم (عربي)</label><input type="text" id="rNameAr"></div>
            <div><label>اسم المطعم (إنكليزي)</label><input type="text" id="rNameEn"></div>
          </div>
          <div class="g2">
            <div><label>الهاتف</label><input type="text" id="rPhone"></div>
            <div><label>واتساب الطلبات (961…)</label><input type="text" id="rWa"></div>
          </div>
        </div>
      </div>

      <div class="acts"><button class="btn y" id="genBtn">توليد الترخيص</button></div>
      <div class="msg" id="nMsg"></div>
      <div id="result" class="hidden">
        <div class="copyrow"><b id="rKey"></b><button class="btn sm" data-copy="rKey">نسخ</button></div>
        <div class="copyrow hidden" id="linkRow"><b id="rLink"></b><button class="btn sm" data-copy="rLink">نسخ</button></div>
        <div class="muted" id="rInfo" style="margin-top:8px"></div>
      </div>
    </div>
  </section>
</div>

<script src="/assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var CFG=window.LIBANAPPS||{};
if(!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY){
  document.body.innerHTML='<p style="padding:40px;text-align:center">عبّي assets/config.js أولاً</p>';
  return;
}
var sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
var PRODUCTS=[], CLIENTS=[], SUBS=[];

/* ---------- login ---------- */
async function boot(){
  var s=await sb.auth.getSession();
  if(!s.data.session) return;
  var admin=await sb.rpc('is_admin');
  if(admin.error||!admin.data){
    $('#loginMsg').className='msg e';
    $('#loginMsg').textContent='هذا الحساب ليس مشرفاً. أضف الـUUID تبعك إلى platform_admins.';
    await sb.auth.signOut();
    return;
  }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').textContent=s.data.session.user.email;
  await loadAll();
}
$('#loginBtn').addEventListener('click',async function(){
  var m=$('#loginMsg'); m.className='msg'; m.textContent='…';
  var r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(r.error){ m.className='msg e'; m.textContent='بيانات الدخول غير صحيحة'; return; }
  m.textContent=''; boot();
});
$('#pw').addEventListener('keydown',function(e){ if(e.key==='Enter') $('#loginBtn').click(); });
$('#outBtn').addEventListener('click',async function(){ await sb.auth.signOut(); location.reload(); });

/* ---------- tabs ---------- */
$$('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    $$('.tab').forEach(function(x){x.setAttribute('aria-pressed',x===t)});
    $$('[data-p]').forEach(function(p){p.classList.toggle('hidden',p.dataset.p!==t.dataset.t)});
  });
});

/* ---------- load ---------- */
async function loadAll(){
  var p=await sb.from('products').select('*').order('code');
  PRODUCTS=p.data||[];
  var opts=PRODUCTS.map(function(x){return '<option value="'+x.code+'">'+esc(x.name_ar)+'</option>'}).join('');
  $('#nProd').innerHTML=opts;
  $('#fProd').innerHTML='<option value="">كل البرامج</option>'+opts;
  await loadClients();
  await loadSubs();
  toggleMenuBox();
}
async function loadClients(){
  var r=await sb.from('clients').select('*').order('created_at',{ascending:false});
  CLIENTS=r.data||[];
  $('#nClient').innerHTML=CLIENTS.map(function(c){
    return '<option value="'+c.id+'">'+esc(c.name)+(c.business?' — '+esc(c.business):'')+'</option>'}).join('');
  var b=$('#clientsTbl').querySelector('tbody');
  b.innerHTML='<tr><th>الاسم</th><th>المؤسسة</th><th>الهاتف</th><th>المنطقة</th><th>البرامج</th></tr>'+
    CLIENTS.map(function(c){
      var n=SUBS.filter(function(s){return s.client_id===c.id}).length;
      return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.business||'—')+'</td>'+
        '<td style="direction:ltr">'+esc(c.phone||'—')+'</td><td>'+esc(c.city||'—')+'</td>'+
        '<td>'+n+'</td></tr>';
    }).join('');
}
async function loadSubs(){
  var r=await sb.from('subscriptions').select('*, clients(name,business,phone)')
        .order('expires_at',{ascending:true});
  SUBS=r.data||[];
  paintSubs();
}
function daysLeft(d){ return Math.ceil((new Date(d)-new Date())/86400000); }
function paintSubs(){
  var fp=$('#fProd').value, fs=$('#fState').value, q=$('#fQ').value.trim().toLowerCase();
  var rows=SUBS.filter(function(s){
    if(fp&&s.product_code!==fp) return false;
    var d=daysLeft(s.expires_at);
    if(fs==='active'&&(s.status!=='active'||d<0)) return false;
    if(fs==='soon'&&!(s.status==='active'&&d>=0&&d<=15)) return false;
    if(fs==='expired'&&d>=0) return false;
    if(fs==='suspended'&&s.status!=='suspended') return false;
    if(q){
      var hay=((s.clients&&s.clients.name)||'')+' '+((s.clients&&s.clients.business)||'')+' '+s.key;
      if(hay.toLowerCase().indexOf(q)<0) return false;
    }
    return true;
  });
  var pn={};PRODUCTS.forEach(function(p){pn[p.code]=p.name_ar});
  var b=$('#subsTbl').querySelector('tbody');
  b.innerHTML='<tr><th>الزبون</th><th>البرنامج</th><th>المفتاح</th><th>الحالة</th><th>الجهاز</th><th></th></tr>'+
    (rows.length?rows.map(function(s){
      var d=daysLeft(s.expires_at), cls, txt;
      if(s.status==='suspended'){cls='bad';txt='موقوف';}
      else if(d<0){cls='bad';txt='منتهي من '+(-d)+' يوم';}
      else if(d<=15){cls='warn';txt='باقي '+d+' يوم';}
      else {cls='ok';txt='باقي '+d+' يوم';}
      return '<tr><td>'+esc((s.clients&&s.clients.name)||'—')+
        '<div class="muted">'+esc((s.clients&&s.clients.business)||'')+'</div></td>'+
        '<td>'+esc(pn[s.product_code]||s.product_code)+
        (s.ref_slug?'<div class="muted">/'+esc(s.ref_slug)+'</div>':'')+'</td>'+
        '<td><span class="key">'+esc(s.key)+'</span></td>'+
        '<td><span class="tag '+cls+'">'+txt+'</span>'+
        '<div class="muted">'+new Date(s.expires_at).toLocaleDateString('en-GB')+'</div></td>'+
        '<td class="muted">'+(s.device_id?'مربوط':'غير مفعّل')+'</td>'+
        '<td style="white-space:nowrap">'+
          '<button class="btn alt sm" data-x="'+s.id+'" data-d="30">+شهر</button> '+
          '<button class="btn alt sm" data-x="'+s.id+'" data-d="365">+سنة</button> '+
          '<button class="btn alt sm" data-rst="'+s.id+'">فك الجهاز</button> '+
          '<button class="btn dg sm" data-sus="'+s.id+'" data-cur="'+s.status+'">'+
            (s.status==='active'?'إيقاف':'تفعيل')+'</button>'+
        '</td></tr>';
    }).join('') : '<tr><td colspan="6" class="muted" style="padding:20px">ما في نتائج</td></tr>');
}
['#fProd','#fState','#fQ'].forEach(function(s){
  $(s).addEventListener('input',paintSubs); $(s).addEventListener('change',paintSubs);
});
$('#subsTbl').addEventListener('click',async function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.x){
    await sb.rpc('extend_subscription',{p_id:b.dataset.x,p_days:Number(b.dataset.d)});
  }else if(b.dataset.rst){
    if(!confirm('فك ربط الجهاز؟ الزبون رح يقدر يفعّل على كمبيوتر جديد.')) return;
    await sb.rpc('reset_device',{p_id:b.dataset.rst});
  }else if(b.dataset.sus){
    var next=b.dataset.cur==='active'?'suspended':'active';
    if(next==='suspended'&&!confirm('إيقاف الاشتراك؟ البرنامج رح يتقفل عند الزبون.')) return;
    await sb.from('subscriptions').update({status:next}).eq('id',b.dataset.sus);
  }
  await loadSubs();
});

/* ---------- add client ---------- */
$('#addClient').addEventListener('click',async function(){
  var m=$('#cMsg'); m.className='msg';
  var name=$('#cName').value.trim();
  if(!name){ m.className='msg e'; m.textContent='اكتب اسم الزبون'; return; }
  var r=await sb.from('clients').insert({
    name:name, business:$('#cBiz').value.trim(), phone:$('#cPhone').value.trim(),
    city:$('#cCity').value.trim(), notes:$('#cNotes').value.trim()
  });
  if(r.error){ m.className='msg e'; m.textContent='ما انحفظ: '+r.error.message; return; }
  m.className='msg s'; m.textContent='تم حفظ الزبون';
  ['#cName','#cBiz','#cPhone','#cCity','#cNotes'].forEach(function(s){$(s).value=''});
  await loadClients();
});

/* ---------- generate ---------- */
function toggleMenuBox(){
  $('#menuBox').classList.toggle('hidden', $('#nProd').value!=='menu');
}
$('#nProd').addEventListener('change',toggleMenuBox);
$('#rSlug').addEventListener('input',function(){
  var v=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'');
  this.value=v; $('#slugPrev').textContent='libanapps.com/'+(v||'…');
});

$('#genBtn').addEventListener('click',async function(){
  var m=$('#nMsg'); m.className='msg'; m.textContent='…';
  $('#result').classList.add('hidden'); $('#linkRow').classList.add('hidden');
  var client=$('#nClient').value, prod=$('#nProd').value, days=Number($('#nPlan').value);
  if(!client){ m.className='msg e'; m.textContent='اختار زبون أولاً (أو ضيف واحد من تبويب الزبائن)'; return; }

  try{
    if(prod==='menu'){
      var slug=$('#rSlug').value.trim();
      var nameAr=$('#rNameAr').value.trim();
      if(!slug||!nameAr) throw new Error('عبّي رابط المطعم واسمه');
      var r=await sb.rpc('new_restaurant',{
        p_client:client, p_slug:slug, p_name_ar:nameAr,
        p_name_en:$('#rNameEn').value.trim(), p_phone:$('#rPhone').value.trim(),
        p_whatsapp:$('#rWa').value.trim(), p_theme:$('#rTheme').value,
        p_days:days, p_price:Number($('#nPrice').value)||0
      });
      if(r.error) throw r.error;
      show(r.data.key, 'https://libanapps.com/'+r.data.slug, r.data.expires_at);
    }else{
      var s=await sb.rpc('new_subscription',{
        p_client:client, p_product:prod,
        p_plan: days<=7?'trial':(days<=31?'monthly':'yearly'),
        p_days:days, p_price:Number($('#nPrice').value)||0,
        p_slug:'', p_notes:$('#nNote').value.trim()
      });
      if(s.error) throw s.error;
      show(s.data.key, '', s.data.expires_at);
    }
    m.className='msg s'; m.textContent='تم إصدار الترخيص';
    await loadSubs();
  }catch(err){
    m.className='msg e';
    m.textContent = String(err.message||err).indexOf('duplicate')>=0
      ? 'هذا الرابط مستعمل من مطعم تاني — اختار غيره'
      : 'ما نجح: '+(err.message||err);
  }
});
function show(key,link,exp){
  $('#rKey').textContent=key;
  if(link){ $('#rLink').textContent=link; $('#linkRow').classList.remove('hidden'); }
  $('#rInfo').textContent='ينتهي بتاريخ '+new Date(exp).toLocaleDateString('en-GB')+
    ' · '+daysLeft(exp)+' يوم';
  $('#result').classList.remove('hidden');
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-copy]'); if(!b) return;
  var t=document.getElementById(b.dataset.copy).textContent;
  navigator.clipboard.writeText(t).then(function(){
    var old=b.textContent; b.textContent='تم ✓';
    setTimeout(function(){b.textContent=old},1400);
  });
});

boot();
})();
</script>
</body>
</html>
