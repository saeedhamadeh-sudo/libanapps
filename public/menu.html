<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="flame">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LibanApps</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Lalezar&family=Tajawal:wght@400;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ===== assets/themes.css (مدمج) ===== */
/* ============================================================
   LibanApps — الثيمات
   صاحب المطعم بيختار وحدة من لوحة التحكم
   ============================================================ */

/* 1. FLAME — أسود / أحمر / أصفر (مطاعم الوجبات السريعة) */
[data-theme="flame"]{
  --bg:#0A0A0A; --bg-2:#131110; --card:#17140F;
  --text:#FFF4DF; --muted:#A0968A; --line:rgba(255,212,0,.15);
  --brand:#E4141B; --brand-ink:#FFFFFF; --accent:#FFD400;
  --price:#FFD400; --shadow:0 14px 30px rgba(0,0,0,.5);
  --glow:radial-gradient(120% 60% at 50% -10%, #241304 0%, rgba(10,10,10,0) 62%);
  --halo:rgba(255,212,0,.30);
  --font-display:'Lalezar', system-ui, sans-serif;
  --radius:18px;
}

/* 2. CLEAN — أبيض هادئ (كافيهات ومطاعم راقية) */
[data-theme="clean"]{
  --bg:#FAF8F5; --bg-2:#FFFFFF; --card:#FFFFFF;
  --text:#1C1917; --muted:#7A716A; --line:rgba(0,0,0,.09);
  --brand:#1C1917; --brand-ink:#FFFFFF; --accent:#C2410C;
  --price:#C2410C; --shadow:0 6px 20px rgba(0,0,0,.07);
  --glow:none; --halo:rgba(194,65,12,.10);
  --font-display:'Tajawal', system-ui, sans-serif;
  --radius:14px;
}

/* 3. WOOD — بني دافئ (مطاعم تقليدية ومشاوي) */
[data-theme="wood"]{
  --bg:#241B14; --bg-2:#2E241B; --card:#33271D;
  --text:#F5E9D9; --muted:#B09C86; --line:rgba(212,163,94,.20);
  --brand:#8A4B21; --brand-ink:#FFF6E8; --accent:#D4A35E;
  --price:#E8B96F; --shadow:0 12px 26px rgba(0,0,0,.45);
  --glow:radial-gradient(120% 60% at 50% -10%, #3D2C1D 0%, rgba(36,27,20,0) 62%);
  --halo:rgba(212,163,94,.22);
  --font-display:'Amiri', Georgia, serif;
  --radius:12px;
}

/* 4. NEON — داكن مع ألوان صارخة (بوظة، عصائر، شباب) */
[data-theme="neon"]{
  --bg:#0B0714; --bg-2:#150E24; --card:#1A1130;
  --text:#F2ECFF; --muted:#9A8DB8; --line:rgba(34,211,238,.22);
  --brand:#7C3AED; --brand-ink:#FFFFFF; --accent:#22D3EE;
  --price:#22D3EE; --shadow:0 14px 34px rgba(124,58,237,.28);
  --glow:radial-gradient(120% 60% at 50% -10%, #1E1040 0%, rgba(11,7,20,0) 62%);
  --halo:rgba(34,211,238,.25);
  --font-display:'Cairo', system-ui, sans-serif;
  --radius:20px;
}

/* لون أساسي مخصص من لوحة التحكم بيتجاوز لون الثيم */
[data-brand-override="1"]{ --brand: var(--custom-brand); }

/* ============================================================
   ثيمات إضافية
   ============================================================ */

/* 5. AURORA — كحلي عميق مع شفق بنفسجي/فيروزي */
[data-theme="aurora"]{
  --bg:#0B1020; --bg-2:#131A2E; --card:#171F36;
  --text:#E8EDFB; --muted:#8E9AB8; --line:rgba(125,211,252,.18);
  --brand:#4C6FFF; --brand-ink:#FFFFFF; --accent:#7DD3FC;
  --price:#A5B4FC; --shadow:0 14px 34px rgba(76,111,255,.25);
  --glow:radial-gradient(130% 70% at 50% -10%, #1B2A5B 0%, rgba(11,16,32,0) 65%);
  --halo:rgba(125,211,252,.22);
  --font-display:'Tajawal', system-ui, sans-serif; --radius:18px;
}

/* 6. NOIR — أبيض وأسود بلا ألوان، تباين عالٍ */
[data-theme="noir"]{
  --bg:#000000; --bg-2:#0E0E0E; --card:#141414;
  --text:#FFFFFF; --muted:#8A8A8A; --line:rgba(255,255,255,.16);
  --brand:#FFFFFF; --brand-ink:#000000; --accent:#FFFFFF;
  --price:#FFFFFF; --shadow:0 10px 26px rgba(0,0,0,.7);
  --glow:none; --halo:rgba(255,255,255,.10);
  --font-display:'Lalezar', system-ui, sans-serif; --radius:4px;
}
[data-theme="noir"] .card{border-color:rgba(255,255,255,.14)}
[data-theme="noir"] .chip[aria-pressed="true"]{box-shadow:none}

/* 7. TERRA — طيني وزيتوني ورملي، فاتح */
[data-theme="terra"]{
  --bg:#F6F1E7; --bg-2:#FFFFFF; --card:#FFFFFF;
  --text:#2E2A24; --muted:#7C7263; --line:rgba(120,95,60,.18);
  --brand:#9C5B34; --brand-ink:#FFF8F0; --accent:#6B7A46;
  --price:#9C5B34; --shadow:0 6px 20px rgba(120,95,60,.12);
  --glow:none; --halo:rgba(156,91,52,.12);
  --font-display:'Tajawal', system-ui, sans-serif; --radius:14px;
}

/* 8. ELEGANT — عاجي مع أخضر داكن وخط رقعي */
[data-theme="elegant"]{
  --bg:#FBF9F4; --bg-2:#FFFFFF; --card:#FFFFFF;
  --text:#1F2A24; --muted:#7A857D; --line:rgba(31,42,36,.14);
  --brand:#14432A; --brand-ink:#F7F3E8; --accent:#B08D3F;
  --price:#14432A; --shadow:0 8px 24px rgba(20,67,42,.10);
  --glow:none; --halo:rgba(176,141,63,.14);
  --font-display:'Amiri', Georgia, serif; --radius:8px;
}

/* 9. CYBER — أسود مع ليموني وماجنتا */
[data-theme="cyber"]{
  --bg:#050608; --bg-2:#0E1116; --card:#12161D;
  --text:#E9FFF3; --muted:#79908A; --line:rgba(163,255,18,.22);
  --brand:#FF2E88; --brand-ink:#FFFFFF; --accent:#A3FF12;
  --price:#A3FF12; --shadow:0 14px 34px rgba(163,255,18,.14);
  --glow:radial-gradient(120% 60% at 50% -10%, #0F1A0B 0%, rgba(5,6,8,0) 62%);
  --halo:rgba(163,255,18,.20);
  --font-display:'Cairo', system-ui, sans-serif; --radius:6px;
}

/* 10. MINIMAL — أبيض صافٍ بلا زخرفة */
[data-theme="minimal"]{
  --bg:#FFFFFF; --bg-2:#FAFAFA; --card:#FFFFFF;
  --text:#111111; --muted:#8A8A8A; --line:rgba(0,0,0,.10);
  --brand:#111111; --brand-ink:#FFFFFF; --accent:#111111;
  --price:#111111; --shadow:none;
  --glow:none; --halo:rgba(0,0,0,.04);
  --font-display:'Tajawal', system-ui, sans-serif; --radius:6px;
}
[data-theme="minimal"] .card:hover{transform:none;box-shadow:none;border-color:rgba(0,0,0,.22)}
[data-theme="minimal"] .sec h2{font-size:20px;letter-spacing:1px}

/* 11. SHOWCASE — صور كبيرة، الصنف بيحتل الكرت */
[data-theme="showcase"]{
  --bg:#0C0C0D; --bg-2:#141416; --card:#161618;
  --text:#F5F5F5; --muted:#9A9A9E; --line:rgba(255,255,255,.12);
  --brand:#E5484D; --brand-ink:#FFFFFF; --accent:#F5C542;
  --price:#F5C542; --shadow:0 16px 36px rgba(0,0,0,.55);
  --glow:radial-gradient(120% 60% at 50% -10%, #1C1C20 0%, rgba(12,12,13,0) 62%);
  --halo:rgba(245,197,66,.16);
  --font-display:'Lalezar', system-ui, sans-serif; --radius:20px;
}
[data-theme="showcase"] .card{grid-template-columns:1fr;padding:0;overflow:hidden}
[data-theme="showcase"] .thumb{width:100%;height:190px;border-radius:0}
[data-theme="showcase"] .card>div:last-child{padding:12px 14px 14px}

/* 12. SHOP BOARD — شبكة مربعات مضغوطة */
[data-theme="shopboard"]{
  --bg:#F4F5F7; --bg-2:#FFFFFF; --card:#FFFFFF;
  --text:#1A1D21; --muted:#6B7280; --line:rgba(0,0,0,.10);
  --brand:#2563EB; --brand-ink:#FFFFFF; --accent:#F59E0B;
  --price:#2563EB; --shadow:0 4px 14px rgba(0,0,0,.08);
  --glow:none; --halo:rgba(37,99,235,.10);
  --font-display:'Tajawal', system-ui, sans-serif; --radius:12px;
}
[data-theme="shopboard"] .grid{grid-template-columns:1fr 1fr;gap:10px}
[data-theme="shopboard"] .card{grid-template-columns:1fr;padding:8px;text-align:center}
[data-theme="shopboard"] .thumb{width:100%;height:110px;margin:0 auto}
[data-theme="shopboard"] .card h3{font-size:15px}
[data-theme="shopboard"] .card p{display:none}
[data-theme="shopboard"] .prow{justify-content:center;flex-wrap:wrap}
@media(min-width:700px){[data-theme="shopboard"] .grid{grid-template-columns:repeat(4,1fr)}}

/* 13. PASTARIA — عاجي وطماطم وريحان، طابع إيطالي */
[data-theme="pastaria"]{
  --bg:#FFF8EF; --bg-2:#FFFFFF; --card:#FFFFFF;
  --text:#3B2A20; --muted:#8B7466; --line:rgba(178,58,44,.18);
  --brand:#B23A2C; --brand-ink:#FFF8EF; --accent:#4E7A3A;
  --price:#B23A2C; --shadow:0 6px 20px rgba(178,58,44,.12);
  --glow:none; --halo:rgba(178,58,44,.12);
  --font-display:'Amiri', Georgia, serif; --radius:10px;
}

</style>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;
  background-image:var(--glow);background-attachment:fixed;overflow-x:hidden}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* topbar */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px)}
.topbar .row{display:flex;align-items:center;gap:10px;padding:8px 16px;max-width:980px;margin:0 auto}
.topbar .logo{width:38px;height:38px;object-fit:contain;border-radius:8px}
.bline{display:flex;flex-direction:column;line-height:1.15;margin-inline-end:auto;min-width:0}
.bline b{font-family:var(--font-display);font-size:19px}
.bline span{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  padding:7px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--text)}
.cartbtn{background:var(--brand);color:var(--brand-ink);border-color:transparent;position:relative}
.cartbtn .n{background:var(--accent);color:#111;border-radius:999px;min-width:20px;height:20px;
  display:grid;place-items:center;font-size:12px;font-weight:800;padding:0 5px}
.heat{height:3px;background:linear-gradient(90deg,var(--brand),var(--accent),var(--brand))}

/* hero */
.hero{text-align:center;padding:22px 16px 6px;position:relative;overflow:hidden}
.hero .halo{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:min(70vw,380px);
  aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--halo) 0%,transparent 68%);
  pointer-events:none}
.hero img{position:relative;width:min(52vw,220px);margin:0 auto;
  filter:drop-shadow(0 12px 26px rgba(0,0,0,.5))}
.hero h1{position:relative;font-size:34px;margin-top:6px}
.hero p{position:relative;margin:2px 0 0;color:var(--accent);font-family:var(--font-display);
  font-size:14px;letter-spacing:2.5px}
.hero .pills{position:relative;margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);
  background:color-mix(in srgb,var(--text) 4%,transparent);padding:6px 13px;border-radius:999px;
  font-size:13px;text-decoration:none;color:var(--text)}
.pill b{color:var(--accent)}

/* slider */
.slider{position:relative;margin:16px 0 0;border-radius:var(--radius);overflow:hidden}
.slides{display:flex;transition:transform .45s ease}
.slides>div{min-width:100%;position:relative}
.slides img{width:100%;aspect-ratio:16/7;object-fit:cover}
.slides .cap{position:absolute;inset-inline:0;bottom:0;padding:14px;
  background:linear-gradient(0deg,rgba(0,0,0,.72),transparent);color:#fff;font-weight:700}
.dots{position:absolute;inset-inline:0;bottom:8px;display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots i.on{background:var(--accent);width:18px;border-radius:999px}

/* tools */
.tools{position:sticky;top:53px;z-index:30;padding-top:12px;
  background:linear-gradient(180deg,var(--bg) 75%,transparent)}
.search{display:flex;align-items:center;gap:8px;background:var(--bg-2);
  border:1px solid var(--line);border-radius:999px;padding:9px 14px}
.search input{flex:1;background:0;border:0;outline:0}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);color:var(--text);padding:7px 16px;
  border-radius:999px;font-size:14.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:transparent}

/* items */
.sec{display:flex;align-items:center;gap:12px;margin:24px 0 12px}
.sec h2{font-size:25px;color:var(--accent)}
.sec i{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.grid{display:grid;gap:12px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:104px 1fr;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:start;
  transition:.18s;width:100%;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card:active{transform:scale(.99)}
.card.off{opacity:.45;pointer-events:none}
.thumb{width:104px;height:104px;border-radius:calc(var(--radius) - 6px);overflow:hidden;
  background:var(--bg-2);display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{font-family:var(--font-display);font-size:12px;color:var(--muted)}
.card h3{font-size:19px;line-height:1.25}
.card p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.prow{display:flex;align-items:center;gap:10px;margin-top:8px}
.price{font-family:var(--font-display);font-size:22px;color:var(--price);line-height:1}
.price i{font-size:13px;font-style:normal;opacity:.75}
.plbp{font-size:12px;color:var(--muted)}
.badge{display:inline-block;background:var(--brand);color:var(--brand-ink);font-size:11px;
  font-weight:800;border-radius:999px;padding:2px 9px;margin-inline-start:6px}
.step{margin-inline-start:auto;display:flex;align-items:center;gap:8px;background:var(--bg-2);
  border:1px solid var(--line);border-radius:999px;padding:3px}
.step button{width:26px;height:26px;border-radius:50%;background:var(--brand);
  color:var(--brand-ink);font-weight:800;line-height:1}
.step b{min-width:16px;text-align:center;font-size:15px}
.plus{margin-inline-start:auto;width:32px;height:32px;border-radius:50%;background:var(--brand);
  color:var(--brand-ink);font-size:20px;font-weight:800;line-height:1}
.empty{text-align:center;color:var(--muted);padding:44px 10px}

/* footer */
footer{margin-top:40px;border-top:1px solid var(--line);padding:24px 16px 120px;text-align:center}
footer .big{font-family:var(--font-display);font-size:28px;color:var(--accent);direction:ltr}
footer .big{display:block;text-decoration:none}

.credit{margin-top:18px;text-align:center}
.credit .credit-logo{width:130px;margin:0 auto 8px;display:block;opacity:.95}
.credit>div{color:var(--muted);font-size:11.5px;letter-spacing:.3px}
.credit>div b{color:var(--text)}
.credit a{display:inline-block;text-decoration:none}
.credit .credit-tel{color:var(--accent);font-weight:700;font-size:12.5px;margin-top:4px;letter-spacing:.5px}

.social{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.social a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);background:color-mix(in srgb,var(--text) 5%,transparent);
  color:var(--text);text-decoration:none;transition:.18s}
.social a:hover{transform:translateY(-2px);border-color:var(--accent)}
.social svg{width:21px;height:21px;fill:currentColor}
.social a.wa:hover{color:#25D366} .social a.ig:hover{color:#E1306C}
.social a.fb:hover{color:#1877F2} .social a.tt:hover{color:var(--accent)}

/* cart drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;opacity:0;
  pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-inline:0;bottom:0;z-index:70;width:100%;max-width:560px;
  margin:0 auto;max-height:88vh;background:var(--bg);border:1px solid var(--line);
  border-bottom:0;border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .3s ease;box-shadow:0 -14px 40px rgba(0,0,0,.5)}
.drawer.on{transform:translateY(0)}
.grip{width:44px;height:4px;border-radius:99px;background:var(--muted);opacity:.4;
  margin:8px auto 0;flex:none}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:22px;margin-inline-end:auto}
.dbody{flex:1;overflow-y:auto;padding:14px 16px}
.dfoot{border-top:1px solid var(--line);padding:14px 16px;background:var(--bg-2)}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line img,.line .noimg{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--bg-2);flex:none}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:15px;font-weight:700}
.line .t span{font-size:12.5px;color:var(--muted)}
.tot{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:4px}
.tot.grand{color:var(--text);font-size:17px;font-weight:800;margin-top:6px}
.tot.grand b{font-family:var(--font-display);color:var(--price);font-size:24px}
.lbpline{text-align:end;font-size:13px;color:var(--muted);margin-bottom:10px}
.btn{width:100%;background:var(--brand);color:var(--brand-ink);border-radius:12px;
  padding:13px;font-weight:800;font-size:16px}
.btn:disabled{opacity:.5}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.wa{background:#1FA855;color:#fff}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=tel],textarea{width:100%;background:var(--bg-2);
  border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:0}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:60px;resize:vertical}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.err{color:#FF7A7E;font-size:13px;margin-top:6px}
#map{height:240px;border-radius:14px;margin-top:10px;border:1px solid var(--line);
  background:var(--bg-2);display:none}
#map.on{display:block}
.leaflet-container{background:var(--bg-2)!important;font-family:'Cairo',sans-serif}
.maptip{font-size:12.5px;color:var(--muted);margin-top:6px;text-align:center}
.ok{color:#4ADE80;font-size:13px;margin-top:6px}
.doneicon{width:64px;height:64px;border-radius:50%;background:var(--brand);color:var(--brand-ink);
  display:grid;place-items:center;font-size:32px;margin:20px auto 10px}

/* promo popup */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.7)}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  max-width:380px;width:100%;overflow:hidden;text-align:center}
.modal img{width:100%;aspect-ratio:4/3;object-fit:cover}
.modal .p{padding:16px}
.modal h3{font-size:24px;color:var(--accent)}
.modal p{color:var(--muted);font-size:14px;margin:6px 0 14px}
.toast{position:fixed;inset-inline:16px;bottom:20px;z-index:90;background:var(--accent);color:#111;
  font-weight:800;text-align:center;border-radius:12px;padding:12px;max-width:400px;margin:0 auto;
  transform:translateY(160%);transition:.28s}
.toast.on{transform:none}

/* شريط السلة التحتي */
.cartbar{position:fixed;inset-inline:0;bottom:0;z-index:50;display:flex;align-items:center;
  gap:12px;width:100%;max-width:560px;margin:0 auto;padding:12px 16px;
  background:var(--brand);color:var(--brand-ink);border-radius:16px 16px 0 0;
  box-shadow:0 -8px 26px rgba(0,0,0,.4);transform:translateY(101%);transition:transform .26s ease}
.cartbar.on{transform:translateY(0)}
.cartbar .cnt{background:rgba(0,0,0,.22);border-radius:999px;min-width:30px;height:30px;
  display:grid;place-items:center;font-weight:800;font-size:14px;padding:0 8px}
.cartbar .lbl{flex:1;font-weight:800;font-size:15px}
.cartbar .amt{font-family:var(--font-display);font-size:21px}
body.hasbar .fab{bottom:74px}
body.hasbar footer{padding-bottom:150px}
.demo{background:var(--accent);color:#111;text-align:center;font-size:12.5px;
  font-weight:700;padding:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="demo hidden" id="demoBar"></div>

<div class="topbar">
  <div class="row">
    <img class="logo hidden" id="tLogo" alt="">
    <div class="bline"><b id="tName">—</b><span id="tTag"></span></div>
    <button class="iconbtn" id="langBtn">English</button>
    <button class="iconbtn cartbtn" id="cartBtn">

      <span class="n" id="cartN">0</span>
    </button>
  </div>
  <div class="heat"></div>
</div>

function tx(o,f){ return L==='en' ? (o[f+'_en']||o[f+'_ar']||'') : (o[f+'_ar']||o[f+'_en']||''); }
function money(n){ n=Number(n)||0; return n%1===0?n:n.toFixed(2); }
function baseLbp(){ return !!(R && R.base_currency==='LBP'); }
function toLbp(usd){
  var step=Number(R.lbp_rounding)||1000;
  return Math.round(usd*Number(R.exchange_rate)/step)*step;
}
// السعر الأساسي حسب عملة المطعم
function mainPrice(usd){
  return baseLbp()
    ? { n: toLbp(usd).toLocaleString('en-US'), c: T.lbp }
    : { n: money(usd), c: T.currency };
}
function mainTxt(usd){ var p=mainPrice(usd); return p.n+' '+p.c; }
// السعر الثانوي — العملة التانية
function subPrice(usd){
  if(!R || !R.show_lbp) return '';
  return baseLbp() ? (money(usd)+' '+T.currency)
                   : (toLbp(usd).toLocaleString('en-US')+' '+T.lbp);
}
function lbp(usd){ return subPrice(usd); }
var toastEl=$('#toast'),tt;
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(tt);

/* ---------- load ---------- */
async function load(){
  if(DEMO){ demoData(); return true; }
  var r=await sb.from('restaurants').select('*').eq('slug',slug).maybeSingle();
  if(r.error||!r.data) return false;
  R=r.data;
  var res=await Promise.all([
    sb.from('categories').select('*').eq('restaurant_id',R.id).eq('is_active',true).order('sort'),
    sb.from('items').select('*').eq('restaurant_id',R.id).order('sort'),
    sb.from('banners').select('*').eq('restaurant_id',R.id).eq('is_active',true).order('sort'),
    sb.from('promos').select('*').eq('restaurant_id',R.id).eq('is_active',true)
  ]);
  CATS=res[0].data||[]; ITEMS=res[1].data||[]; BANNERS=res[2].data||[]; PROMOS=res[3].data||[];
  return true;
}

/* ---------- language ---------- */
function setLang(l){
  L=l; T=window.I18N[l];
  document.documentElement.lang=l; document.documentElement.dir=T.dir;
  $('#langBtn').textContent=T.other;
  $('#q').placeholder=T.search;
  $('#dTitle').textContent=T.cart;
  $('#lType').textContent=T.orderType; $('#lName').textContent=T.name;
  $('#lPhone').textContent=T.phone; $('#lTable').textContent=T.tableNo;
  $('#lAddr').textContent=T.address; $('#lNote').textContent=T.note; $('#lPay').textContent=T.payment;
  $('#geoBtn').textContent=T.getLocation; $('#confirmBtn').textContent=T.confirm;
  $('#lPaste').textContent=T.orPaste; $('#pasteHint').textContent=T.pasteHint;
  if(MAP&&!geo.lat){ var gm=$('#geoMsg'); gm.className=''; gm.style.color='var(--muted)';
    gm.textContent=T.mapHint; }
  $('#backBtn').textContent=T.back;
  $('#typeSeg').children[0].textContent=T.dineIn;
  $('#typeSeg').children[1].textContent=T.deliveryType;
  $('#paySeg').children[0].textContent=T.cash;
  $('#paySeg').children[1].textContent=T.whish;
  if(DEMO) $('#demoBar').textContent=T.demo;
  paintHeader(); paintChips(); paintMenu(); paintCart();
  store('la_lang',l);
}
$('#langBtn').addEventListener('click',function(){ setLang(L==='ar'?'en':'ar') });

/* ---------- header ---------- */
function paintHeader(){
  document.documentElement.dataset.theme=R.theme||'flame';
  var nm=tx(R,'name'), tg=tx(R,'tagline');
  document.title=nm+(tg?' — '+tg:'');
  $('#tName').textContent=nm; $('#tTag').textContent=tg;
  $('#hName').textContent=nm; $('#hTag').textContent=tg;
  if(R.logo_url){ $('#tLogo').src=R.logo_url; $('#tLogo').classList.remove('hidden');
                  $('#hLogo').src=R.logo_url; $('#hLogo').classList.remove('hidden'); }
  if(R.phone){ var p=$('#hPhone'); p.href='tel:'+R.phone; p.innerHTML='<b>'+esc(R.phone)+'</b>';
               p.classList.remove('hidden'); $('#fPhone').textContent=R.phone; }
  var ad=tx(R,'address');
  if(ad){ $('#hAddr').textContent=ad; $('#hAddr').classList.remove('hidden'); }
  $('#fNote').textContent=tx(R,'notes');
  $('#paySeg').children[1].classList.toggle('hidden', !R.whish_enabled);
  if(!R.dinein_enabled){ oType='delivery'; }
  $('#typeSeg').children[0].classList.toggle('hidden',!R.dinein_enabled);
  $('#typeSeg').children[1].classList.toggle('hidden',!R.delivery_enabled);
}

  if(!v) return '';
  v=String(v).trim();
  if(/^https?:\/\//i.test(v)) return v;
  return base + v.replace(/^@/,'');
}

function paintSocial(){
  var out=[];
  var wa=(R.whatsapp||'').replace(/\D/g,'');
  if(wa) out.push(['wa','https://wa.me/'+wa,'WhatsApp']);
  var ig=socialUrl(R.instagram,'https://instagram.com/');
  if(ig) out.push(['ig',ig,'Instagram']);
  var fb=socialUrl(R.facebook,'https://facebook.com/');
  if(fb) out.push(['fb',fb,'Facebook']);

  if(tt) out.push(['tt',tt,'TikTok']);
  $('#fSocial').innerHTML=out.map(function(o){
    return '<a class="'+o[0]+'" href="'+esc(o[1])+'" target="_blank" rel="noopener" '+
           'aria-label="'+o[2]+'"><svg viewBox="0 0 24 24">'+ICONS[o[0]]+'</svg></a>';
  }).join('');
  var ad=tx(R,'address');
  $('#fAddr').textContent = ad || '';
}

/* ---------- slider ---------- */
var si=0,stm;
function paintSlider(){
  if(!BANNERS.length) return;
  $('#slider').classList.remove('hidden');
  $('#slides').innerHTML=BANNERS.map(function(b){
    var c=tx(b,'caption');
    return '<div><img src="'+esc(b.image_url)+'" alt="">'+(c?'<div class="cap">'+esc(c)+'</div>':'')+'</div>';
  }).join('');
  $('#dots').innerHTML=BANNERS.map(function(_,i){return '<i class="'+(i?'':'on')+'"></i>'}).join('');
  if(BANNERS.length>1){ clearInterval(stm); stm=setInterval(next,4500); }
}
function next(){
  si=(si+1)%BANNERS.length;
  var d=document.documentElement.dir==='rtl'?1:-1;
  $('#slides').style.transform='translateX('+(d*si*100)+'%)';
  Array.prototype.forEach.call($('#dots').children,function(e,i){e.classList.toggle('on',i===si)});
}

/* ---------- menu ---------- */
function paintChips(){
  var h='<button class="chip" data-c="all" aria-pressed="'+(filter==='all')+'">'+T.all+'</button>';
  CATS.forEach(function(c){
    h+='<button class="chip" data-c="'+c.id+'" aria-pressed="'+(filter===c.id)+'">'+esc(tx(c,'name'))+'</button>';
  });
  $('#chips').innerHTML=h;
}
function itemHtml(it){
  var q=cart[it.id]?cart[it.id].qty:0;
  var img=it.image_url?'<img src="'+esc(it.image_url)+'" alt="" loading="lazy">':'<span>'+esc(tx(R,'name'))+'</span>';
  var ctrl=q?'<div class="step"><button data-m="'+it.id+'">−</button><b>'+q+'</b><button data-a="'+it.id+'">+</button></div>'
           :'<button class="plus" data-a="'+it.id+'" aria-label="'+T.add+'">+</button>';
  var mp=mainPrice(it.price_usd), lb=subPrice(it.price_usd);
  return '<div class="card'+(it.is_available?'':' off')+'"><div class="thumb">'+img+'</div><div>'+
    '<h3>'+esc(tx(it,'name'))+(it.is_featured?'<span class="badge">'+T.featured+'</span>':'')+
    (it.is_available?'':'<span class="badge">'+T.unavailable+'</span>')+'</h3>'+
    (tx(it,'desc')?'<p>'+esc(tx(it,'desc'))+'</p>':'')+
    '<div class="prow"><span class="price">'+mp.n+' <i>'+mp.c+'</i></span>'+
    (lb?'<span class="plbp">'+lb+'</span>':'')+ctrl+'</div></div></div>';
}
function paintMenu(){
  var q=query.trim().toLowerCase();
  var list=ITEMS.filter(function(it){
    if(filter!=='all'&&it.category_id!==filter) return false;
    if(q&&(tx(it,'name')+' '+tx(it,'desc')).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  if(!list.length){ $('#menuBody').innerHTML='<p class="empty">'+T.noResults+'</p>'; return; }
  var groups=filter==='all'?CATS:CATS.filter(function(c){return c.id===filter});
  var h='';
  groups.forEach(function(c){
    var sub=list.filter(function(i){return i.category_id===c.id});
    if(!sub.length) return;
    h+='<div class="sec"><h2>'+esc(tx(c,'name'))+'</h2><i></i></div><div class="grid">'+
       sub.map(itemHtml).join('')+'</div>';
  });
  $('#menuBody').innerHTML=h||'<p class="empty">'+T.noResults+'</p>';
}
$('#chips').addEventListener('click',function(e){
  var b=e.target.closest('.chip'); if(!b) return;
  filter=b.dataset.c; paintChips(); paintMenu();
});
$('#q').addEventListener('input',function(e){ query=e.target.value; paintMenu(); });
$('#menuBody').addEventListener('click',function(e){
  var a=e.target.closest('[data-a]'), m=e.target.closest('[data-m]');
  if(a) addItem(a.dataset.a);
  else if(m) removeItem(m.dataset.m);
});

/* ---------- cart ---------- */

  var it=ITEMS.find(function(x){return x.id===id}); if(!it||!it.is_available) return;
  cart[id]=cart[id]||{item:it,qty:0}; cart[id].qty++;
  toast(tx(it,'name')+' · '+T.added); saveCart(); paintMenu(); paintCart();
}
function removeItem(id){
  if(!cart[id]) return;
  cart[id].qty--; if(cart[id].qty<=0) delete cart[id];
  saveCart(); paintMenu(); paintCart();
}
function saveCart(){
  try{ localStorage.setItem('la_cart_'+slug,JSON.stringify(
    Object.keys(cart).map(function(k){return {id:k,qty:cart[k].qty}}))); }catch(e){}
}
function loadCart(){
  try{
    var s=JSON.parse(localStorage.getItem('la_cart_'+slug)||'[]');
    s.forEach(function(l){
      var it=ITEMS.find(function(x){return x.id===l.id&&x.is_available});
      if(it) cart[l.id]={item:it,qty:l.qty};
    });
  }catch(e){}
}
function totals(){
  var sub=0,n=0;
  Object.keys(cart).forEach(function(k){ sub+=cart[k].item.price_usd*cart[k].qty; n+=cart[k].qty; });
  var del=(oType==='delivery'&&sub>0)?Number(R.delivery_fee_usd||0):0;
  return {sub:sub,del:del,total:sub+del,count:n};
}
function paintCart(){
  var t=totals();
  $('#cartN').textContent=t.count;
  var keys=Object.keys(cart);

  // شريط السلة التحتي
  var open=$('#drawer').classList.contains('on');
  $('#barCnt').textContent=t.count;
  $('#barLbl').textContent=T.cart;
  $('#barAmt').textContent=mainTxt(t.total);
  $('#cartBar').classList.toggle('on', keys.length>0 && !open);
  document.body.classList.toggle('hasbar', keys.length>0 && !open);

  if(!keys.length){
    $('#stepCart').innerHTML='<p class="empty">'+T.cartEmpty+'<br><span style="font-size:13px">'+T.cartEmptyHint+'</span></p>';
    $('#footCart').innerHTML='';
    return;
  }
  $('#stepCart').innerHTML=keys.map(function(k){
    var c=cart[k], it=c.item;
    return '<div class="line">'+(it.image_url?'<img src="'+esc(it.image_url)+'" alt="">':'<div class="noimg"></div>')+
      '<div class="t"><b>'+esc(tx(it,'name'))+'</b><span>'+mainTxt(it.price_usd*c.qty)+'</span></div>'+
      '<div class="step"><button data-m="'+k+'">−</button><b>'+c.qty+'</b><button data-a="'+k+'">+</button></div></div>';
  }).join('');
  var lb=subPrice(t.total);
  $('#footCart').innerHTML=
    '<div class="tot"><span>'+T.subtotal+'</span><span>'+mainTxt(t.sub)+'</span></div>'+
    (t.del?'<div class="tot"><span>'+T.delivery+'</span><span>'+mainTxt(t.del)+'</span></div>':'')+
    '<div class="tot grand"><span>'+T.total+'</span><b>'+mainTxt(t.total)+'</b></div>'+
    (lb?'<div class="lbpline">'+lb+'</div>':'')+
    '<button class="btn" id="toForm">'+T.continue+'</button>';
  $('#toForm').addEventListener('click',showForm);
}
$('#stepCart').addEventListener('click',function(e){
  var a=e.target.closest('[data-a]'), m=e.target.closest('[data-m]');
  if(a) addItem(a.dataset.a); else if(m) removeItem(m.dataset.m);
});

/* ---------- drawer ---------- */
function openCart(o){
  $('#drawer').classList.toggle('on',o); $('#scrim').classList.toggle('on',o);
  if(o) refreshMap();
  $('#drawer').setAttribute('aria-hidden',!o);
  document.body.style.overflow=o?'hidden':'';
  paintCart();
}
$('#cartBtn').addEventListener('click',function(){ showStep('cart'); openCart(true); });
$('#cartBar').addEventListener('click',function(){ showStep('cart'); openCart(true); });
$('#dClose').addEventListener('click',function(){ openCart(false) });
$('#scrim').addEventListener('click',function(){ openCart(false) });
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#drawer').classList.contains('on')) openCart(false);
});
// سحب لتحت لتسكير السلة
(function(){
  var y0=null, d=$('#drawer');
  d.addEventListener('touchstart',function(e){
    if(e.target.closest('#map')){ y0=null; return; }
    var b=d.querySelector('.dbody:not(.hidden)');
    y0=(b&&b.scrollTop<=0)?e.touches[0].clientY:null;
  },{passive:true});
  d.addEventListener('touchmove',function(e){
    if(y0===null) return;
    var dy=e.touches[0].clientY-y0;
    if(dy>0) d.style.transform='translateY('+dy+'px)';
  },{passive:true});
  d.addEventListener('touchend',function(e){
    if(y0===null) return;
    var dy=(e.changedTouches[0].clientY-y0);
    d.style.transform='';
    if(dy>90) openCart(false);
    y0=null;
  });
})();

function showStep(s){
  ['cart','form','done'].forEach(function(x){
    $('#step'+x[0].toUpperCase()+x.slice(1)).classList.toggle('hidden',x!==s);
    $('#foot'+x[0].toUpperCase()+x.slice(1)).classList.toggle('hidden',x!==s);
  });
  $('#dTitle').textContent = s==='done'? T.success : T.cart;
}
function showForm(){
  if(!R.dinein_enabled) setType('delivery');
  showStep('form');
  if(oType==='delivery'){ setTimeout(function(){ initMap(); if(MAP) MAP.invalidateSize(); },120); }
}
$('#backBtn').addEventListener('click',function(){ showStep('cart') });

/* ---------- checkout form ---------- */
function setType(t){
  oType=t;
  Array.prototype.forEach.call($('#typeSeg').children,function(b){
    b.setAttribute('aria-pressed', b.dataset.t===t);
  });
  $('#wrapTable').classList.toggle('hidden',t!=='dine_in');
  $('#wrapAddr').classList.toggle('hidden',t!=='delivery');
  if(t==='delivery'){ setTimeout(initMap,60); }
  paintCart();
}
$('#typeSeg').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(b) setType(b.dataset.t);
});
$('#paySeg').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  pay=b.dataset.p;
  Array.prototype.forEach.call($('#paySeg').children,function(x){
    x.setAttribute('aria-pressed', x.dataset.p===pay);
  });
  var note=$('#whishNote');
  if(pay==='whish' && baseLbp()){
    note.textContent=T.whishUsd.replace('{a}', money(totals().total));
    note.classList.remove('hidden');
  } else note.classList.add('hidden');
});
/* ---------- خريطة تحديد الموقع ---------- */
var MAP=null, PIN=null, ACC=null;
function showAccuracy(la,ln,m){
  if(!MAP) return;
  if(ACC){ MAP.removeLayer(ACC); ACC=null; }
  if(!m || m<=0) return;
  ACC=window.L.circle([la,ln],{radius:m,color:'#FFD400',weight:1,
        fillColor:'#FFD400',fillOpacity:.10}).addTo(MAP);
}
function setPin(la,ln,zoom){
  geo.lat=la; geo.lng=ln;
  if(!MAP) return;
  if(PIN) PIN.setLatLng([la,ln]);
  else{
    PIN=window.L.marker([la,ln],{draggable:true}).addTo(MAP);
    PIN.on('dragend',function(){ var p=PIN.getLatLng(); geo.lat=p.lat; geo.lng=p.lng;
      if(ACC){ MAP.removeLayer(ACC); ACC=null; } okMsg(); });
  }
  if(zoom) MAP.setView([la,ln],zoom); else MAP.panTo([la,ln]);
  okMsg();
}
function okMsg(){
  var m=$('#geoMsg'); m.className='ok'; m.style.color=''; m.textContent=T.locationSet;
  try{ localStorage.setItem('la_geo',JSON.stringify({lat:geo.lat,lng:geo.lng})); }catch(e){}
}
function refreshMap(){
  if(!MAP) return;
  [0,150,400,900].forEach(function(t){ setTimeout(function(){ MAP.invalidateSize(); },t); });
}
function initMap(){
  if(MAP) { refreshMap(); return; }
  if(typeof window.L==='undefined'){
    // ما نزلت المكتبة (نت ضعيف أو محجوب) — نرجع لخانة الرابط
    var m0=$('#geoMsg'); m0.className='err'; m0.style.color='';
    m0.textContent='مكتبة الخريطة (Leaflet) ما نزلت — '+T.mapFail;
    $('#linkWrap').classList.remove('hidden');
    return;
  }
  $('#map').classList.add('on');
  try{
    MAP=window.L.map('map',{zoomControl:true,attributionControl:true})
         .setView([33.8547,35.8623],8);   // لبنان
    window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
      MAP.on('click',function(e){
      if(ACC){ MAP.removeLayer(ACC); ACC=null; }
      setPin(e.latlng.lat,e.latlng.lng);
    });
  }catch(err){
    MAP=null;
    var me=$('#geoMsg'); me.className='err'; me.style.color='';
    me.textContent='خطأ بالخريطة: '+(err&&err.message||err);
    $('#linkWrap').classList.remove('hidden');
    return;
  }
  refreshMap();
  if(!geo.lat){
    try{ var sv=JSON.parse(localStorage.getItem('la_geo')||'null');
      if(sv&&sv.lat){ geo.lat=sv.lat; geo.lng=sv.lng; } }catch(e){}
  }
  if(geo.lat) setPin(geo.lat,geo.lng,17);
  else { var m=$('#geoMsg'); m.className=''; m.style.color='var(--muted)'; m.textContent=T.mapHint; }
}

function geoErrText(err){
  if(!err) return T.locationFail;
  if(err.code===1) return T.locDenied;
  if(err.code===2) return T.locUnavailable;
  if(err.code===3) return T.locTimeout;
  return T.locationFail;
}
function tryGeo(opts){
  return new Promise(function(res,rej){
    var done=false;
    var guard=setTimeout(function(){
      if(!done){ done=true; rej({code:3,message:'timeout'}); }
    }, (opts.timeout||10000)+2000);
    navigator.geolocation.getCurrentPosition(
      function(p){ if(done) return; done=true; clearTimeout(guard); res(p); },
      function(e){ if(done) return; done=true; clearTimeout(guard); rej(e); },
      opts);
  });
}
$('#geoBtn').addEventListener('click',async function(){
  var m=$('#geoMsg'), btn=this;
  try{ await runGeo.call(this,m,btn); }
  catch(err){ m.className='err'; m.style.color='';
    m.textContent='خطأ: '+(err&&err.message||err);
    $('#linkWrap').classList.remove('hidden'); btn.disabled=false; }
});
async function runGeo(m,btn){
  initMap();
  if(!MAP) return;   // initMap كتبت السبب — ما منكتب فوقه
  m.className='ok'; m.style.color=''; m.textContent=T.locating;
  if(!navigator.geolocation){
    m.className='err'; m.textContent=T.locationFail;
    $('#linkWrap').classList.remove('hidden'); return;
  }
  if(!window.isSecureContext){
    m.className='err'; m.textContent=T.needHttps; return;
  }
  // إذا الإذن مرفوض من قبل، المتصفح ما بيسأل — منقول للزبون شو يعمل
  if(navigator.permissions&&navigator.permissions.query){
    try{
      var st=await navigator.permissions.query({name:'geolocation'});
      if(st.state==='denied'){
        m.className='err'; m.textContent=T.locBlocked;
        $('#linkWrap').classList.remove('hidden');
        return;
      }
    }catch(e){}
  }
  btn.disabled=true;
  var err=null, pos=null;
  try{
    pos=await tryGeo({enableHighAccuracy:true,timeout:9000,maximumAge:0});
  }catch(e1){
    err=e1;
    if(e1.code!==1){
      try{ pos=await tryGeo({enableHighAccuracy:false,timeout:20000,maximumAge:120000}); err=null; }
      catch(e2){ err=e2; }
    }
  }
  btn.disabled=false;
  if(pos&&!err){
    var acc=Math.round(pos.coords.accuracy||0);
    setPin(pos.coords.latitude,pos.coords.longitude, acc>300?15:17);
    showAccuracy(pos.coords.latitude,pos.coords.longitude,acc);
    $('#linkWrap').classList.add('hidden');
    if(acc>60){
      m.className=''; m.style.color='var(--accent)';
      m.textContent=T.accWeak.replace('{m}',acc);
    }
  }else{
    m.className='err'; m.textContent=geoErrText(err)+' — '+T.mapHint;
    btn.textContent=T.retry;
    $('#linkWrap').classList.remove('hidden');
  }
}

// بديل: استخراج الإحداثيات من رابط Google Maps
function parseMapLink(u){
  var pats=[/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/, /[?&]q=(-?\d+\.\d+),\s*(-?\d+\.\d+)/,
            /[?&]ll=(-?\d+\.\d+),\s*(-?\d+\.\d+)/, /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,
            /^\s*(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)\s*$/];
  for(var i=0;i<pats.length;i++){
    var m=u.match(pats[i]);
    if(m){
      var la=parseFloat(m[1]), ln=parseFloat(m[2]);
      if(la>=-90&&la<=90&&ln>=-180&&ln<=180) return {lat:la,lng:ln};
    }
  }
  return null;
}
$('#mapLink').addEventListener('input',function(){
  var v=this.value.trim(); if(!v) return;
  var c=parseMapLink(v), m=$('#geoMsg');
  if(c){ initMap(); setPin(c.lat,c.lng,17); m.className='ok'; m.textContent=T.linkOk; }
  else { m.className='err'; m.textContent=T.linkBad; }
});

function waText(o){
  var lines=[];
  lines.push('*'+tx(R,'name')+'* — '+T.orderNo+' '+o.order_no);
  lines.push(oType==='delivery'?T.deliveryType:T.dineIn);
  lines.push(T.name+': '+$('#cName').value.trim());
  lines.push(T.phone+': '+$('#cPhone').value.trim());
  if(oType==='dine_in'&&$('#cTable').value) lines.push(T.tableNo+': '+$('#cTable').value.trim());
  if(oType==='delivery'){
    if($('#cAddr').value) lines.push(T.address+': '+$('#cAddr').value.trim());
    if(geo.lat) lines.push('📍 https://maps.google.com/?q='+geo.lat+','+geo.lng);
  }
  lines.push('———');
  Object.keys(cart).forEach(function(k){
    lines.push(cart[k].qty+' × '+tx(cart[k].item,'name')+' — '+mainTxt(cart[k].item.price_usd*cart[k].qty));
  });
  lines.push('———');
  var t=totals();
  if(t.del) lines.push(T.delivery+': '+mainTxt(t.del));
  lines.push('*'+T.total+': '+mainTxt(o.total_usd||t.total)+'*');
  var lb=subPrice(o.total_usd||t.total); if(lb) lines.push(lb);
  lines.push(T.payment+': '+(pay==='whish'?T.whish:T.cash));
  if($('#cNote').value.trim()) lines.push(T.note+': '+$('#cNote').value.trim());
  if(o.token) lines.push('🧾 '+location.origin+'/i/'+encodeURIComponent(o.token));
  return lines.join('\n');
}

$('#confirmBtn').addEventListener('click',async function(){
  var err=$('#formErr'); err.classList.add('hidden');
  var name=$('#cName').value.trim(), phone=$('#cPhone').value.trim();
  if(name.length<2){ return fail(T.required); }
  if(phone.replace(/\D/g,'').length<7){ return fail(T.invalidPhone); }
  if(oType==='delivery'&&R.require_location&&!geo.lat){ return fail(T.needLocation); }
  var t=totals();
  if(oType==='delivery'&&t.sub<Number(R.min_order_usd||0)){
    return fail(T.minOrder+': '+mainTxt(R.min_order_usd));
  }
  function fail(m){ err.textContent=m; err.classList.remove('hidden'); }

  var btn=this; btn.disabled=true; btn.textContent=T.sending;
  var order={order_no:'DEMO-1001',token:'',total_usd:t.total};
  try{
    if(!DEMO){
      var res=await sb.rpc('place_order',{
        p_slug:slug, p_type:oType, p_name:name, p_phone:phone,
        p_table:$('#cTable').value.trim(), p_address:$('#cAddr').value.trim(),
        p_lat:geo.lat, p_lng:geo.lng, p_note:$('#cNote').value.trim(),
        p_payment:pay,
        p_lines:Object.keys(cart).map(function(k){return {item_id:k,qty:cart[k].qty}})
      });
      if(res.error) throw res.error;
      order=res.data[0]||order;

      if(pay==='whish'){
        var r=await fetch('/api/whish/create',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({order_id:order.order_id,slug:slug})});
        var j=await r.json();
        if(j.collectUrl){ location.href=j.collectUrl; return; }
        throw new Error(j.error||'payment failed');
      }
    }
    done(order);
  }catch(e){
    console.error('place_order failed:', e);
    var d = (e && (e.message || e.hint || e.details || e.code)) || '';
    fail(T.error + (d ? ' — ' + d : ''));
  }finally{ btn.disabled=false; btn.textContent=T.confirm; }
});

function done(o){
  var wa=(R.whatsapp||'').replace(/\D/g,'');
  var url='https://wa.me/'+wa+'?text='+encodeURIComponent(waText(o));
  $('#stepDone').innerHTML='<div class="doneicon">✓</div>'+
    '<h2 style="font-size:26px">'+T.success+'</h2>'+
    '<p style="color:var(--muted)">'+T.orderNo+' <b style="color:var(--accent)">'+esc(o.order_no)+'</b></p>'+
    '<p style="color:var(--muted);font-size:13px;margin-top:14px">'+T.whatsappHint+'</p>';
  $('#footDone').innerHTML=
    '<a class="btn wa" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="'+esc(url)+'">'+T.openWhatsapp+'</a>'+
    (o.token?'<a class="btn alt" style="display:block;text-align:center;text-decoration:none;margin-top:8px" href="/i/'+encodeURIComponent(o.token)+'">'+T.invoice+'</a>':'')+
    '<button class="btn alt" style="margin-top:8px" id="againBtn">'+T.newOrder+'</button>';
  $('#againBtn').addEventListener('click',function(){
    cart={}; saveCart(); paintMenu(); paintCart(); showStep('cart'); openCart(false);
  });
  showStep('done');

  // نولّد ملف الفاتورة بالخلفية ليكون جاهزاً قبل ما المطعم يفتح الرابط
  if(o.token && !DEMO){
    var fr=document.createElement('iframe');
    fr.style.cssText='position:fixed;width:520px;height:900px;left:-9999px;top:0;border:0';
    fr.src='/i/'+encodeURIComponent(o.token)+'?gen=1';
    document.body.appendChild(fr);
    setTimeout(function(){ fr.remove() },15000);
  }

  if(wa) window.open(url,'_blank');
}

/* ---------- promo popup ---------- */
function showPromo(){
  if(!PROMOS.length) return;
  var p=PROMOS[0];
  try{ if(p.show_once&&sessionStorage.getItem('la_promo_'+p.id)) return; }catch(e){}
  if(p.image_url){ $('#pImg').src=p.image_url; $('#pImg').classList.remove('hidden'); }
  $('#pTitle').textContent=tx(p,'title'); $('#pBody').textContent=tx(p,'body');
  $('#promo').classList.remove('hidden');
  $('#pClose').addEventListener('click',function(){
    $('#promo').classList.add('hidden');
    try{ sessionStorage.setItem('la_promo_'+p.id,'1'); }catch(e){}
  });
}

/* ---------- boot ---------- */
(async function(){
  var ok=await load();
  if(!ok){
    document.body.innerHTML='<p style="text-align:center;padding:60px 20px;color:#888">'+
      'Restaurant not found — <code>'+esc(slug)+'</code></p>';
    return;
  }
  if(DEMO) $('#demoBar').classList.remove('hidden');
  loadCart();
  var saved=store('la_lang');
  setLang(saved||R.default_lang||'ar');
  setType(R.dinein_enabled?'dine_in':'delivery');
  paintSlider();
  setTimeout(showPromo,1200);
})();
})();
