<style>
:root{
  --p:#0c3b5e; --pd:#082a44; --a:#f5a400; --on-p:#fff;
  --bg:#f3f6f9; --card:#fff; --ink:#0f1c2b; --ink2:#4a5b6c; --mut:#8a9aab; --line:#e1e8ef;
  --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7; --bad:#dc2626; --badbg:#fee2e2; --soft:#eef3f8;
  --wish:#6d28d9; --wishbg:#ede9fe;
  --r:14px; --sh:0 1px 2px rgba(15,28,43,.06),0 4px 16px rgba(15,28,43,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
.hidden{display:none!important}
a{color:var(--p)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(12,59,94,.15)}
input[type=checkbox]{width:auto}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--ink2);margin:0 0 4px;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:600;margin:6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;background:var(--p);color:var(--on-p);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn.alt{background:var(--soft);color:var(--p)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.wa{background:#25d366;color:#fff}
.btn.wish{background:var(--wish);color:#fff}
.btn.acc{background:var(--a);color:#1d1300}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.lg{padding:16px 22px;font-size:18px;border-radius:14px}
.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--okbg);color:var(--ok)}
.chip.off{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.gray{background:var(--soft);color:var(--ink2)}
.chip.wish{background:var(--wishbg);color:var(--wish)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:17px}
.muted{color:var(--mut);font-size:13px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
td.num,th.num{display:table-cell;unicode-bidi:plaintext;text-align:start}
.err{color:var(--bad);background:var(--badbg);padding:9px 12px;border-radius:10px;font-size:14px;white-space:pre-line}
.okmsg{color:var(--ok);background:var(--okbg);padding:9px 12px;border-radius:10px;font-size:14px}
.msg:empty{display:none}
/* الجداول: تمرير أفقي، بدون تكسير الكلمات حرفاً حرفاً */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap;vertical-align:middle}
th{background:var(--soft);font-size:12.5px;color:var(--ink2);font-weight:700;position:sticky;top:0}
tr.void td{opacity:.45;text-decoration:line-through}
tbody tr:hover{background:#fafcfe}
td.wrap{white-space:normal;min-width:180px}
/* الهيكل */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:26px 22px;max-width:400px;width:100%;text-align:center}
.gbox img{max-width:90px;max-height:90px;border-radius:14px;margin-bottom:8px}
.gbox h1{font-size:21px;margin:4px 0 2px}
.gbox form{text-align:start;margin-top:14px}
.gbox .fld{margin-bottom:10px}
header.top{background:var(--p);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.tbar{display:flex;align-items:center;gap:10px;padding:8px 12px;max-width:1280px;margin:0 auto}
.tbar img{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#fff}
.tbar .ttl{font-weight:800;font-size:16px;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar .who{font-size:12px;opacity:.85}
.tbar select{width:auto;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.tbar select option{color:#000}
.tbar .btn{background:rgba(255,255,255,.14);color:#fff}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 8px 6px;max-width:1280px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;color:rgba(255,255,255,.8);padding:7px 12px;border-radius:999px;font-weight:700;white-space:nowrap;cursor:pointer;font-size:14px}
nav.tabs button.on{background:#fff;color:var(--p)}
main{max-width:1280px;margin:0 auto;padding:14px 12px 90px}
.lic{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:10px;margin-bottom:12px;font-weight:700;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:12px 14px}
.stat b{display:block;font-size:20px;margin-top:2px}
.stat span{font-size:12.5px;color:var(--ink2);font-weight:700}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:8px}
.litem{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.litem:active{background:var(--soft)}
.litem .nm{font-weight:800}
.litem .sub{font-size:12.5px;color:var(--ink2)}
.bal{font-weight:800}
.bal.debt{color:var(--bad)}
.bal.cred{color:var(--ok)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;margin:8px 0}
.kv div{font-size:13px;color:var(--ink2)}
.kv b{display:block;color:var(--ink);font-size:14.5px;word-break:normal;overflow-wrap:anywhere}
.bigbal{text-align:center;padding:12px;border-radius:12px;background:var(--soft);margin:10px 0}
.bigbal b{font-size:26px;display:block}
.step{border:2px dashed var(--line);border-radius:14px;padding:14px;margin-top:10px}
.valinput{font-size:28px;text-align:center;font-weight:800;direction:ltr;letter-spacing:1px}
.prev-img{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:8px auto}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--soft)}
.gps{font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--soft);display:inline-block}
.gps.ok{background:var(--okbg);color:var(--ok)}
.gps.bad{background:var(--badbg);color:var(--bad)}
.sec-t{font-weight:800;color:var(--p);margin:14px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select{width:auto;min-width:140px;flex:1 1 160px}
.pbar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
/* النوافذ: ما بتسكّر بالضغط برّاتها، وبتنزلق عالموبايل */
.ov{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;padding:10px;z-index:1000}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);overflow:hidden}
.modal.wide{max-width:960px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.mh h3{margin:0;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;flex:none}
.mb{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1 1 auto;min-height:0}
.mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);flex:none}
.toast{pointer-events:none;position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:#0f1c2b;color:#fff;padding:11px 18px;border-radius:12px;z-index:3000;transition:all .3s;max-width:92vw;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.3);white-space:pre-line;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.e{background:var(--bad)}
.toast.s{background:var(--ok)}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden}
.cam video{width:100%;max-height:60vh;display:block;object-fit:cover}
.cam .aim{position:absolute;inset:22% 10%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.25);pointer-events:none}
.inv-box{background:#fffdf6;border:1px solid #f3e3b4;border-radius:12px;padding:12px;font-size:14px}
.inv-box .ln{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.inv-box .ln.tot{border-top:1px dashed #c9b37a;margin-top:6px;padding-top:8px;font-weight:800;font-size:16px}
.lb-img{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:10px}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0}}

function t(k,v){ var a=D[k]; var s=a?(a[LI[LANG]]||a[0]):k; if(v) for(var x in v) s=s.split('{'+x+'}').join(v[x]); return s; }
function setLang(l){ if(!LI.hasOwnProperty(l)) l='ar'; LANG=l; try{ localStorage.setItem('motor_lang',l); }catch(e){}
  document.documentElement.lang=l; document.documentElement.dir=(l==='ar'?'rtl':'ltr'); }

/* =========================================================
   أدوات عامة
   ========================================================= */
var CFG=window.LIBANAPPS, sb=null;
try{ sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY); }catch(e){}
var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var SLUG='', TOKEN='', ME=null, SITE=null, PLANS=[], STAFF=[], CUST=[], LIC=null, TODAY='', TAB='dash';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
function n2(v){ var x=Number(v); return isFinite(x)?x:0; }
function fmtN(v,d){ return n2(v).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d==null?2:d}); }
function sym(c){ return c==='LBP' ? (LANG==='ar'?'ل.ل':'LBP') : '$'; }
function mainCur(){ return (SITE&&SITE.currency)||'USD'; }
function rate(){ return n2(SITE&&SITE.lbp_rate); }
function money(v,c){ c=c||mainCur(); var s=fmtN(v,c==='LBP'?0:2); return c==='LBP'? s+' '+sym(c) : sym(c)+s; }
function second(v){ if(!SITE||!SITE.show_second||!rate()) return ''; return mainCur()==='USD' ? money(n2(v)*rate(),'LBP') : money(n2(v)/rate(),'USD'); }
function moneyBoth(v){ var s=second(v); return '<span class="num">'+esc(money(v))+'</span>'+(s?' <span class="muted num">≈ '+esc(s)+'</span>':''); }
function dt(s){ if(!s) return ''; var d=new Date(s); if(isNaN(d)) return String(s); var p=function(x){return String(x).padStart(2,'0')};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function balHtml(b){ b=n2(b); return '<span class="bal num '+(b>0?'debt':(b<0?'cred':''))+'">'+esc(money(b))+'</span>'; }
function isAdmin(){ return !!(ME&&ME.is_admin); }
function planName(id){ var p=PLANS.filter(function(x){return x.id===id})[0]; return p?p.name:''; }
function staffName(id){ var s=STAFF.filter(function(x){return x.id===id})[0]; return s?s.name:''; }
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
var toastT=null;
function toast(m,k){ var el=$('#toast'); el.textContent=m; el.className='toast on '+(k||''); clearTimeout(toastT); toastT=setTimeout(function(){ el.className='toast'; }, k==='e'?5200:2600); }
function errText(e){
  var m=String((e&&(e.message||e.error_description||e.error))||e||'');
  var mm=m.match(/MOTOR:([a-z_]+)(?::([^\n"]*))?/);
  if(mm){ var k='e_'+mm[1]; var x=(mm[2]||'').replace('|',' → '); return D[k]?t(k,{x:x}):m; }
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return t('e_network');
  return m||'Error';
}
function isAuthErr(e){ return /MOTOR:(auth|license|inactive)\b/.test(String(e&&e.message||e||'')); }
async function call(fn,args){
  if(!sb) throw new Error(t('e_network'));
  var a=Object.assign({p_slug:SLUG,p_token:TOKEN||null},args||{});
  var r=await sb.rpc(fn,a);
  if(r.error){ if(isAuthErr(r.error)&&ME){ handleAuthLoss(r.error); } throw r.error; }
  return r.data;
}
function handleAuthLoss(e){ toast(errText(e),'e'); setTimeout(function(){ doLogout(true); }, 1500); }

/* ---------- النوافذ (لا تُغلق بالضغط خارجها) ---------- */
function modal(title,body,foot,wide){
  var ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="modal'+(wide?' wide':'')+'" role="dialog" aria-modal="true"><div class="mh"><h3></h3><button class="mx" type="button" aria-label="close">×</button></div><div class="mb"></div>'+(foot!==false?'<div class="mf"></div>':'')+'</div>';
  $('h3',ov).textContent=title;
  $('.mb',ov).innerHTML=body||'';
  if(foot) $('.mf',ov).innerHTML=foot;
  document.body.appendChild(ov); document.body.classList.add('lock');
  var api={el:ov, body:$('.mb',ov), foot:$('.mf',ov), onclose:null,
    close:function(){ if(api.onclose) try{ api.onclose(); }catch(e){} ov.remove(); if(!$('.ov')) document.body.classList.remove('lock'); }};
  $('.mx',ov).addEventListener('click',function(){ api.close(); });
  return api;
}
function confirmBox(text){ return new Promise(function(res){
  var m=modal(t('ok'),'<p style="margin:0;white-space:pre-line">'+esc(text)+'</p>','<button class="btn ghost" data-a="n">'+esc(t('cancel'))+'</button><button class="btn" data-a="y">'+esc(t('ok'))+'</button>');
  m.onclose=function(){ res(false); };
  m.foot.addEventListener('click',function(e){ var b=e.target.closest('[data-a]'); if(!b) return; m.onclose=null; m.close(); res(b.dataset.a==='y'); });
}); }
function busy(btn,on,txt){ if(!btn) return; if(on){ btn.dataset.t=btn.innerHTML; btn.disabled=true; btn.textContent=txt||t('saving'); } else { btn.disabled=false; if(btn.dataset.t) btn.innerHTML=btn.dataset.t; } }

/* =========================================================
   البدء: الرابط → صفحة الدخول أو البرنامج
   ========================================================= */
function gate(note,showLogin){
  $('#app').classList.add('hidden'); $('#gate').classList.remove('hidden');
  $('#gNote').innerHTML=note||''; $('#loginForm').classList.toggle('hidden',!showLogin);
  paintGateTexts();
}
function paintGateTexts(){
  $('#lUser').textContent=t('username'); $('#lPass').textContent=t('password');
  $('#loginBtn').textContent=t('login'); $('#ownerLink').textContent=t('owner_login');
  $('#gSub').textContent=t('app_name'); $('#gLang').value=LANG;
}
async function boot(){
  var seg=location.pathname.split('/').filter(Boolean);
  SLUG=(seg[0]==='portal-motor'&&seg[1])?decodeURIComponent(seg[1]).toLowerCase():'';
  if(!LANG) setLang('ar'); else setLang(LANG);
  gate(t('loading'),false);
  if(!sb){ gate('<div class="err">'+esc(t('e_network'))+'</div>',false); return; }
  if(!SLUG){
    // /motor بدون رابط: صاحب الاشتراك → أول مولّد عنده
    try{ var s=await sb.auth.getSession();
      if(s.data.session){ var lic=(await sb.rpc('my_licenses')).data||[]; var m=lic.filter(function(x){return x.product==='motor'&&x.slug})[0];
        if(m){ location.replace('/portal-motor/'+encodeURIComponent(m.slug)); return; } } }catch(e){}
    gate(esc(t('no_slug'))+'<br><br><a class="btn" href="/account">'+esc(t('my_account'))+'</a>',false); return;
  }
  var pub;
  try{ var r=await sb.rpc('motor_public',{p_slug:SLUG}); if(r.error) throw r.error; pub=r.data; }
  catch(e){ gate('<div class="err">'+esc(errText(e))+'</div>',false); return; }
  if(pub && pub.site){ $('#gName').textContent=pub.site.name||SLUG; document.title=(pub.site.name||SLUG)+' — Motor';
    if(pub.site.logo_url){ $('#gLogo').src=pub.site.logo_url; $('#gLogo').classList.remove('hidden'); }
    if(!lsGet('motor_lang','')) setLang(pub.site.default_lang||'ar'); }
  if(!pub || !pub.ok){
    // صاحب الاشتراك قد يكون اشترى للتو ولم تُنشأ المؤسسة بعد
    if(pub && pub.reason==='not_found'){ var made=await tryOwner(true); if(made) return; }
    var rk=pub&&pub.reason==='not_found'?'r_not_found':(pub&&pub.reason==='inactive'?'r_inactive':'r_license');
    if(!(pub&&pub.reason==='not_found')){ var asOwner=await tryOwner(false); if(asOwner) return; }
    gate('<div class="err">'+esc(t(rk))+'</div><br><a class="btn alt" href="/account">'+esc(t('my_account'))+'</a>',false); return;
  }
  TOKEN=lsGet('motor_tok:'+SLUG,'');
  if(TOKEN){ if(await enter()) return; TOKEN=''; lsSet('motor_tok:'+SLUG,null); }
  if(await tryOwner(false)) return;
  gate('',true); setTimeout(function(){ $('#inUser').focus(); },50);
}
async function tryOwner(ensure){
  try{ var s=await sb.auth.getSession(); if(!s.data.session) return false;
    if(ensure){ var e=await sb.rpc('ensure_motor',{p_slug:SLUG}); if(e.error||!e.data||!e.data.ok) return false; }
    TOKEN=''; return await enter(true);
  }catch(e){ return false; }
}
async function enter(quiet){
  try{
    var d=await call('motor_me');
    ME=d.me; SITE=d.site; PLANS=d.plans||[]; STAFF=d.staff||[]; LIC=d.license; TODAY=d.today;
    if(!lsGet('motor_lang','')) setLang(SITE.default_lang||'ar');
    $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
    document.title=(SITE.name||SLUG)+' — Motor';
    paintShell();
    loadCustomers();   // بالخلفية — القوائم بتتحدّث لما توصل
    go(lsGet('motor_tab:'+SLUG, ME.role==='collector'?'read':'dash'));
    return true;
  }catch(e){ if(!quiet && !isAuthErr(e)) gate('<div class="err">'+esc(errText(e))+'</div>',true); return false; }
}
$('#loginForm').addEventListener('submit',async function(e){
  e.preventDefault(); var b=$('#loginBtn'), m=$('#loginMsg'); m.textContent='';
  busy(b,true,t('loading'));
  try{
    var r=await sb.rpc('motor_login',{p_slug:SLUG,p_username:$('#inUser').value.trim(),p_password:$('#inPass').value});
    if(r.error) throw r.error;
    var d=r.data||{};
    if(!d.ok){ m.textContent= d.reason==='locked'?t('locked',{m:d.minutes||15}) : d.reason==='inactive_user'?t('inactive_user') : d.reason==='license'?t('r_license') : t('bad_login'); busy(b,false); return; }
    TOKEN=d.token; lsSet('motor_tok:'+SLUG,TOKEN); $('#inPass').value='';
    busy(b,false);
    if(!(await enter())){ m.textContent=t('e_auth'); }
  }catch(err){ m.textContent=errText(err); busy(b,false); }
});
$('#ownerLink').addEventListener('click',function(e){ e.preventDefault(); location.href='/login?next='+encodeURIComponent(location.pathname); });
$('#gLang').addEventListener('change',function(){ setLang(this.value); paintGateTexts(); });
async function doLogout(silent){
  if(TOKEN){ try{ await sb.rpc('motor_logout',{p_token:TOKEN}); }catch(e){} }
  lsSet('motor_tok:'+SLUG,null); TOKEN=''; ME=null;
  if(!silent && sb){ try{ var s=await sb.auth.getSession(); if(s.data.session){ location.href='/account'; return; } }catch(e){} }
  gate('',true);
}

var TABS=[
  {id:'dash',k:'nav_dash',i:'🏠'},
  {id:'read',k:'nav_read',i:'📷'},
  {id:'pay',k:'nav_pay',i:'💵'},
  {id:'customers',k:'nav_customers',i:'👥'},
  {id:'month',k:'nav_month',i:'🗓️'},
  {id:'cstmt',k:'nav_cstmt',i:'🧾'},
  {id:'whish',k:'nav_whish',i:'🟣',admin:true},
  {id:'staff',k:'nav_staff',i:'🧑‍🔧',admin:true},
  {id:'plans',k:'nav_plans',i:'⚡',admin:true},
  {id:'settings',k:'nav_settings',i:'⚙️'}
];
function visibleTabs(){ return TABS.filter(function(x){ return !x.admin||isAdmin(); }); }
function paintShell(){
  $('#tName').textContent=SITE.name||SLUG;
  $('#tWho').textContent=(ME.role==='owner'?t('role_owner'):ME.name+' · '+t('role_'+ME.role));
  if(SITE.logo_url){ $('#tLogo').src=SITE.logo_url; $('#tLogo').classList.remove('hidden'); } else $('#tLogo').classList.add('hidden');
  $('#tLang').value=LANG; $('#tOut').textContent=t('logout');
  $('#tabs').innerHTML=visibleTabs().map(function(x){ return '<button data-tab="'+x.id+'" class="'+(x.id===TAB?'on':'')+'">'+x.i+' '+esc(t(x.k))+'</button>'; }).join('');
}
$('#tabs').addEventListener('click',function(e){ var b=e.target.closest('[data-tab]'); if(b) go(b.dataset.tab); });
$('#tLang').addEventListener('change',function(){ setLang(this.value); paintShell(); go(TAB); });
$('#tOut').addEventListener('click',function(){ doLogout(false); });
function go(tab){
  if(!visibleTabs().some(function(x){return x.id===tab})) tab=ME.role==='collector'?'read':'dash';
  TAB=tab; lsSet('motor_tab:'+SLUG,tab);
  $$('#tabs button').forEach(function(b){ b.classList.toggle('on',b.dataset.tab===tab); });
  var on=$('#tabs [data-tab="'+tab+'"]'); if(on&&on.scrollIntoView) try{ on.scrollIntoView({block:'nearest',inline:'center'}); }catch(e){}
  var main=$('#main'); main.innerHTML='<div class="muted">'+esc(t('loading'))+'</div>';
  var f=VIEWS[tab]; Promise.resolve().then(function(){ return f(main); }).catch(function(e){ main.innerHTML='<div class="err">'+esc(errText(e))+'</div>'; });
}
function licBanner(){
  if(!LIC||!LIC.days_left&&LIC.days_left!==0) return '';
  if(LIC.trial) return '<div class="lic">'+esc(t('lic_trial',{d:LIC.days_left}))+'</div>';
  if(LIC.days_left<=15) return '<div class="lic">'+esc(t('lic_days',{d:LIC.days_left}))+'</div>';
  return '';
}

/* ---------- الزبائن (قائمة خفيفة للبحث) ---------- */
var custLoading=null;
function loadCustomers(){ custLoading=call('motor_customers').then(function(d){ CUST=d||[]; custLoading=null; if(TAB==='read'||TAB==='pay'||TAB==='customers') refreshSearchLists(); return CUST; })
  .catch(function(e){ custLoading=null; toast(errText(e),'e'); return CUST; }); return custLoading; }
function patchCust(id,obj){ var c=CUST.filter(function(x){return x.id===id})[0]; if(c) Object.assign(c,obj); }
function normS(s){ return String(s||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim(); }
function searchCust(q,lim){
  q=normS(q); if(!q) return [];
  return CUST.filter(function(c){ return normS(c.name).indexOf(q)>=0 || normS(c.alt_name).indexOf(q)>=0 || normS(c.barcode)===q || normS(c.barcode).indexOf(q)>=0
    || normS(c.meter_no).indexOf(q)>=0 || normS(c.box)===q || String(c.code)===q || normS(c.mobile).indexOf(q)>=0; }).slice(0,lim||40);
}
function custItem(c,mode){
  var right= mode==='read' ? (c.read_now?'<span class="chip on">✓ '+esc(t('read_done'))+'</span>':'<span class="chip gray">'+esc(t('not_read'))+'</span>') : balHtml(c.balance);
  return '<div class="litem" data-cust="'+esc(c.id)+'" data-mode="'+mode+'"><div style="flex:1;min-width:0"><div class="nm">'+esc(c.name)+(c.is_active?'':' <span class="chip off">'+esc(t('inactive'))+'</span>')+'</div>'+
    '<div class="sub">#'+esc(c.code)+' · '+esc(c.barcode||'—')+(c.box?' · '+esc(t('box'))+' '+esc(c.box):'')+(c.area?' · '+esc(c.area):'')+'</div></div>'+right+'</div>';
}
document.addEventListener('click',function(e){ var it=e.target.closest('[data-cust]'); if(it) openCustomer(it.dataset.cust,null,it.dataset.mode||''); });
var searchHooks=[];
function refreshSearchLists(){ searchHooks.forEach(function(f){ try{ f(); }catch(e){} }); }

var VIEWS={};

/* ---------- الرئيسية ---------- */
VIEWS.dash=async function(main){
  var d=await call('motor_dashboard');
  var mine=ME.role==='collector';
  main.innerHTML=licBanner()+
    '<div class="big-actions"><button class="btn lg" data-go="read">📷 '+esc(t('nav_read'))+'</button><button class="btn lg ok" data-go="pay">💵 '+esc(t('nav_pay'))+'</button></div>'+
    '<div class="stats">'+
      stat(t('st_active_c'), fmtN(d.customers_active,0)+' / '+fmtN(d.customers_total,0))+
      stat(t('st_read',{p:d.period}), fmtN(d.read_period,0))+
      stat(t('st_billed'), money(d.billed_period))+
      (mine?'':stat(t('st_debt'), money(d.debt_total)))+
      stat(t('st_cash_today'), money(d.cash_today))+
      stat(t('st_whish_today'), money(d.whish_today))+
      stat(t('st_month'), money(d.collected_month))+
      (d.my_cash_in_hand!=null?stat(t('st_hand'), money(d.my_cash_in_hand)):'')+
    '</div>'+
    (mine?windowNote():'');
  $$('[data-go]',main).forEach(function(b){ b.addEventListener('click',function(){ go(b.dataset.go); }); });
};
function stat(l,v){ return '<div class="stat"><span>'+esc(l)+'</span><b class="num">'+esc(v)+'</b></div>'; }
function windowNote(){
  var me=STAFF.filter(function(s){return s.id===ME.staff_id})[0]||ME;
  if(!me.read_from||!me.read_to) return '<div class="lic">'+esc(t('window_none'))+'</div>';
  var open=TODAY>=me.read_from&&TODAY<=me.read_to;
  return '<div class="'+(open?'okmsg':'lic')+'">'+esc(t('window_is',{f:me.read_from,t:me.read_to}))+(open?'':' — '+esc(t('window_closed')))+'</div>';
}

/* ---------- أخذ العداد / القبض: مسح أو بحث ---------- */
function finderView(main,mode){
  searchHooks=[];
  main.innerHTML=licBanner()+(mode==='read'&&ME.role==='collector'?windowNote():'')+
    '<div class="card"><button class="btn lg full '+(mode==='pay'?'ok':'')+'" id="scanBtn">📷 '+esc(t(mode==='pay'?'scan_pay':'scan'))+'</button>'+
    '<div style="margin-top:12px"><input id="fq" type="search" placeholder="'+esc(t('search_ph'))+'" autocomplete="off"></div>'+
    (mode==='read'?'<div class="muted" id="fprog" style="margin-top:8px"></div>':'')+'</div>'+
    '<div class="list" id="flist"></div>';
  var q=$('#fq',main);
  function paint(){
    var v=q.value, list=$('#flist',main);
    if(mode==='read'){ var a=CUST.filter(function(c){return c.read_now}).length, b=CUST.filter(function(c){return c.is_active&&!c.archived}).length;
      var pr=$('#fprog',main); if(pr) pr.textContent=custLoading&&!CUST.length?t('loading'):t('progress',{a:a,b:b,p:SITE.bill_period}); }
    if(!v.trim()){ list.innerHTML=''; return; }
    var r=searchCust(v,50); list.innerHTML=r.length?r.map(function(c){return custItem(c,mode)}).join(''):'<div class="muted">'+esc(t('no_results'))+'</div>';
  }
  q.addEventListener('input',paint);
  // قارئ باركود خارجي (لوحة مفاتيح) أو كتابة الرمز ثم Enter
  q.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); var v=q.value.trim(); if(v) openByCode(v,mode); } });
  $('#scanBtn',main).addEventListener('click',async function(){ var code=await scanBarcode(); if(code) openByCode(code,mode); });
  searchHooks.push(paint); paint();
}
VIEWS.read=function(main){ finderView(main,'read'); };
VIEWS.pay=function(main){ finderView(main,'pay'); };
async function openByCode(code,mode){
  code=String(code).trim(); var lc=code.toLowerCase();
  var c=CUST.filter(function(x){ return String(x.barcode).toLowerCase()===lc; })[0]||CUST.filter(function(x){ return String(x.meter_no).toLowerCase()===lc; })[0];
  openCustomer(c?c.id:null, c?null:code, mode);
}

/* ---------- صفحة الزبون ---------- */
async function openCustomer(id,barcode,mode){
  var m=modal(t('loading'),'<div class="muted">'+esc(t('loading'))+'</div>',false,false);
  var d;
  try{ d=await call('motor_customer_get',{p_id:id||null,p_barcode:barcode||null}); }
  catch(e){ m.body.innerHTML='<div class="err">'+esc(errText(e))+'</div>'; $('h3',m.el).textContent=barcode||''; return; }
  var c=d.customer;
  $('h3',m.el).textContent=c.name;
  function paint(){
    var adm=isAdmin();
    var info=[
      [t('code'),'#'+c.code],[t('barcode'),c.barcode],[t('meter_no'),c.meter_no],[t('box'),c.box],
      [t('plan'),d.plan?(d.plan.name+(d.plan.kind==='fixed'?' · '+t('kind_fixed'):'')):'—'],[t('area'),[c.area,c.location_name].filter(Boolean).join(' · ')],
      [t('collector'),d.collector_name],[t('mobile'),c.mobile?('+'+c.mobile_cc+' '+c.mobile):''],[t('prev_reading'),fmtN(d.prev_value)]
    ].filter(function(x){return x[1]!==''&&x[1]!=null});
    m.body.innerHTML=
      '<div class="row"><span class="chip '+(c.is_active?'on':'off')+'">'+esc(c.is_active?t('active'):t('inactive'))+'</span>'+(c.archived?' <span class="chip gray">'+esc(t('archived'))+'</span>':'')+
      (d.read_now?' <span class="chip on">✓ '+esc(t('read_done'))+' '+esc(d.period)+': '+esc(fmtN(d.read_now.value))+'</span>':' <span class="chip gray">'+esc(t('not_read'))+' '+esc(d.period)+'</span>')+'</div>'+
      '<div class="bigbal"><span class="muted">'+esc(t('balance'))+'</span><b>'+balHtml(c.balance)+'</b>'+(second(c.balance)?'<span class="muted num">≈ '+esc(second(c.balance))+'</span>':'')+'</div>'+
      '<div class="kv">'+info.map(function(x){return '<div>'+esc(x[0])+'<b dir="auto">'+esc(x[1])+'</b></div>'}).join('')+'</div>'+
      '<div class="row" style="margin-top:10px">'+
        '<button class="btn" data-a="read" '+(d.read_now||!c.is_active?'disabled':'')+'>'+esc(t('take_reading'))+'</button>'+

function invLines(inv){
  var L=[];
  if(inv.kind==='meter'){ L.push([t('prev_reading'),fmtN(inv.prev_value)]); L.push([t('cur_reading'),fmtN(inv.cur_value)]);
    L.push([t('consumption')+' ('+t('kwh')+')',fmtN(inv.kwh)+' × '+fmtN(inv.kwh_price,4).replace(/0+$/,'').replace(/\.$/,'')]); L.push([t('energy'),money(inv.energy)]); }
  if(n2(inv.fee)) L.push([t('fee'),money(inv.fee)]);
  if(n2(inv.discount)) L.push([t('discount'),'−'+money(inv.discount)]);
  if(n2(inv.addition)) L.push([t('addition'),money(inv.addition)]);
  return L;
}

    '<div class="ln tot"><span>'+esc(t('total_due'))+'</span><span>'+moneyBoth(inv.balance_after)+'</span></div></div>';

function invoiceText(inv,c){

/* =========================================================
   الطباعة: بلوتوث عبر RawBT (ESC/POS) أو نافذة الطباعة
   التذكرة = قائمة أسطر {t:نص, b:عريض, s:حجم, c:وسط, kv:[يسار,يمين], hr:خط}
   ========================================================= */
function invoiceTicket(inv,c){
  var T=[{t:SITE.name||'',b:1,s:30,c:1}];
  if(SITE.phone) T.push({t:SITE.phone,c:1,s:20});
  T.push({hr:1},{t:t('inv_for',{p:inv.period}),b:1,c:1},{t:t('inv_no',{n:inv.no})+' · '+dt(inv.created_at),c:1,s:19},{hr:1});
  T.push({kv:[t('customer'),c.name]},{kv:[t('code'),'#'+c.code+(c.box?' · '+t('box')+' '+c.box:'')]});
  if(inv.plan_name) T.push({kv:[t('plan'),inv.plan_name]});
  T.push({hr:1}); invLines(inv).forEach(function(x){ T.push({kv:x}); });
  T.push({hr:1},{kv:[t('inv_amount'),money(inv.amount)],b:1},{kv:[t('prev_balance'),money(inv.balance_before)]},{kv:[t('total_due'),money(inv.balance_after)],b:1,s:26});
  if(second(inv.balance_after)) T.push({kv:['',' ≈ '+second(inv.balance_after)]});
  if(SITE.invoice_note) T.push({hr:1},{t:SITE.invoice_note,c:1,s:19});
  T.push({t:t('thanks'),c:1});
  return T;
}
function receiptTicket(p,c){
  var T=[{t:SITE.name||'',b:1,s:30,c:1}];
  if(SITE.phone) T.push({t:SITE.phone,c:1,s:20});
  T.push({hr:1},{t:t('receipt'),b:1,c:1},{t:t('rcpt_no',{n:p.no})+' · '+dt(p.created_at),c:1,s:19},{hr:1},
    {kv:[t('customer'),c.name]},{kv:[t('code'),'#'+c.code]},{kv:[t('method'),p.method==='whish'?t('whish'):t('cash')]},{hr:1},
    {kv:[t('prev_balance'),money(p.balance_before)]},{kv:[t('paid'),money(p.paid_amount,p.paid_currency)],b:1,s:26});
  if(p.paid_currency!==mainCur()) T.push({kv:['','= '+money(p.amount)]});
  T.push({kv:[t('remaining'),money(p.balance_after)],b:1});
  if(second(p.balance_after)) T.push({kv:['',' ≈ '+second(p.balance_after)]});
  T.push({hr:1},{kv:[t('by'),p.staff_name||'']},{t:t('thanks'),c:1});
  return T;
}
function printMode(){ var d=/android/i.test(navigator.userAgent)?'rawbt':'browser'; return lsGet('motor_print',d); }
function paperW(){ return lsGet('motor_paper','58')==='80'?576:384; }
function renderTicket(T){
  var W=paperW(), pad=8, rtl=LANG==='ar';
  var cv=document.createElement('canvas'), ctx=cv.getContext('2d');
  var font=function(s,b){ return (b?'bold ':'')+(s||22)+'px Cairo, Tahoma, Arial, sans-serif'; };
  function wrap(text,maxW,s,b){ ctx.font=font(s,b); var words=String(text).split(' '), lines=[], cur='';
    words.forEach(function(w){ var tst=cur?cur+' '+w:w; if(ctx.measureText(tst).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=tst; }); if(cur) lines.push(cur); return lines.length?lines:['']; }
  var ops=[], y=pad;
  T.forEach(function(l){ var s=l.s||22, lh=Math.round(s*1.45);
    if(l.hr){ ops.push({hr:1,y:y+6}); y+=14; return; }
    if(l.kv){ var vl=wrap(l.kv[1],W*0.62,s,l.b); ops.push({kv:1,k:l.kv[0],v:vl,y:y,s:s,b:l.b,lh:lh}); y+=lh*vl.length; return; }
    var ls=wrap(l.t,W-pad*2,s,l.b); ls.forEach(function(x){ ops.push({t:x,y:y,s:s,b:l.b,c:l.c}); y+=lh; }); });
  y+=pad+30; cv.width=W; cv.height=y;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,y); ctx.fillStyle='#000'; ctx.textBaseline='top'; ctx.direction=rtl?'rtl':'ltr';
  ops.forEach(function(o){
    if(o.hr){ ctx.fillRect(pad,o.y,W-pad*2,2); return; }
    ctx.font=font(o.s,o.b);
    if(o.kv){ ctx.textAlign=rtl?'right':'left'; ctx.fillText(o.k,rtl?W-pad:pad,o.y);
      ctx.textAlign=rtl?'left':'right'; o.v.forEach(function(v,i){ ctx.fillText(v,rtl?pad:W-pad,o.y+i*o.lh); }); return; }
    if(o.c){ ctx.textAlign='center'; ctx.fillText(o.t,W/2,o.y); } else { ctx.textAlign=rtl?'right':'left'; ctx.fillText(o.t,rtl?W-pad:pad,o.y); }
  });
  return cv;
}
function canvasToEscPos(cv){
  var ctx=cv.getContext('2d'), w=cv.width, h=cv.height, img=ctx.getImageData(0,0,w,h).data, bpr=Math.ceil(w/8), r=new Uint8Array(bpr*h);
  for(var yy=0;yy<h;yy++) for(var xx=0;xx<w;xx++){ var i=(yy*w+xx)*4; if((img[i]+img[i+1]+img[i+2])/3<170) r[yy*bpr+(xx>>3)]|=(0x80>>(xx%8)); }
  var head=new Uint8Array([0x1B,0x40,0x1D,0x76,0x30,0x00,bpr&255,(bpr>>8)&255,h&255,(h>>8)&255]), tail=new Uint8Array([0x0A,0x0A,0x0A,0x1D,0x56,0x42,0x00]);
  var out=new Uint8Array(head.length+r.length+tail.length); out.set(head,0); out.set(r,head.length); out.set(tail,head.length+r.length); return out;
}
async function printDoc(T){
  try{ if(document.fonts&&document.fonts.ready) await document.fonts.ready; }catch(e){}
  var cv=renderTicket(T);
  if(printMode()==='rawbt'){
    try{ var bytes=canvasToEscPos(cv), bin=''; for(var i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null,Array.prototype.slice.call(bytes.subarray(i,i+8192)));
      var b64=btoa(bin), a=document.createElement('a');
      a.href=/android/i.test(navigator.userAgent)?'intent:base64,'+b64+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;':'rawbt:base64,'+b64;
      document.body.appendChild(a); a.click(); a.remove(); return;
    }catch(e){ toast('RawBT: '+(e&&e.message||''),'e'); return; }
  }
  printHtml('<img src="'+cv.toDataURL('image/png')+'" style="width:'+(paperW()===576?'80mm':'58mm')+'">');
}
function printHtml(html){
  var pa=$('#printArea'); pa.innerHTML=html; pa.classList.remove('hidden');

var C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function code128Svg(text,h){
  text=String(text).replace(/[^\x20-\x7E]/g,''); var codes=[104], sum=104;
  for(var i=0;i<text.length;i++){ var v=text.charCodeAt(i)-32; codes.push(v); sum+=v*(i+1); }
  codes.push(sum%103); codes.push(106);
  var x=10, bars='';
  codes.forEach(function(cd){ var p=C128[cd]; for(var j=0;j<p.length;j++){ var w=+p[j]; if(j%2===0) bars+='<rect x="'+x+'" y="0" width="'+w+'" height="'+h+'"/>'; x+=w; } });
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(x+10)+' '+h+'" preserveAspectRatio="none" style="width:100%;height:'+h+'px">'+bars+'</svg>';
}

async function readXlsx(buf){
  var dv=new DataView(buf), eocd=-1;
  for(var i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('zip');
  var cnt=dv.getUint16(eocd+10,true), off=dv.getUint32(eocd+16,true), files={}, td=new TextDecoder();
  for(var n=0;n<cnt;n++){ var meth=dv.getUint16(off+10,true), cs=dv.getUint32(off+20,true), nl=dv.getUint16(off+28,true), el=dv.getUint16(off+30,true), cl=dv.getUint16(off+32,true), lo=dv.getUint32(off+42,true);
    files[td.decode(new Uint8Array(buf,off+46,nl))]={m:meth,cs:cs,lo:lo}; off+=46+nl+el+cl; }
  async function get(name){ var f=files[name]; if(!f) return null; var ln=dv.getUint16(f.lo+26,true), le=dv.getUint16(f.lo+28,true), data=new Uint8Array(buf,f.lo+30+ln+le,f.cs);
    if(f.m===0) return td.decode(data);
    if(typeof DecompressionStream==='undefined') throw new Error('DecompressionStream');
    var out=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer(); return td.decode(out); }
  var X=function(s){ return new DOMParser().parseFromString(s,'application/xml'); };
  var sheet='xl/worksheets/sheet1.xml';
  try{ var wb=X(await get('xl/workbook.xml')), rels=X(await get('xl/_rels/workbook.xml.rels')), s0=wb.getElementsByTagName('sheet')[0];
    var rid=s0&&(s0.getAttribute('r:id')||s0.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
    Array.prototype.forEach.call(rels.getElementsByTagName('Relationship'),function(r){ if(r.getAttribute('Id')===rid){ var tg=r.getAttribute('Target'); sheet=tg.charAt(0)==='/'?tg.slice(1):'xl/'+tg.replace(/^\.\//,''); } });
  }catch(e){}
  var ss=[], sst=await get('xl/sharedStrings.xml');
  if(sst) Array.prototype.forEach.call(X(sst).getElementsByTagName('si'),function(si){ var s=''; Array.prototype.forEach.call(si.getElementsByTagName('t'),function(x){ s+=x.textContent; }); ss.push(s); });
  var sx=await get(sheet); if(!sx) throw new Error('sheet');
  var rows=[];
  Array.prototype.forEach.call(X(sx).getElementsByTagName('row'),function(r){ var arr=[];
    Array.prototype.forEach.call(r.getElementsByTagName('c'),function(c){ var ref=c.getAttribute('r')||'', col=0, m=ref.match(/^[A-Z]+/);
      if(m){ for(var k=0;k<m[0].length;k++) col=col*26+(m[0].charCodeAt(k)-64); col--; } else col=arr.length;
      var ty=c.getAttribute('t'), v=c.getElementsByTagName('v')[0], val='';
      if(ty==='s') val=ss[+(v&&v.textContent)]||''; else if(ty==='inlineStr'){ Array.prototype.forEach.call(c.getElementsByTagName('t'),function(x){ val+=x.textContent; }); } else val=v?v.textContent:'';
      arr[col]=val; });
    for(var q=0;q<arr.length;q++) if(arr[q]===undefined) arr[q]='';
    rows.push(arr); });
  return rows;
}
function readCsv(text){ var rows=[], row=[], cur='', q=false; text=text.replace(/^﻿/,''); var sep=(text.split('\n')[0].split(';').length>text.split('\n')[0].split(',').length)?';':',';
  for(var i=0;i<text.length;i++){ var ch=text[i]; if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===sep){ row.push(cur); cur=''; } else if(ch==='\n'){ row.push(cur.replace(/\r$/,'')); rows.push(row); row=[]; cur=''; } else cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); } return rows; }
var HMAP={'الاسم':'name','الخدمة':'service','المبنى':'building','الطابق':'floor','الجهة':'side','العلبة':'box','المولد / الكابل':'generator','المولد/الكابل':'generator',
  'رقم الدجنتير':'breaker_no','رقم العداد':'meter_no','باركود العداد':'barcode','اسم اخر':'alt_name','اسم آخر':'alt_name','اسم الموقع':'location_name','رمز الموقع':'location_code',
  'خط العرض':'lat','خط الطول':'lng','المنطقة':'area','رمز المنطقة':'area_code','النطاق':'zone','الفئة':'category','الفئة 2':'category2','الجابي':'collector_name',
  'تاريخ الاشتراك':'sub_date','مفعل':'is_active','مفعّل':'is_active','تاريغ التوقيف':'stopped_at','تاريخ التوقيف':'stopped_at','موقف بواسطة':'stopped_by','الحد الائتماني':'credit_limit',
  'الخصم عند التشريج':'charge_discount','وصف الخصم':'discount_desc','الإضافة عند التشريج':'charge_addition','الاضافة عند التشريج':'charge_addition','وصف الإضافة':'addition_desc','وصف الاضافة':'addition_desc',
  'الرصيد':'opening_balance','الجوال':'mobile','الهاتف':'phone','العنوان':'address','البريد الالكتروني':'email','البريد الإلكتروني':'email','الجنسية':'nationality','ارشيف':'archived','أرشيف':'archived',
  'يوم التحصيل':'collect_day','ملاحظات':'notes',
  'name':'name','service':'service','plan':'service','barcode':'barcode','meter':'meter_no','meter no':'meter_no','box':'box','area':'area','mobile':'mobile','phone':'phone','balance':'opening_balance','collector':'collector_name','active':'is_active','notes':'notes','address':'address'};
function normH(h){ return String(h||'').replace(/[\t\r\n]+/g,' ').replace(/[؟?]/g,'').replace(/\s+/g,' ').trim().toLowerCase(); }
function excelDate(v){ if(/^\d{4,5}(\.\d+)?$/.test(v)&&+v>20000&&+v<80000){ var d=new Date(Math.round((+v-25569)*86400000)); return d.toISOString().slice(0,10); } return v; }
function buildImport(rows){
  var head=rows[0]||[], map=[], seenMobile=false, ignored=[];
  head.forEach(function(h,i){ var k=HMAP[normH(h)]; if(k==='mobile'){ if(seenMobile) k='mobile_cc'; seenMobile=true; } map[i]=k||null; if(!k&&String(h).trim()) ignored.push(String(h).trim()); });
  if(map.indexOf('name')<0) return {err:t('imp_none')};
  var out=[];
  rows.slice(1).forEach(function(r){ var o={};
    map.forEach(function(k,i){ if(!k) return; var v=String(r[i]==null?'':r[i]).trim(); if(v==='NULL'||v==='null') v='';
      if(k==='opening_balance'||k==='charge_discount'||k==='charge_addition'||k==='credit_limit'){ var nm=v.replace(/,/g,'').match(/-?\d+(\.\d+)?/); v=nm?nm[0]:''; }
      if(k==='is_active'||k==='archived') v=/^(1|true|yes|نعم|مفعل|مفعّل)$/i.test(v)?true:(v===''?(k==='is_active'):false);
      if(k==='breaker_no'&&v==='0') v='';
      if((k==='mobile'||k==='phone')&&/^0+$/.test(v)) v='';
      if(k==='mobile_cc'){ v=v.replace(/\D/g,''); if(v.length>4) { if(!o.mobile) o.mobile=v; v=''; } }
      if(k==='nationality'&&/^unknown$/i.test(v)) v='';
      if(k==='sub_date'||k==='stopped_at') v=excelDate(v);
      if(k==='collect_day') v=v.replace(/\D/g,'');
      o[k]=v; });
    if(o.name) out.push(o); });
  return {rows:out,cols:map.filter(Boolean),ignored:ignored};
}

function staffForm(s){
  var n=!s; s=s||{role:'collector',is_active:true,can_collect:true};
  var m=modal(n?t('new_staff'):s.name,'<div class="g2">'+
    '<div><label>'+esc(t('name_user'))+'</label><input id="fn" value="'+esc(s.name||'')+'"></div>'+
    '<div><label>'+esc(t('phone'))+'</label><input id="fph" type="tel" value="'+esc(s.phone||'')+'"></div>'+
    '<div><label>'+esc(t('username'))+'</label><input id="fu" autocapitalize="off" spellcheck="false" value="'+esc(s.username||'')+'"></div>'+
    '<div><label>'+esc(t('password'))+'</label><input id="fp" type="text" autocomplete="new-password" placeholder="'+esc(n?'':t('pass_keep'))+'"></div>'+
    '<div><label>'+esc(t('role'))+'</label><select id="fr"><option value="collector">'+esc(t('role_collector'))+'</option><option value="admin">'+esc(t('role_admin'))+'</option></select></div>'+
    '<div><label>&nbsp;</label><label class="chk"><input type="checkbox" id="fa" '+(s.is_active?'checked':'')+'> '+esc(t('active'))+'</label><label class="chk"><input type="checkbox" id="fc" '+(s.can_collect?'checked':'')+'> '+esc(t('can_collect'))+'</label></div>'+
    '<div><label>'+esc(t('read_window'))+' — '+esc(t('from'))+'</label><input id="ff" type="date" value="'+esc(s.read_from||'')+'"></div>'+
    '<div><label>'+esc(t('to'))+'</label><input id="ft" type="date" value="'+esc(s.read_to||'')+'"></div>'+
    '</div><div id="fmsg" class="err msg" style="margin-top:10px"></div>',
    '<button class="btn ghost" data-x>'+esc(t('cancel'))+'</button>'+(n?'':'<button class="btn danger" data-del>'+esc(t('delete'))+'</button>')+'<button class="btn" data-s>'+esc(t('save'))+'</button>');
  $('#fr',m.body).value=s.role;
  m.foot.addEventListener('click',async function(e){
    if(e.target.closest('[data-x]')) return m.close();
    if(e.target.closest('[data-del]')){ if(!(await confirmBox(t('confirm_delete')))) return;
      try{ var r=await call('motor_staff_delete',{p_id:s.id}); toast(r.deactivated?t('staff_deact'):t('saved'),'s'); m.close(); go('staff'); }catch(err){ $('#fmsg',m.body).textContent=errText(err); } return; }
    var b=e.target.closest('[data-s]'); if(!b) return;
    var d={id:s.id||'',name:$('#fn',m.body).value.trim(),phone:$('#fph',m.body).value.trim(),username:$('#fu',m.body).value.trim().toLowerCase(),role:$('#fr',m.body).value,
      is_active:$('#fa',m.body).checked,can_collect:$('#fc',m.body).checked,read_from:$('#ff',m.body).value,read_to:$('#ft',m.body).value};
    busy(b,true);
    try{ await call('motor_staff_save',{p_data:d,p_password:$('#fp',m.body).value||null}); toast(t('saved'),'s'); m.close(); go('staff'); }
    catch(err){ $('#fmsg',m.body).textContent=errText(err); busy(b,false); }
  });
}

var SF={staff:'',from:'',to:''};
VIEWS.cstmt=async function(main){
  var adm=isAdmin();
  if(!adm) SF.staff=ME.staff_id;
  if(!SF.from){ SF.from=TODAY.slice(0,8)+'01'; SF.to=TODAY; }
  var cols=STAFF.filter(function(s){ return adm||s.id===ME.staff_id; });
  if(adm&&!SF.staff&&cols.length) SF.staff=(cols.filter(function(s){return s.role==='collector'})[0]||cols[0]).id;
  main.innerHTML='<div class="toolbar">'+(adm?'<select id="xs">'+cols.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.name)+' · '+esc(t('role_'+s.role))+'</option>'}).join('')+'</select>':'')+
    '<label style="margin:0">'+esc(t('from'))+'</label><input type="date" id="xf" value="'+esc(SF.from)+'" style="flex:0 1 160px"><label style="margin:0">'+esc(t('to'))+'</label><input type="date" id="xt" value="'+esc(SF.to)+'" style="flex:0 1 160px">'+
    (adm?'<button class="btn ok" id="xh">'+esc(t('handover'))+'</button>':'')+'</div><div id="xbody"></div>';
  if(!SF.staff){ $('#xbody',main).innerHTML='<div class="muted">'+esc(t('choose_staff'))+'</div>'; return; }
  if($('#xs',main)) $('#xs',main).value=SF.staff;
  async function load(){
    var box=$('#xbody',main); box.innerHTML='<div class="muted">'+esc(t('loading'))+'</div>';
    var d; try{ d=await call('motor_collector_statement',{p_staff:SF.staff,p_from:SF.from||null,p_to:SF.to||null}); }catch(e){ box.innerHTML='<div class="err">'+esc(errText(e))+'</div>'; return; }
    var run=n2(d.opening), cash=0, hand=0;
    var trs=d.rows.map(function(r){ if(!r.voided){ run+=n2(r.debit)-n2(r.credit); cash+=n2(r.debit); hand+=n2(r.credit); }
      var lab=r.t==='pay'?(t('k_pay')+' #'+r.no+' · '+r.customer+(r.method==='whish'?' (Whish — '+money(r.amount)+')':'')):t('m_'+r.kind)+(r.by?' · '+r.by:'');
      return '<tr class="'+(r.voided?'void':'')+'"><td class="num">'+esc(dt(r.at))+'</td><td>'+esc(lab)+(r.note?' <span class="muted">'+esc(r.note)+'</span>':'')+'</td><td class="num">'+(n2(r.debit)?esc(money(r.debit)):'')+'</td><td class="num">'+(n2(r.credit)?esc(money(r.credit)):'')+'</td><td>'+balHtml(run)+'</td>'+
        (adm?'<td>'+(r.t==='move'?'<button class="btn ghost sm" data-dm="'+esc(r.id)+'">'+esc(t('delete'))+'</button>':'')+'</td>':'')+'</tr>'; });
    box.innerHTML='<div class="stats">'+stat(t('opening'),money(d.opening))+stat(t('cash_collected'),money(cash))+stat(t('handed'),money(hand))+stat(t('in_hand'),money(d.balance_now))+stat(t('whish_coll'),money(d.whish_total))+stat(t('readings_n'),fmtN(d.readings,0))+'</div>'+
      '<div class="tw"><table><thead><tr><th>'+esc(t('date'))+'</th><th>'+esc(t('type'))+'</th><th>'+esc(t('debit'))+'</th><th>'+esc(t('creditc'))+'</th><th>'+esc(t('running'))+'</th>'+(adm?'<th></th>':'')+'</tr></thead><tbody>'+
      (trs.join('')||'<tr><td colspan="6" class="muted">'+esc(t('no_results'))+'</td></tr>')+'</tbody></table></div>'+
      '<div class="row" style="margin-top:10px"><button class="btn alt sm" id="xp">'+esc(t('print'))+'</button></div>';
    $$('[data-dm]',box).forEach(function(b){ b.addEventListener('click',async function(){ if(!(await confirmBox(t('confirm_delete')))) return; try{ await call('motor_move_delete',{p_id:b.dataset.dm}); load(); }catch(e){ toast(errText(e),'e'); } }); });
    $('#xp',box).addEventListener('click',function(){ printDoc([{t:SITE.name||'',b:1,s:28,c:1},{t:t('nav_cstmt'),b:1,c:1},{t:d.staff.name,c:1},{t:SF.from+' → '+SF.to,c:1,s:19},{hr:1},
      {kv:[t('opening'),money(d.opening)]},{kv:[t('cash_collected'),money(cash)]},{kv:[t('handed'),money(hand)]},{kv:[t('whish_coll'),money(d.whish_total)]},{kv:[t('readings_n'),fmtN(d.readings,0)]},{hr:1},{kv:[t('in_hand'),money(d.balance_now)],b:1,s:26}]); });
  }
  if($('#xs',main)) $('#xs',main).addEventListener('change',function(){ SF.staff=this.value; load(); });
  $('#xf',main).addEventListener('change',function(){ SF.from=this.value; load(); });
  $('#xt',main).addEventListener('change',function(){ SF.to=this.value; load(); });
  if($('#xh',main)) $('#xh',main).addEventListener('click',function(){ moveForm('collector',SF.staff,load); });
  load();
};
function moveForm(account,staff,after){
  var kinds=account==='collector'?['handover','adjust']:['withdraw','deposit','adjust'];
  var m=modal(account==='collector'?t('handover')+' — '+staffName(staff):t('nav_whish'),
    '<label>'+esc(t('type'))+'</label><select id="mk">'+kinds.map(function(k){return '<option value="'+k+'">'+esc(t('m_'+k))+'</option>'}).join('')+'</select>'+
    '<label style="margin-top:8px">'+esc(t('amount'))+' ('+esc(mainCur())+')</label><input id="ma" type="text" inputmode="decimal"><div class="muted" id="mhint"></div>'+
    '<label style="margin-top:8px">'+esc(t('note'))+'</label><input id="mn"><div id="mmsg" class="err msg" style="margin-top:8px"></div>',
    '<button class="btn ghost" data-x>'+esc(t('cancel'))+'</button><button class="btn" data-s>'+esc(t('save'))+'</button>');
  function hint(){ $('#mhint',m.body).textContent=$('#mk',m.body).value==='adjust'?t('adj_amount'):''; } $('#mk',m.body).addEventListener('change',hint); hint();
  m.foot.addEventListener('click',async function(e){ if(e.target.closest('[data-x]')) return m.close(); var b=e.target.closest('[data-s]'); if(!b) return;
    var v=Number($('#ma',m.body).value); if(!v){ $('#mmsg',m.body).textContent=t('e_bad_amount'); return; }
    busy(b,true); try{ await call('motor_move_add',{p_account:account,p_staff:staff||null,p_kind:$('#mk',m.body).value,p_amount:v,p_note:$('#mn',m.body).value}); toast(t('saved'),'s'); m.close(); after&&after(); }
    catch(err){ $('#mmsg',m.body).textContent=errText(err); busy(b,false); } });
}

var WF={from:'',to:''};
VIEWS.whish=async function(main){
  if(!WF.from){ WF.from=TODAY.slice(0,8)+'01'; WF.to=TODAY; }
  main.innerHTML='<div class="toolbar"><label style="margin:0">'+esc(t('from'))+'</label><input type="date" id="wf2" value="'+esc(WF.from)+'" style="flex:0 1 160px"><label style="margin:0">'+esc(t('to'))+'</label><input type="date" id="wt2" value="'+esc(WF.to)+'" style="flex:0 1 160px">'+
    '<button class="btn wish" id="wadd">'+esc(t('whish_withdraw'))+' / '+esc(t('m_deposit'))+'</button></div><div id="wbody"></div>';
  async function load(){
    var box=$('#wbody',main); box.innerHTML='<div class="muted">'+esc(t('loading'))+'</div>';
    var d; try{ d=await call('motor_whish_statement',{p_from:WF.from||null,p_to:WF.to||null}); }catch(e){ box.innerHTML='<div class="err">'+esc(errText(e))+'</div>'; return; }
    var run=n2(d.opening), inn=0, out=0;
    var trs=d.rows.map(function(r){ if(!r.voided){ run+=n2(r.credit)-n2(r.debit); inn+=n2(r.credit); out+=n2(r.debit); }
      var lab=r.t==='pay'?t('k_pay')+' #'+r.no+' · '+r.customer+(r.paid_currency!==mainCur()?' ('+money(r.paid_amount,r.paid_currency)+')':''):t('m_'+r.kind);
      return '<tr class="'+(r.voided?'void':'')+'"><td class="num">'+esc(dt(r.at))+'</td><td>'+esc(lab)+(r.note?' <span class="muted">'+esc(r.note)+'</span>':'')+'</td><td>'+esc(r.staff||'')+'</td><td class="num">'+(n2(r.credit)?esc(money(r.credit)):'')+'</td><td class="num">'+(n2(r.debit)?esc(money(r.debit)):'')+'</td><td class="num"><b>'+esc(money(run))+'</b></td>'+
        '<td>'+(r.t==='move'?'<button class="btn ghost sm" data-dm="'+esc(r.id)+'">'+esc(t('delete'))+'</button>':'')+'</td></tr>'; });
    box.innerHTML='<div class="stats">'+stat(t('opening'),money(d.opening))+stat(t('creditc'),money(inn))+stat(t('debit'),money(out))+stat(t('whish_bal'),money(d.balance_now))+'</div>'+
      '<div class="tw"><table><thead><tr><th>'+esc(t('date'))+'</th><th>'+esc(t('type'))+'</th><th>'+esc(t('by'))+'</th><th>'+esc(t('creditc'))+'</th><th>'+esc(t('debit'))+'</th><th>'+esc(t('running'))+'</th><th></th></tr></thead><tbody>'+
      (trs.join('')||'<tr><td colspan="7" class="muted">'+esc(t('no_results'))+'</td></tr>')+'</tbody></table></div>';
    $$('[data-dm]',box).forEach(function(b){ b.addEventListener('click',async function(){ if(!(await confirmBox(t('confirm_delete')))) return; try{ await call('motor_move_delete',{p_id:b.dataset.dm}); load(); }catch(e){ toast(errText(e),'e'); } }); });
  }
  $('#wf2',main).addEventListener('change',function(){ WF.from=this.value; load(); });
  $('#wt2',main).addEventListener('change',function(){ WF.to=this.value; load(); });
  $('#wadd',main).addEventListener('click',function(){ moveForm('whish',null,load); });
  load();
};

    '<div><label>'+esc(t('paper'))+'</label><select id="ppw"><option value="58">58 mm</option><option value="80">80 mm</option></select></div></div>'+
    '<p class="muted">'+esc(t('rawbt_hint'))+'</p><button class="btn alt" id="ptest">'+esc(t('test_print'))+'</button></div>';
  if(ME.staff_id) h+='<div class="card"><h3>'+esc(t('s_pass'))+'</h3><div class="g2"><div><label>'+esc(t('old_pass'))+'</label><input id="op" type="password" autocomplete="current-password"></div><div><label>'+esc(t('new_pass'))+'</label><input id="np" type="password" autocomplete="new-password"></div></div>'+
    '<div id="pwmsg" class="msg" style="margin-top:8px"></div><button class="btn" id="pwgo" style="margin-top:8px">'+esc(t('save'))+'</button></div>';
  main.innerHTML=h;
  function fld(l,k,v){ return '<div><label>'+esc(t(l))+'</label><input data-s="'+k+'" value="'+esc(v==null?'':v)+'"'+(/rate|step|dist/.test(k)?' inputmode="decimal"':'')+'></div>'; }
  function chk(l,k,v){ return '<label class="chk"><input type="checkbox" data-s="'+k+'" '+(v?'checked':'')+'> '+esc(t(l))+'</label>'; }
  if(adm){ $('[data-s=default_lang]',main).value=S.default_lang||'ar'; $('[data-s=currency]',main).value=S.currency||'USD';
    $('#ssave',main).addEventListener('click',async function(){ var b=this, d={}; $$('[data-s]',main).forEach(function(el){ d[el.dataset.s]=el.type==='checkbox'?el.checked:el.value.trim(); });
      busy(b,true); var msg=$('#smsg',main); msg.className='msg'; msg.textContent='';
      try{ SITE=await call('motor_settings_save',{p_data:d}); msg.className='okmsg'; msg.textContent=t('saved'); paintShell(); }catch(e){ msg.className='err'; msg.textContent=errText(e); } busy(b,false); }); }
  $('#pmode',main).value=printMode(); $('#ppw',main).value=lsGet('motor_paper','58');
  $('#pmode',main).addEventListener('change',function(){ lsSet('motor_print',this.value); });
  $('#ppw',main).addEventListener('change',function(){ lsSet('motor_paper',this.value); });
  $('#ptest',main).addEventListener('click',function(){ printDoc([{t:SITE.name||'Motor',b:1,s:30,c:1},{t:t('test_print'),c:1},{hr:1},{kv:[t('total_due'),money(123.45)],b:1},{t:dt(new Date()),c:1,s:19}]); });
  if($('#pwgo',main)) $('#pwgo',main).addEventListener('click',async function(){ var b=this, msg=$('#pwmsg',main); busy(b,true); msg.className='msg'; msg.textContent='';
    try{ await call('motor_change_password',{p_old:$('#op',main).value,p_new:$('#np',main).value}); msg.className='okmsg'; msg.textContent=t('saved'); $('#op',main).value=''; $('#np',main).value=''; }
    catch(e){ msg.className='err'; msg.textContent=errText(e); } busy(b,false); });
};

window.addEventListener('offline',function(){ toast(t('offline'),'e'); });
boot();
})();
</script>
