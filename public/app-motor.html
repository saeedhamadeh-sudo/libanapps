<style>
:root{
  --p:#0c3b5e; --pd:#082a44; --a:#f5a400; --on-p:#fff;
  --bg:#f3f6f9; --card:#fff; --ink:#0f1c2b; --ink2:#4a5b6c; --mut:#8a9aab; --line:#e1e8ef;
  --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7; --bad:#dc2626; --badbg:#fee2e2; --soft:#eef3f8;
  --wish:#6d28d9; --wishbg:#ede9fe;
  --r:14px; --sh:0 1px 2px rgba(15,28,43,.06),0 4px 16px rgba(15,28,43,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
.hidden{display:none!important}
a{color:var(--p)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(12,59,94,.15)}
input[type=checkbox]{width:auto}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--ink2);margin:0 0 4px;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:600;margin:6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;background:var(--p);color:var(--on-p);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn.alt{background:var(--soft);color:var(--p)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.wa{background:#25d366;color:#fff}
.btn.wish{background:var(--wish);color:#fff}
.btn.acc{background:var(--a);color:#1d1300}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.lg{padding:16px 22px;font-size:18px;border-radius:14px}
.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--okbg);color:var(--ok)}
.chip.off{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.gray{background:var(--soft);color:var(--ink2)}
.chip.wish{background:var(--wishbg);color:var(--wish)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:17px}
.muted{color:var(--mut);font-size:13px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
td.num,th.num{display:table-cell;unicode-bidi:plaintext;text-align:start}
.err{color:var(--bad);background:var(--badbg);padding:9px 12px;border-radius:10px;font-size:14px;white-space:pre-line}
.okmsg{color:var(--ok);background:var(--okbg);padding:9px 12px;border-radius:10px;font-size:14px}
.msg:empty{display:none}
/* الجداول: تمرير أفقي، بدون تكسير الكلمات حرفاً حرفاً */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap;vertical-align:middle}
th{background:var(--soft);font-size:12.5px;color:var(--ink2);font-weight:700;position:sticky;top:0}
tr.void td{opacity:.45;text-decoration:line-through}
tbody tr:hover{background:#fafcfe}
td.wrap{white-space:normal;min-width:180px}
/* على الكمبيوتر: العناوين والنصوص بتنزل لسطر تاني (بين الكلمات فقط)، والأرقام والكبسات بتضل على سطر */
@media (min-width:900px){
  th{white-space:normal;line-height:1.25;vertical-align:bottom}
  td{white-space:normal;overflow-wrap:normal;word-break:normal}
  td.num,td .num,td .chip,td .btn,td b.num{white-space:nowrap}
  td:has(> .btn){white-space:nowrap}
}
/* على التلفون: كل سطر كرت */
@media (max-width:899px){
  .tw{border:0;background:transparent;overflow:visible;max-height:none}
  table.cards,table.cards tbody{display:block;width:100%}
  table.cards thead{display:none}
  table.cards tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 8px;padding:8px 10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  table.cards tr.cr-full{display:block;padding:0;border:0;background:transparent;box-shadow:none}
  table.cards td{display:block;border:0;padding:2px 0;white-space:normal;text-align:start;min-width:0;overflow-wrap:break-word}
  table.cards td::before{content:attr(data-l);display:block;font-weight:600;color:var(--mut,#64748b);font-size:11px;line-height:1.3;margin-bottom:1px}
  table.cards td[data-l=""]{grid-column:1/-1}
  table.cards td[data-l=""]::before{display:none}
  table.cards td.cr-empty{display:none}
  table.cards tr.cr-full td{grid-column:auto}
  table.cards tr.cr-full td::before{display:none}
  table.cards td .btn{margin:2px 0}
  table.cards td,table.cards td *{white-space:normal!important;max-width:100%}
  table.cards td .btn{white-space:nowrap!important}
  table.cards td.num{text-align:start}
  table.stick td:nth-child(2){position:static;box-shadow:none}
  .tw::before{display:none}
}
/* الهيكل */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:26px 22px;max-width:400px;width:100%;text-align:center}

.tbar select{width:auto;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}

main{max-width:1280px;margin:0 auto;padding:14px 12px 90px}
/* القائمة على اليمين: ثابتة على الكمبيوتر (تنضب بزر ☰)، ودرج على الهاتف */
.menu-btn{display:inline-flex!important}
.stat[data-go]{cursor:pointer;transition:transform .1s,box-shadow .1s}
.stat[data-go]:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(12,59,94,.18)}
.stat[data-go] span::after{content:' ›';opacity:.5}
/* الجداول: تمرير يمين/شمال وفوق/تحت داخل الجدول نفسه، وشريط التمرير الأفقي دايماً ظاهر */
.tw{max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px);overflow:auto}
@media (max-width:899px){
  .tw{max-height:none}
  table{font-size:13px} th,td{padding:6px 8px}
  .toolbar input,.toolbar select{min-width:0;flex:1 1 44%}
  .toolbar .btn{padding:8px 10px;font-size:13px}
  .tw::before{content:attr(data-swipe);display:block;position:sticky;inset-inline-start:0;font-size:11.5px;color:var(--mut);padding:4px 8px;background:#fff}

.menu-ov{display:none}
@media (min-width:900px){
  nav.tabs{position:fixed;top:54px;bottom:0;inset-inline-start:0;width:230px;flex-direction:column;flex-wrap:nowrap;padding:8px 8px;margin:0;max-width:none;overflow-y:auto;background:var(--pd);gap:1px;z-index:40}

}

  nav.tabs{position:fixed;top:0;bottom:0;inset-inline-start:0;width:270px;max-width:85vw;flex-direction:column;flex-wrap:nowrap;padding:18px 12px;margin:0;background:var(--pd);z-index:900;transform:translateX(105%);transition:transform .2s;overflow-y:auto;gap:4px}
  html[dir=ltr] nav.tabs{transform:translateX(-105%)}

}
.lic{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:10px;margin-bottom:12px;font-weight:700;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:12px 14px}

.list{display:flex;flex-direction:column;gap:8px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}

 wac_hint:['حتى يبعت البرنامج رسائل واتساب لحالو (بلا ما يفتح صفحة واتساب):\n1) نزّل «برنامج واتساب للمكتب» وشغّل START-WHATSAPP.bat على كمبيوتر المكتب (يلزمه Node.js).\n2) اضغط «ربط مع برنامج واتساب» وامسح رمز QR من تلفونك.\nبعدها أي كبسة واتساب بالبرنامج بتبعت مباشرة، والإرسال الجماعي بيصير 50 رسالة بالدفعة.','To let the program send WhatsApp messages by itself:\n1) Download the office WhatsApp connector and run START-WHATSAPP.bat on the office computer (needs Node.js).\n2) Press “Link” and scan the QR with your phone.\nThen every WhatsApp button sends directly, and bulk sending goes 50 at a time.','Pour envoyer automatiquement : lancez le connecteur au bureau puis liez et scannez le QR.'],

 wc_hint:['الإرسال عبر WhatsApp Business API الرسمي من خلال WhatChimp: لا حظر، ولا يحتاج كمبيوتر المكتب. الفواتير والإيصالات والتذكيرات وأوامر العمل تُرسل عبر templates موافق عليها من Meta.\nأنشئ مفتاح API من WhatChimp: Settings ← Integrations ← API keys ← Create API key (صلاحيات: Send messages + Templates Read، القناة: مولد عين وزين)، ثم الصقه هنا. المفتاح يُحفظ على السيرفر ولا يظهر بعد الحفظ.','Sending through the official WhatsApp Business API via WhatChimp: no bans, no office computer needed. Bills, receipts, reminders and work orders go out as Meta-approved templates.\nCreate an API key in WhatChimp (Settings › Integrations › API keys › Create API key, access: Send messages + Templates Read) and paste it here. It is kept on the server and never shown again.','Envoi via l’API officielle WhatsApp Business (WhatChimp). Créez une clé API dans WhatChimp et collez-la ici ; elle reste sur le serveur.'],

 bot_hint:['يرسل المشترك الباركود المكتوب على العدّاد أو الفاتورة إلى رقم واتساب المولّد، وإذا كان رقم هاتفه مطابقاً لرقم المشترك يصله الرصيد والفواتير غير المدفوعة وآخر فاتورة وآخر دفعة تلقائياً.\nطريقة الربط في WhatChimp: Settings ← Webhooks ← Add endpoint، الصق الرابط أدناه، واختر الحدث message.incoming، ثم انسخ الـSigning secret (يبدأ بـwhsec_) والصقه هنا.','The customer sends the barcode from the meter or bill to the generator\'s WhatsApp number. If their phone matches the subscriber\'s number, they automatically receive the balance, unpaid bills, last bill and last payment.\nSetup in WhatChimp: Settings → Webhooks → Add endpoint, paste the URL below, pick the message.incoming event, then copy the Signing secret (starts with whsec_) and paste it here.','L\'abonné envoie le code-barres du compteur ou de la facture au numéro WhatsApp du générateur. Si son numéro correspond à celui de l\'abonné, il reçoit automatiquement le solde, les factures impayées, la dernière facture et le dernier paiement.\nDans WhatChimp : Settings → Webhooks → Add endpoint, collez l\'URL ci-dessous, choisissez l\'événement message.incoming, puis copiez le Signing secret (commence par whsec_) et collez-le ici.'],

 inv_imp_hint:['ملف Excel فيه سطر لكل فاتورة: الاسم، رقم العداد، المنطقة، الحالي، السابق، تاريخ الفاتورة، إجمالي الفاتورة، رصيد الحساب الحالي.\n• المطابقة بالاسم كما هو (مع «- 1» و«- 2»…)، والأسماء غير المسجلة لا تُدخل.\n• تاريخ الفاتورة من 1 إلى 14 = فاتورة الشهر السابق (02/06 ← أيار)، ومن 15 فما فوق = فاتورة الشهر نفسه.\n• الاستهلاك = الحالي − السابق.\n• بعد الاستيراد يصبح رصيد كل زبون مطابقاً لـ«رصيد الحساب الحالي» في الملف.\n• يمكن إعادة الاستيراد: الفواتير المستوردة سابقاً تُستبدل، والأشهر التي فيها قراءة من البرنامج لا تُلمس.','Excel file with one row per invoice: name, meter no., area, current, previous, invoice date, invoice total, current balance.\n• Matching by exact name (including “- 1”, “- 2”…); unknown names are skipped.\n• Invoice dated 1–14 = previous month’s bill (02/06 → May); 15 or later = same month.\n• Consumption = current − previous.\n• After import each balance equals the file’s current balance.\n• Re-import replaces earlier imported invoices; months read in this program are not touched.','Fichier Excel, une ligne par facture : nom, compteur, zone, actuel, précédent, date, total, solde actuel.\n• Correspondance par nom exact ; noms inconnus ignorés.\n• Facture du 1 au 14 = mois précédent (02/06 → mai) ; 15 et plus = même mois.\n• Consommation = actuel − précédent.\n• Après import, chaque solde = solde actuel du fichier.\n• Réimporter remplace les factures importées ; les mois relevés ici ne sont pas touchés.'],

 st_imp:['تصحيح الحسابات من كشف الحساب','Fix balances from statement of account','Corriger les soldes depuis le relevé'],
 st_imp_hint:['ملف Excel «كشف حساب» من البرنامج السابق (كل الزبائن بملف واحد).\n• المطابقة برقم الحساب ثم بالاسم.\n• لكل زبون يُعاد بناء الحساب كما في الكشف: فاتورة كل شهر بشهرها وتاريخها، الدفعات بتاريخها ورقم الإيصال، والرسوم الإضافية (كونتكتير، تركيب…).\n• ما قبل تاريخ بداية الكشف يُجمع بسطر «رصيد سابق»، وقراءات العدادات المستوردة تبقى.\n• الرصيد النهائي = رصيد الكشف، مطروحاً منه الدفعات المقبوضة في هذا البرنامج وغير المسجلة في الكشف (الدفعة المسجلة في الاثنين لا تُحسب مرتين).\n• الأشهر التي أُخذ عدادها في هذا البرنامج لا تتكرر.','“Statement of account” Excel from the previous program (all customers in one file).\n• Matching by account number, then by name.\n• Each account is rebuilt exactly as in the statement: each month’s bill with its month and date, payments with their date and receipt no., extra charges (contactor, installation…).\n• Everything before the statement start becomes one “previous balance” line; imported meter readings are kept.\n• Final balance = statement balance minus payments taken in this program that are not in the statement (a payment recorded in both is counted once).\n• Months read in this program are not duplicated.','Relevé de compte Excel de l’ancien programme (tous les clients).\n• Correspondance par n° de compte puis par nom.\n• Chaque compte est reconstruit comme dans le relevé : factures par mois et date, paiements avec date et n° de reçu, frais supplémentaires.\n• Tout ce qui précède le début du relevé devient une ligne « solde antérieur » ; les relevés de compteur importés sont conservés.\n• Solde final = solde du relevé moins les paiements encaissés ici et absents du relevé (un paiement présent des deux côtés compte une fois).\n• Les mois relevés ici ne sont pas dupliqués.'],

var SLUG='', TOKEN='', ME=null, SITE=null, PLANS=[], STAFF=[], CUST=[], LIC=null, TODAY='', TAB='dash';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
function n2(v){ var x=Number(v); return isFinite(x)?x:0; }
function fmtN(v,d){ return n2(v).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d==null?2:d}); }
function sym(c){ if(SITE&&SITE.cur_label&&c===mainCur()) return SITE.cur_label; return c==='LBP' ? (LANG==='ar'?'ل.ل':'LBP') : '$'; }
function mainCur(){ return (SITE&&SITE.currency)||'USD'; }
function rate(){ return n2(SITE&&SITE.lbp_rate); }
function money(v,c){ c=c||mainCur(); var s=fmtN(v,c==='LBP'?0:2), y=sym(c); return y==='$'? y+s : s+' '+y; }
function second(v){ if(!SITE||!SITE.show_second||!rate()) return ''; return mainCur()==='USD' ? money(n2(v)*rate(),'LBP') : money(n2(v)/rate(),'USD'); }
function moneyBoth(v){ var s=second(v); return '<span class="num">'+esc(money(v))+'</span>'+(s?' <span class="muted num">≈ '+esc(s)+'</span>':''); }
function dt(s){ if(!s) return ''; var d=new Date(s); if(isNaN(d)) return String(s); var p=function(x){return String(x).padStart(2,'0')};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function balHtml(b){ b=n2(b); return '<span class="bal num '+(b>0?'debt':(b<0?'cred':''))+'">'+esc(money(b))+'</span>'; }
function isAdmin(){ return !!(ME&&ME.is_admin); }
function planName(id){ var p=PLANS.filter(function(x){return x.id===id})[0]; return p?p.name:''; }
function staffName(id){ var s=STAFF.filter(function(x){return x.id===id})[0]; return s?s.name:''; }
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
var toastT=null;
function toast(m,k){ var el=$('#toast'); el.textContent=m; el.className='toast on '+(k||''); clearTimeout(toastT); toastT=setTimeout(function(){ el.className='toast'; }, k==='e'?5200:2600); }
function errText(e){
  var m=String((e&&(e.message||e.error_description||e.error))||e||'');
  var mm=m.match(/MOTOR:([a-z_]+)(?::([^\n"]*))?/);
  if(mm){ var k='e_'+mm[1]; var x=(mm[2]||'').replace('|',' → '); return D[k]?t(k,{x:x}):m; }
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return t('e_network');
  return m||'Error';
}
function isAuthErr(e){ return /MOTOR:(auth|license|inactive)\b/.test(String(e&&e.message||e||'')); }
var INFLIGHT=0;
window.addEventListener('beforeunload',function(e){ if(INFLIGHT>0){ e.preventDefault(); e.returnValue=t('upload_wait'); return t('upload_wait'); } });
async function call(fn,args){
  if(!sb) throw new Error(t('e_network'));
  var a=Object.assign({p_slug:SLUG,p_token:TOKEN||null},args||{});
  var r; INFLIGHT++; try{ r=await sb.rpc(fn,a); } finally { INFLIGHT--; }
  if(r.error){ if(isAuthErr(r.error)&&ME){ handleAuthLoss(r.error); } throw r.error; }
  return r.data;
}
function handleAuthLoss(e){ toast(errText(e),'e'); setTimeout(function(){ doLogout(true); }, 1500); }

function modal(title,body,foot,wide){
  var ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="modal'+(wide?' wide':'')+'" role="dialog" aria-modal="true"><div class="mh"><h3></h3><button class="mx" type="button" aria-label="close">×</button></div><div class="mb"></div>'+(foot!==false?'<div class="mf"></div>':'')+'</div>';
  $('h3',ov).textContent=title;
  $('.mb',ov).innerHTML=body||'';
  if(foot) $('.mf',ov).innerHTML=foot;
  document.body.appendChild(ov); document.body.classList.add('lock');
  var api={el:ov, body:$('.mb',ov), foot:$('.mf',ov), onclose:null,
    close:function(){ if(api.onclose) try{ api.onclose(); }catch(e){} ov.remove(); if(!$('.ov')) document.body.classList.remove('lock'); }};
  $('.mx',ov).addEventListener('click',function(){ api.close(); });
  return api;
}
function confirmBox(text){ return new Promise(function(res){
  var m=modal(t('ok'),'<p style="margin:0;white-space:pre-line">'+esc(text)+'</p>','<button class="btn ghost" data-a="n">'+esc(t('cancel'))+'</button><button class="btn" data-a="y">'+esc(t('ok'))+'</button>');
  m.onclose=function(){ res(false); };

async function boot(){
  var seg=location.pathname.split('/').filter(Boolean);
  SLUG=(seg[0]==='portal-motor'&&seg[1])?decodeURIComponent(seg[1]).toLowerCase():'';
  if(!LANG) setLang('ar'); else setLang(LANG);
  gate(t('loading'),false);
  if(!sb){ gate('<div class="err">'+esc(t('e_network'))+'</div>',false); return; }
  if(!SLUG){
    // /motor بدون رابط: صاحب الاشتراك → أول مولّد عنده
    try{ var s=await sb.auth.getSession();
      if(s.data.session){ var lic=(await sb.rpc('my_licenses')).data||[]; var m=lic.filter(function(x){return x.product==='motor'&&x.slug})[0];
        if(m){ location.replace('/portal-motor/'+encodeURIComponent(m.slug)); return; } } }catch(e){}
    gate(esc(t('no_slug'))+'<br><br><a class="btn" href="/account">'+esc(t('my_account'))+'</a>',false); return;
  }
  var pub;
  try{ var r=await sb.rpc('motor_public',{p_slug:SLUG}); if(r.error) throw r.error; pub=r.data; }
  catch(e){ gate('<div class="err">'+esc(errText(e))+'</div>',false); return; }
  if(pub && pub.site){ $('#gName').textContent=pub.site.name||SLUG; document.title=(pub.site.name||SLUG)+' — Motor';
    if(pub.site.logo_url){ $('#gLogo').src=pub.site.logo_url; $('#gLogo').classList.remove('hidden'); }
    if(!lsGet('motor_lang','')) setLang(pub.site.default_lang||'ar'); }
  if(!pub || !pub.ok){
    // صاحب الاشتراك قد يكون اشترى للتو ولم تُنشأ المؤسسة بعد — منبنيها وبعدين شاشة الدخول (ADMIN / 0000)
    if(pub && pub.reason==='not_found'){ try{ var ss=await sb.auth.getSession(); if(ss.data.session){ var e1=await sb.rpc('ensure_motor',{p_slug:SLUG}); if(e1.data&&e1.data.ok){ location.reload(); return; } } }catch(e){} }
    var rk=pub&&pub.reason==='not_found'?'r_not_found':(pub&&pub.reason==='inactive'?'r_inactive':'r_license');
    gate('<div class="err">'+esc(t(rk))+'</div><br><a class="btn alt" href="/account">'+esc(t('my_account'))+'</a>',false); return;
  }
  TOKEN=lsGet('motor_tok:'+SLUG,'');
  if(TOKEN){ if(lsGet('motor_kind:'+SLUG,'')==='customer'){ if(await enterCustomer()) return; } else if(await enter()) return;
    TOKEN=''; lsSet('motor_tok:'+SLUG,null); }
  try{ var qu=new URLSearchParams(location.search).get('u'); if(qu) $('#inUser').value=qu; }catch(e){}
  gate('',true); setTimeout(function(){ ($('#inUser').value?$('#inPass'):$('#inUser')).focus(); },50);
}
async function tryOwner(ensure){
  try{ var s=await sb.auth.getSession(); if(!s.data.session) return false;
    if(ensure){ var e=await sb.rpc('ensure_motor',{p_slug:SLUG}); if(e.error||!e.data||!e.data.ok) return false; }
    TOKEN=''; return await enter(true);
  }catch(e){ return false; }
}
async function enter(quiet){
  try{
    var d=await call('motor_me');
    ME=d.me; SITE=d.site; PLANS=d.plans||[]; STAFF=d.staff||[]; LIC=d.license; TODAY=d.today;

}

function dueText(r){
  var d=r.due||{}, c=r.customer, cur=mainCur();
  var amt=fmtN(d.balance,cur==='LBP'?0:2)+' '+cur;
  var months=(d.periods||[]).map(function(p){ return monthName(p,true); });
  if(d.older) months.unshift(t('due_older'));
  if(!months.length) months=[monthName(r.inv.period,true)];
  if(!(n2(d.balance)>0.005)){ var okm=t('due_msg_ok',{s:SITE.name||'',n:c.name,m:monthName(r.inv.period,true),i:fmtN(r.inv.amount,cur==='LBP'?0:2)+' '+cur,v:fmtN(Math.abs(n2(d.balance)),cur==='LBP'?0:2)+' '+cur});
    return Math.abs(n2(d.balance))<0.005?okm.split('\n').slice(0,-1).join('\n'):okm; }
  return t('due_msg',{s:SITE.name||'',n:c.name,k:fmtN((d.count||0)+(d.older?1:0),0),v:amt,m:months.join(t('due_and'))});
}

var SYNC={since:null,timer:null,ping:null,busy:false};
function startSync(){
  stopSync();
  SYNC.since=null;
  SYNC.timer=setInterval(syncNow,15000);
  if(TOKEN){ pingNow(); SYNC.ping=setInterval(pingNow,60000); }
}
function stopSync(){ if(SYNC.timer) clearInterval(SYNC.timer); if(SYNC.ping) clearInterval(SYNC.ping); SYNC.timer=SYNC.ping=null; }
async function syncNow(){
  if(SYNC.busy||!ME||document.hidden) return; SYNC.busy=true;
  try{
    var r=await call('motor_changes',{p_since:SYNC.since});
    var first=SYNC.since===null; SYNC.since=r.now;
    var dot=$('#liveDot'); if(dot) dot.style.color='#7CFC9A';
    var changed=(r.customers||[]).length>0;
    (r.customers||[]).forEach(function(c){ var i=-1; for(var k=0;k<CUST.length;k++) if(CUST[k].id===c.id){ i=k; break; }
      if(c.deleted){ if(i>=0) CUST.splice(i,1); return; } if(i>=0) CUST[i]=c; else CUST.push(c); });
    if(r.me){ var was=JSON.stringify([ME.can_read,ME.can_collect,ME.can_cut,ME.is_admin]); ME=Object.assign(ME,r.me); if(was!==JSON.stringify([ME.can_read,ME.can_collect,ME.can_cut,ME.is_admin])) paintShell(); }
    var perChanged=SITE.bill_period!==r.period||n2(SITE.lbp_rate)!==n2(r.lbp_rate);
    SITE.bill_period=r.period; SITE.lbp_rate=r.lbp_rate;
    if(r.wa_pending!=null) setWaBadge(r.wa_pending,r.wa_inv);
    if((changed&&!first)||perChanged){
      refreshSearchLists();
      var idle=!$('.ov')&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));
      if(idle&&['dash','month','cash','whish','cstmt'].indexOf(TAB)>=0) go(TAB,true);
    }
  }catch(e){ var dot2=$('#liveDot'); if(dot2) dot2.style.color='#ffb4b4'; }
  SYNC.busy=false;
}
function pingNow(){ if(!navigator.geolocation||!TOKEN) return;
  if(lsGet('motor_main:'+SLUG,'')) return;   // المدير داخل على حساب موظف — ما منسجّل موقعو
  navigator.geolocation.getCurrentPosition(function(p){ call('motor_ping',{p_lat:p.coords.latitude,p_lng:p.coords.longitude,p_acc:Math.round(p.coords.accuracy||0)}).catch(function(){}); },function(){},{enableHighAccuracy:true,timeout:20000,maximumAge:60000}); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&ME) syncNow(); });

  main.innerHTML=licBanner()+(mode==='read'&&ME.role==='collector'?windowNote():'')+

      if(mode==='read') return c.is_active&&!c.archived&&!c.read_now;
      if(mode==='pay') return !c.archived&&n2(c.balance)>0;
      return !c.archived;

  }
  function paint(){
    var v=q.value, list=$('#flist',main);
    if(mode==='read'){ var a=CUST.filter(function(c){return c.read_now}).length, b=CUST.filter(function(c){return c.is_active&&!c.archived}).length;
      var pr=$('#fprog',main); if(pr) pr.textContent=custLoading&&!CUST.length?t('loading'):t('progress',{a:a,b:b,p:SITE.bill_period}); }
    var r;

      $('#ftitle',main).textContent=t(mode==='read'?'remaining_read':mode==='pay'?'remaining_pay':'all_customers',{n:fmtN(r.length,0)});
    }
    var shown=r.slice(0,FF.lim);
    list.innerHTML=shown.length?shown.map(function(c){return custItem(c,mode)}).join(''):'<div class="muted">'+esc(custLoading?t('loading'):t('no_results'))+'</div>';
    $('#fmore',main).innerHTML=r.length>FF.lim?'<button class="btn ghost" id="fmb">'+esc(t('more'))+' ('+esc(r.length-FF.lim)+')</button>':'';
    var mb=$('#fmb',main); if(mb) mb.addEventListener('click',function(){ FF.lim+=150; paint(); });
  }
  q.addEventListener('input',paint);
  $('#farea',main).addEventListener('change',function(){ FF.area=this.value; FF.lim=80; paint(); });
  q.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); var v=q.value.trim(); if(v) openByCode(v,mode); } });
  if($('#scanBtn',main)) $('#scanBtn',main).addEventListener('click',async function(){ var code=await scanBarcode(); if(code) openByCode(code,mode); });
  if(isAdmin()) setTimeout(function(){ q.focus(); },60);
  searchHooks.push(paint); paint();
}

  function estimate(v){

    return {kwh:k,price:price,amt:n2(p.fee)+k*price-n2(c.charge_discount)+n2(c.charge_addition)};
  }

function quickGeo(){ return new Promise(function(res){ if(!navigator.geolocation) return res(null);

/* ---------- الفاتورة/الإيصال بنفس شكل الإيصال الورقي ----------
   o = {inv, pay, c}  — inv: الفاتورة (ممكن تكون فاضية بالقبض)، pay: الإيصال */
function ymd(s){ var d=dt(s); return d?d.slice(0,10).replace(/-/g,'/'):''; }
function priceStr(v){ var n=n2(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4}), y=sym(mainCur()); return y==='$'? y+n : n+' '+y; }
function billLines(o){
  var inv=o.inv, p=o.pay, L=[];
  if(inv){
    L.push({k:t('b_inv_date'),v:ymd(inv.created_at)});
    if(p) L.push({k:t('b_pay_date'),v:ymd(p.created_at)});
    L.push({k:t('b_name'),v:o.c.name});
    if(inv.period&&inv.kind!=='sale') L.push({k:t('b_desc'),v:t('b_inv_of',{m:monthName(inv.period)})+' - '+o.c.name});
    if(inv.period&&inv.kind!=='sale') L.push({t:t('b_month',{m:monthName(inv.period,true)})});
    L.push({hr:1},{t:t('b_details')},{hr:1});
    if(n2(inv.fee)) L.push({k:t('b_fee'),v:money(inv.fee)});
    if(inv.kind==='meter'){
      L.push({k:t('b_prev'),v:fmtN(inv.prev_value)},{k:t('b_cur'),v:fmtN(inv.cur_value)},{k:t('b_cons'),v:fmtN(inv.kwh)+' '+t('b_kwh_unit')});
      if(n2(inv.kwh_price)||n2(inv.energy)) L.push({k:t('b_price'),v:priceStr(inv.kwh_price)},{k:t('b_energy'),v:money(inv.energy)});
    }
    if(n2(inv.discount)) L.push({k:t('discount'),v:'−'+money(inv.discount)});
    if(n2(inv.addition)) L.push({k:t('addition'),v:money(inv.addition)});
    if(inv.kind==='sale'){ (inv.items||[]).forEach(function(x){ L.push({k:'\u2067'+x.name+'\u2069',v:money(x.total)}); if(n2(x.qty)!==1) L.push({t:'\u2066'+fmtN(x.qty)+' × '+money(x.price)+'\u2069',s:1}); }); }
    if(/^قراءة أولى/.test(inv.note||'')) L.push({t:t('first_read'),s:1});
    L.push({hr:1},{k:t('b_amount'),v:money(inv.amount),b:1},{hr:1},{k:t('b_prev_bal'),v:money(inv.balance_before)},{hr:1});
  } else if(p){
    L.push({k:t('b_pay_date'),v:ymd(p.created_at)},{k:t('b_name'),v:o.c.name},{hr:1});
  }
  if(p){
    L.push({k:t('b_due'),v:money(p.balance_before),b:1},{hr:1},
      {k:t('b_paid'),v:money(p.paid_amount,p.paid_currency)+(p.paid_currency!==mainCur()?' (= '+money(p.amount)+')':''),b:1},{hr:1},
      {k:t('b_now'),v:money(p.balance_after),b:1});
    if(second(p.balance_after)&&n2(p.balance_after)) L.push({t:'≈ '+second(p.balance_after),s:1});
  } else if(inv){
    L.push({k:t('b_due'),v:money(inv.balance_after),b:1});
    if(second(inv.balance_after)) L.push({t:'≈ '+second(inv.balance_after),s:1});
  }
  return L;
}
function billHead(o){ return o.inv?(o.inv.kind==='sale'?t('k_sale')+' — ':'')+t('b_inv_no',{n:o.inv.no}):t('receipt'); }
function billHtml(o){
  return '<div class="inv-box">'+(SITE.logo_url?'<div style="text-align:center"><img src="'+esc(SITE.logo_url)+'" alt="" style="max-height:56px"></div>':'')+
    '<div style="text-align:center;font-weight:800;font-size:17px">'+esc(SITE.name||'')+'</div>'+(SITE.tagline?'<div style="text-align:center" class="muted">'+esc(SITE.tagline)+'</div>':'')+
    '<div style="text-align:center;margin:4px 0">'+esc(billHead(o))+'</div>'+
    billLines(o).map(function(l){
      if(l.hr) return '<div style="border-top:1px dashed #c9b37a;margin:6px 0"></div>';
      if(l.t) return '<div class="'+(l.s?'muted':'')+'" style="'+(l.s?'':'font-weight:700')+'">'+esc(l.t)+'</div>';
      return '<div class="ln'+(l.b?' tot':'')+'" style="'+(l.b?'border:0;margin:0;padding-top:3px':'')+'"><span>'+esc(l.k)+'</span><span dir="auto">'+esc(l.v)+'</span></div>';
    }).join('')+(o.pay&&o.pay.method==='whish'?'<div style="text-align:center;font-weight:800;margin-top:6px">'+esc(t('b_whish_paid'))+'</div>':'')+
    (o.pay?'<div class="muted" style="margin-top:6px">'+esc(t('b_rcpt',{n:o.pay.no,s:o.pay.staff_name||''}))+'</div>':'')+
    (SITE.invoice_note?'<div style="text-align:center;white-space:pre-line;margin-top:6px;border-top:1px dashed #c9b37a;padding-top:6px">'+esc(SITE.invoice_note)+'</div>':'')+'</div>';
}
function billText(o){
  var s=['*'+(SITE.name||'')+'*']; if(SITE.tagline) s.push(SITE.tagline); s.push(billHead(o)); s.push('');
  billLines(o).forEach(function(l){ if(l.hr) s.push('—————'); else if(l.t) s.push(l.t); else s.push((l.b?'*':'')+l.k+': '+l.v+(l.b?'*':'')); });
  if(o.pay&&o.pay.method==='whish') s.push('', '*'+t('b_whish_paid')+'*');
  if(o.pay) s.push('', t('b_rcpt',{n:o.pay.no,s:o.pay.staff_name||''}));
  if(SITE.invoice_note) s.push('', SITE.invoice_note);
  return s.join('\n');
}

function c128Modules(text){ text=String(text).replace(/[^\x20-\x7E]/g,''); var codes=[104], sum=104;
  for(var i=0;i<text.length;i++){ var v=text.charCodeAt(i)-32; codes.push(v); sum+=v*(i+1); }
  codes.push(sum%103); codes.push(106); var m=[]; codes.forEach(function(cd){ var p=C128[cd]; for(var j=0;j<p.length;j++) m.push(+p[j]); }); return m; }
/* رسم ملصق واحد على canvas بدقة الطابعة (203 أو 300 نقطة/إنش) */
function renderLabel(c,cfg){
  var dpm=cfg.dpi/25.4, W=Math.round(cfg.w*dpm), H=Math.round(cfg.h*dpm);
  W=Math.ceil(W/8)*8;
  var cv=document.createElement('canvas'); cv.width=W; cv.height=H; var x=cv.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.fillStyle='#000'; x.textAlign='center'; x.textBaseline='middle';
  var pad=Math.round(1.2*dpm), ox=Math.round(n2(cfg.ox)*dpm), oy=Math.round(n2(cfg.oy)*dpm), y=pad+oy;
  function line(txt,sz,bold){ if(!txt) return; var f=sz; x.direction=/[\u0600-\u06FF]/.test(txt)?'rtl':'ltr'; x.font=(bold?'bold ':'')+f+'px Cairo, Tahoma, Arial, sans-serif';
    while(x.measureText(txt).width>W-pad*2&&f>8){ f--; x.font=(bold?'bold ':'')+f+'px Cairo, Tahoma, Arial, sans-serif'; }
    x.fillText(txt,W/2+ox,y+f*0.6); y+=Math.round(f*1.18); }
  var base=Math.max(14,Math.round(H/7));
  if(cfg.f_site) line(SITE.name||'',Math.round(base*0.8),false);
  var top=[cfg.f_name?c.name:'',cfg.f_box&&c.box?(t('box')+' '+c.box):'',cfg.f_area&&c.area?c.area:''].filter(Boolean).join(' · ');
  line(top,base,true);
  var codeH=cfg.f_code?Math.round(base*1.05):0, bh=Math.max(20,Math.min(H-y-codeH-pad,Math.round(H*n2(cfg.bh)/100)));
  var mods=c128Modules(c.barcode||''), tot=mods.reduce(function(a,b){return a+b},0)+20, mw=Math.max(1,Math.floor((W-pad*2)/tot)), bw=tot*mw, bx=Math.round((W-bw)/2)+ox+10*mw, xx=bx;
  mods.forEach(function(w,i){ if(i%2===0) x.fillRect(xx,y,w*mw,bh); xx+=w*mw; });
  y+=bh+2;
  if(cfg.f_code) line(c.barcode,codeH,true);
  if(+cfg.rot===180){ var c2=document.createElement('canvas'); c2.width=W; c2.height=H; var x2=c2.getContext('2d'); x2.translate(W,H); x2.rotate(Math.PI); x2.drawImage(cv,0,0); cv=c2; }
  return cv;
}
function canvasBits(cv,blackIsOne){
  var w=cv.width, h=cv.height, d=cv.getContext('2d').getImageData(0,0,w,h).data, bpr=Math.ceil(w/8), out=new Uint8Array(bpr*h);
  if(!blackIsOne) out.fill(255);
  for(var y=0;y<h;y++) for(var xx=0;xx<w;xx++){ var i=(y*w+xx)*4; if((d[i]+d[i+1]+d[i+2])/3<150){ if(blackIsOne) out[y*bpr+(xx>>3)]|=(0x80>>(xx%8)); else out[y*bpr+(xx>>3)]&=~(0x80>>(xx%8)); } }
  return {bpr:bpr,h:h,data:out};
}
function enc(str){ return new TextEncoder().encode(str); }

/* TSPL (Xprinter / TSC / Gprinter / HPRT…) */
function labelsTspl(list,cfg){
  var parts=[enc('SIZE '+cfg.w+' mm,'+cfg.h+' mm\r\nGAP '+n2(cfg.gap)+' mm,0 mm\r\nDENSITY '+cfg.density+'\r\nSPEED '+cfg.speed+'\r\nDIRECTION 0,0\r\nREFERENCE 0,0\r\nSET TEAR ON\r\n')];
  list.forEach(function(c){ var b=canvasBits(renderLabel(c,cfg),!!+cfg.inv);
    parts.push(enc('CLS\r\nBITMAP 0,0,'+b.bpr+','+b.h+',0,'),b.data,enc('\r\nPRINT 1,'+Math.max(1,cfg.copies|0)+'\r\n')); });
  return joinBytes(parts);
}
/* ESC/POS (طابعات ملصقات تعمل بأوامر الإيصالات) */
function labelsEscPos(list,cfg){
  var parts=[new Uint8Array([0x1B,0x40])];
  list.forEach(function(c){ var b=canvasBits(renderLabel(c,cfg),!+cfg.inv);
    for(var k=0;k<Math.max(1,cfg.copies|0);k++){ parts.push(new Uint8Array([0x1D,0x76,0x30,0x00,b.bpr&255,(b.bpr>>8)&255,b.h&255,(b.h>>8)&255]),b.data,new Uint8Array([0x1D,0x0C])); } });
  return joinBytes(parts);
}

async function readXlsx(buf){

    var rid=s0&&(s0.getAttribute('r:id')||s0.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
    Array.prototype.forEach.call(rels.getElementsByTagName('Relationship'),function(r){ if(r.getAttribute('Id')===rid){ var tg=r.getAttribute('Target'); sheet=tg.charAt(0)==='/'?tg.slice(1):'xl/'+tg.replace(/^\.\//,''); } });
  }catch(e){}
  var ss=[], sst=await get('xl/sharedStrings.xml');

  var sx=await get(sheet); if(!sx) throw new Error('sheet');
  var rows=[];
  Array.prototype.forEach.call(X(sx).getElementsByTagName('row'),function(r){ var arr=[];
    Array.prototype.forEach.call(r.getElementsByTagName('c'),function(c){ var ref=c.getAttribute('r')||'', col=0, m=ref.match(/^[A-Z]+/);
      if(m){ for(var k=0;k<m[0].length;k++) col=col*26+(m[0].charCodeAt(k)-64); col--; } else col=arr.length;

      if(ty==='s') val=ss[+(v&&v.textContent)]||''; else if(ty==='inlineStr'){ Array.prototype.forEach.call(c.getElementsByTagName('t'),function(x){ val+=x.textContent; }); } else val=v?v.textContent:'';
      arr[col]=val; });
    for(var q=0;q<arr.length;q++) if(arr[q]===undefined) arr[q]='';
    rows.push(arr); });

}
function readCsv(text){ var rows=[], row=[], cur='', q=false; text=text.replace(/^﻿/,''); var sep=(text.split('\n')[0].split(';').length>text.split('\n')[0].split(',').length)?';':',';
  for(var i=0;i<text.length;i++){ var ch=text[i]; if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }

function excelDate(v){ if(/^\d{4,5}(\.\d+)?$/.test(v)&&+v>20000&&+v<80000){ var d=new Date(Math.round((+v-25569)*86400000)); return d.toISOString().slice(0,10); } return v; }
function buildImport(rows){
  var head=rows[0]||[], map=[], seenMobile=false, ignored=[];
  head.forEach(function(h,i){ var k=HMAP[normH(h)]; if(k==='mobile'){ if(seenMobile) k='mobile_cc'; seenMobile=true; } map[i]=k||null; if(!k&&String(h).trim()) ignored.push(String(h).trim()); });
  if(map.indexOf('name')<0) return {err:t('imp_none')};
  var out=[];
  rows.slice(1).forEach(function(r){ var o={};
    map.forEach(function(k,i){ if(!k) return; var v=String(r[i]==null?'':r[i]).trim(); if(v==='NULL'||v==='null') v='';
      if(k==='opening_balance'||k==='charge_discount'||k==='charge_addition'||k==='credit_limit'){ var nm=v.replace(/,/g,'').match(/-?\d+(\.\d+)?/); v=nm?nm[0]:''; }
      if(k==='is_active'||k==='archived') v=/^(1|true|yes|نعم|مفعل|مفعّل)$/i.test(v)?true:(v===''?(k==='is_active'):false);
      if(k==='breaker_no'&&v==='0') v='';
      if((k==='mobile'||k==='phone')&&/^0+$/.test(v)) v='';
      if(k==='mobile_cc'){ v=v.replace(/\D/g,''); if(v.length>4) { if(!o.mobile) o.mobile=v; v=''; } }
      if(k==='nationality'&&/^unknown$/i.test(v)) v='';
      if(k==='sub_date'||k==='stopped_at') v=excelDate(v);
      if(k==='collect_day') v=v.replace(/\D/g,'');
      o[k]=v; });
    if(o.name) out.push(o); });
  return {rows:out,cols:map.filter(Boolean),ignored:ignored};
}

  function add(x){ var b=typeof x==='string'?enc.encode(x):x; parts.push(b); off+=b.length; }

var WA_BATCH_ON=false;
async function waBatch(box,items,sendOne,onDone){
  if(!wcOn()){ toast(t('wa_need_link'),'e'); return; }
  if(WA_BATCH_ON){ toast(t('wa_batch_busy'),'e'); return; }
  var left=240; try{ var q=await wcApi({op:'quota'}); if(q&&q.left!=null) left=q.left; }catch(e){}
  if(left<=0){ toast(t('wc_e_daily'),'e'); return; }
  var list=items.slice(0,left);   // حد Meta: 250 رقماً مختلفاً كل 24 ساعة — منوقف على 240
  if(!list.length) return;
  if(list.length<items.length) toast(t('wc_batch_cut',{n:list.length}));
  if(!(await confirmBox(t('wc_batch_q',{n:list.length,l:left})))) return;
  WA_LOCK=false;
  var stop=false, ok=0, bad=0; box.classList.remove('hidden'); WA_BATCH_ON=true;
  var sb=$('[data-bstop]',box); sb.onclick=function(){ stop=true; sb.disabled=true; };
  sb.disabled=false;
  function leave(e){ e.preventDefault(); e.returnValue=t('wa_batch_leave'); return e.returnValue; }
  window.addEventListener('beforeunload',leave);
  $('[data-bt]',box).textContent=t('wa_batch_prog',{i:0,n:list.length,ok:0,bad:0}); $('[data-bp]',box).style.width='0%';
  try{
    for(var i=0;i<list.length&&!stop;i++){
      if(i>0) await new Promise(function(r){ setTimeout(r,500); });   // واتساب الرسمي: بلا انتظار (نص ثانية بس)
      if(stop) break;
      $('[data-bw]',box).textContent=t('wa_batch_sending',{i:i+1,n:list.length}); $('[data-bw]',box).classList.remove('hidden');
      var r=false; try{ r=await sendOne(list[i]); }catch(e){ r=false; }
      $('[data-bw]',box).classList.add('hidden');
      if(r===true) ok++; else { bad++; if(WA_LOCK){ stop=true; toast(t('wc_e_daily'),'e'); } $('[data-bl]',box).insertAdjacentHTML('beforeend','<div>✗ '+esc(r&&r.name||(list[i].customer&&list[i].customer.name)||'')+(r&&r.err?' — '+esc(r.err):'')+'</div>'); }
      $('[data-bt]',box).textContent=t('wa_batch_prog',{i:i+1,n:list.length,ok:ok,bad:bad});
      $('[data-bp]',box).style.width=Math.round((i+1)/list.length*100)+'%';
    }
  } finally { WA_BATCH_ON=false; window.removeEventListener('beforeunload',leave); }
  $('[data-bp]',box).style.width='100%';
  $('[data-bt]',box).textContent=t('wa_batch_done',{ok:ok,bad:bad}); sb.disabled=true;
  onDone&&onDone();
}

/* ---------- التقرير المالي الشهري (المدير الأساسي) ---------- */
var FR={period:''};
function frNext(per){ var d=new Date(per+'-01T12:00:00'); d.setMonth(d.getMonth()+1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function frPrev(per){ var d=new Date(per+'-01T12:00:00'); d.setMonth(d.getMonth()-1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function frLastDay(per){ var d=new Date(frNext(per)+'-01T12:00:00'); d.setDate(0); return d.getDate(); }
function frToday(){ var d=new Date(), per=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  var wd=''; try{ wd=d.toLocaleDateString(LANG==='ar'?'ar-LB':LANG,{weekday:'long'}); }catch(e){} return (wd?wd+'، ':'')+d.getDate()+' '+monthName(per,true); }
function frAuto(a,per){
  var prv=frPrev(per), nx=frNext(per), pb=a.prev_balance!=null?n2(a.prev_balance):0;
  return { title:t('fr_title',{m:monthName(per,true)}),
    income:[{l:t('fr_coll',{m:monthName(prv,false)+' '+prv.slice(0,4)}),a:n2(a.collections)}],
    expenses:(a.expenses||[]).map(function(x){ return {l:x.label,a:n2(x.amount)}; }),
    prev_label:t('fr_prev',{m:monthName(prv,false)}), prev_balance:pb, month_label:t('fr_month',{m:monthName(per,false)}),
    cur_label:t('fr_cur',{d:frLastDay(per)+' '+monthName(per,true)}),
    open_title:t('fr_open',{d:'1 '+monthName(nx,true)}),
    opening:(a.stock||[]).map(function(x){ return {l:t('fr_stock',{n:x.name}),v:fmtN(x.qty)}; }).concat([{l:t('fr_ins'),v:money(a.insurance)}]),
    sign:t('fr_sign',{s:SITE.name||''}), date:frToday() };
}
function frTotals(doc){ var i=0,e=0; doc.income.forEach(function(x){ i+=n2(x.a); }); doc.expenses.forEach(function(x){ e+=n2(x.a); });
  var m=Math.round((i-e)*100)/100; return {inc:i,exp:e,month:m,cur:Math.round((n2(doc.prev_balance)+m)*100)/100}; }
async function frCanvas(doc){
  var W=1240, P=90, cw=W-2*P, fam=getComputedStyle(document.body).fontFamily||'sans-serif', cur=SITE.cur_label||sym(mainCur());
  var logo=null; if(SITE.logo_url){ logo=await new Promise(function(res){ var im=new Image(); im.crossOrigin='anonymous'; var done=false;
    im.onload=function(){ if(!done){ done=true; res(im); } }; im.onerror=function(){ if(!done){ done=true; res(null); } }; setTimeout(function(){ if(!done){ done=true; res(null); } },5000); im.src=SITE.logo_url; }); }
  if(logo) logo=trimImg(logo);
  var T=frTotals(doc), rowH=44, secs=[];
  secs.push({h:t('fr_income'),rows:doc.income.map(function(x){ return [x.l,fmtN(x.a,2),cur]; }),tot:[t('fr_total'),fmtN(T.inc,2),cur]});
  secs.push({h:t('fr_exp'),rows:doc.expenses.map(function(x){ return [x.l,fmtN(x.a,2),cur]; }),tot:[t('fr_total'),fmtN(T.exp,2),cur]});
  secs.push({h:t('fr_bal'),rows:[[doc.prev_label,fmtN(doc.prev_balance,2),cur],[doc.month_label+(T.month<0?' '+t('fr_deficit'):''),(T.month<0?'- ':'')+fmtN(Math.abs(T.month),2),cur],[doc.cur_label,fmtN(T.cur,2),cur]],bold:true});
  secs.push({h:doc.open_title,rows:doc.opening.map(function(x){ return [x.l,String(x.v||''),'']; }),left:true,gap:110});
  var top=logo?300:120, H=top+120; secs.forEach(function(s){ H+=(s.gap||60)+rowH*(1+s.rows.length)+(s.tot?rowH:0); }); H+=260; H=Math.max(H,Math.round(W*1.4142));
  var cv=document.createElement('canvas'); cv.width=W; cv.height=H; var x=cv.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.fillStyle='#000'; x.strokeStyle='#555'; x.lineWidth=1.5;
  var rtl=LANG==='ar'; x.direction=rtl?'rtl':'ltr';
  if(logo){ var lh=230, lw=Math.min(380,logo.width*lh/logo.height); x.drawImage(logo,rtl?W-P-lw:P,40,lw,lh); }
  x.textAlign='center'; x.font='bold 44px '+fam; x.fillText(doc.title,W/2,top+40);
  var y=top+120, mid=P+cw/2, labX=rtl?W-P-16:P+16, numX=rtl?mid-20:W-P-90, symX=rtl?P+30:W-P-30;
  function cell(r,bold,box){
    if(box){ x.strokeRect(P,y,cw,rowH); x.beginPath(); x.moveTo(mid,y); x.lineTo(mid,y+rowH); x.stroke(); }
    x.font=(bold?'bold ':'')+'26px '+fam; x.textAlign=rtl?'right':'left'; x.direction=rtl?'rtl':'ltr'; x.fillText(r[0],labX,y+30,cw/2-30);
    x.direction='ltr'; x.textAlign='right'; x.fillText(r[1],numX,y+30); x.textAlign='center'; x.fillText(r[2]||'',symX,y+30); x.direction=rtl?'rtl':'ltr'; y+=rowH; }
  secs.forEach(function(s,i){ if(i) y+=(s.gap||60);
    x.fillStyle='#e6e6e6'; x.fillRect(P,y,cw,rowH); x.fillStyle='#000'; x.strokeRect(P,y,cw,rowH);
    x.font='bold 28px '+fam; if(s.left){ x.textAlign=rtl?'right':'left'; x.fillText(s.h,labX,y+31); } else { x.textAlign='center'; x.fillText(s.h,W/2,y+31); } y+=rowH;
    s.rows.forEach(function(r){ cell(r,s.bold,true); }); if(s.tot) cell(s.tot,true,false); });
  y+=140; x.font='bold 26px '+fam; x.textAlign=rtl?'right':'left'; x.direction=rtl?'rtl':'ltr';
  x.fillText(doc.sign,rtl?W-P-60:P+60,y); x.fillText(doc.date,rtl?W-P-60:P+60,y+60);
  return cv;
}

async function backupNow(){
  var b=await call('motor_backup');
  // الجداول الكبيرة على دفعات من 2000 سطر
  async function pages(tb){ var all=[], off=0; for(;;){ var r=await call('motor_backup_page',{p_table:tb,p_offset:off,p_limit:2000}); all=all.concat(r||[]); if(!r||r.length<2000) return all; off+=2000; } }
  if(b.paged){ for(var tb of ['customers','readings','invoices','payments','moves','insurance']) b[tb]=await pages(tb); }
  var S=[];
  function sheet(name,list,cols){ var rows=[cols]; (list||[]).forEach(function(x){ rows.push(cols.map(function(c){ var v=x[c]; return v==null?'':(typeof v==='object'?JSON.stringify(v):v); })); }); S.push({name:name,rows:rows}); }
  sheet('customers',b.customers,['code','name','alt_name','barcode','meter_no','box','generator','breaker_no','building','floor','side','location_name','location_code','lat','lng','area','area_code','zone','category','category2','collector_name','sub_date','is_active','stopped_at','stopped_by','credit_limit','charge_discount','discount_desc','charge_addition','addition_desc','initial_reading','balance','mobile','mobile_cc','mobile2','phone','address','email','nationality','archived','collect_day','notes','username','id','plan_id','collector_id']);
  sheet('plans',b.plans,['name','amps','kind','fee','kwh_price','is_active','sort','id']);
  sheet('staff',b.staff,['name','username','role','phone','can_read','can_collect','can_cut','is_active']);
  sheet('readings',b.readings,['created_at','period','customer_id','prev_value','value','photo_url','lat','lng','accuracy','dist_m','staff_name','id']);
  sheet('invoices',b.invoices,['created_at','no','period','kind','customer_id','plan_name','prev_value','cur_value','kwh','kwh_price','fee','energy','discount','addition','amount','balance_before','balance_after','note','staff_name','voided','id']);
  sheet('payments',b.payments,['created_at','no','customer_id','amount','paid_currency','paid_amount','rate','method','balance_before','balance_after','note','staff_name','voided','id']);
  sheet('moves',b.moves,['created_at','account','kind','amount','note','by_name','staff_id','extra','id']);
  if(b.insurance) sheet('insurance',b.insurance,['created_at','name','kind','amount','account','ref_no','service','note','by_name','customer_id','imported','id']);
  var d=new Date(), p=function(x){return String(x).padStart(2,'0')};
  downloadBlob(makeXlsx(S),'backup-'+SLUG+'-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.xlsx');
}
async function flushUploads(){
  if(INFLIGHT<=0) return;
  var m=modal(t('uploading'),'<div class="muted">'+esc(t('uploading'))+'</div>',false);
  for(var i=0;i<120&&INFLIGHT>0;i++) await new Promise(function(r){ setTimeout(r,250); });
  m.close();
}
/* المدير الأساسي بيفوت على حساب موظف من جهازو، وبيرجع لحسابو بكبسة */
async function loginAs(s){
  if(!(await confirmBox(t('as_q',{n:s.name})))) return;
  try{ var r=await call('motor_impersonate',{p_staff:s.id});
    lsSet('motor_main:'+SLUG,TOKEN); stopSync(); TOKEN=r.token; lsSet('motor_tok:'+SLUG,TOKEN); lsSet('motor_kind:'+SLUG,'staff');
    lsSet('motor_tab:'+SLUG,null); if(!(await enter())) await backToMain(); }
  catch(e){ toast(errText(e),'e'); }
}
async function backToMain(){
  var main=lsGet('motor_main:'+SLUG,''); if(!main) return;
  await flushUploads();
  try{ await sb.rpc('motor_logout',{p_token:TOKEN}); }catch(e){}
  stopSync(); lsSet('motor_main:'+SLUG,null); TOKEN=main; lsSet('motor_tok:'+SLUG,TOKEN); lsSet('motor_tab:'+SLUG,'staff');
  var b=$('#asBar'); if(b) b.remove();
  if(!(await enter())) doLogout(true);
}
async function logoutClick(){
  if(lsGet('motor_main:'+SLUG,'')) return backToMain();
  await flushUploads();
  if(ME&&ME.is_admin&&TOKEN){
    var m=modal(t('backup_t'),'<div class="muted">'+esc(t('backup_making'))+'</div>',false);
    try{ await backupNow(); m.onclose=null; m.close(); toast(t('backup_done'),'s'); }
    catch(e){ m.onclose=null; m.close(); if(!(await confirmBox(t('backup_fail')+'\n'+errText(e)))) return; }
  }
  doLogout(false);
}

/* كل جدول: تلميح السحب على الهاتف + تثبيت عمود الاسم عند التمرير يميناً/يساراً */
/* كل الجداول على قد الشاشة بلا سحب يمين وشمال:
   - الكمبيوتر: الكتابة بتنزل سطرين بدل ما تمد، وإذا بعد أعرض بيتصغّر الجدول لحالو
   - التلفون: كل سطر بيصير كرت (اسم العامود : القيمة) */
(function(){ var pend=false, lastW=0;
  function cardify(tb){
    var hr=tb.tHead&&tb.tHead.rows[0]; if(!hr) return false;
    var hs=Array.prototype.map.call(hr.cells,function(c){ return c.textContent.trim(); });
    Array.prototype.forEach.call(tb.tBodies,function(b){ Array.prototype.forEach.call(b.rows,function(r){
      if(r.cells.length<2){ r.classList.add('cr-full'); return; }
      Array.prototype.forEach.call(r.cells,function(c,i){ if(!c.hasAttribute('data-l')) c.setAttribute('data-l',hs[i]||''); if(!c.textContent.trim()&&!c.querySelector('img,button,input,select,a')) c.classList.add('cr-empty'); else c.classList.remove('cr-empty'); }); }); });
    tb.classList.add('cards'); return true;
  }
  function fit(el){
    var tb=el.querySelector(':scope > table'); if(!tb) return;
    if(el.closest('#printArea')) return;
    if(window.innerWidth<900){ tb.style.zoom=''; if(cardify(tb)){ el.removeAttribute('data-swipe'); return; } }
    tb.classList.remove('cards'); tb.style.zoom='';
    var have=el.clientWidth, need=tb.scrollWidth;
    if(need>have+1) tb.style.zoom=String(Math.max(0.6,(have-2)/need).toFixed(3));
    if(tb.scrollWidth*(+tb.style.zoom||1)>have+4){ el.dataset.swipe=t('swipe'); if(tb.rows[0]&&tb.rows[0].cells.length>5) tb.classList.add('stick'); }
    else { el.removeAttribute('data-swipe'); tb.classList.remove('stick'); }
  }
  function fix(){ pend=false; $$('.tw').forEach(fit); }
  function sched(){ if(!pend){ pend=true; requestAnimationFrame(fix); } }
  new MutationObserver(sched).observe(document.body,{childList:true,subtree:true});
  window.addEventListener('resize',function(){ if(Math.abs(window.innerWidth-lastW)>20){ lastW=window.innerWidth; $$('.tw table').forEach(function(tb){ tb.style.zoom=''; }); sched(); } });
})();
/* قراءة جدول PDF (برنامج الفوترة القديم): لكل صف → مفتاح الاسم + القراءة الأخيرة + السابق + الجوال + العلبة */
function nameKey(s){
  s=String(s||'').normalize('NFKC').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'')
    .replace(/[ً-ْـ]/g,'').replace(/[^ء-يa-zA-Z0-9]/g,'').toLowerCase();
  return s.split('').sort().join('');
}
function parseBillingPages(pages){ // pages: [[{str,x,y,w}]]
  var HEAD={name:nameKey('المشترك'),mobile:nameKey('الجوال'),service:nameKey('الخدمة'),area:nameKey('المنطقة'),box:nameKey('العلبة'),
    last:nameKey('القراءة الأخيرة'),prev:nameKey('السابق'),date:nameKey('التاريخ')};
  var out=[], cols=null, problems=[];
  pages.forEach(function(items,pi){
    items=items.filter(function(i){ return String(i.str).trim()!==''; });
    var hash=items.filter(function(i){ return String(i.str).trim()==='#'; })[0];
    if(hash){
      // عناوين الأعمدة: كل الحروف القريبة من سطر «#» مجمّعة حسب x
      var hs=items.filter(function(i){ return i!==hash&&Math.abs(i.y-hash.y)<16; }).sort(function(a,b){ return a.x-b.x; });
      var cl=[], cur=null;
      hs.forEach(function(i){ if(cur&&i.x<=cur.x2+5){ cur.x2=Math.max(cur.x2,i.x+i.w); cur.t+=i.str; } else { cur={x1:i.x,x2:i.x+i.w,t:i.str}; cl.push(cur); } });
      var c={hash:hash.x+hash.w/2};
      cl.forEach(function(k){ var key=nameKey(k.t); for(var h in HEAD) if(HEAD[h]===key) c[h]=(k.x1+k.x2)/2; });
      if(c.name!=null&&c.last!=null) cols=c; else problems.push('page '+(pi+1)+': header not recognised');
    }
    if(!cols) return;
    var centers=Object.keys(cols).map(function(k){ return {k:k,x:cols[k]}; });
    function col(i){ var cx=i.x+i.w/2, best=null, bd=1e9; centers.forEach(function(c){ var d=Math.abs(c.x-cx); if(d<bd){ bd=d; best=c.k; } }); return best; }
    var hy=hash?hash.y:1e9;
    var anchors=items.filter(function(i){ return i.y<hy-5&&/^\d+$/.test(String(i.str).trim())&&col(i)==='hash'; }).sort(function(a,b){ return b.y-a.y; });
    anchors.forEach(function(a,ai){
      var up=ai>0?(anchors[ai-1].y+a.y)/2:Math.min(hy-5,a.y+30), dn=ai<anchors.length-1?(anchors[ai+1].y+a.y)/2:a.y-30;
      var row=items.filter(function(i){ return i.y<up&&i.y>=dn; });
      var g={}; row.forEach(function(i){ var k=col(i); (g[k]=g[k]||[]).push(i); });
      function txt(k){ var a=(g[k]||[]).sort(function(p,q){ return (Math.abs(q.y-p.y)>3?q.y-p.y:0)||(q.x-p.x); }), out='', prev=null;
        a.forEach(function(i){ if(prev&&(Math.abs(prev.y-i.y)>3||prev.x-(i.x+i.w)>1.5)) out+=' '; out+=i.str; prev=i; }); return out; }
      function num(k){ var v=(g[k]||[]).map(function(i){return String(i.str).trim()}).filter(function(s){return /^-?\d+(\.\d+)?$/.test(s)}); return v.length?Number(v[0]):null; }
      out.push({no:Number(String(a.str).trim()),page:pi+1,key:nameKey(txt('name')),name_raw:txt('name').normalize('NFKC').replace(/\s+/g,' ').trim(),
        last:num('last'),prev:num('prev'),mobile:txt('mobile').replace(/\D/g,''),box:txt('box').trim()});
    });
  });
  return {rows:out,problems:problems};
}

/* ---------- «إدخال العداد السابق» من ملف PDF (مطابقة بالاسم) ---------- */
var PDFJS_V='4.0.379', pdfjsP=null;
function loadPdfJs(){ if(pdfjsP) return pdfjsP;
  pdfjsP=import('https://cdn.jsdelivr.net/npm/pdfjs-dist@'+PDFJS_V+'/build/pdf.min.mjs').then(function(m){
    m.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@'+PDFJS_V+'/build/pdf.worker.min.mjs'; return m; })
    .catch(function(e){ pdfjsP=null; throw e; });

function stPeriod(desc){ var s=impNameKey(desc), i=s.indexOf('فاتوره شهر'); if(i<0) return null; s=s.slice(i+10).trim();
  var keys=Object.keys(ST_MONTHS).sort(function(a,b){ return b.length-a.length; }), mo=0;
  for(var k=0;k<keys.length;k++){ if(s.indexOf(impNameKey(keys[k]))===0){ mo=ST_MONTHS[keys[k]]; s=s.slice(impNameKey(keys[k]).length); break; } }

  if((m=d.match(/^رقم القيد:\s*(\d+)\s*(?:تشريج\s*\/|,)\s*(.*)$/))) return (m[2]||'').trim()+' · قيد '+m[1];

  return d; }

      $('#ppres',m.body).innerHTML='<div class="okmsg">'+esc(t('prev_pdf_done',{n:done}))+'</div>'+(errs.length?'<div class="err" style="margin-top:8px">'+esc(errs.slice(0,40).map(function(x){ return (byId[x.id]||'')+': '+errText(x.error); }).join('\n'))+'</div>':'');
      gb.classList.add('hidden'); await loadCustomers(); if(TAB==='customers') go('customers');
    }catch(err){ $('#ppres',m.body).innerHTML='<div class="err">'+esc(errText(err))+'</div>'; busy(gb,false); }
    running=false;
  });
  $('#ppf',m.body).addEventListener('change',async function(){
    var file=this.files&&this.files[0], pv=$('#ppv',m.body), gb=$('[data-gob]',m.foot); plan=null; gb.classList.add('hidden'); if(!file) return;
    pv.innerHTML='<div class="muted">'+esc(t('loading'))+'</div>';
    try{
      var lib=await loadPdfJs(); var doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise, pages=[];
      for(var n=1;n<=doc.numPages;n++){ var tc=await (await doc.getPage(n)).getTextContent();
        pages.push(tc.items.map(function(i){ return {str:i.str,x:i.transform[4],y:i.transform[5],w:i.width}; }));
        pv.innerHTML='<div class="muted">'+esc(t('loading'))+' '+n+' / '+doc.numPages+'</div>'; }
      var res=parseBillingPages(pages);
      if(!res.rows.length){ pv.innerHTML='<div class="err">'+esc(t('prev_pdf_bad'))+'</div>'; return; }
      var idx={}; CUST.forEach(function(c){ var k=nameKey(c.name); (idx[k]=idx[k]||[]).push(c); });
      var ok=[], none=[], amb=[];
      res.rows.forEach(function(r){
        if(r.last==null) return;
        var l=idx[r.key]||[];
        if(l.length>1){ var f=l.filter(function(c){ var a=String(c.mobile||'').replace(/^0+/,''); return (a&&r.mobile.replace(/^0+/,'').slice(-a.length)===a)||(r.box&&c.box===r.box); }); if(f.length===1) l=f; }
        if(l.length===1) ok.push({r:r,c:l[0]}); else if(l.length>1) amb.push(r); else none.push(r);
      });
      plan=ok;
      pv.innerHTML='<div class="stats">'+stat(t('prev_pdf_rows'),fmtN(res.rows.length,0))+stat(t('prev_pdf_ok'),fmtN(ok.length,0))+stat(t('prev_pdf_none'),fmtN(none.length,0))+stat(t('prev_pdf_amb'),fmtN(amb.length,0))+'</div>'+
        '<div class="tw" style="max-height:40vh"><table><thead><tr><th>#</th><th>'+esc(t('name'))+'</th><th>'+esc(t('box'))+'</th><th>'+esc(t('prev_reading'))+' ('+esc(t('now'))+')</th><th>'+esc(t('prev_reading'))+' ('+esc(t('new'))+')</th></tr></thead><tbody>'+
        ok.map(function(x){ var cur=x.c.read_now?x.c.read_now_prev:x.c.last_value; return '<tr><td class="num">'+esc(x.r.no)+'</td><td><b>'+esc(x.c.name)+'</b></td><td>'+esc(x.c.box)+'</td><td class="num">'+esc(fmtN(cur))+'</td><td class="num"><b>'+esc(fmtN(x.r.last))+'</b></td></tr>'; }).join('')+'</tbody></table></div>'+
        ((none.length||amb.length)?'<div class="lic" style="margin-top:10px;white-space:pre-line"><b>'+esc(t('prev_pdf_skip'))+'</b>\n'+
          esc(none.concat(amb).map(function(r){ return '#'+r.no+' · '+r.name_raw+(r.mobile?' · '+r.mobile:'')+(amb.indexOf(r)>=0?' ('+t('prev_pdf_amb')+')':''); }).join('\n'))+'</div>':'')+
        '<div class="pbar" id="ppbar" style="margin-top:12px"><i></i></div><div id="ppres" style="margin-top:10px"></div>';
      if(ok.length){ gb.textContent=t('prev_pdf_go',{n:ok.length}); gb.classList.remove('hidden'); }
    }catch(err){ pv.innerHTML='<div class="err">'+esc(t('prev_pdf_bad'))+' ('+esc(err&&err.message||'')+')</div>'; }
  });
}
window.addEventListener('offline',function(){ toast(t('offline'),'e'); });
boot();
})();
</script>
