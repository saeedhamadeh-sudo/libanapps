<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c3b5e">
<title>Motor — LibanApps</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p:#0c3b5e; --pd:#082a44; --a:#f5a400; --on-p:#fff;
  --bg:#f3f6f9; --card:#fff; --ink:#0f1c2b; --ink2:#4a5b6c; --mut:#8a9aab; --line:#e1e8ef;
  --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7; --bad:#dc2626; --badbg:#fee2e2; --soft:#eef3f8;
  --wish:#6d28d9; --wishbg:#ede9fe;
  --r:14px; --sh:0 1px 2px rgba(15,28,43,.06),0 4px 16px rgba(15,28,43,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
.hidden{display:none!important}
a{color:var(--p)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(12,59,94,.15)}
input[type=checkbox]{width:auto}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--ink2);margin:0 0 4px;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:600;margin:6px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;background:var(--p);color:var(--on-p);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn.alt{background:var(--soft);color:var(--p)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.wa{background:#25d366;color:#fff}
.btn.wish{background:var(--wish);color:#fff}
.btn.acc{background:var(--a);color:#1d1300}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.lg{padding:16px 22px;font-size:18px;border-radius:14px}
.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.on{background:var(--okbg);color:var(--ok)}
.chip.off{background:var(--badbg);color:var(--bad)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.gray{background:var(--soft);color:var(--ink2)}
.chip.wish{background:var(--wishbg);color:var(--wish)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:720px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:17px}
.muted{color:var(--mut);font-size:13px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
td.num,th.num{display:table-cell;unicode-bidi:plaintext;text-align:start}
.err{color:var(--bad);background:var(--badbg);padding:9px 12px;border-radius:10px;font-size:14px;white-space:pre-line}
.okmsg{color:var(--ok);background:var(--okbg);padding:9px 12px;border-radius:10px;font-size:14px}
.msg:empty{display:none}
/* الجداول: تمرير أفقي، بدون تكسير الكلمات حرفاً حرفاً */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap;vertical-align:middle}
th{background:var(--soft);font-size:12.5px;color:var(--ink2);font-weight:700;position:sticky;top:0}
tr.void td{opacity:.45;text-decoration:line-through}
tbody tr:hover{background:#fafcfe}
td.wrap{white-space:normal;min-width:180px}
/* الهيكل */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:26px 22px;max-width:400px;width:100%;text-align:center}
.gbox img{max-width:90px;max-height:90px;border-radius:14px;margin-bottom:8px}
.gbox h1{font-size:21px;margin:4px 0 2px}
.gbox form{text-align:start;margin-top:14px}
.gbox .fld{margin-bottom:10px}
header.top{background:var(--p);color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.tbar{display:flex;align-items:center;gap:10px;padding:8px 12px;max-width:1280px;margin:0 auto}
.tbar img{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#fff}
.tbar .ttl{font-weight:800;font-size:16px;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar .who{font-size:12px;opacity:.85}
.tbar select{width:auto;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.tbar select option{color:#000}
.tbar .btn{background:rgba(255,255,255,.14);color:#fff}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 8px 6px;max-width:1280px;margin:0 auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;color:rgba(255,255,255,.8);padding:7px 12px;border-radius:999px;font-weight:700;white-space:nowrap;cursor:pointer;font-size:14px}
nav.tabs button.on{background:#fff;color:var(--p)}
main{max-width:1280px;margin:0 auto;padding:14px 12px 90px}
.lic{background:var(--warnbg);color:var(--warn);padding:8px 12px;border-radius:10px;margin-bottom:12px;font-weight:700;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:12px 14px}
.stat b{display:block;font-size:20px;margin-top:2px}
.stat span{font-size:12.5px;color:var(--ink2);font-weight:700}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:8px}
.litem{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.litem:active{background:var(--soft)}
.litem .nm{font-weight:800}
.litem .sub{font-size:12.5px;color:var(--ink2)}
.bal{font-weight:800}
.bal.debt{color:var(--bad)}
.bal.cred{color:var(--ok)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;margin:8px 0}
.kv div{font-size:13px;color:var(--ink2)}
.kv b{display:block;color:var(--ink);font-size:14.5px;word-break:normal;overflow-wrap:anywhere}
.bigbal{text-align:center;padding:12px;border-radius:12px;background:var(--soft);margin:10px 0}
.bigbal b{font-size:26px;display:block}
.step{border:2px dashed var(--line);border-radius:14px;padding:14px;margin-top:10px}
.valinput{font-size:28px;text-align:center;font-weight:800;direction:ltr;letter-spacing:1px}
.prev-img{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:8px auto}
.thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;cursor:pointer;background:var(--soft)}
.gps{font-size:13px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--soft);display:inline-block}
.gps.ok{background:var(--okbg);color:var(--ok)}
.gps.bad{background:var(--badbg);color:var(--bad)}
.sec-t{font-weight:800;color:var(--p);margin:14px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select{width:auto;min-width:140px;flex:1 1 160px}
.pbar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
/* النوافذ: ما بتسكّر بالضغط برّاتها، وبتنزلق عالموبايل */
.ov{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center;padding:10px;z-index:1000}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);overflow:hidden}
.modal.wide{max-width:960px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
.mh h3{margin:0;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mx{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;flex:none}
.mb{padding:14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1 1 auto;min-height:0}
.mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);flex:none}
.toast{pointer-events:none;position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:#0f1c2b;color:#fff;padding:11px 18px;border-radius:12px;z-index:3000;transition:all .3s;max-width:92vw;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.3);white-space:pre-line;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.e{background:var(--bad)}
.toast.s{background:var(--ok)}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden}
.cam video{width:100%;max-height:60vh;display:block;object-fit:cover}
.cam .aim{position:absolute;inset:22% 10%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 2000px rgba(0,0,0,.25);pointer-events:none}
.inv-box{background:#fffdf6;border:1px solid #f3e3b4;border-radius:12px;padding:12px;font-size:14px}
.inv-box .ln{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.inv-box .ln.tot{border-top:1px dashed #c9b37a;margin-top:6px;padding-top:8px;font-weight:800;font-size:16px}
.lb-img{max-width:100%;max-height:75vh;display:block;margin:0 auto;border-radius:10px}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0}}
</style>

function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
var toastT=null;
function toast(m,k){ var el=$('#toast'); el.textContent=m; el.className='toast on '+(k||''); clearTimeout(toastT); toastT=setTimeout(function(){ el.className='toast'; }, k==='e'?5200:2600); }
function errText(e){
  var m=String((e&&(e.message||e.error_description||e.error))||e||'');
  var mm=m.match(/MOTOR:([a-z_]+)(?::([^\n"]*))?/);
  if(mm){ var k='e_'+mm[1]; var x=(mm[2]||'').replace('|',' → '); return D[k]?t(k,{x:x}):m; }
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return t('e_network');
  return m||'Error';
}
function isAuthErr(e){ return /MOTOR:(auth|license|inactive)\b/.test(String(e&&e.message||e||'')); }
async function call(fn,args){
  if(!sb) throw new Error(t('e_network'));
  var a=Object.assign({p_slug:SLUG,p_token:TOKEN||null},args||{});
  var r=await sb.rpc(fn,a);
  if(r.error){ if(isAuthErr(r.error)&&ME){ handleAuthLoss(r.error); } throw r.error; }
  return r.data;
}

function modal(title,body,foot,wide){
  var ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML='<div class="modal'+(wide?' wide':'')+'" role="dialog" aria-modal="true"><div class="mh"><h3></h3><button class="mx" type="button" aria-label="close">×</button></div><div class="mb"></div>'+(foot!==false?'<div class="mf"></div>':'')+'</div>';
  $('h3',ov).textContent=title;
  $('.mb',ov).innerHTML=body||'';
  if(foot) $('.mf',ov).innerHTML=foot;
  document.body.appendChild(ov); document.body.classList.add('lock');
  var api={el:ov, body:$('.mb',ov), foot:$('.mf',ov), onclose:null,
    close:function(){ if(api.onclose) try{ api.onclose(); }catch(e){} ov.remove(); if(!$('.ov')) document.body.classList.remove('lock'); }};
  $('.mx',ov).addEventListener('click',function(){ api.close(); });
  return api;
}
function confirmBox(text){ return new Promise(function(res){

  m.onclose=function(){ res(false); };

}); }

function gate(note,showLogin){

  $('#gNote').innerHTML=note||''; $('#loginForm').classList.toggle('hidden',!showLogin);
  paintGateTexts();

function paintGateTexts(){
  $('#lUser').textContent=t('username'); $('#lPass').textContent=t('password'); $('#lTotp').textContent=t('totp');
  $('#loginBtn').textContent=t('login'); $('#ownerLink').textContent=t('owner_login');
  $('#gSub').textContent=t('app_name'); $('#gLang').value=LANG;
}
async function boot(){
  var seg=location.pathname.split('/').filter(Boolean);
  SLUG=(seg[0]==='portal-motor'&&seg[1])?decodeURIComponent(seg[1]).toLowerCase():'';
  if(!LANG) setLang('ar'); else setLang(LANG);
  gate(t('loading'),false);
  if(!sb){ gate('<div class="err">'+esc(t('e_network'))+'</div>',false); return; }
  if(!SLUG){
    // /motor بدون رابط: صاحب الاشتراك → أول مولّد عنده
    try{ var s=await sb.auth.getSession();
      if(s.data.session){ var lic=(await sb.rpc('my_licenses')).data||[]; var m=lic.filter(function(x){return x.product==='motor'&&x.slug})[0];
        if(m){ location.replace('/portal-motor/'+encodeURIComponent(m.slug)); return; } } }catch(e){}
    gate(esc(t('no_slug'))+'<br><br><a class="btn" href="/account">'+esc(t('my_account'))+'</a>',false); return;
  }
  var pub;
  try{ var r=await sb.rpc('motor_public',{p_slug:SLUG}); if(r.error) throw r.error; pub=r.data; }
  catch(e){ gate('<div class="err">'+esc(errText(e))+'</div>',false); return; }
  if(pub && pub.site){ $('#gName').textContent=pub.site.name||SLUG; document.title=(pub.site.name||SLUG)+' — Motor';
    if(pub.site.logo_url){ $('#gLogo').src=pub.site.logo_url; $('#gLogo').classList.remove('hidden'); }
    if(!lsGet('motor_lang','')) setLang(pub.site.default_lang||'ar'); }
  if(!pub || !pub.ok){
    // صاحب الاشتراك قد يكون اشترى للتو ولم تُنشأ المؤسسة بعد
    if(pub && pub.reason==='not_found'){ var made=await tryOwner(true); if(made) return; }
    var rk=pub&&pub.reason==='not_found'?'r_not_found':(pub&&pub.reason==='inactive'?'r_inactive':'r_license');
    if(!(pub&&pub.reason==='not_found')){ var asOwner=await tryOwner(false); if(asOwner) return; }
    gate('<div class="err">'+esc(t(rk))+'</div><br><a class="btn alt" href="/account">'+esc(t('my_account'))+'</a>',false); return;
  }
  TOKEN=lsGet('motor_tok:'+SLUG,'');
  if(TOKEN){ if(await enter()) return; TOKEN=''; lsSet('motor_tok:'+SLUG,null); }
  if(await tryOwner(false)) return;
  try{ var qu=new URLSearchParams(location.search).get('u'); if(qu) $('#inUser').value=qu; }catch(e){}
  gate('',true); setTimeout(function(){ ($('#inUser').value?$('#inPass'):$('#inUser')).focus(); },50);
}
async function tryOwner(ensure){
  try{ var s=await sb.auth.getSession(); if(!s.data.session) return false;
    if(ensure){ var e=await sb.rpc('ensure_motor',{p_slug:SLUG}); if(e.error||!e.data||!e.data.ok) return false; }
    TOKEN=''; return await enter(true);
  }catch(e){ return false; }
}
async function enter(quiet){
  try{
    var d=await call('motor_me');
    ME=d.me; SITE=d.site; PLANS=d.plans||[]; STAFF=d.staff||[]; LIC=d.license; TODAY=d.today;
    if(!lsGet('motor_lang','')) setLang(SITE.default_lang||'ar');
    $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
    document.title=(SITE.name||SLUG)+' — Motor';
    paintShell();
    loadCustomers();   // بالخلفية — القوائم بتتحدّث لما توصل
    startSync();
    go(lsGet('motor_tab:'+SLUG, ME.role==='collector'?'read':'dash'));
    return true;
  }catch(e){ if(!quiet && !isAuthErr(e)) gate('<div class="err">'+esc(errText(e))+'</div>',true); return false; }
}
$('#loginForm').addEventListener('submit',async function(e){
  e.preventDefault(); var b=$('#loginBtn'), m=$('#loginMsg'); m.textContent='';
  busy(b,true,t('loading'));
  try{
    var r=await sb.rpc('motor_login',{p_slug:SLUG,p_username:$('#inUser').value.trim(),p_password:$('#inPass').value,p_totp:$('#inTotp').value.trim()||null});
    if(r.error) throw r.error;
    var d=r.data||{};
    if(!d.ok&&d.need_totp){ $('#totpFld').classList.remove('hidden'); m.textContent=d.reason==='bad_totp'?t('bad_totp'):''; busy(b,false); $('#inTotp').value=''; $('#inTotp').focus(); return; }
    if(!d.ok){ m.textContent= d.reason==='locked'?t('locked',{m:d.minutes||15}) : d.reason==='inactive_user'?t('inactive_user') : d.reason==='license'?t('r_license') : t('bad_login'); busy(b,false); return; }
    TOKEN=d.token; lsSet('motor_tok:'+SLUG,TOKEN); $('#inPass').value=''; $('#inTotp').value=''; $('#totpFld').classList.add('hidden');
    busy(b,false);
    if(!(await enter())){ m.textContent=t('e_auth'); }
  }catch(err){ m.textContent=errText(err); busy(b,false); }
});
$('#ownerLink').addEventListener('click',function(e){ e.preventDefault(); location.href='/login?next='+encodeURIComponent(location.pathname); });
$('#gLang').addEventListener('change',function(){ setLang(this.value); paintGateTexts(); });
async function doLogout(silent){
  if(TOKEN){ try{ await sb.rpc('motor_logout',{p_token:TOKEN}); }catch(e){} }
  stopSync(); lsSet('motor_tok:'+SLUG,null); TOKEN=''; ME=null;
  if(!silent && sb){ try{ var s=await sb.auth.getSession(); if(s.data.session){ location.href='/account'; return; } }catch(e){} }
  gate('',true);
}

/* =========================================================
   التحديث المباشر (كل 15 ثانية) + موقع الموظف (كل دقيقة)
   ========================================================= */
var SYNC={since:null,timer:null,ping:null,busy:false};
function startSync(){
  stopSync();
  SYNC.since=null;
  SYNC.timer=setInterval(syncNow,15000);
  if(TOKEN){ pingNow(); SYNC.ping=setInterval(pingNow,60000); }
}
function stopSync(){ if(SYNC.timer) clearInterval(SYNC.timer); if(SYNC.ping) clearInterval(SYNC.ping); SYNC.timer=SYNC.ping=null; }
async function syncNow(){
  if(SYNC.busy||!ME||document.hidden) return; SYNC.busy=true;
  try{
    var r=await call('motor_changes',{p_since:SYNC.since});
    var first=SYNC.since===null; SYNC.since=r.now;
    var dot=$('#liveDot'); if(dot) dot.style.color='#7CFC9A';
    var changed=(r.customers||[]).length>0;
    (r.customers||[]).forEach(function(c){ var i=-1; for(var k=0;k<CUST.length;k++) if(CUST[k].id===c.id){ i=k; break; } if(i>=0) CUST[i]=c; else CUST.push(c); });
    if(r.me){ var was=JSON.stringify([ME.can_read,ME.can_collect,ME.can_cut,ME.is_admin]); ME=Object.assign(ME,r.me); if(was!==JSON.stringify([ME.can_read,ME.can_collect,ME.can_cut,ME.is_admin])) paintShell(); }
    var perChanged=SITE.bill_period!==r.period||n2(SITE.lbp_rate)!==n2(r.lbp_rate);
    SITE.bill_period=r.period; SITE.lbp_rate=r.lbp_rate;
    if(r.wa_pending!=null) setWaBadge(r.wa_pending);
    if((changed&&!first)||perChanged){
      refreshSearchLists();
      var idle=!$('.ov')&&!(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));
      if(idle&&['dash','month','cash','whish','cstmt'].indexOf(TAB)>=0) go(TAB,true);
    }
  }catch(e){ var dot2=$('#liveDot'); if(dot2) dot2.style.color='#ffb4b4'; }
  SYNC.busy=false;
}
function pingNow(){ if(!navigator.geolocation||!TOKEN) return;
  navigator.geolocation.getCurrentPosition(function(p){ call('motor_ping',{p_lat:p.coords.latitude,p_lng:p.coords.longitude,p_acc:Math.round(p.coords.accuracy||0)}).catch(function(){}); },function(){},{enableHighAccuracy:true,timeout:20000,maximumAge:60000}); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&ME) syncNow(); });

function stat(l,v){ return '<div class="stat"><span>'+esc(l)+'</span><b class="num">'+esc(v)+'</b></div>'; }
function windowNote(){

var CUR_MODAL=null;
async function openCustomer(id,barcode,mode){
  var m=modal(t('loading'),'<div class="muted">'+esc(t('loading'))+'</div>',false,false);
  CUR_MODAL=m;
  var d;
  try{ d=await call('motor_customer_get',{p_id:id||null,p_barcode:barcode||null}); }
  catch(e){ m.body.innerHTML='<div class="err">'+esc(errText(e))+'</div>'; $('h3',m.el).textContent=barcode||''; return; }
  var c=d.customer;
  $('h3',m.el).textContent=c.name;
  function paint(keepStep){
    var adm=isAdmin(), stepHtml=keepStep&&$('#cstep',m.body)?$('#cstep',m.body).innerHTML:'';
    var info=[
      [t('code'),'#'+c.code],[t('barcode'),c.barcode],[t('meter_no'),c.meter_no],[t('box'),c.box],
      [t('plan'),d.plan?(d.plan.name+(d.plan.kind==='fixed'?' · '+t('kind_fixed'):'')):'—'],[t('area'),[c.area,c.location_name].filter(Boolean).join(' · ')],
      [t('collector'),d.collector_name],[t('mobile'),c.mobile?('+'+c.mobile_cc+' '+c.mobile):''],[t('prev_reading'),fmtN(d.prev_value)]
    ].filter(function(x){return x[1]!==''&&x[1]!=null});
    var notes=(d.notes||[]), sw=(d.switches||[]);
    m.body.innerHTML=
      '<div class="row"><span class="chip '+(c.is_active?'on':'off')+'">'+esc(c.is_active?t('active'):t('inactive'))+'</span>'+(c.archived?' <span class="chip gray">'+esc(t('archived'))+'</span>':'')+
      (d.read_now?' <span class="chip on">✓ '+esc(t('read_done'))+' '+esc(d.period)+': '+esc(fmtN(d.read_now.value))+'</span>':' <span class="chip gray">'+esc(t('not_read'))+' '+esc(d.period)+'</span>')+'</div>'+
      '<div class="bigbal"><span class="muted">'+esc(t('balance'))+'</span><b>'+balHtml(c.balance)+'</b>'+(second(c.balance)?'<span class="muted num">≈ '+esc(second(c.balance))+'</span>':'')+'</div>'+
      '<div class="kv">'+info.map(function(x){return '<div>'+esc(x[0])+'<b dir="auto">'+esc(x[1])+'</b></div>'}).join('')+'</div>'+
      '<div class="row" style="margin-top:10px">'+
        (can('read')?'<button class="btn" data-a="read" '+(d.read_now||!c.is_active?'disabled':'')+'>'+esc(t('take_reading'))+'</button>':'')+
        (can('collect')?'<button class="btn ok" data-a="pay">'+esc(t('collect'))+'</button>':'')+
        (can('cut')?(c.is_active?'<button class="btn danger" data-a="cut">'+esc(t('cut'))+'</button>':'<button class="btn acc" data-a="connect">'+esc(t('connect'))+'</button>'):'')+
        '<button class="btn alt" data-a="stmt">'+esc(t('statement'))+'</button>'+
        (c.mobile&&waHere()?'<button class="btn wa sm" data-a="wa">'+esc(t('whatsapp'))+'</button>':'')+
        (adm?'<button class="btn ghost sm" data-a="edit">✏️ '+esc(t('edit'))+'</button><button class="btn ghost sm" data-a="adj">'+esc(t('adjust'))+'</button><button class="btn ghost sm" data-a="label">🏷️ '+esc(t('label_one'))+'</button>':'')+
      '</div><div id="cstep">'+stepHtml+'</div>'+
      '<div class="sec-t">📝 '+esc(t('notes_t'))+'</div><div class="row"><input id="nbody" placeholder="'+esc(t('add_note'))+'" style="flex:1"><button class="btn sm" data-a="note">'+esc(t('save'))+'</button></div>'+
      (notes.length?'<div class="list" style="margin-top:8px">'+notes.map(function(n){ return '<div class="litem" style="cursor:default"><div style="flex:1"><div>'+esc(n.body)+'</div><div class="sub">'+esc(n.by)+' · '+esc(dt(n.at))+'</div></div></div>'; }).join('')+'</div>':'')+
      (sw.length?'<div class="sec-t">🔌 '+esc(t('switches'))+'</div><div class="list">'+sw.map(function(x){ return '<div class="sub">'+'<span class="chip '+(x.action==='cut'?'off':'on')+'">'+esc(t('a_'+x.action))+'</span> '+esc(dt(x.at))+' · '+esc(x.by)+(x.note?' — '+esc(x.note):'')+'</div>'; }).join('')+'</div>':'');
  }
  m.body.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
    var a=b.dataset.a;
    if(a==='read') readForm();
    else if(a==='pay') payForm();
    else if(a==='cut'||a==='connect') switchForm(a==='connect');
    else if(a==='stmt') openStatement(c.id);
    else if(a==='wa') openWa(c.mobile_cc,c.mobile,'');
    else if(a==='edit'){ m.close(); editCustomer(c.id); }
    else if(a==='adj') adjustForm();
    else if(a==='label') printLabels([c]);
    else if(a==='note') addNote();
  });
  async function reload(){ try{ d=await call('motor_customer_get',{p_id:c.id}); c=d.customer;
    patchCust(c.id,{balance:c.balance,is_active:c.is_active,read_now:!!d.read_now,read_now_value:d.read_now&&d.read_now.value,last_value:d.prev_value,
      last_note:d.notes&&d.notes[0]?d.notes[0].body:null}); refreshSearchLists(); }catch(e){} }
  async function addNote(){ var inp=$('#nbody',m.body), v=inp.value.trim(); if(!v) return;
    try{ await call('motor_note_add',{p_customer:c.id,p_body:v}); toast(t('note_saved'),'s'); await reload(); paint(true); }catch(e){ toast(errText(e),'e'); } }
  function switchForm(on){
    var box=$('#cstep',m.body);
    box.innerHTML='<div class="step"><label>'+esc(t('cut_reason'))+'</label><input id="swn"><div id="swmsg" class="err msg" style="margin-top:8px"></div>'+
      '<button class="btn full lg '+(on?'acc':'danger')+'" id="swgo" style="margin-top:8px">'+esc(t(on?'connect':'cut'))+'</button></div>';
    $('#swgo',box).addEventListener('click',async function(){
      if(!(await confirmBox(t(on?'confirm_connect':'confirm_cut',{n:c.name})))) return;
      var btn=this; busy(btn,true); var g=await quickGeo();
      try{ await call('motor_set_active',{p_customer:c.id,p_active:on,p_note:$('#swn',box).value,p_lat:g?g.lat:null,p_lng:g?g.lng:null});
        toast(t(on?'connect_done':'cut_done'),'s'); await reload(); paint(); }
      catch(e){ $('#swmsg',box).textContent=errText(e); busy(btn,false); }
    });
  }

  /* ----- أخذ العداد: القيمة ← الكاميرا ← تحميل الصورة + الموقع ← فاتورة ----- */
  var geo=null, geoErr=false, photoBlob=null;
  function startGeo(){
    geo=null; geoErr=false; paintGeo();
    if(!navigator.geolocation){ geoErr=true; paintGeo(); return; }
    navigator.geolocation.getCurrentPosition(function(p){ geo={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}; paintGeo(); },
      function(){ geoErr=true; paintGeo(); }, {enableHighAccuracy:true,timeout:20000,maximumAge:30000});
  }
  function paintGeo(){ var el=$('#gpsLine',m.body); if(!el) return;
    el.innerHTML= geo?'<span class="gps ok">'+esc(t('gps_ok',{a:geo.acc}))+'</span>' : geoErr?'<span class="gps bad">'+esc(t('gps_bad'))+'</span> <button class="btn sm alt" type="button" id="gpsRetry">'+esc(t('gps_retry'))+'</button>' : '<span class="gps">'+esc(t('gps_wait'))+'</span>';
    var r=$('#gpsRetry',m.body); if(r) r.addEventListener('click',startGeo); }
  function estimate(v){
    var p=d.plan||{}, prev=d.baseline?n2(v):n2(d.prev_value), k=Math.max(0,n2(v)-prev);
    var price=p.kind==='fixed'?0:(p.kwh_price!=null&&p.kwh_price!==''?n2(p.kwh_price):n2(SITE.kwh_price));
    return {kwh:k,price:price,amt:n2(p.fee)+k*price-n2(c.charge_discount)+n2(c.charge_addition)};
  }
  function readForm(){
    var box=$('#cstep',m.body); photoBlob=null;
    box.innerHTML='<div class="step"><label>'+esc(t('enter_value'))+' — '+esc(t('prev_reading'))+': <b class="num">'+esc(fmtN(d.prev_value))+'</b></label>'+
      '<input id="rv" class="valinput" type="text" inputmode="decimal" autocomplete="off" placeholder="'+esc(fmtN(d.prev_value))+'">'+
      (d.baseline?'<div class="lic" style="margin-top:8px">'+esc(t('baseline_note'))+'</div>':'')+
      '<div id="rest" class="muted" style="margin:8px 0"></div><div id="gpsLine" style="margin:6px 0"></div>'+
      '<div id="rph"></div><div id="rmsg" class="err msg"></div>'+
      '<button class="btn full" id="rnext" style="margin-top:8px">'+esc(t('next_photo'))+'</button></div>';
    startGeo();
    var inp=$('#rv',box); setTimeout(function(){ inp.focus(); },60);
    inp.addEventListener('input',function(){ inp.value=inp.value.replace(/[٠-٩]/g,function(x){return '٠١٢٣٤٥٦٧٨٩'.indexOf(x)}).replace(/[^0-9.]/g,'');
      var v=inp.value; if(!v){ $('#rest',box).textContent=''; return; } var e=estimate(v);
      $('#rest',box).innerHTML=esc(t('consumption'))+': <b class="num">'+esc(fmtN(e.kwh))+' '+esc(t('kwh'))+'</b> · '+esc(t('est_invoice'))+': <b>'+moneyBoth(e.amt)+'</b>'; });
    $('#rnext',box).addEventListener('click',async function(){
      var msg=$('#rmsg',box); msg.textContent='';
      var v=inp.value.trim(); if(v===''||!isFinite(Number(v))){ msg.textContent=t('e_bad_value'); return; }
      if(!d.baseline&&Number(v)<n2(d.prev_value)){ msg.textContent=t('e_lower_than_prev',{x:fmtN(d.prev_value)}); return; }
      if(photoBlob){ return saveReading(Number(v)); }
      var blob=await takePhoto(); if(!blob) return;
      photoBlob=blob; inp.readOnly=true;
      $('#rph',box).innerHTML='<img class="prev-img" src="'+URL.createObjectURL(blob)+'" alt=""><div class="row" style="justify-content:center"><button class="btn ghost sm" id="rretake">'+esc(t('retake'))+'</button></div>';
      $('#rretake',box).addEventListener('click',async function(){ var b2=await takePhoto(); if(b2){ photoBlob=b2; $('.prev-img',box).src=URL.createObjectURL(b2); } });
      $('#rnext',box).innerHTML=esc(t('upload_save')); $('#rnext',box).classList.add('ok');
    });
  }
  async function saveReading(v){
    var box=$('#cstep',m.body), btn=$('#rnext',box), msg=$('#rmsg',box); msg.textContent='';
    if(SITE.require_gps&&!geo){ msg.textContent=t('e_gps_required'); startGeo(); return; }
    busy(btn,true,t('uploading'));
    try{
      var path=photoBlob?await uploadPhoto(photoBlob):'';
      btn.textContent=t('saving');
      var r=await call('motor_read',{p_customer:c.id,p_value:v,p_photo:path,p_lat:geo?geo.lat:null,p_lng:geo?geo.lng:null,p_accuracy:geo?geo.acc:null});
      toast(t('read_saved'),'s');
      await reload(); paint();
      showBill({inv:r.invoice,c:c,dist:r.dist_m,title:t('read_saved')});
    }catch(e){ msg.textContent=errText(e); busy(btn,false); }
  }
  function showBill(o){
    var box=$('#cstep',m.body);
    box.innerHTML='<div class="step"><div class="okmsg">'+esc(o.title)+'</div>'+(o.dist!=null?'<div class="muted" style="margin-top:6px">'+esc(t('dist',{d:o.dist}))+'</div>':'')+
      '<div style="margin-top:10px">'+billHtml(o)+'</div>'+
      '<div class="row" style="margin-top:10px">'+(waHere()?'<button class="btn wa" id="bwa">'+esc(t('send_wa'))+'</button>':'<span class="chip wish">📲 '+esc(t('wa_office'))+'</span>')+
      '<button class="btn alt" id="bpr">'+esc(t('print'))+'</button></div></div>';
    var w=$('#bwa',box); if(w) w.addEventListener('click',function(){ sendBillWa(o); });
    $('#bpr',box).addEventListener('click',function(){ printDoc(billTicket(o)); });
  }
  /* ----- القبض ----- */
  function payForm(){
    var box=$('#cstep',m.body), cur=mainCur(), oth=cur==='USD'?'LBP':'USD';
    var def=n2(c.balance)>0?n2(c.balance):'';
    box.innerHTML='<div class="step"><div class="g2"><div><label>'+esc(t('amount'))+'</label><input id="pa" type="text" inputmode="decimal" class="valinput" style="font-size:22px" value="'+esc(def===''?'':String(def))+'"></div>'+
      '<div><label>'+esc(t('currency'))+'</label><select id="pc"><option value="'+cur+'">'+esc(cur+' '+sym(cur))+'</option>'+(rate()?'<option value="'+oth+'">'+esc(oth+' '+sym(oth))+'</option>':'')+'</select></div></div>'+
      '<div id="peq" class="muted" style="margin:6px 0"></div>'+(rate()?'<div class="muted">'+esc(t('rate_t'))+': <b class="num">'+esc(fmtN(rate(),0))+'</b></div>':'')+
      '<label style="margin-top:8px">'+esc(t('method'))+'</label><div class="row"><label class="chk"><input type="radio" name="pm" value="cash" checked> 💵 '+esc(t('cash'))+'</label><label class="chk"><input type="radio" name="pm" value="whish"> 🟣 '+esc(t('whish'))+'</label></div>'+
      '<label>'+esc(t('note'))+'</label><input id="pn">'+
      '<div id="pmsg" class="err msg" style="margin-top:8px"></div><button class="btn ok full lg" id="pgo" style="margin-top:10px">'+esc(t('pay_save'))+'</button></div>';
    var pa=$('#pa',box), pc=$('#pc',box);
    function eq(){ var v=n2(pa.value), cc=pc.value, s='';
      if(cc!==cur&&rate()) s=t('equals',{v:money(cc==='LBP'?v/rate():v*rate(),cur)});
      else if(second(v)) s=t('equals',{v:second(v)});
      $('#peq',box).textContent=s; }
    pa.addEventListener('input',function(){ pa.value=pa.value.replace(/[٠-٩]/g,function(x){return '٠١٢٣٤٥٦٧٨٩'.indexOf(x)}).replace(/[^0-9.]/g,''); eq(); });
    pc.addEventListener('change',function(){ var v=n2(pa.value); if(v&&rate()){ pa.value=String(pc.value==='LBP'?Math.round(v*rate()):Math.round(v/rate()*100)/100); } eq(); });
    eq();
    $('#pgo',box).addEventListener('click',async function(){
      var btn=this, msg=$('#pmsg',box); msg.textContent='';
      var v=n2(pa.value); if(!(v>0)){ msg.textContent=t('e_bad_amount'); return; }
      busy(btn,true);
      try{
        var g=null; try{ g=await quickGeo(); }catch(e){}
        var r=await call('motor_pay',{p_customer:c.id,p_paid:v,p_currency:pc.value,p_method:$('input[name=pm]:checked',box).value,p_note:$('#pn',box).value,p_lat:g?g.lat:null,p_lng:g?g.lng:null});
        toast(t('pay_saved'),'s');
        await reload(); paint();
        showBill({inv:r.invoice,pay:r.payment,c:c,title:t('pay_saved')});
      }catch(e){ msg.textContent=errText(e); busy(btn,false); }
    });
  }
  function adjustForm(){
    var box=$('#cstep',m.body);
    box.innerHTML='<div class="step"><label>'+esc(t('adj_amount'))+'</label><input id="aa" type="text" inputmode="decimal"><label style="margin-top:8px">'+esc(t('note'))+'</label><input id="an">'+
      '<div id="amsg" class="err msg" style="margin-top:8px"></div><button class="btn full" id="ago" style="margin-top:8px">'+esc(t('save'))+'</button></div>';
    $('#ago',box).addEventListener('click',async function(){ var btn=this; var v=Number($('#aa',box).value); if(!v){ $('#amsg',box).textContent=t('e_bad_amount'); return; }
      busy(btn,true); try{ await call('motor_adjust',{p_customer:c.id,p_amount:v,p_note:$('#an',box).value}); toast(t('saved'),'s'); await reload(); paint(); }catch(e){ $('#amsg',box).textContent=errText(e); busy(btn,false); } });
  }
  paint();
  if(mode==='read'&&can('read')&&!d.read_now&&c.is_active) readForm();
  else if(mode==='pay'&&can('collect')) payForm();
  else if(mode==='switch'&&can('cut')) switchForm(!c.is_active);
}
function quickGeo(){ return new Promise(function(res){ if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(function(p){ res({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}); },function(){ res(null); },{enableHighAccuracy:true,timeout:8000,maximumAge:60000}); }); }

/* ---------- الفاتورة/الإيصال بنفس شكل الإيصال الورقي ----------
   o = {inv, pay, c}  — inv: الفاتورة (ممكن تكون فاضية بالقبض)، pay: الإيصال */
function ymd(s){ var d=dt(s); return d?d.slice(0,10).replace(/-/g,'/'):''; }
function priceStr(v){ var n=n2(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:4}), y=sym(mainCur()); return y==='$'? y+n : n+' '+y; }
function billLines(o){
  var inv=o.inv, p=o.pay, L=[];
  if(inv){
    L.push({k:t('b_inv_date'),v:ymd(inv.created_at)});
    if(p) L.push({k:t('b_pay_date'),v:ymd(p.created_at)});
    L.push({k:t('b_name'),v:o.c.name});
    if(inv.period) L.push({k:t('b_desc'),v:t('b_inv_of',{m:monthName(inv.period)})+' - '+o.c.name});
    if(inv.period) L.push({t:t('b_month',{m:monthName(inv.period,true)})});
    L.push({hr:1},{t:t('b_details')},{hr:1});
    if(n2(inv.fee)) L.push({k:t('b_fee'),v:money(inv.fee)});
    if(inv.kind==='meter'){
      L.push({k:t('b_prev'),v:fmtN(inv.prev_value)},{k:t('b_cur'),v:fmtN(inv.cur_value)},{k:t('b_cons'),v:fmtN(inv.kwh)+' '+t('b_kwh_unit')},
        {k:t('b_price'),v:priceStr(inv.kwh_price)},{k:t('b_energy'),v:money(inv.energy)});
    }
    if(n2(inv.discount)) L.push({k:t('discount'),v:'−'+money(inv.discount)});
    if(n2(inv.addition)) L.push({k:t('addition'),v:money(inv.addition)});
    if(/^قراءة أولى/.test(inv.note||'')) L.push({t:t('first_read'),s:1});
    L.push({hr:1},{k:t('b_amount'),v:money(inv.amount),b:1},{hr:1},{k:t('b_prev_bal'),v:money(inv.balance_before)},{hr:1});
  } else if(p){
    L.push({k:t('b_pay_date'),v:ymd(p.created_at)},{k:t('b_name'),v:o.c.name},{hr:1});
  }
  if(p){
    L.push({k:t('b_due'),v:money(p.balance_before),b:1},{hr:1},
      {k:t('b_paid'),v:money(p.paid_amount,p.paid_currency)+(p.paid_currency!==mainCur()?' (= '+money(p.amount)+')':''),b:1},{hr:1},
      {k:t('b_now'),v:money(p.balance_after),b:1});
    if(second(p.balance_after)&&n2(p.balance_after)) L.push({t:'≈ '+second(p.balance_after),s:1});
  } else if(inv){
    L.push({k:t('b_due'),v:money(inv.balance_after),b:1});
    if(second(inv.balance_after)) L.push({t:'≈ '+second(inv.balance_after),s:1});
  }
  return L;
}
function billHead(o){ return o.inv?t('b_inv_no',{n:o.inv.no}):t('receipt'); }
function billHtml(o){
  return '<div class="inv-box">'+(SITE.logo_url?'<div style="text-align:center"><img src="'+esc(SITE.logo_url)+'" alt="" style="max-height:56px"></div>':'')+
    '<div style="text-align:center;font-weight:800;font-size:17px">'+esc(SITE.name||'')+'</div>'+(SITE.tagline?'<div style="text-align:center" class="muted">'+esc(SITE.tagline)+'</div>':'')+
    '<div style="text-align:center;margin:4px 0">'+esc(billHead(o))+'</div>'+
    billLines(o).map(function(l){
      if(l.hr) return '<div style="border-top:1px dashed #c9b37a;margin:6px 0"></div>';
      if(l.t) return '<div class="'+(l.s?'muted':'')+'" style="'+(l.s?'':'font-weight:700')+'">'+esc(l.t)+'</div>';
      return '<div class="ln'+(l.b?' tot':'')+'" style="'+(l.b?'border:0;margin:0;padding-top:3px':'')+'"><span>'+esc(l.k)+'</span><span dir="auto">'+esc(l.v)+'</span></div>';
    }).join('')+(o.pay?'<div class="muted" style="margin-top:6px">'+esc(t('b_rcpt',{n:o.pay.no,s:o.pay.staff_name||''}))+'</div>':'')+'</div>';
}
function billText(o){
  var s=['*'+(SITE.name||'')+'*']; if(SITE.tagline) s.push(SITE.tagline); s.push(billHead(o)); s.push('');
  billLines(o).forEach(function(l){ if(l.hr) s.push('—————'); else if(l.t) s.push(l.t); else s.push((l.b?'*':'')+l.k+': '+l.v+(l.b?'*':'')); });
  if(o.pay) s.push('', t('b_rcpt',{n:o.pay.no,s:o.pay.staff_name||''}));
  if(SITE.invoice_note) s.push('', SITE.invoice_note);
  return s.join('\n');
}
function sendBillWa(o,after){ openWa(o.c.mobile_cc,o.c.mobile,billText(o));
  var k=o.pay?'pay':'inv', id=o.pay?o.pay.id:(o.inv&&o.inv.id); if(id) call('motor_wa_mark',{p_kind:k,p_id:id}).then(function(){ after&&after(); }).catch(function(){}); }
function openWa(cc,mobile,text){
  var num=String(mobile||'').replace(/\D/g,''); if(!num){ toast(t('no_mobile'),'e'); return; }
  cc=String(cc||'961').replace(/\D/g,'');
  if(num.indexOf('00')===0) num=num.slice(2); else if(!(num.indexOf(cc)===0&&num.length>9)) num=cc+num.replace(/^0+/,'');
  var u='https://wa.me/'+num+(text?'?text='+encodeURIComponent(text):'');
  var w=window.open(u,'_blank'); if(!w) location.href=u;
}

/* =========================================================
   الطباعة: طابعة بلوتوث مباشرة (BLE) أو عبر RawBT أو نافذة الطباعة
   التذكرة = أسطر {img} {t,b,s,c} {kv:[k,v]} {hr}
   ========================================================= */
function billTicket(o){
  var T=[];
  if(SITE.logo_url) T.push({img:SITE.logo_url});
  T.push({t:SITE.name||'',b:1,s:32,c:1});
  if(SITE.tagline) T.push({t:SITE.tagline,c:1,s:19});
  T.push({t:billHead(o),c:1,s:21},{hr:1});

async function readXlsx(buf){

    files[td.decode(new Uint8Array(buf,off+46,nl))]={m:meth,cs:cs,lo:lo}; off+=46+nl+el+cl; }

    if(f.m===0) return td.decode(data);

    var out=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer(); return td.decode(out); }
  var X=function(s){ return new DOMParser().parseFromString(s,'application/xml'); };
  var sheet='xl/worksheets/sheet1.xml';
  try{ var wb=X(await get('xl/workbook.xml')), rels=X(await get('xl/_rels/workbook.xml.rels')), s0=wb.getElementsByTagName('sheet')[0];
    var rid=s0&&(s0.getAttribute('r:id')||s0.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
    Array.prototype.forEach.call(rels.getElementsByTagName('Relationship'),function(r){ if(r.getAttribute('Id')===rid){ var tg=r.getAttribute('Target'); sheet=tg.charAt(0)==='/'?tg.slice(1):'xl/'+tg.replace(/^\.\//,''); } });
  }catch(e){}
  var ss=[], sst=await get('xl/sharedStrings.xml');

  var sx=await get(sheet); if(!sx) throw new Error('sheet');
  var rows=[];
  Array.prototype.forEach.call(X(sx).getElementsByTagName('row'),function(r){ var arr=[];
    Array.prototype.forEach.call(r.getElementsByTagName('c'),function(c){ var ref=c.getAttribute('r')||'', col=0, m=ref.match(/^[A-Z]+/);
      if(m){ for(var k=0;k<m[0].length;k++) col=col*26+(m[0].charCodeAt(k)-64); col--; } else col=arr.length;
      var ty=c.getAttribute('t'), v=c.getElementsByTagName('v')[0], val='';
      if(ty==='s') val=ss[+(v&&v.textContent)]||''; else if(ty==='inlineStr'){ Array.prototype.forEach.call(c.getElementsByTagName('t'),function(x){ val+=x.textContent; }); } else val=v?v.textContent:'';
      arr[col]=val; });
    for(var q=0;q<arr.length;q++) if(arr[q]===undefined) arr[q]='';
    rows.push(arr); });
  return rows;
}
function readCsv(text){ var rows=[], row=[], cur='', q=false; text=text.replace(/^﻿/,''); var sep=(text.split('\n')[0].split(';').length>text.split('\n')[0].split(',').length)?';':',';
  for(var i=0;i<text.length;i++){ var ch=text[i]; if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===sep){ row.push(cur); cur=''; } else if(ch==='\n'){ row.push(cur.replace(/\r$/,'')); rows.push(row); row=[]; cur=''; } else cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); } return rows; }

var WF={from:'',to:''};
VIEWS.whish=async function(main){
  if(!WF.from){ WF.from=TODAY.slice(0,8)+'01'; WF.to=TODAY; }
  main.innerHTML='<div class="toolbar"><label style="margin:0">'+esc(t('from'))+'</label><input type="date" id="wf2" value="'+esc(WF.from)+'" style="flex:0 1 160px"><label style="margin:0">'+esc(t('to'))+'</label><input type="date" id="wt2" value="'+esc(WF.to)+'" style="flex:0 1 160px">'+
    '<button class="btn wish" id="wadd">'+esc(t('whish_withdraw'))+' / '+esc(t('m_deposit'))+'</button></div><div id="wbody"></div>';
  async function load(){
    var box=$('#wbody',main); box.innerHTML='<div class="muted">'+esc(t('loading'))+'</div>';
    var d; try{ d=await call('motor_whish_statement',{p_from:WF.from||null,p_to:WF.to||null}); }catch(e){ box.innerHTML='<div class="err">'+esc(errText(e))+'</div>'; return; }
    var run=n2(d.opening), inn=0, out=0;
    var trs=d.rows.map(function(r){ if(!r.voided){ run+=n2(r.credit)-n2(r.debit); inn+=n2(r.credit); out+=n2(r.debit); }
      var lab=r.t==='pay'?t('k_pay')+' #'+r.no+' · '+r.customer+(r.paid_currency!==mainCur()?' ('+money(r.paid_amount,r.paid_currency)+')':''):t('m_'+r.kind);
      return '<tr class="'+(r.voided?'void':'')+'"><td class="num">'+esc(dt(r.at))+'</td><td>'+esc(lab)+(r.note?' <span class="muted">'+esc(r.note)+'</span>':'')+'</td><td>'+esc(r.staff||'')+'</td><td class="num">'+(n2(r.credit)?esc(money(r.credit)):'')+'</td><td class="num">'+(n2(r.debit)?esc(money(r.debit)):'')+'</td><td class="num"><b>'+esc(money(run))+'</b></td>'+
        '<td>'+(r.t==='move'?'<button class="btn ghost sm" data-dm="'+esc(r.id)+'">'+esc(t('delete'))+'</button>':'')+'</td></tr>'; });
    box.innerHTML='<div class="stats">'+stat(t('opening'),money(d.opening))+stat(t('creditc'),money(inn))+stat(t('debit'),money(out))+stat(t('whish_bal'),money(d.balance_now))+'</div>'+
      '<div class="tw"><table><thead><tr><th>'+esc(t('date'))+'</th><th>'+esc(t('type'))+'</th><th>'+esc(t('by'))+'</th><th>'+esc(t('creditc'))+'</th><th>'+esc(t('debit'))+'</th><th>'+esc(t('running'))+'</th><th></th></tr></thead><tbody>'+
      (trs.join('')||'<tr><td colspan="7" class="muted">'+esc(t('no_results'))+'</td></tr>')+'</tbody></table></div>';
    $$('[data-dm]',box).forEach(function(b){ b.addEventListener('click',async function(){ if(!(await confirmBox(t('confirm_delete')))) return; try{ await call('motor_move_delete',{p_id:b.dataset.dm}); load(); }catch(e){ toast(errText(e),'e'); } }); });
  }
  $('#wf2',main).addEventListener('change',function(){ WF.from=this.value; load(); });
  $('#wt2',main).addEventListener('change',function(){ WF.to=this.value; load(); });
  $('#wadd',main).addEventListener('click',function(){ moveForm('whish',null,load); });
  load();
};

VIEWS.plans=async function(main){
  var me=await call('motor_me'); PLANS=me.plans||[]; SITE=me.site;
  main.innerHTML='<div class="card"><h3>⚡ '+esc(t('kwh_general'))+'</h3><div class="row"><input id="kp" type="text" inputmode="decimal" value="'+esc(SITE.kwh_price)+'" style="max-width:200px"><b>'+esc(sym(mainCur()))+' / '+esc(t('kwh'))+'</b><button class="btn" id="kps">'+esc(t('save'))+'</button></div>'+
    '<p class="muted" style="margin-bottom:0">'+esc(t('plan_hint'))+'</p></div>'+
    '<div class="toolbar"><b>'+esc(t('plans_t'))+'</b><span class="sp"></span><button class="btn" id="padd">'+esc(t('new_plan'))+'</button></div>'+
    '<div class="tw"><table><thead><tr><th>'+esc(t('name'))+'</th><th>'+esc(t('amps'))+'</th><th>'+esc(t('kind'))+'</th><th>'+esc(t('fee'))+'</th><th>'+esc(t('kwh_price'))+'</th><th>'+esc(t('status'))+'</th><th></th></tr></thead><tbody>'+
    (PLANS.map(function(p){ return '<tr><td><b>'+esc(p.name)+'</b></td><td class="num">'+esc(fmtN(p.amps))+'</td><td>'+esc(p.kind==='fixed'?t('kind_fixed'):t('kind_meter'))+'</td><td class="num">'+esc(money(p.fee))+'</td>'+
      '<td class="num">'+(p.kind==='fixed'?'—':(p.kwh_price!=null?esc(money(p.kwh_price).replace(/\.?0+$/,'')):'<span class="muted">'+esc(fmtN(SITE.kwh_price,4))+' ('+esc(t('kwh_general'))+')</span>'))+'</td>'+
      '<td><span class="chip '+(p.is_active?'on':'off')+'">'+esc(p.is_active?t('active'):t('inactive'))+'</span></td><td><button class="btn ghost sm" data-pe="'+esc(p.id)+'">'+esc(t('edit'))+'</button></td></tr>'; }).join('')||'<tr><td colspan="7" class="muted">'+esc(t('no_results'))+'</td></tr>')+'</tbody></table></div>';
  $('#kps',main).addEventListener('click',async function(){ var b=this, v=$('#kp',main).value.trim(); if(v===''||!isFinite(Number(v))) return toast(t('e_bad_amount'),'e');
    busy(b,true); try{ SITE=await call('motor_settings_save',{p_data:{kwh_price:v}}); toast(t('saved'),'s'); }catch(e){ toast(errText(e),'e'); } busy(b,false); });
  $('#padd',main).addEventListener('click',function(){ planForm(null); });
  $$('[data-pe]',main).forEach(function(b){ b.addEventListener('click',function(){ planForm(PLANS.filter(function(p){return p.id===b.dataset.pe})[0]); }); });
};
function planForm(p){
  var n=!p; p=p||{kind:'meter',is_active:true,amps:'',fee:'',kwh_price:null,sort:PLANS.length+1};
  var m=modal(n?t('new_plan'):p.name,'<div class="g2"><div><label>'+esc(t('name'))+'</label><input id="qn" value="'+esc(p.name||'')+'" placeholder="6A"></div>'+
    '<div><label>'+esc(t('amps'))+'</label><input id="qa" inputmode="decimal" value="'+esc(p.amps)+'"></div>'+
    '<div style="grid-column:1/-1"><label>'+esc(t('kind'))+'</label><select id="qk"><option value="meter">'+esc(t('kind_meter'))+'</option><option value="fixed">'+esc(t('kind_fixed'))+'</option></select></div>'+
    '<div><label>'+esc(t('fee'))+' ('+esc(mainCur())+')</label><input id="qf" inputmode="decimal" value="'+esc(p.fee)+'"></div>'+
    '<div id="qkpw"><label>'+esc(t('kwh_price'))+'</label><input id="qkp" inputmode="decimal" value="'+esc(p.kwh_price==null?'':p.kwh_price)+'" placeholder="'+esc(t('kwh_blank'))+'"></div>'+
    '<div><label>'+esc(t('sort'))+'</label><input id="qs" inputmode="numeric" value="'+esc(p.sort)+'"></div>'+
    '<div><label>&nbsp;</label><label class="chk"><input type="checkbox" id="qact" '+(p.is_active?'checked':'')+'> '+esc(t('active'))+'</label></div></div>'+
    '<p class="muted">'+esc(t('plan_hint'))+'</p><div id="qmsg" class="err msg"></div>',
    '<button class="btn ghost" data-x>'+esc(t('cancel'))+'</button>'+(n?'':'<button class="btn danger" data-del>'+esc(t('delete'))+'</button>')+'<button class="btn" data-s>'+esc(t('save'))+'</button>');
  $('#qk',m.body).value=p.kind;
  function tog(){ $('#qkpw',m.body).classList.toggle('hidden',$('#qk',m.body).value==='fixed'); } $('#qk',m.body).addEventListener('change',tog); tog();
  m.foot.addEventListener('click',async function(e){
    if(e.target.closest('[data-x]')) return m.close();
    if(e.target.closest('[data-del]')){ if(!(await confirmBox(t('confirm_delete')))) return; try{ await call('motor_plan_delete',{p_id:p.id}); m.close(); go('plans'); }catch(err){ $('#qmsg',m.body).textContent=errText(err); } return; }
    var b=e.target.closest('[data-s]'); if(!b) return; busy(b,true);
    try{ await call('motor_plan_save',{p_data:{id:p.id||'',name:$('#qn',m.body).value.trim(),amps:$('#qa',m.body).value,kind:$('#qk',m.body).value,fee:$('#qf',m.body).value,
        kwh_price:$('#qk',m.body).value==='fixed'?'':$('#qkp',m.body).value.trim(),sort:$('#qs',m.body).value,is_active:$('#qact',m.body).checked}});
      toast(t('saved'),'s'); m.close(); go('plans'); }catch(err){ $('#qmsg',m.body).textContent=errText(err); busy(b,false); }
  });
}

VIEWS.settings=async function(main){
  var adm=isAdmin(), S=SITE;
  var h='';
  if(adm){
    h+='<div class="card"><h3>'+esc(t('s_biz'))+'</h3><div class="row" style="margin-bottom:10px">'+
      (S.logo_url?'<img id="slogo" src="'+esc(S.logo_url)+'" alt="" style="height:60px;border-radius:10px;background:#fff">':'<span id="slogo"></span>')+
      '<label class="btn alt" style="cursor:pointer">'+esc(t('logo_upload'))+'<input type="file" id="slogof" accept="image/*" class="hidden"></label></div><div class="g2">'+
      fld('biz_name','name',S.name)+fld('tagline','tagline',S.tagline)+fld('phone','phone',S.phone)+fld('wa_num','whatsapp',S.whatsapp)+fld('address','address',S.address)+
      '<div><label>'+esc(t('def_lang'))+'</label><select data-s="default_lang"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option></select></div>'+
      '<input type="hidden" data-s="logo_url" value="'+esc(S.logo_url||'')+'"></div></div>'+
      '<div class="card"><h3>'+esc(t('s_money'))+'</h3><div class="g2">'+
      '<div><label>'+esc(t('main_cur'))+'</label><select data-s="currency"><option value="USD">USD $</option><option value="LBP">LBP ل.ل</option></select></div>'+
      fld('lbp_rate','lbp_rate',S.lbp_rate)+fld('cur_label','cur_label',S.cur_label)+fld('round_step','round_step',S.round_step)+fld('barcode_prefix','barcode_prefix',S.barcode_prefix)+
      '<div style="grid-column:1/-1">'+chk('show_second','show_second',S.show_second)+chk('wa_from_office','wa_from_office',S.wa_from_office)+'</div>'+
      '<div style="grid-column:1/-1"><label>'+esc(t('invoice_note'))+'</label><textarea data-s="invoice_note">'+esc(S.invoice_note)+'</textarea></div></div></div>'+
      '<div class="card"><h3>'+esc(t('s_read'))+'</h3>'+chk('require_photo','require_photo',S.require_photo)+chk('first_baseline','first_read_baseline',S.first_read_baseline)+chk('require_gps','require_gps',S.require_gps)+chk('sees_all','collector_sees_all',S.collector_sees_all)+
      '<div class="g2" style="margin-top:8px">'+fld('max_dist','max_distance_m',S.max_distance_m)+'</div>'+
      '<div id="smsg" class="msg" style="margin-top:10px"></div><button class="btn" id="ssave" style="margin-top:10px">'+esc(t('save'))+'</button></div>';
  }
  var pm=printMode();
  h+='<div class="card"><h3>🖨️ '+esc(t('s_device'))+'</h3><div class="g2"><div><label>'+esc(t('print_mode'))+'</label><select id="pmode"><option value="ble">'+esc(t('pm_ble'))+'</option><option value="rawbt">'+esc(t('pm_rawbt'))+'</option><option value="browser">'+esc(t('pm_browser'))+'</option></select></div>'+
    '<div><label>'+esc(t('paper'))+'</label><select id="ppw"><option value="58">58 mm</option><option value="80">80 mm</option></select></div></div>'+
    '<div id="blebox" style="margin-top:10px"><div class="row"><button class="btn" id="blepick">'+esc(t('ble_pick'))+'</button><b id="blename"></b></div>'+
    '<div class="g2" style="margin-top:8px"><div><label>'+esc(t('ble_chunk'))+'</label><input id="blech" inputmode="numeric" value="'+esc(lsGet('motor_ble_chunk','100'))+'"></div><div><label>'+esc(t('ble_delay'))+'</label><input id="bledl" inputmode="numeric" value="'+esc(lsGet('motor_ble_delay','20'))+'"></div></div>'+
    '<p class="muted">'+esc(t('ble_hint'))+'</p></div>'+
    '<p class="muted" id="rawhint">'+esc(t('rawbt_hint'))+'</p><button class="btn alt" id="ptest">'+esc(t('test_print'))+'</button></div>';
  if(ME.staff_id){
    h+='<div class="card"><h3>🔐 '+esc(t('tfa'))+' — <span class="chip '+(ME.totp_enabled?'on':'gray')+'">'+esc(ME.totp_enabled?t('tfa_on'):t('tfa_off'))+'</span></h3><div id="tfabox">'+
      (ME.totp_enabled?'<div class="row"><input id="tfoff" inputmode="numeric" maxlength="6" placeholder="'+esc(t('totp'))+'" style="max-width:200px"><button class="btn danger" id="tfoffb">'+esc(t('tfa_disable'))+'</button></div>'
        :'<button class="btn" id="tfon">'+esc(t('tfa_setup'))+'</button>')+'</div></div>'+
      '<div class="card"><h3>'+esc(t('s_pass'))+'</h3><div class="g2"><div><label>'+esc(t('old_pass'))+'</label><input id="op" type="password" autocomplete="current-password"></div><div><label>'+esc(t('new_pass'))+'</label><input id="np" type="password" autocomplete="new-password"></div></div>'+
      '<div id="pwmsg" class="msg" style="margin-top:8px"></div><button class="btn" id="pwgo" style="margin-top:8px">'+esc(t('save'))+'</button></div>';
  } else h+='<div class="card"><h3>🔐 '+esc(t('tfa'))+'</h3><p class="muted" style="margin:0">'+esc(t('tfa_owner'))+'</p></div>';
  main.innerHTML=h;
  function fld(l,k,v){ return '<div><label>'+esc(t(l))+'</label><input data-s="'+k+'" value="'+esc(v==null?'':v)+'"'+(/rate|step|dist/.test(k)?' inputmode="decimal"':'')+'></div>'; }
  function chk(l,k,v){ return '<label class="chk"><input type="checkbox" data-s="'+k+'" '+(v?'checked':'')+'> '+esc(t(l))+'</label>'; }
  if(adm){ $('[data-s=default_lang]',main).value=S.default_lang||'ar'; $('[data-s=currency]',main).value=S.currency||'USD';
    $('#slogof',main).addEventListener('change',async function(){ var f=this.files&&this.files[0]; if(!f) return;
      try{ toast(t('uploading')); var b=await shrink(f,600); var path=await uploadPhoto(b,'logo'); $('[data-s=logo_url]',main).value=path;
        var im=$('#slogo',main); if(im.tagName==='IMG') im.src=path; else im.outerHTML='<img id="slogo" src="'+esc(path)+'" style="height:60px;border-radius:10px">'; toast(t('logo_saved'),'s'); }
      catch(e){ toast(errText(e),'e'); } });
    $('#ssave',main).addEventListener('click',async function(){ var b=this, d={}; $$('[data-s]',main).forEach(function(el){ d[el.dataset.s]=el.type==='checkbox'?el.checked:el.value.trim(); });
      busy(b,true); var msg=$('#smsg',main); msg.className='msg'; msg.textContent='';
      try{ SITE=await call('motor_settings_save',{p_data:d}); msg.className='okmsg'; msg.textContent=t('saved'); paintShell(); }catch(e){ msg.className='err'; msg.textContent=errText(e); } busy(b,false); }); }
  function pmTog(){ var v=$('#pmode',main).value; $('#blebox',main).classList.toggle('hidden',v!=='ble'); $('#rawhint',main).classList.toggle('hidden',v!=='rawbt');
    $('#blename',main).textContent=lsGet('motor_ble_name','')?t('ble_cur',{n:lsGet('motor_ble_name','')}):''; }
  $('#pmode',main).value=pm; $('#ppw',main).value=lsGet('motor_paper','58'); pmTog();
  $('#pmode',main).addEventListener('change',function(){ lsSet('motor_print',this.value); pmTog(); });
  $('#ppw',main).addEventListener('change',function(){ lsSet('motor_paper',this.value); });
  $('#blech',main).addEventListener('change',function(){ lsSet('motor_ble_chunk',this.value); });
  $('#bledl',main).addEventListener('change',function(){ lsSet('motor_ble_delay',this.value); });
  $('#blepick',main).addEventListener('click',async function(){ try{ var nm=await blePick(); toast(t('ble_cur',{n:nm}),'s'); pmTog(); }catch(e){ if(!/cancel/i.test(String(e&&e.message))) toast(errText(e),'e'); } });
  $('#ptest',main).addEventListener('click',function(){ printDoc(billTicket({c:{name:'Test',code:0,mobile:''},inv:{no:1,created_at:new Date().toISOString(),period:SITE.bill_period,kind:'meter',fee:5,prev_value:1229,cur_value:1331,kwh:102,kwh_price:0.75,energy:76.5,amount:81.5,balance_before:0,balance_after:81.5,note:''}})); });
  if($('#pwgo',main)) $('#pwgo',main).addEventListener('click',async function(){ var b=this, msg=$('#pwmsg',main); busy(b,true); msg.className='msg'; msg.textContent='';
    try{ await call('motor_change_password',{p_old:$('#op',main).value,p_new:$('#np',main).value}); msg.className='okmsg'; msg.textContent=t('saved'); $('#op',main).value=''; $('#np',main).value=''; }
    catch(e){ msg.className='err'; msg.textContent=errText(e); } busy(b,false); });
  var on=$('#tfon',main); if(on) on.addEventListener('click',async function(){
    try{ var r=await call('motor_2fa_setup'); var box=$('#tfabox',main);
      box.innerHTML='<p class="muted">'+esc(t('tfa_scan'))+'</p><div style="text-align:center">'+qrSvg(r.uri)+'</div><p class="muted">'+esc(t('tfa_key'))+' <b class="num" style="letter-spacing:1px">'+esc(r.secret.replace(/(.{4})/g,'$1 '))+'</b></p>'+
        '<div class="row"><input id="tfc" inputmode="numeric" maxlength="6" placeholder="'+esc(t('totp'))+'" style="max-width:200px"><button class="btn ok" id="tfcb">'+esc(t('ok'))+'</button></div><div id="tfmsg" class="err msg" style="margin-top:8px"></div>';
      $('#tfcb',box).addEventListener('click',async function(){ try{ await call('motor_2fa_enable',{p_code:$('#tfc',box).value.trim()}); ME.totp_enabled=true; toast(t('tfa_enabled'),'s'); go('settings'); }catch(e){ $('#tfmsg',box).textContent=errText(e); } });
    }catch(e){ toast(errText(e),'e'); } });
  var off=$('#tfoffb',main); if(off) off.addEventListener('click',async function(){
    try{ await call('motor_2fa_disable',{p_code:$('#tfoff',main).value.trim(),p_staff:null}); ME.totp_enabled=false; toast(t('tfa_disabled'),'s'); go('settings'); }catch(e){ toast(errText(e),'e'); } });
};
function qrSvg(text){ var mx=ClubQR(text,'M'), n=mx.length, q=4, sz=n+q*2, p='';
  for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(mx[r][c]) p+='M'+(c+q)+' '+(r+q)+'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+sz+' '+sz+'" style="width:200px;height:200px;background:#fff" shape-rendering="crispEdges"><path d="'+p+'" fill="#000"/></svg>'; }

window.addEventListener('offline',function(){ toast(t('offline'),'e'); });
boot();
})();
</script>
