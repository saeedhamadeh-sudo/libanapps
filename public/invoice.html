<style>
/* ===== assets/themes.css (مدمج) ===== */
/* ============================================================
   LibanApps — الثيمات
   صاحب المطعم بيختار وحدة من لوحة التحكم
   ============================================================ */

/* 1. FLAME — أسود / أحمر / أصفر (مطاعم الوجبات السريعة) */
[data-theme="flame"]{
  --bg:#0A0A0A; --bg-2:#131110; --card:#17140F;
  --text:#FFF4DF; --muted:#A0968A; --line:rgba(255,212,0,.15);
  --brand:#E4141B; --brand-ink:#FFFFFF; --accent:#FFD400;
  --price:#FFD400; --shadow:0 14px 30px rgba(0,0,0,.5);
  --glow:radial-gradient(120% 60% at 50% -10%, #241304 0%, rgba(10,10,10,0) 62%);
  --halo:rgba(255,212,0,.30);
  --font-display:'Lalezar', system-ui, sans-serif;
  --radius:18px;
}

/* 2. CLEAN — أبيض هادئ (كافيهات ومطاعم راقية) */
[data-theme="clean"]{
  --bg:#FAF8F5; --bg-2:#FFFFFF; --card:#FFFFFF;
  --text:#1C1917; --muted:#7A716A; --line:rgba(0,0,0,.09);
  --brand:#1C1917; --brand-ink:#FFFFFF; --accent:#C2410C;
  --price:#C2410C; --shadow:0 6px 20px rgba(0,0,0,.07);
  --glow:none; --halo:rgba(194,65,12,.10);
  --font-display:'Tajawal', system-ui, sans-serif;
  --radius:14px;
}

/* 3. WOOD — بني دافئ (مطاعم تقليدية ومشاوي) */
[data-theme="wood"]{
  --bg:#241B14; --bg-2:#2E241B; --card:#33271D;
  --text:#F5E9D9; --muted:#B09C86; --line:rgba(212,163,94,.20);
  --brand:#8A4B21; --brand-ink:#FFF6E8; --accent:#D4A35E;
  --price:#E8B96F; --shadow:0 12px 26px rgba(0,0,0,.45);
  --glow:radial-gradient(120% 60% at 50% -10%, #3D2C1D 0%, rgba(36,27,20,0) 62%);
  --halo:rgba(212,163,94,.22);
  --font-display:'Amiri', Georgia, serif;
  --radius:12px;
}

/* 4. NEON — داكن مع ألوان صارخة (بوظة، عصائر، شباب) */
[data-theme="neon"]{
  --bg:#0B0714; --bg-2:#150E24; --card:#1A1130;
  --text:#F2ECFF; --muted:#9A8DB8; --line:rgba(34,211,238,.22);
  --brand:#7C3AED; --brand-ink:#FFFFFF; --accent:#22D3EE;
  --price:#22D3EE; --shadow:0 14px 34px rgba(124,58,237,.28);
  --glow:radial-gradient(120% 60% at 50% -10%, #1E1040 0%, rgba(11,7,20,0) 62%);
  --halo:rgba(34,211,238,.25);
  --font-display:'Cairo', system-ui, sans-serif;
  --radius:20px;
}

/* لون أساسي مخصص من لوحة التحكم بيتجاوز لون الثيم */
[data-brand-override="1"]{ --brand: var(--custom-brand); }

/* ============================================================
   ثيمات إضافية
   ============================================================ */

/* 5. AURORA — كحلي عميق مع شفق بنفسجي/فيروزي */
[data-theme="aurora"]{
  --bg:#0B1020; --bg-2:#131A2E; --card:#171F36;
  --text:#E8EDFB; --muted:#8E9AB8; --line:rgba(125,211,252,.18);
  --brand:#4C6FFF; --brand-ink:#FFFFFF; --accent:#7DD3FC;
  --price:#A5B4FC; --shadow:0 14px 34px rgba(76,111,255,.25);
  --glow:radial-gradient(130% 70% at 50% -10%, #1B2A5B 0%, rgba(11,16,32,0) 65%);
  --halo:rgba(125,211,252,.22);
  --font-display:'Tajawal', system-ui, sans-serif; --radius:18px;
}

/* 6. NOIR — أبيض وأسود بلا ألوان، تباين عالٍ */
[data-theme="noir"]{
  --bg:#000000; --bg-2:#0E0E0E; --card:#141414;
  --text:#FFFFFF; --muted:#8A8A8A; --line:rgba(255,255,255,.16);
  --brand:#FFFFFF; --brand-ink:#000000; --accent:#FFFFFF;
  --price:#FFFFFF; --shadow:0 10px 26px rgba(0,0,0,.7);
  --glow:none; --halo:rgba(255,255,255,.10);
  --font-display:'Lalezar', system-ui, sans-serif; --radius:4px;
}
[data-theme="noir"] .card{border-color:rgba(255,255,255,.14)}
[data-theme="noir"] .chip[aria-pressed="true"]{box-shadow:none}

/* 7. TERRA — طيني وزيتوني ورملي، فاتح */
[data-theme="terra"]{
  --bg:#F6F1E7; --bg-2:#FFFFFF; --card:#FFFFFF;
  --text:#2E2A24; --muted:#7C7263; --line:rgba(120,95,60,.18);
  --brand:#9C5B34; --brand-ink:#FFF8F0; --accent:#6B7A46;
  --price:#9C5B34; --shadow:0 6px 20px rgba(120,95,60,.12);
  --glow:none; --halo:rgba(156,91,52,.12);
  --font-display:'Tajawal', system-ui, sans-serif; --radius:14px;
}

/* 8. ELEGANT — عاجي مع أخضر داكن وخط رقعي */
[data-theme="elegant"]{
  --bg:#FBF9F4; --bg-2:#FFFFFF; --card:#FFFFFF;
  --text:#1F2A24; --muted:#7A857D; --line:rgba(31,42,36,.14);
  --brand:#14432A; --brand-ink:#F7F3E8; --accent:#B08D3F;
  --price:#14432A; --shadow:0 8px 24px rgba(20,67,42,.10);
  --glow:none; --halo:rgba(176,141,63,.14);
  --font-display:'Amiri', Georgia, serif; --radius:8px;
}

/* 9. CYBER — أسود مع ليموني وماجنتا */
[data-theme="cyber"]{
  --bg:#050608; --bg-2:#0E1116; --card:#12161D;
  --text:#E9FFF3; --muted:#79908A; --line:rgba(163,255,18,.22);
  --brand:#FF2E88; --brand-ink:#FFFFFF; --accent:#A3FF12;
  --price:#A3FF12; --shadow:0 14px 34px rgba(163,255,18,.14);
  --glow:radial-gradient(120% 60% at 50% -10%, #0F1A0B 0%, rgba(5,6,8,0) 62%);
  --halo:rgba(163,255,18,.20);
  --font-display:'Cairo', system-ui, sans-serif; --radius:6px;
}

/* 10. MINIMAL — أبيض صافٍ بلا زخرفة */
[data-theme="minimal"]{
  --bg:#FFFFFF; --bg-2:#FAFAFA; --card:#FFFFFF;
  --text:#111111; --muted:#8A8A8A; --line:rgba(0,0,0,.10);
  --brand:#111111; --brand-ink:#FFFFFF; --accent:#111111;
  --price:#111111; --shadow:none;
  --glow:none; --halo:rgba(0,0,0,.04);
  --font-display:'Tajawal', system-ui, sans-serif; --radius:6px;
}
[data-theme="minimal"] .card:hover{transform:none;box-shadow:none;border-color:rgba(0,0,0,.22)}
[data-theme="minimal"] .sec h2{font-size:20px;letter-spacing:1px}

/* 11. SHOWCASE — صور كبيرة، الصنف بيحتل الكرت */
[data-theme="showcase"]{
  --bg:#0C0C0D; --bg-2:#141416; --card:#161618;
  --text:#F5F5F5; --muted:#9A9A9E; --line:rgba(255,255,255,.12);
  --brand:#E5484D; --brand-ink:#FFFFFF; --accent:#F5C542;
  --price:#F5C542; --shadow:0 16px 36px rgba(0,0,0,.55);
  --glow:radial-gradient(120% 60% at 50% -10%, #1C1C20 0%, rgba(12,12,13,0) 62%);
  --halo:rgba(245,197,66,.16);
  --font-display:'Lalezar', system-ui, sans-serif; --radius:20px;
}
[data-theme="showcase"] .card{grid-template-columns:1fr;padding:0;overflow:hidden}
[data-theme="showcase"] .thumb{width:100%;height:190px;border-radius:0}
[data-theme="showcase"] .card>div:last-child{padding:12px 14px 14px}

/* 12. SHOP BOARD — شبكة مربعات مضغوطة */
[data-theme="shopboard"]{
  --bg:#F4F5F7; --bg-2:#FFFFFF; --card:#FFFFFF;
  --text:#1A1D21; --muted:#6B7280; --line:rgba(0,0,0,.10);
  --brand:#2563EB; --brand-ink:#FFFFFF; --accent:#F59E0B;
  --price:#2563EB; --shadow:0 4px 14px rgba(0,0,0,.08);
  --glow:none; --halo:rgba(37,99,235,.10);
  --font-display:'Tajawal', system-ui, sans-serif; --radius:12px;
}
[data-theme="shopboard"] .grid{grid-template-columns:1fr 1fr;gap:10px}
[data-theme="shopboard"] .card{grid-template-columns:1fr;padding:8px;text-align:center}
[data-theme="shopboard"] .thumb{width:100%;height:110px;margin:0 auto}
[data-theme="shopboard"] .card h3{font-size:15px}
[data-theme="shopboard"] .card p{display:none}
[data-theme="shopboard"] .prow{justify-content:center;flex-wrap:wrap}
@media(min-width:700px){[data-theme="shopboard"] .grid{grid-template-columns:repeat(4,1fr)}}

/* 13. PASTARIA — عاجي وطماطم وريحان، طابع إيطالي */
[data-theme="pastaria"]{
  --bg:#FFF8EF; --bg-2:#FFFFFF; --card:#FFFFFF;
  --text:#3B2A20; --muted:#8B7466; --line:rgba(178,58,44,.18);
  --brand:#B23A2C; --brand-ink:#FFF8EF; --accent:#4E7A3A;
  --price:#B23A2C; --shadow:0 6px 20px rgba(178,58,44,.12);
  --glow:none; --halo:rgba(178,58,44,.12);
  --font-display:'Amiri', Georgia, serif; --radius:10px;
}

</style>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;
  padding:20px 14px 60px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0}
.sheet{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden}
.head{text-align:center;padding:22px 18px 16px;border-bottom:1px dashed var(--line)}
.head img{width:96px;margin:0 auto 8px;display:block}
.head h1{font-size:28px}
.head .no{margin-top:8px;display:inline-block;background:var(--brand);color:var(--brand-ink);
  border-radius:999px;padding:4px 14px;font-weight:800;font-size:14px}
.head .date{color:var(--muted);font-size:12.5px;margin-top:8px}
.info{padding:14px 18px;border-bottom:1px dashed var(--line);font-size:14px}
.info div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.info span:first-child{color:var(--muted)}
.info a{color:var(--accent)}
.lines{padding:14px 18px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14.5px;
  border-bottom:1px dashed var(--line)}
.ln:last-child{border:0}
.ln .q{color:var(--muted);font-size:12.5px}
.sum{padding:14px 18px;background:var(--bg-2)}
.sum div{display:flex;justify-content:space-between;padding:3px 0;font-size:14px;color:var(--muted)}
.sum .g{color:var(--text);font-weight:800;font-size:18px;padding-top:10px;margin-top:6px;
  border-top:1px solid var(--line)}
.sum .g b{font-family:var(--font-display);color:var(--price);font-size:26px}
.sum .lb{justify-content:flex-end;font-size:13px}
.foot{text-align:center;padding:16px;color:var(--muted);font-size:12px}
.tools{max-width:520px;margin:14px auto 0;display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:15px;
  background:var(--brand);color:var(--brand-ink);text-align:center;text-decoration:none;cursor:pointer}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--text)}
.msg{max-width:520px;margin:10px auto 0;text-align:center;color:var(--muted);font-size:13px}
.paid{display:inline-block;border:2px solid #4ADE80;color:#4ADE80;border-radius:8px;
  padding:2px 10px;font-weight:800;font-size:13px;margin-top:8px}
@media print{.tools,.msg{display:none}body{background:#fff;padding:0}}
</style>
</head>
<body>

<div class="sheet" id="sheet">

</div>

</div>
<div class="msg" id="msg"></div>

  var d=new Date(o.created_at);
  var dateStr=d.toLocaleDateString(L==='ar'?'ar-LB':'en-GB')+' · '+
              d.toLocaleTimeString(L==='ar'?'ar-LB':'en-GB',{hour:'2-digit',minute:'2-digit'});

  var h='<div class="head">'+
    (r.logo_url?'<img src="'+esc(r.logo_url)+'" alt="">':'')+
    '<h1>'+esc(L==='ar'?r.name_ar:r.name_en)+'</h1>'+
    '<div class="no">'+esc(o.order_no)+'</div>'+
    (o.status==='paid'?'<div><span class="paid">'+W().paid+'</span></div>':'')+
    '<div class="date">'+esc(dateStr)+'</div></div>';

  h+='<div class="info">';
  h+=row(W().type, o.order_type==='delivery'?W().del:W().dine);
  h+=row(W().name, o.customer_name);
  h+=row(W().phone, o.customer_phone);
  if(o.order_type==='dine_in'&&o.table_no) h+=row(W().table,o.table_no);
  if(o.order_type==='delivery'){
    if(o.address_text) h+=row(W().addr,o.address_text);
    if(o.lat) h+='<div><span>'+W().map+'</span><a href="https://maps.google.com/?q='+
      o.lat+','+o.lng+'" target="_blank" rel="noopener">'+o.lat.toFixed(5)+', '+o.lng.toFixed(5)+'</a></div>';
  }
  if(o.customer_note) h+=row(W().note,o.customer_note);
  h+=row(W().pay, o.payment_method==='whish'?W().whish:W().cash);
  h+='</div>';

  h+='<div class="lines">'+items.map(function(i){
    return '<div class="ln"><div>'+esc(L==='ar'?i.name_ar:i.name_en)+
      '<div class="q">'+i.qty+' × '+money(i.price_usd)+' $</div></div>'+
      '<div>'+money(i.line_usd)+' $</div></div>';
  }).join('')+'</div>';

  var lbpTxt=Number(o.total_lbp).toLocaleString('en-US')+' '+(L==='ar'?'ل.ل.':'LBP');
  h+='<div class="sum">'+
    '<div><span>'+W().sub+'</span><span>'+money(o.subtotal_usd)+' $</span></div>'+
    (Number(o.delivery_usd)?'<div><span>'+W().fee+'</span><span>'+money(o.delivery_usd)+' $</span></div>':'')+
    '<div class="g"><span>'+W().total+'</span><b>'+money(o.total_usd)+' $</b></div>'+
    '<div class="lb">'+lbpTxt+'</div></div>';

  h+='<div class="foot">'+W().thanks+(r.phone?' · '+esc(r.phone):'')+'<br>Powered by LibanApps</div>';

  $('#sheet').innerHTML=h;
  $('#tools').style.display='flex';
}
function row(a,b){ return '<div><span>'+esc(a)+'</span><span>'+esc(b)+'</span></div>'; }

async function makePdf(upload){
  var msg=$('#msg'); msg.textContent=W().gen;
  var el=$('#sheet');
  var canvas=await html2canvas(el,{scale:2,backgroundColor:getComputedStyle(document.body).backgroundColor,useCORS:true});
  var img=canvas.toDataURL('image/jpeg',0.92);
  var pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
  var pw=pdf.internal.pageSize.getWidth(), margin=28;
  var w=pw-margin*2, hgt=canvas.height*w/canvas.width;
  var ph=pdf.internal.pageSize.getHeight()-margin*2;
  if(hgt<=ph){
    pdf.addImage(img,'JPEG',margin,margin,w,hgt);
  }else{ // فاتورة طويلة: نقسمها على صفحات
    var drawn=0;
    while(drawn<hgt){
      pdf.addImage(img,'JPEG',margin,margin-drawn,w,hgt);
      drawn+=ph;
      if(drawn<hgt) pdf.addPage();
    }
  }
  if(!upload){ pdf.save(D.order.order_no+'.pdf'); msg.textContent=''; return; }

  var b64=pdf.output('datauristring').split(',')[1];
  try{
    var res=await fetch('/api/store-invoice',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:token,pdf_base64:b64})});
    var j=await res.json();
    if(j.url){ D.order.invoice_pdf_url=j.url; msg.textContent=W().saved; }
    else msg.textContent='';
  }catch(e){ msg.textContent=''; }
}

$('#pdfBtn').addEventListener('click',function(){
  if(D.order.invoice_pdf_url){ window.open(D.order.invoice_pdf_url,'_blank'); return; }
  makePdf(false);
});
$('#langBtn').addEventListener('click',function(){
  L=(L==='ar')?'en':'ar'; T=window.I18N[L]; render();
});

(async function(){
  if(!sb||!token){ $('#sheet').innerHTML='<div class="foot">'+LBL.ar.notfound+'</div>'; return; }
  var res=await sb.rpc('get_order',{p_token:token});
  if(res.error||!res.data){ $('#sheet').innerHTML='<div class="foot">'+LBL.ar.notfound+'</div>'; return; }
  D=res.data;
  L=(D.restaurant&&D.restaurant.default_lang)||'ar';
  render();
  // أول فتحة: نولّد الملف ونخزنه مرة وحدة
  if(!D.order.invoice_pdf_url){ setTimeout(function(){ makePdf(true) },600); }
  if(autoGen){ document.body.style.opacity='0'; } // نسخة خفية تولّد الملف بالخلفية
})();
})();
</script>
