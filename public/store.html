<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="nova">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Store</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* ============================================================
   LibanApps Store — نظام التصميم v2
   ٥ ثيمات: nova (أزياء) · aurum (فخم/إكسسوارات) · pulse (إلكترونيات)
            bloom (تجميل/نسائي) · atelier (مينيمال/منزل)
   كل ثيم = ألوان + خطوط + هيدر + هيرو + تصنيفات + كرت + فلاتر
   ============================================================ */

/* ---------- NOVA: أزياء تحريرية، أبيض وأسود بأحمر للتخفيضات ---------- */
[data-theme="nova"]{
  --bg:#fff; --surface:#F4F4F2; --surface-2:#EDEDEA; --text:#0B0B0B; --muted:#6C6C69; --line:#E4E4E0;
  --brand:#0B0B0B; --brand-ink:#fff; --accent:#E4002B; --accent-ink:#fff; --ok:#12805C;
  --r:0px; --r-lg:0px; --r-btn:0px;
  --font-display:'Archivo','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'Inter','IBM Plex Sans Arabic',system-ui,sans-serif;
  --shadow:0 24px 60px rgba(0,0,0,.18); --gap:clamp(10px,1.6vw,22px);
  --cols:2; --cols-m:3; --cols-d:4; --card-ar:3/4; --img-fit:cover;
}
/* ---------- AURUM: فخم داكن بذهبي، سيريف، إطارات رفيعة ---------- */
[data-theme="aurum"]{
  --bg:#0D1524; --surface:#141E31; --surface-2:#1B2740; --text:#F3EEE4; --muted:#A7A08F;
  --line:rgba(214,184,122,.22); --brand:#D6B87A; --brand-ink:#0D1524; --accent:#D96C5F; --accent-ink:#fff; --ok:#7FC8A0;
  --r:0px; --r-lg:0px; --r-btn:0px;
  --font-display:'Playfair Display','Amiri',Georgia,serif;
  --font-body:'Jost','Tajawal',system-ui,sans-serif;
  --shadow:0 30px 70px rgba(0,0,0,.55); --gap:clamp(14px,2.2vw,32px);
  --cols:2; --cols-m:3; --cols-d:4; --card-ar:1/1.12; --img-fit:cover;
}
/* ---------- PULSE: إلكترونيات، فاتح بكوبالت، كروت تقنية ---------- */
[data-theme="pulse"]{
  --bg:#F3F5F9; --surface:#EEF1F7; --surface-2:#E4E9F2; --text:#0E1526; --muted:#5B6577; --line:#E1E6EF;
  --brand:#2456FF; --brand-ink:#fff; --accent:#FF5C39; --accent-ink:#fff; --ok:#0F9D6B;
  --r:12px; --r-lg:20px; --r-btn:12px;
  --font-display:'Sora','Readex Pro',system-ui,sans-serif;
  --font-body:'Inter','Readex Pro',system-ui,sans-serif;
  --shadow:0 20px 50px rgba(20,36,90,.16); --gap:clamp(12px,1.6vw,20px);
  --cols:2; --cols-m:3; --cols-d:3; --card-ar:1/1; --img-fit:contain;
}
/* ---------- BLOOM: ناعم، وردي وعنابي، حواف مدوّرة ---------- */
[data-theme="bloom"]{
  --bg:#FFF6F3; --surface:#FFFFFF; --surface-2:#FCEAE4; --text:#2E1A2B; --muted:#8A6F85; --line:rgba(94,38,76,.12);
  --brand:#5E264C; --brand-ink:#fff; --accent:#FF6F86; --accent-ink:#fff; --ok:#2E8B6A;
  --r:20px; --r-lg:34px; --r-btn:999px;
  --font-display:'DM Serif Display','El Messiri',Georgia,serif;
  --font-body:'Plus Jakarta Sans','Tajawal',system-ui,sans-serif;
  --shadow:0 20px 50px rgba(94,38,76,.16); --gap:clamp(12px,1.8vw,24px);
  --cols:2; --cols-m:3; --cols-d:4; --card-ar:1/1.1; --img-fit:cover;
}
/* ---------- ATELIER: مينيمال، أبيض تحريري، خط خفيف ---------- */
[data-theme="atelier"]{
  --bg:#fff; --surface:#F4F3F0; --surface-2:#ECEAE6; --text:#151515; --muted:#7B7A76; --line:#E8E7E3;
  --brand:#151515; --brand-ink:#fff; --accent:#2F5D50; --accent-ink:#fff; --ok:#2F5D50;
  --r:2px; --r-lg:4px; --r-btn:2px;
  --font-display:'DM Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'DM Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
  --shadow:0 18px 44px rgba(0,0,0,.12); --gap:clamp(14px,2.4vw,40px);
  --cols:2; --cols-m:3; --cols-d:3; --card-ar:4/5; --img-fit:cover;
}

/* ---------- ELECTRO: متجر إلكترونيات كلاسيكي (مستوحى من Porto) — هيدر بمستويين، قائمة Shop All، بنرات، كروت بحدود ---------- */
[data-theme="electro"]{
  --bg:#fff; --surface:#F5F7F9; --surface-2:#E7E7E7; --text:#222529; --muted:#777B81; --line:#E7E7E7;
  --brand:#A50000; --brand-ink:#fff; --accent:#D90212; --accent-ink:#fff; --ok:#0F9D58;
  --r:3px; --r-lg:4px; --r-btn:3px;
  --font-display:'Poppins','Cairo',system-ui,sans-serif;
  --font-body:'Poppins','Cairo',system-ui,sans-serif;
  --shadow:0 12px 34px rgba(34,37,41,.16); --gap:clamp(10px,1.4vw,18px);
  --cols:2; --cols-m:3; --cols-d:4; --card-ar:1/1; --img-fit:contain;
}

/* ============================================================
   الأساس
   ============================================================ */
*{box-sizing:border-box}
:root{--maxw:1360px;--danger:#C0392B;--hd-h:70px}
[data-theme="aurum"]{--danger:#F08A7E}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;
  line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;max-width:100%}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(14px,3vw,40px)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[data-theme="aurum"] :focus-visible{outline-color:var(--brand)}
bdi{unicode-bidi:isolate}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

.state{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.state .box{max-width:440px}
.state .lg{max-height:64px;width:auto;max-width:220px;object-fit:contain;margin:0 auto 20px}
.state h1{font-family:var(--font-display);font-size:clamp(28px,5vw,40px);margin:0 0 10px;line-height:1.15}
.state p{color:var(--muted);margin:0 0 20px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* الأزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 26px;
  border-radius:var(--r-btn);background:var(--brand);color:var(--brand-ink);font-weight:600;font-size:14.5px;
  border:1.5px solid var(--brand);transition:transform .18s var(--ease,ease),filter .18s,background .18s,color .18s;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.98)}
.btn.alt{background:transparent;color:var(--text);border-color:var(--line)}
.btn.alt:hover{border-color:var(--text);filter:none}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:0 16px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
[data-theme="nova"] .btn,[data-theme="atelier"] .btn{text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;font-weight:600}
[data-theme="aurum"] .btn{letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;font-weight:500}
[data-theme="pulse"] .btn{font-weight:600}
[data-theme="bloom"] .btn{font-weight:700}
.link{display:inline-flex;align-items:center;gap:8px;font-weight:600;border-bottom:1.5px solid currentColor;padding-bottom:2px}

/* ============================================================
   الشريط المتحرك + الهيدر
   ============================================================ */
.mq{overflow:hidden;background:var(--brand);color:var(--brand-ink);font-size:12.5px;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.mq .tr{display:inline-flex;animation:mq 34s linear infinite;padding:9px 0}
.mq span{padding-inline:38px;display:inline-flex;align-items:center;gap:38px}
.mq span::after{content:"";width:5px;height:5px;background:currentColor;opacity:.55;transform:rotate(45deg)}
@keyframes mq{to{transform:translateX(-50%)}}
[dir="rtl"] .mq .tr{animation-name:mqr}
@keyframes mqr{to{transform:translateX(50%)}}
[data-theme="nova"] .mq{text-transform:uppercase;letter-spacing:.2em;font-size:11px}
[data-theme="aurum"] .mq{background:transparent;color:var(--brand);border-bottom:1px solid var(--line);letter-spacing:.24em;text-transform:uppercase;font-size:11px;font-weight:500}
[data-theme="pulse"] .mq{background:linear-gradient(90deg,#0E1526,#1B2F7A);color:#fff}
[data-theme="bloom"] .mq{background:var(--accent);color:#fff}
[data-theme="atelier"] .mq{background:var(--surface);color:var(--text);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:11px}

.hd{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 94%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hd-in{display:grid;align-items:center;min-height:var(--hd-h);gap:12px 20px;grid-template-columns:auto 1fr auto;
  grid-template-areas:"logo nav act"}
.hd-menu{display:none;grid-area:menu}
.hd-logo{grid-area:logo;display:flex;align-items:center;min-width:0}
.hd-logo img{height:var(--logo-h,44px);width:auto;max-width:min(220px,46vw);object-fit:contain}
.hd-logo b{font-family:var(--font-display);font-size:24px;line-height:1.1;font-weight:700;white-space:nowrap}
.hd-nav{grid-area:nav;display:flex;gap:6px 26px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.hd-nav::-webkit-scrollbar{display:none}
.hd-nav a{white-space:nowrap;font-weight:500;font-size:14px;padding:6px 0;color:var(--text);opacity:.82;position:relative;transition:opacity .15s}
.hd-nav a:hover,.hd-nav a[aria-current="true"]{opacity:1}
.hd-nav a::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1.5px;background:currentColor;transform:scaleX(0);transition:transform .25s}
.hd-nav a:hover::after,.hd-nav a[aria-current="true"]::after{transform:scaleX(1)}
.hd-search{grid-area:search;display:none}
.hd-act{grid-area:act;display:flex;align-items:center;gap:2px;justify-content:flex-end}
.ib{position:relative;min-width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r);transition:background .15s}
.ib:hover{background:var(--surface)}
.ib.txt{font-size:13px;font-weight:600;padding:0 10px}
.cnt{position:absolute;top:3px;inset-inline-end:1px;min-width:18px;height:18px;border-radius:99px;background:var(--brand);color:var(--brand-ink);
  font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;line-height:1}
[data-theme="nova"] .hd-nav a{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600}
[data-theme="nova"] .hd-logo b{font-family:var(--font-display);font-weight:900;letter-spacing:-.03em;text-transform:uppercase;font-size:26px}
[data-theme="nova"] .cnt{background:var(--accent);color:#fff}

/* aurum: الشعار بالمنتصف والقائمة أسفله */
[data-theme="aurum"] .hd-in{grid-template-columns:1fr auto 1fr;grid-template-areas:"lang logo act" "nav nav nav";padding-top:14px;gap:6px 20px}
[data-theme="aurum"] .hd-lang{grid-area:lang;display:flex}
[data-theme="aurum"] .hd-nav{border-top:1px solid var(--line);padding:10px 0;gap:6px 34px;margin-inline:calc(-1 * clamp(14px,3vw,40px));padding-inline:clamp(14px,3vw,40px)}
[data-theme="aurum"] .hd-nav a{text-transform:uppercase;letter-spacing:.2em;font-size:11.5px;font-weight:500}
[data-theme="aurum"] .hd-logo{justify-content:center}
[data-theme="aurum"] .hd-logo b{font-weight:600;letter-spacing:.06em;font-size:28px}
[data-theme="aurum"] .hd{background:color-mix(in srgb,var(--bg) 96%,transparent)}
.hd-lang{display:none}

/* pulse: بحث كبير بالمنتصف + شريط تصنيفات */
[data-theme="pulse"] .hd{background:#fff}
[data-theme="pulse"] .hd-in{grid-template-columns:auto minmax(220px,1fr) auto;grid-template-areas:"logo search act" "nav nav nav";gap:0 24px;padding-top:12px}
[data-theme="pulse"] .hd-search{display:flex}
[data-theme="pulse"] .hd-nav{justify-content:flex-start;padding:10px 0 12px;gap:8px}
[data-theme="pulse"] .hd-nav a{padding:7px 16px;border-radius:99px;background:var(--surface);font-size:13.5px;opacity:1;font-weight:500}
[data-theme="pulse"] .hd-nav a::after{display:none}
[data-theme="pulse"] .hd-nav a:hover,[data-theme="pulse"] .hd-nav a[aria-current="true"]{background:var(--brand);color:#fff}
[data-theme="pulse"] .hd-logo b{font-weight:700;letter-spacing:-.02em}
.sbar{position:relative;display:flex;align-items:center;gap:10px;width:100%;max-width:640px;margin:0 auto;height:46px;padding:0 16px;
  border-radius:99px;background:var(--surface);color:var(--muted);text-align:start;transition:background .15s,box-shadow .15s}
.sbar:hover{background:var(--surface-2)}

/* bloom: هيدر عائم */
[data-theme="bloom"] .hd{top:12px;margin:12px clamp(10px,2vw,28px) 0;border:0;border-radius:99px;background:rgba(255,255,255,.86);
  box-shadow:0 10px 34px rgba(94,38,76,.12)}
[data-theme="bloom"] .hd-in{padding-inline:clamp(16px,2vw,28px)}
[data-theme="bloom"] .hd-nav a{font-weight:600;font-size:14px}
[data-theme="bloom"] .hd-nav a::after{height:8px;bottom:-2px;background:color-mix(in srgb,var(--accent) 35%,transparent);z-index:-1;border-radius:6px}
[data-theme="bloom"] .hd-logo b{font-size:28px}
[data-theme="bloom"] .ib{border-radius:99px}

/* atelier: مينيمال */
[data-theme="atelier"] .hd-in{grid-template-columns:auto 1fr auto}
[data-theme="atelier"] .hd-nav{justify-content:flex-end;padding-inline-end:12px}
[data-theme="atelier"] .hd-nav a{font-size:13.5px;font-weight:400}
[data-theme="atelier"] .hd-logo b{font-weight:500;letter-spacing:-.02em}

@media(max-width:900px){
  .hd-in,[data-theme] .hd-in{grid-template-columns:44px 1fr auto;grid-template-areas:"menu logo act";min-height:62px;padding-top:0}
  .hd-menu{display:grid}
  .hd-nav,[data-theme] .hd-nav{display:none}
  [data-theme="pulse"] .hd-search{display:none}
  .hd-logo,[data-theme] .hd-logo{justify-content:center}
  [data-theme="aurum"] .hd-lang{display:none}
  .hd-act .ib.lang{display:none}
  .hd-logo img{height:min(var(--logo-h,44px),40px)}
}

/* ============================================================
   الهيرو
   ============================================================ */
.hero{position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;min-width:0}
.s-img,.s-img img{width:100%;height:100%}
.s-img img{object-fit:cover;object-position:center}
.s-img.fb{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 40%,var(--surface)))}
.s-txt h2{font-family:var(--font-display);margin:0 0 14px;line-height:1.05}
.s-txt p{margin:0 0 24px;font-size:clamp(15px,1.5vw,18px)}
.s-idx{position:absolute;z-index:3;font-size:12px;font-weight:600;letter-spacing:.14em}
.dots{display:flex;gap:8px;justify-content:center;padding:16px 0 0}
.dot{width:8px;height:8px;border-radius:99px;background:var(--line);transition:.3s}
.dot.on{width:28px;background:var(--brand)}
.arw{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:var(--bg);color:var(--text);
  display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:4;transition:transform .2s}
.arw:hover{transform:translateY(-50%) scale(1.06)}
.arw.p{inset-inline-start:16px}.arw.n{inset-inline-end:16px}
.arw svg{width:20px;height:20px}
.arw.p svg{transform:scaleX(-1)}
[dir="rtl"] .arw.p svg{transform:none}
[dir="rtl"] .arw.n svg{transform:scaleX(-1)}
@media(max-width:700px){.arw{display:none}}

/* nova: صورة كاملة وعنوان ضخم */
[data-theme="nova"] .slide{height:clamp(520px,86vh,860px);color:#fff}
[data-theme="nova"] .s-img{position:absolute;inset:0}
[data-theme="nova"] .s-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.66),rgba(0,0,0,0) 58%)}
[data-theme="nova"] .s-txt{position:absolute;inset-inline:0;bottom:0;z-index:2;padding:0 clamp(16px,3vw,40px) clamp(28px,6vh,64px);max-width:var(--maxw);margin:0 auto}
[data-theme="nova"] .s-txt h2{font-size:clamp(46px,10.5vw,168px);font-weight:900;text-transform:uppercase;letter-spacing:-.045em;line-height:.9;margin-bottom:20px}
[data-theme="nova"] .s-txt p{text-transform:uppercase;letter-spacing:.16em;font-size:12.5px;font-weight:600;margin-bottom:22px}
[data-theme="nova"] .s-txt .btn{background:#fff;color:#000;border-color:#fff}
[data-theme="nova"] .s-idx{inset-inline-end:clamp(16px,3vw,40px);top:20px;color:#fff}
[data-theme="nova"] .dots{position:absolute;inset-inline-start:clamp(16px,3vw,40px);top:24px;padding:0}
[data-theme="nova"] .dot{background:rgba(255,255,255,.4);border-radius:0;height:3px;width:26px}
[data-theme="nova"] .dot.on{background:#fff;width:46px}
[data-theme="nova"] .arw{border-radius:0}
@media(max-width:700px){[data-theme="nova"] .slide{height:min(78vh,640px)}}

/* aurum: صورة مع إطار ذهبي داخلي ونص بالمنتصف */
[data-theme="aurum"] .slide{height:clamp(500px,80vh,780px);color:var(--text);text-align:center}
[data-theme="aurum"] .s-img{position:absolute;inset:0}
[data-theme="aurum"] .s-img::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 90% at 50% 50%,rgba(13,21,36,.45),rgba(13,21,36,.78))}
[data-theme="aurum"] .slide::after{content:"";position:absolute;inset:clamp(12px,2vw,26px);border:1px solid rgba(214,184,122,.55);z-index:2;pointer-events:none}
[data-theme="aurum"] .s-txt{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 clamp(28px,8vw,120px)}
[data-theme="aurum"] .s-txt::before{content:"";width:1px;height:54px;background:var(--brand);margin-bottom:22px}
[data-theme="aurum"] .s-txt h2{font-size:clamp(34px,6.4vw,84px);font-weight:500;max-width:14em}
[data-theme="aurum"] .s-txt p{color:#E7DFCE;max-width:34em;font-weight:300;letter-spacing:.03em}
[data-theme="aurum"] .s-txt .btn{background:transparent;color:var(--brand);border-color:var(--brand)}
[data-theme="aurum"] .s-txt .btn:hover{background:var(--brand);color:var(--brand-ink);filter:none}
[data-theme="aurum"] .s-idx{display:none}
[data-theme="aurum"] .dots{position:absolute;inset-inline:0;bottom:34px;padding:0;z-index:4}
[data-theme="aurum"] .dot{background:rgba(255,255,255,.35);border-radius:0;transform:rotate(45deg);width:7px;height:7px}
[data-theme="aurum"] .dot.on{background:var(--brand);width:7px}
[data-theme="aurum"] .arw{background:transparent;color:var(--brand);border:1px solid rgba(214,184,122,.6);box-shadow:none;border-radius:0}

/* pulse: كتلة تدرّج داكنة، نص يسار وصورة يمين بتلاشي */
[data-theme="pulse"] .hero>.wrap{padding-top:clamp(12px,2vw,24px)}
[data-theme="pulse"] .slides{border-radius:var(--r-lg)}
[data-theme="pulse"] .slide{min-height:clamp(300px,36vw,460px);display:grid;grid-template-columns:1.05fr 1fr;background:linear-gradient(115deg,#0B1226 0%,#15245E 58%,#2456FF 150%);color:#fff;overflow:hidden}
[data-theme="pulse"] .s-txt{display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,4vw,64px);z-index:2}
[data-theme="pulse"] .s-txt h2{font-size:clamp(28px,4.4vw,58px);font-weight:700;letter-spacing:-.03em}
[data-theme="pulse"] .s-txt p{color:rgba(255,255,255,.74)}
[data-theme="pulse"] .s-txt .btn{background:#fff;color:#0E1526;border-color:#fff;align-self:flex-start}
[data-theme="pulse"] .s-img{position:relative;order:2;-webkit-mask-image:linear-gradient(to left,#000 55%,transparent);mask-image:linear-gradient(to left,#000 55%,transparent)}
[dir="rtl"][data-theme="pulse"] .s-img{-webkit-mask-image:linear-gradient(to right,#000 55%,transparent);mask-image:linear-gradient(to right,#000 55%,transparent)}
[data-theme="pulse"] .slide.notxt{display:block}
[data-theme="pulse"] .slide.notxt .s-img{position:absolute;inset:0;-webkit-mask-image:none;mask-image:none}
[data-theme="pulse"] .s-idx{display:none}
[data-theme="pulse"] .dots{position:absolute;inset-inline-start:clamp(24px,4vw,64px);bottom:22px;padding:0}
[data-theme="pulse"] .dot{background:rgba(255,255,255,.3)}
[data-theme="pulse"] .dot.on{background:#fff}
@media(max-width:760px){[data-theme="pulse"] .slide{grid-template-columns:1fr}
  [data-theme="pulse"] .s-img{order:0;height:190px;-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent);mask-image:linear-gradient(to bottom,#000 60%,transparent)!important}
  [dir="rtl"][data-theme="pulse"] .s-img{-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent);mask-image:linear-gradient(to bottom,#000 60%,transparent)}
  [data-theme="pulse"] .dots{bottom:14px}}

/* bloom: كتلة وردية بتدرّج وصورة بقوس */
[data-theme="bloom"] .hero>.wrap{padding-top:clamp(14px,2vw,26px)}
[data-theme="bloom"] .slides{border-radius:44px}
[data-theme="bloom"] .slide{min-height:clamp(340px,40vw,520px);display:grid;grid-template-columns:1.1fr 1fr;align-items:center;
  background:linear-gradient(120deg,#FFE3D8 0%,#FFD0DD 55%,#E9D5FA 110%);color:var(--text);padding:clamp(16px,3vw,40px);gap:clamp(12px,3vw,40px)}
[data-theme="bloom"] .s-txt{padding-inline:clamp(8px,3vw,40px)}
[data-theme="bloom"] .s-txt h2{font-size:clamp(34px,5.4vw,74px);color:var(--brand);font-weight:400;letter-spacing:-.01em}
[data-theme="bloom"] .s-txt p{color:#6E4A66}
[data-theme="bloom"] .s-img{order:2;height:clamp(240px,32vw,440px);border-radius:999px 999px 36px 36px;overflow:hidden;box-shadow:0 20px 50px rgba(94,38,76,.22);
  border:8px solid rgba(255,255,255,.75)}
[data-theme="bloom"] .slide.notxt{display:block;padding:0}
[data-theme="bloom"] .slide.notxt .s-img{position:absolute;inset:0;border:0;border-radius:0;height:100%;box-shadow:none}
[data-theme="bloom"] .s-idx{display:none}
[data-theme="bloom"] .dots{position:absolute;inset-inline-start:clamp(28px,5vw,80px);bottom:24px;padding:0}
[data-theme="bloom"] .dot{background:rgba(94,38,76,.22)}
[data-theme="bloom"] .dot.on{background:var(--brand)}
[data-theme="bloom"] .arw{background:#fff}
@media(max-width:760px){[data-theme="bloom"] .slide{grid-template-columns:1fr}
  [data-theme="bloom"] .s-img{order:0;height:220px}
  [data-theme="bloom"] .slides{border-radius:30px}}

/* atelier: نص كبير خفيف + صورة بلا إطار */
[data-theme="atelier"] .hero>.wrap{padding-top:0}
[data-theme="atelier"] .slide{min-height:clamp(420px,52vw,640px);display:grid;grid-template-columns:5fr 7fr;background:var(--surface)}
[data-theme="atelier"] .s-txt{display:flex;flex-direction:column;justify-content:center;padding:clamp(24px,5vw,80px)}
[data-theme="atelier"] .s-txt h2{font-size:clamp(34px,5vw,72px);font-weight:300;letter-spacing:-.035em}
[data-theme="atelier"] .s-txt p{color:var(--muted)}
[data-theme="atelier"] .s-txt .btn{align-self:flex-start}
[data-theme="atelier"] .s-img{order:2}
[data-theme="atelier"] .slide.notxt{display:block}
[data-theme="atelier"] .slide.notxt .s-img{position:absolute;inset:0}
[data-theme="atelier"] .s-idx{inset-inline-start:clamp(24px,5vw,80px);bottom:28px;color:var(--muted)}
[data-theme="atelier"] .dots{display:none}
@media(max-width:800px){[data-theme="atelier"] .slide{grid-template-columns:1fr}[data-theme="atelier"] .s-img{order:0;height:260px}}

/* ============================================================
   شريط المزايا + عناوين الأقسام
   ============================================================ */
.usp{padding:clamp(18px,2.6vw,30px) 0}
.usp-in{display:grid;gap:14px 24px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.usp-i{display:flex;align-items:center;gap:14px;font-size:13.5px}
.usp-i .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--text)}
.usp-i b{display:block;font-size:14px;font-weight:600;line-height:1.3}
[data-theme="aurum"] .usp-i .ic{background:transparent;border:1px solid var(--line);color:var(--brand)}
[data-theme="pulse"] .usp-i .ic{background:#E7EDFF;color:var(--brand);border-radius:14px}
[data-theme="bloom"] .usp-i .ic{background:#FFE3D8;color:var(--brand)}
[data-theme="nova"] .usp-i .ic,[data-theme="atelier"] .usp-i .ic{border-radius:0}
[data-theme="nova"] .usp,[data-theme="atelier"] .usp{border-bottom:1px solid var(--line)}

.sec{padding:clamp(34px,6vw,84px) 0 0}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:clamp(18px,3vw,36px)}
.sh h2{font-family:var(--font-display);margin:0;font-size:clamp(26px,3.6vw,46px);line-height:1.08;letter-spacing:-.02em}
.sh .sub{color:var(--muted);margin:6px 0 0;max-width:46ch}
.sh .link{font-size:13.5px}
[data-theme="nova"] .sh h2{text-transform:uppercase;font-weight:900;letter-spacing:-.04em}
[data-theme="aurum"] .sh{flex-direction:column;align-items:center;text-align:center;gap:6px}
[data-theme="aurum"] .sh h2{font-weight:500;letter-spacing:0}
[data-theme="aurum"] .sh h2::after{content:"◆";display:block;color:var(--brand);font-size:11px;margin-top:12px;letter-spacing:0}
[data-theme="aurum"] .sh .link{margin-top:6px;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
[data-theme="pulse"] .sh h2{font-weight:700;letter-spacing:-.03em;font-size:clamp(22px,2.6vw,32px)}
[data-theme="bloom"] .sh h2{font-weight:400}
[data-theme="atelier"] .sh h2{font-weight:300;letter-spacing:-.03em}

/* ============================================================
   بلاطات التصنيفات
   ============================================================ */
.ct{display:grid;gap:var(--gap);grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.ct{grid-template-columns:repeat(var(--n,4),minmax(0,1fr))}}
.tile{position:relative;display:block;overflow:hidden;background:var(--surface);aspect-ratio:3/4;text-align:start}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease,ease)}
.tile:hover img{transform:scale(1.06)}
.tile .cap{position:absolute;inset-inline:0;bottom:0;padding:18px;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.62),transparent)}
.tile .cap b{display:block;font-family:var(--font-display);font-size:clamp(17px,1.8vw,24px);line-height:1.15}
.tile .cap small{opacity:.8;font-size:12px}
.tile .init{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:64px;color:var(--muted);opacity:.4}
[data-theme="nova"] .tile .cap b{text-transform:uppercase;font-weight:900;letter-spacing:-.02em}
/* aurum: صورة بإطار ذهبي وعنوان تحتها */
[data-theme="aurum"] .ct{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){[data-theme="aurum"] .ct{grid-template-columns:repeat(var(--n,3),1fr)}}
[data-theme="aurum"] .tile{aspect-ratio:4/5;background:var(--surface);outline:1px solid var(--line);outline-offset:-10px}
[data-theme="aurum"] .tile::after{content:"";position:absolute;inset:10px;border:1px solid rgba(214,184,122,.5);pointer-events:none}
[data-theme="aurum"] .tile .cap{text-align:center;padding-bottom:26px}
[data-theme="aurum"] .tile .cap b{font-weight:500;letter-spacing:.04em}
/* pulse: bento */
[data-theme="pulse"] .ct{grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(130px,1fr)}
@media(min-width:760px){[data-theme="pulse"] .ct{grid-template-columns:repeat(4,1fr);grid-auto-rows:170px}
  [data-theme="pulse"] .tile:first-child{grid-row:span 2;grid-column:span 2}}
[data-theme="pulse"] .tile{aspect-ratio:auto;border-radius:var(--r-lg);background:linear-gradient(135deg,#E7EDFF,#F7F9FF);border:1px solid var(--line)}
[data-theme="pulse"] .tile img{object-fit:contain;padding:14px 14px 40px}
[data-theme="pulse"] .tile .cap{background:none;color:var(--text);padding:14px 16px}
[data-theme="pulse"] .tile .cap b{font-weight:700;font-size:16px}
/* bloom: ألوان باستيل بدوائر */
[data-theme="bloom"] .tile{aspect-ratio:1/1.12;border-radius:var(--r-lg);background:var(--pastel,#FFE3D8);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0}
[data-theme="bloom"] .tile:nth-child(4n+1){--pastel:#FFE3D8}[data-theme="bloom"] .tile:nth-child(4n+2){--pastel:#EADCF8}
[data-theme="bloom"] .tile:nth-child(4n+3){--pastel:#DDF3E8}[data-theme="bloom"] .tile:nth-child(4n+4){--pastel:#FFF0BF}
[data-theme="bloom"] .tile img{position:relative;inset:auto;width:72%;height:auto;aspect-ratio:1;border-radius:50%;margin:18px auto 0;border:6px solid rgba(255,255,255,.8)}
[data-theme="bloom"] .tile .cap{position:relative;background:none;color:var(--brand);text-align:center;padding:12px 10px 20px}
[data-theme="bloom"] .tile .cap b{font-weight:400}
/* atelier: قائمة نصية كبيرة */
[data-theme="atelier"] .ct{display:flex;flex-wrap:wrap;gap:6px 34px;border-block:1px solid var(--line);padding:clamp(18px,3vw,32px) 0}
[data-theme="atelier"] .tile{aspect-ratio:auto;background:none;overflow:visible}
[data-theme="atelier"] .tile img,[data-theme="atelier"] .tile .init{display:none}
[data-theme="atelier"] .tile .cap{position:static;background:none;color:var(--text);padding:0;display:flex;align-items:baseline;gap:8px}
[data-theme="atelier"] .tile .cap b{font-size:clamp(26px,4vw,52px);font-weight:300;letter-spacing:-.03em;transition:color .2s}
[data-theme="atelier"] .tile:hover .cap b{color:var(--accent)}

/* ============================================================
   Hot Sale + الصفوف الأفقية
   ============================================================ */
.hot{margin-top:clamp(34px,6vw,84px);padding:clamp(22px,3.4vw,44px) 0}
[data-theme="nova"] .hot{background:#0B0B0B;color:#fff;--surface:#1a1a1a;--line:#333;--muted:#aaa;--text:#fff}
[data-theme="aurum"] .hot{background:var(--surface);border-block:1px solid var(--line)}
[data-theme="pulse"] .hot{background:linear-gradient(115deg,#0B1226,#15245E);color:#fff;--text:#fff;--muted:#aebbe0;--surface:#1c2c6b;--line:#2b3c80}
[data-theme="bloom"] .hot{background:linear-gradient(120deg,#FFD9E1,#FFE9D6)}
[data-theme="atelier"] .hot{background:var(--surface)}
.hot .sh{margin-bottom:20px}
.cd{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13px}
.cd .u{min-width:54px;text-align:center;padding:7px 8px;background:var(--bg);color:var(--text);border-radius:var(--r);line-height:1.1;border:1px solid var(--line)}
.cd .u b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-family:var(--font-display)}
.cd .u small{font-size:10.5px;color:var(--muted);font-weight:500}
[data-theme="nova"] .hot .cd .u,[data-theme="pulse"] .hot .cd .u{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}
[data-theme="pulse"] .hot .card,[data-theme="nova"] .hot .card{color:var(--text)}
[data-theme="pulse"] .hot .card{background:#fff;--text:#0E1526;--muted:#5B6577;--surface:#EEF1F7;--line:#E1E6EF}
.flame{width:.8em;height:.8em;fill:var(--accent);flex:none;margin-inline-end:8px}
.hrow{display:flex;gap:var(--gap);overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 14px;scrollbar-width:thin}
.hrow .card{flex:0 0 clamp(158px,42vw,250px);scroll-snap-align:start}
[data-theme="pulse"] .hrow .card{flex-basis:clamp(190px,46vw,270px)}

/* ============================================================
   شريط الأدوات + الفلاتر + الشبكة
   ============================================================ */
.tb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:clamp(14px,2vw,24px)}
.tb .cntx{color:var(--muted);font-size:13.5px;margin-inline-end:auto}
.tb select{height:44px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:0 14px;min-width:150px;font-weight:500}
[data-theme="pulse"] .tb select,[data-theme="pulse"] .tb .btn{background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:99px;background:var(--surface);font-size:13px;font-weight:500}
.chip button{font-size:16px;line-height:1;opacity:.6}
.shopl{display:block}
.flt{position:fixed;inset-block:0;inset-inline-end:0;width:min(400px,100vw);background:var(--bg);color:var(--text);z-index:90;display:none;flex-direction:column;box-shadow:var(--shadow)}
.flt.on{display:flex;animation:slide .26s ease}
@keyframes slide{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
[dir="rtl"] .flt.on{animation-name:slideR}
@keyframes slideR{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
.flt .fh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.flt .fh h3{margin:0;font-family:var(--font-display);font-size:22px}
.flt .fb{flex:1;overflow:auto;padding:6px 20px 20px}
.flt .ff{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
.fg{padding:18px 0;border-bottom:1px solid var(--line)}
.fg h4{margin:0 0 12px;font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.fopts{display:flex;flex-wrap:wrap;gap:8px}
.fo{min-width:44px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);display:grid;place-items:center;font-size:13.5px;font-weight:500;background:var(--bg);transition:.15s}
.fo:hover{border-color:var(--text)}
.fo[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.sw-c{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);position:relative;padding:0}
.sw-c[aria-pressed="true"]{outline:2px solid var(--text);outline-offset:2px}
.sw-c.light::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.frow{display:flex;gap:10px;align-items:center}
.frow input[type=number]{width:100%;height:42px;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:0 12px}
.fchk{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.fchk input{width:18px;height:18px;accent-color:var(--brand)}
/* pulse + atelier: الفلاتر كعمود ثابت على الشاشات الكبيرة */
@media(min-width:1024px){
  [data-flt="side"] .shopl{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(24px,3vw,48px);align-items:start}
  [data-flt="side"] .flt{z-index:2;position:sticky;top:calc(var(--hd-h) + 60px);inset:auto;width:auto;display:flex;box-shadow:none;background:transparent;max-height:calc(100vh - 140px);animation:none}
  [data-flt="side"] .flt .fh,[data-flt="side"] .flt .ff{display:none}
  [data-flt="side"] .flt .fb{padding:0;overflow:auto}
  [data-flt="side"] .fbtn{display:none}
  [data-theme="pulse"] .flt{background:#fff;border-radius:var(--r-lg);border:1px solid var(--line);padding:6px 18px}
}

.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap)}
@media(min-width:720px){.grid{grid-template-columns:repeat(var(--cols-m),minmax(0,1fr))}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(var(--cols-d),minmax(0,1fr))}}
[data-flt="side"] .grid{--cols-d:3}

/* ============================================================
   كرت المنتج
   ============================================================ */
.card{position:relative;min-width:0;display:flex;flex-direction:column;cursor:pointer;text-align:start}
.ph{position:relative;overflow:hidden;aspect-ratio:var(--card-ar);background:var(--surface)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:var(--img-fit);transition:opacity .45s ease,transform .8s var(--ease,ease)}
.ph .im2{opacity:0}
.card:hover .ph .im2{opacity:1}
.card:hover .ph img:only-of-type{transform:scale(1.045)}
.ph .noimg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:clamp(34px,6vw,60px);color:var(--muted);opacity:.5}
.bds{position:absolute;top:10px;inset-inline-start:10px;z-index:3;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bd{font-size:11px;font-weight:700;padding:4px 9px;line-height:1.2;background:#0B0B0B;color:#fff;letter-spacing:.06em}
.bd.sale{background:var(--accent);color:var(--accent-ink)}
.bd.new{background:#0B0B0B;color:#fff}
.bd.so{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font-size:13.5px;letter-spacing:.08em;z-index:3;text-transform:uppercase}
.wl{position:absolute;top:8px;inset-inline-end:8px;z-index:4;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);color:#111;
  display:grid;place-items:center;transition:transform .2s,background .2s;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.wl:hover{transform:scale(1.1)}
.wl svg{width:19px;height:19px}
.wl[aria-pressed="true"]{color:#E11D48}
.wl[aria-pressed="true"] svg{fill:currentColor}
.qa{position:absolute;z-index:4;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;transition:.25s var(--ease,ease)}
.cb{padding:14px 0 0;min-width:0;display:flex;flex-direction:column;gap:5px;flex:1}
.cb .br{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.cb h3{margin:0;font-size:14.5px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr b{font-weight:700;font-size:15px}
.pr s{color:var(--muted);font-size:13px}
.pr .off{font-size:12px;font-weight:700;color:var(--accent)}
.stars{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.stars svg{width:14px;height:14px;fill:#F5A623;stroke:none}
.stars .em svg{fill:var(--line)}
.sws{display:flex;gap:5px;align-items:center;margin-top:2px}
.sws i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.18);display:block}
.sws small{font-size:11.5px;color:var(--muted);margin-inline-start:2px}
.chips-s{display:flex;gap:5px;flex-wrap:wrap}
.chips-s span{font-size:11px;padding:2px 8px;background:var(--surface);color:var(--muted);border-radius:99px;font-weight:500}
.qsz{position:absolute;inset-inline:0;bottom:0;z-index:4;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:10px;
  background:rgba(255,255,255,.94);transform:translateY(101%);transition:transform .3s var(--ease,ease)}
.qsz button{min-width:34px;height:32px;padding:0 8px;font-size:12px;font-weight:600;color:#111;border:1px solid #ddd;background:#fff}
.qsz button:hover{background:#111;color:#fff;border-color:#111}
.qsz button[disabled]{opacity:.35;text-decoration:line-through;pointer-events:none}
@media(hover:hover){.card:hover .qsz{transform:none}}
@media(hover:none){.qsz{display:none}}

/* nova */
[data-theme="nova"] .cb{padding-top:12px;gap:3px}
[data-theme="nova"] .cb h3{font-size:13.5px;font-weight:500}
[data-theme="nova"] .pr b{font-size:13.5px}
[data-theme="nova"] .bd{text-transform:uppercase;font-size:10.5px}
[data-theme="nova"] .wl{border-radius:0;background:#fff}
[data-theme="nova"] .qa{display:none}
/* aurum */
[data-theme="aurum"] .ph{background:var(--surface)}
[data-theme="aurum"] .ph::after{content:"";position:absolute;inset:0;border:1px solid transparent;transition:border-color .3s;pointer-events:none;z-index:2}
[data-theme="aurum"] .card:hover .ph::after{border-color:rgba(214,184,122,.6);inset:8px}
[data-theme="aurum"] .cb{align-items:center;text-align:center;padding-top:16px}
[data-theme="aurum"] .cb h3{font-family:var(--font-display);font-size:18px;font-weight:500}
[data-theme="aurum"] .pr{justify-content:center}
[data-theme="aurum"] .pr b{color:var(--brand);font-weight:500;letter-spacing:.06em}
[data-theme="aurum"] .bd{background:transparent;border:1px solid var(--brand);color:var(--brand);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:10px}
[data-theme="aurum"] .bd.sale{border-color:var(--accent);color:var(--accent);background:transparent}
[data-theme="aurum"] .wl{background:rgba(13,21,36,.72);color:var(--brand);border-radius:0}
[data-theme="aurum"] .sws{justify-content:center}
[data-theme="aurum"] .qa{inset-inline:14px;bottom:14px;height:42px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;transform:translateY(160%);opacity:0}
@media(hover:hover){[data-theme="aurum"] .card:hover .qa{transform:none;opacity:1}}
[data-theme="aurum"] .qsz{background:rgba(13,21,36,.94)}
[data-theme="aurum"] .qsz button{background:transparent;border-color:var(--line);color:var(--text)}
/* pulse */
[data-theme="pulse"] .card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;transition:transform .25s,box-shadow .25s,border-color .25s}
[data-theme="pulse"] .card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:transparent}
[data-theme="pulse"] .ph{border-radius:calc(var(--r-lg) - 6px);background:linear-gradient(160deg,#F4F7FD,#E9EEF8)}
[data-theme="pulse"] .ph img{padding:16px}
[data-theme="pulse"] .cb{padding:12px 6px 6px;gap:6px}
[data-theme="pulse"] .cb h3{font-weight:600;font-size:14.5px}
[data-theme="pulse"] .cb .br{color:var(--brand)}
[data-theme="pulse"] .pr b{font-size:18px;font-family:var(--font-display);letter-spacing:-.02em}
[data-theme="pulse"] .bd{border-radius:8px;letter-spacing:.02em}
[data-theme="pulse"] .bd.new{background:var(--brand);color:#fff}
[data-theme="pulse"] .wl{border-radius:12px}
[data-theme="pulse"] .qa{position:static;margin:8px 0 0;height:44px;border-radius:12px;font-weight:600;font-size:13.5px;gap:8px;display:flex;align-items:center;justify-content:center;width:100%}

/* bloom */
[data-theme="bloom"] .card{background:#fff;border-radius:var(--r-lg);padding:10px;box-shadow:0 8px 28px rgba(94,38,76,.07);transition:transform .3s,box-shadow .3s}
[data-theme="bloom"] .card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
[data-theme="bloom"] .ph{border-radius:calc(var(--r-lg) - 10px);background:var(--pastel,#FFE3D8)}
[data-theme="bloom"] .card:nth-child(4n+1) .ph{--pastel:#FFE3D8}[data-theme="bloom"] .card:nth-child(4n+2) .ph{--pastel:#EADCF8}
[data-theme="bloom"] .card:nth-child(4n+3) .ph{--pastel:#DDF3E8}[data-theme="bloom"] .card:nth-child(4n+4) .ph{--pastel:#FFF0BF}
[data-theme="bloom"] .cb{padding:14px 10px 8px;text-align:center;align-items:center}
[data-theme="bloom"] .cb h3{font-weight:600;font-size:15px}
[data-theme="bloom"] .pr{justify-content:center}
[data-theme="bloom"] .pr b{color:var(--brand);font-size:17px}
[data-theme="bloom"] .bd{border-radius:99px;padding:4px 11px}
[data-theme="bloom"] .sws{justify-content:center}
[data-theme="bloom"] .qa{inset-inline-end:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(255,111,134,.4)}
[data-theme="bloom"] .qa:hover{transform:scale(1.1) rotate(90deg)}
/* atelier */
[data-theme="atelier"] .cb{padding-top:14px;gap:4px}
[data-theme="atelier"] .cb h3{font-weight:400;font-size:14.5px}
[data-theme="atelier"] .pr b{font-weight:400}
[data-theme="atelier"] .bd{background:var(--bg);color:var(--text);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px}
[data-theme="atelier"] .bd.sale{background:var(--accent);color:#fff}
[data-theme="atelier"] .wl{background:transparent;box-shadow:none;color:var(--text)}
[data-theme="atelier"] .qa{inset-inline:0;bottom:0;height:46px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transform:translateY(101%)}
@media(hover:hover){[data-theme="atelier"] .card:hover .qa{transform:none}}
@media(hover:none){.qa{transform:none!important;opacity:1!important}[data-theme="nova"] .qa{display:none}}
.card.sold .qa{display:none}
[data-theme="pulse"] .card.sold .qa{display:grid}
.empty{grid-column:1/-1;text-align:center;padding:60px 14px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:18px;margin-bottom:4px}

/* ============================================================
   صفحة المنتج
   ============================================================ */
.ov{position:fixed;inset:0;z-index:80;display:none}
.ov.on{display:block}
.ov .bk{position:absolute;inset:0;background:rgba(8,10,14,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.pvw{position:fixed;inset:0;z-index:85;background:var(--bg);overflow:auto;display:none;overscroll-behavior:contain}
.pvw.on{display:block;animation:fadeup .3s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.pv-top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pv-top .wrap{display:flex;align-items:center;gap:8px;min-height:60px}
.pv-top .crumb{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-top .crumb b{color:var(--text);font-weight:600}
.pv{display:grid;gap:clamp(20px,4vw,64px);padding-block:clamp(18px,3vw,44px);grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.pv{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.gal{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.gal{grid-template-columns:78px minmax(0,1fr)}.gal .gth{order:0;flex-direction:column;overflow:auto;max-height:640px}.gal .gm{order:1}
  .pv-info{position:sticky;top:84px}}
.gm{position:relative;aspect-ratio:var(--pv-ar,4/5);background:var(--surface);overflow:hidden;cursor:zoom-in}
[data-theme="pulse"] .gm{--pv-ar:1/1;border-radius:var(--r-lg)}
[data-theme="bloom"] .gm{border-radius:var(--r-lg)}
.gm img,.gm iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:var(--img-fit,cover)}
[data-theme="pulse"] .gm img{padding:24px}
.gm .vp{position:absolute;inset:0;display:grid;place-items:center;background:#000}
.gm .vp img{opacity:.8;object-fit:cover;padding:0}
.play{position:relative;z-index:2;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.96);display:grid;place-items:center;box-shadow:0 10px 34px rgba(0,0,0,.4)}
.play svg{width:30px;height:30px;fill:#111;stroke:none;margin-inline-start:4px}
.gth{display:flex;gap:8px;overflow-x:auto;order:1;scrollbar-width:thin}
.gth button{flex:none;width:72px;height:72px;overflow:hidden;background:var(--surface);border:2px solid transparent;position:relative;border-radius:var(--r)}
.gth button[aria-pressed="true"]{border-color:var(--text)}
.gth img{width:100%;height:100%;object-fit:cover}
.gth .vt{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45)}
.gth .vt svg{width:22px;height:22px;fill:#fff;stroke:none}
.pv-info h1{font-family:var(--font-display);margin:6px 0 10px;font-size:clamp(26px,3.6vw,44px);line-height:1.1;letter-spacing:-.02em}
[data-theme="nova"] .pv-info h1{text-transform:uppercase;font-weight:900;letter-spacing:-.035em}
[data-theme="aurum"] .pv-info h1{font-weight:500}
[data-theme="atelier"] .pv-info h1{font-weight:300}
.pv-info .br{font-size:12.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.pv-pr{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:14px 0 4px}
.pv-pr b{font-size:clamp(26px,3vw,34px);font-family:var(--font-display);font-weight:700;letter-spacing:-.02em}
.pv-pr s{color:var(--muted);font-size:18px}
.pv-pr .save{background:var(--accent);color:var(--accent-ink);font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:var(--r-btn)}
.saleend{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:8px}
.pv-sd{color:var(--muted);margin:12px 0 18px}
.opt{margin:18px 0}
.opt .oh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:13.5px}
.opt .oh b{font-weight:700}
.opt .oh a,.opt .oh button{color:var(--muted);text-decoration:underline;font-size:12.5px}
.szs{display:flex;flex-wrap:wrap;gap:8px}
.sz{min-width:52px;height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:var(--r);display:grid;place-items:center;font-weight:600;font-size:14px;background:var(--bg);transition:.15s;position:relative}
.sz:hover{border-color:var(--text)}
.sz[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.sz[disabled]{color:var(--muted);opacity:.55;cursor:not-allowed;background:var(--surface);overflow:hidden}
.sz[disabled]::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--muted) 50%,transparent calc(50% + 1px))}
.sz small{position:absolute;bottom:2px;font-size:9px;color:var(--accent);font-weight:700}
.opt.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.opt .req{color:var(--danger);font-size:12.5px;margin-top:6px;display:none}
.opt.shake .req{display:block}
.cols-p{display:flex;gap:10px;flex-wrap:wrap}
.qrow{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;margin-top:22px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-btn)}
[data-theme="bloom"] .qty{border-radius:99px}
.qty button{width:44px;height:100%;min-height:46px;font-size:20px;display:grid;place-items:center}
.qty span{min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.stock-n{font-size:13px;font-weight:600;color:var(--accent);margin-top:12px}
.stock-n.ok{color:var(--ok)}
.pv-perks{margin-top:22px;border-top:1px solid var(--line)}
.pv-perks div{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.pv-perks svg{width:20px;height:20px;color:var(--muted)}
.tabs{margin-top:clamp(28px,5vw,64px);border-top:1px solid var(--line)}
.tabs .th{display:flex;gap:clamp(18px,3vw,40px);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs .th button{padding:18px 0;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs .th button[aria-selected="true"]{color:var(--text);border-color:var(--text)}
.tabs .tb2{padding:clamp(20px,3vw,36px) 0;max-width:820px}
.dl{display:grid;grid-template-columns:minmax(120px,220px) 1fr;border-top:1px solid var(--line)}
.dl>*{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl dt{color:var(--muted);font-weight:500;margin:0}
.dl dd{margin:0;font-weight:500}
.desc{white-space:pre-line;color:var(--muted);line-height:1.8}
.rv{padding:18px 0;border-bottom:1px solid var(--line)}
.rv .who{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-weight:600}
.rv .who small{color:var(--muted);font-weight:400}
.rvf{margin-top:24px;padding:20px;background:var(--surface);border-radius:var(--r-lg)}
.rvf h4{margin:0 0 12px;font-family:var(--font-display);font-size:20px}
.rate-in{display:flex;gap:4px;margin-bottom:12px}
.rate-in button{width:34px;height:34px;color:var(--line)}
.rate-in button svg{width:26px;height:26px;fill:currentColor;stroke:none}
.rate-in button.on{color:#F5A623}
.stickybar{position:fixed;inset-inline:0;bottom:0;z-index:6;display:none;gap:12px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.08)}
.stickybar b{font-size:18px;font-family:var(--font-display)}
@media(max-width:899px){.pvw.on .stickybar{display:flex}.pvw{padding-bottom:70px}}
.lb{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.94);display:none;place-items:center;cursor:zoom-out}
.lb.on{display:grid}
.lb img{max-width:96vw;max-height:94vh;object-fit:contain}

/* ============================================================
   سلة / أدراج / نوافذ
   ============================================================ */
.drawer{position:absolute;top:0;bottom:0;inset-inline-end:0;width:min(480px,100vw);background:var(--bg);color:var(--text);display:flex;flex-direction:column;animation:slide .28s ease;box-shadow:var(--shadow)}
[dir="rtl"] .drawer{animation-name:slideR}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-family:var(--font-display);font-size:24px;flex:1}
.x{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;flex:none}
.x:hover{background:var(--surface)}
.x svg{width:20px;height:20px}
.db{flex:1;overflow:auto;padding:8px 22px 20px}
.df{padding:16px 22px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.li{display:grid;grid-template-columns:78px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.li .lt{width:78px;aspect-ratio:1/1.2;background:var(--surface);overflow:hidden;border-radius:var(--r)}
.li .lt img{width:100%;height:100%;object-fit:cover}
.li h4{margin:0 0 3px;font-size:14.5px;font-weight:600;line-height:1.35}
.li .var{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.li .qty button{width:34px;min-height:34px;font-size:17px}
.li .qty{margin-top:8px;border-radius:var(--r)}
.rm{color:var(--muted);font-size:12.5px;text-decoration:underline;align-self:start}
.tot{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted);font-size:14px}
.tot.g{color:var(--text);font-weight:700;font-size:19px;padding-top:12px;margin-top:6px;border-top:1px solid var(--line)}
.fs{margin:14px 0 4px;font-size:13px}
.fs .bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:8px}
.fs .bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.cp{display:flex;gap:8px;margin:14px 0 6px}
.cp input{flex:1;min-width:0;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 14px;text-transform:uppercase}
.cp .btn{min-height:46px;padding:0 18px}
.note{font-size:13px;margin:4px 0 0}
.note.ok{color:var(--ok)}.note.no{color:var(--danger)}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:12px 14px;min-height:48px}
[data-theme="pulse"] .fld input,[data-theme="pulse"] .fld textarea,[data-theme="pulse"] .fld select{background:#fff}
.fld textarea{resize:vertical;min-height:76px}
.fld.bad input,.fld.bad textarea,.fld.bad select{border-color:var(--danger)!important}
.g2f{display:grid;gap:0 12px;grid-template-columns:1fr 1fr}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-bottom:6px}
.seg button{padding:13px 10px;border:1.5px solid var(--line);border-radius:var(--r);font-weight:600;text-align:center;background:var(--bg)}
.seg button[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.pm{display:flex;flex-direction:column;gap:8px}
.pmi{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:var(--r);text-align:start;background:var(--bg);width:100%}
.pmi[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.pmi .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;position:relative}
.pmi[aria-pressed="true"] .rd{border-color:var(--text)}
.pmi[aria-pressed="true"] .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--text)}
.pmi b{display:block;font-size:14.5px}
.pmi small{color:var(--muted);font-size:12.5px}
.pmi .lg2{margin-inline-start:auto;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--surface);color:var(--muted);letter-spacing:.04em}
.ok-box{text-align:center;padding:32px 6px}
.ok-box .tick{width:78px;height:78px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 16px}
.ok-box .tick svg{width:38px;height:38px;stroke-width:3}
.ok-box h3{font-family:var(--font-display);font-size:30px;margin:0 0 6px}
.ok-box p{color:var(--muted);margin:0 0 16px}
.manual{background:var(--surface);padding:14px;border-radius:var(--r);text-align:start;white-space:pre-line;margin-bottom:16px;font-size:14px}
.wa-btn{background:#25D366!important;border-color:#25D366!important;color:#06361A!important}
.trk{margin:18px 0}
.trk .st{display:flex;gap:0;margin:18px 0}
.trk .st i{flex:1;text-align:center;font-style:normal;font-size:11.5px;color:var(--muted);position:relative;padding-top:22px}
.trk .st i::before{content:"";position:absolute;top:4px;inset-inline:0;height:3px;background:var(--line)}
.trk .st i::after{content:"";position:absolute;top:0;inset-inline-start:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--bg)}
.trk .st i.on{color:var(--text);font-weight:600}
.trk .st i.on::before{background:var(--ok)}.trk .st i.on::after{background:var(--ok)}

/* بحث */
.srch{position:fixed;inset:0;z-index:95;background:var(--bg);display:none;flex-direction:column}
.srch.on{display:flex;animation:fadeup .25s ease}
.srch .top{border-bottom:1px solid var(--line)}
.srch .top .wrap{display:flex;align-items:center;gap:12px;min-height:74px}
.srch input{flex:1;border:0;background:none;font-size:clamp(20px,3vw,30px);font-family:var(--font-display);outline:0;min-width:0;padding:8px 0}
.srch .res{flex:1;overflow:auto;padding:20px 0}
.sr{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.sr .t{width:64px;aspect-ratio:1/1.15;background:var(--surface);overflow:hidden;border-radius:var(--r)}
.sr .t img{width:100%;height:100%;object-fit:cover}
.pop{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:min(440px,92vw);background:var(--bg);color:var(--text);
  overflow:hidden;box-shadow:var(--shadow);animation:pop2 .35s ease;border-radius:var(--r-lg)}
@keyframes pop2{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%)}}
.pop .pi{aspect-ratio:16/10;background:var(--surface)}
.pop .pi img{width:100%;height:100%;object-fit:cover}
.pop .pt{padding:26px;text-align:center}
.pop h3{font-family:var(--font-display);font-size:32px;margin:0 0 8px;line-height:1.1}
.pop p{color:var(--muted);margin:0 0 16px;white-space:pre-line}
.code{display:inline-flex;gap:10px;align-items:center;border:2px dashed var(--brand);padding:8px 8px 8px 16px;margin-bottom:18px;font-weight:700;letter-spacing:.1em;direction:ltr;border-radius:var(--r)}
.code button{background:var(--brand);color:var(--brand-ink);padding:7px 14px;font-size:12.5px;letter-spacing:0;border-radius:calc(var(--r) - 2px)}
.pop .x{position:absolute;top:10px;inset-inline-end:10px;background:var(--bg);z-index:3}
.pg{padding:26px}
.pg h3{font-family:var(--font-display);font-size:26px;margin:0 0 14px}

   التذييل
   ============================================================ */

.fgrid{display:grid;gap:34px;grid-template-columns:1fr}

.nl{display:flex;gap:8px;margin-top:6px}

.nl .btn{min-height:46px;padding:0 18px}

.paybadges{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.paybadges span{font-size:11px;font-weight:700;padding:5px 10px;border:1px solid var(--line);border-radius:6px;color:var(--muted);letter-spacing:.04em}
.ft .bt{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ft .bt a{display:inline;font-size:13px;margin:0}
.wa-fab{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;width:54px;height:54px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 10px 26px rgba(37,211,102,.45);transition:transform .2s}
.wa-fab:hover{transform:scale(1.08)}

@media(max-width:700px){.wa-fab{width:48px;height:48px}.wa-fab svg{width:26px;height:26px}}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--text);color:var(--bg);
  padding:12px 22px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.28s;z-index:130;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.reveal{animation:fadeup .6s ease both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.mq .tr{animation:none!important}}
#shop{scroll-margin-top:110px}
.hero .slide .btn{margin-top:2px}
.slide.notxt{display:block!important}
.slide.notxt .s-img{position:absolute!important;inset:0;height:100%!important}

function cleanHtml(html){
  var doc=new DOMParser().parseFromString('<body>'+String(html||''),'text/html');
  function ser(node){
    var h='';
    Array.prototype.forEach.call(node.childNodes,function(n){
      if(n.nodeType===3){ h+=esc(String(n.nodeValue).replace(/\u00a0/g,' ').replace(/\s*\n\s*/g,' ')); return; }
      if(n.nodeType!==1) return;
      var t=n.tagName; if(HTML_DROP[t]) return;
      var inner=ser(n), tl=t.toLowerCase();
      if(!HTML_OK[t]||t==='SPAN'){h+=inner;return;}
      if(t==='BR'||t==='HR'){h+='<'+tl+'>';return;}
      if(t==='IMG'){var s=n.getAttribute('src')||''; if(/^https?:\/\//i.test(s)||s.charAt(0)==='/') h+='<img src="'+esc(s)+'" alt="'+esc(n.getAttribute('alt')||'')+'" loading="lazy">'; return;}
      if(t==='A'){var hr=n.getAttribute('href')||''; h+=/^(https?:|mailto:|tel:)/i.test(hr)?'<a href="'+esc(hr)+'" target="_blank" rel="noopener nofollow">'+inner+'</a>':inner; return;}
      if(t==='TD'||t==='TH'){var cs=n.getAttribute('colspan'); h+='<'+tl+(cs&&/^\d{1,2}$/.test(cs)?' colspan="'+cs+'"':'')+'>'+inner+'</'+tl+'>'; return;}
      h+='<'+tl+'>'+inner+'</'+tl+'>';
    });
    return h;
  }
  var out=ser(doc.body), prev;
  do{prev=out; out=out.replace(/<(p|strong|em|b|i|u|li|div|h[1-6]|blockquote|small|sup|sub)>(\s|<br>)*<\/\1>/g,'');}while(out!==prev);
  return out.trim();
}
function renderRich(s){
  s=String(s||'').replace(/\r/g,'');
  if(/<\/?(p|br|ul|ol|li|table|tr|td|h[1-6]|strong|b|em|div|span|img|a)\b/i.test(s)) return cleanHtml(s);
  function inl(t){
    t=esc(t);
    t=t.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
    t=t.replace(/\[([^\]\n]+)\]\(((?:https?:\/\/|mailto:|tel:)[^\s)]+)\)/g,function(m,a,u){return '<a href="'+u+'" target="_blank" rel="noopener nofollow">'+a+'</a>'});
    t=t.replace(/(^|[\s(>])(https?:\/\/[^\s<)]+)/g,function(m,p,u){return p+'<a href="'+u+'" target="_blank" rel="noopener nofollow">'+u+'</a>'});
    return t;
  }
  var out=[], list=[], para=[];
  function flushL(){ if(list.length){out.push('<ul>'+list.map(function(x){return '<li>'+inl(x)+'</li>'}).join('')+'</ul>');list=[];} }
  function flushP(){ if(para.length){out.push('<p>'+para.map(inl).join('<br>')+'</p>');para=[];} }
  s.split('\n').forEach(function(line){
    var m;
    if((m=line.match(/^\s*[-*•]\s+(.*)$/))){flushP();list.push(m[1]);}
    else if((m=line.match(/^\s*#{1,3}\s+(.*)$/))){flushP();flushL();out.push('<h4>'+inl(m[1])+'</h4>');}
    else if(!line.trim()){flushP();flushL();}
    else {flushL();para.push(line);}
  });
  flushP(); flushL(); return out.join('');
}

function visible(){
  var f=view.f, q=view.q.trim().toLowerCase();
  var a=PRODS.filter(function(p){
    if(view.cat!=='all'&&!inCat(p,catAndKids(view.cat))) return false;
    if(q&&(p.name_ar+' '+p.name_en+' '+(p.brand||'')+' '+(p.sku||'')).toLowerCase().indexOf(q)<0) return false;
    if(f.sale&&!isSale(p)) return false; if(f.isnew&&!p.is_new) return false; if(f.instock&&soldOut(p)) return false;
    if(f.sizes.length&&!(hasSizes(p)&&p.sizes.some(function(s){return f.sizes.indexOf(s.n)>=0&&sizeAvail(s)}))) return false;
    if(f.colors.length&&!(hasColors(p)&&p.colors.some(function(c){return f.colors.indexOf(c.n)>=0&&c.on!==false}))) return false;
    if(f.brands.length&&f.brands.indexOf(p.brand)<0) return false;
    if(f.min!==''&&p.price<Number(f.min)) return false; if(f.max!==''&&p.price>Number(f.max)) return false;
    return true;
  });
  var s=view.sort;
  if(s==='low') a.sort(function(x,y){return x.price-y.price}); else if(s==='high') a.sort(function(x,y){return y.price-x.price});
  else if(s==='new') a.sort(function(x,y){return String(y.created_at).localeCompare(String(x.created_at))});
  else if(s==='sale') a.sort(function(x,y){return (isSale(y)?pct(y):0)-(isSale(x)?pct(x):0)});
  else if(s==='rate') a.sort(function(x,y){return (y.rating_avg||0)-(x.rating_avg||0)});
  return a;
}

function addLine(id,size,color,q,quiet){

async function placeOrder(){
  if(busy) return; readForm();
  var msg=$('#coMsg'); msg.textContent=''; $$('.fld.bad').forEach(function(x){x.classList.remove('bad')});
  var bad=[]; if(form.name.trim().length<2) bad.push('name'); if(form.phone.replace(/\D/g,'').length<7) bad.push('phone');
  if(method==='delivery'){ if(form.address.trim().length<3) bad.push('address'); if((S.shipping_zones||[]).length&&!zone) bad.push('zone'); }
  if(bad.length){bad.forEach(function(k){var el=$('#coF [name="'+k+'"]');if(el&&el.closest('.fld'))el.closest('.fld').classList.add('bad')});msg.textContent=T.required;return;}
  var c=calc(); if(c.sub<Number(S.min_order||0)){msg.textContent=fillT(T.minOrder,{n:fmt(S.min_order)});return;}
  busy=true; var btn=$('#coBtn'); btn.disabled=true; btn.textContent=T.sending;
  var lines=cart.map(function(l){return {id:l.id,qty:l.q,size:l.size||'',color:l.color||''}});
  var r; try{
    r=await sb.rpc('store_place_order',{p_slug:S.slug,p_name:form.name,p_phone:form.phone,p_email:form.email,p_method:method,p_zone:zone||'',
      p_city:form.city,p_address:form.address,p_note:form.note,p_payment:pay,p_coupon:coupon?coupon.code:'',p_lines:lines});
  }catch(e){r={error:e};}
  busy=false; btn.disabled=false; btn.textContent=T.confirm;
  if(r.error||!r.data){
    var m=String((r.error&&r.error.message)||'');
    if(/insufficient stock/i.test(m)){msg.textContent=fillT(T.errStock,{n:m.split(':').slice(1).join(':').trim()});refreshStockHint();}
    else if(/coupon/i.test(m)){coupon=null;msg.textContent=T.couponBad;}
    else if(/min order/i.test(m)) msg.textContent=fillT(T.minOrder,{n:fmt(S.min_order)});
    else if(/zone/i.test(m)) msg.textContent=T.errZone;
    else msg.textContent=T.err;
    return;
  }
  var o=r.data; o.lines=cart.map(function(l){var p=byId[l.id];return {name:tx(p,'name'),size:l.size,color:l.color,q:l.q,price:unitPrice(p,l.size)}}); o.paid=false;
  lastOrder=o; cart=[]; coupon=null; saveCart(); syncCounts(); payErr=false;
  if(o.online){
    drawerView='paying'; renderDrawer();
    try{
      var pr=await fetch('/api/store/pay/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:o.token})});
      var pj=await pr.json();
      if(pr.ok&&pj.url){location.href=pj.url;return;}
      payErr=true;
    }catch(e){payErr=true;}
  }
  drawerView='done'; renderDrawer();
}

}
async function showPayResult(token){
  lastOrder={paid:false,failed:false}; drawerView='payres'; renderDrawer(); $('#ovC').classList.add('on'); if(!openCart.on){lock(true);openCart.on=true;}
  var tries=0;
  async function poll(){
    tries++; var d=null;
    try{var r=await fetch('/api/store/pay/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token})}); d=await r.json();}catch(e){}
    if(!d||!d.ok){ try{var rr=await sb.rpc('store_order_status',{p_token:token}); d=rr.data?{ok:true,status:rr.data.status,paid:rr.data.status==='paid',order_no:rr.data.order_no}:null;}catch(e){} }
    if(d&&d.ok){
      lastOrder={paid:!!d.paid,failed:false,order_no:d.order_no};
      if(d.paid||d.status==='failed'||d.status==='cancelled'||tries>=5){ if(!d.paid) lastOrder.failed=true; renderDrawer(); if(d.paid){cart=[];saveCart();syncCounts();} return; }
    } else if(tries>=5){lastOrder={paid:false,failed:true,order_no:''};renderDrawer();return;}

}

    }).join('') + (all.length>res.length||all.length ? '<button type="button" class="foot" data-hsall="'+esc(q)+'">'+esc(fillT(T.viewAllN,{n:all.length}))+'</button>' : '')
    : '<div class="none">'+esc(T.noMatch)+'</div>';

}
function shareProduct(k){
  var p=curP; if(!p) return; var u=location.origin+location.pathname+'#/p/'+p.id, eu=encodeURIComponent(u), et=encodeURIComponent(tx(p,'name'));
  var map={fb:'https://www.facebook.com/sharer/sharer.php?u='+eu,x:'https://twitter.com/intent/tweet?url='+eu+'&text='+et,wa:'https://wa.me/?text='+et+'%20'+eu,mail:'mailto:?subject='+et+'&body='+eu};
  if(k==='copy'){try{navigator.clipboard.writeText(u)}catch(x){} toast(T.linkCopied);return;}

}

  if((el=t.closest('[data-tab]'))){pvTab=el.dataset.tab;$$('[data-tab]').forEach(function(b){b.setAttribute('aria-selected',String(b===el))});renderTab();return;}
  if((el=t.closest('[data-gorev]'))){e.preventDefault();pvTab='rev';renderPV();var tb=$('#tabs');if(tb)tb.scrollIntoView({behavior:'smooth'});return;}

  if((el=t.closest('[data-cat]'))){ if(!(e.metaKey||e.ctrlKey||e.shiftKey||e.button)){e.preventDefault();goCat(el.dataset.cat);} return;}
  if(t.closest('[data-more]')){e.preventDefault();return;}

  if((el=t.closest('[data-eq]'))){e.stopPropagation();var sp=$('span',el.parentNode);sp.textContent=Math.max(1,Math.min(99,Number(sp.textContent)+Number(el.dataset.eq)));return;}
  if((el=t.closest('[data-eadd]'))){e.stopPropagation();var q=Number($('.eq span',el.parentNode).textContent)||1; if(addLine(el.dataset.eadd,'','',q)) {} return;}

  if(t.closest('[data-hsgo]')){headerSearch();return;}

  if((el=t.closest('[data-fx]'))){var k=el.dataset.fx,v=el.dataset.v; if(['sizes','colors','brands'].indexOf(k)>=0) toggleIn(view.f[k],v); else if(k==='min'||k==='max') view.f[k]=''; else view.f[k]=false; renderFilters();renderGrid();return;}

  var f=e.target; e.preventDefault();
  if(f.id==='nlF'){var em=f.elements[0].value.trim(), m=$('#nlM'); m.className='note';
    try{var r=await sb.rpc('store_subscribe',{p_slug:S.slug,p_email:em}); if(r.error) throw r.error; m.classList.add('ok');m.textContent=T.subsOk;f.reset();}catch(x){m.classList.add('no');m.textContent=T.subsBad;} return;}
  if(f.id==='rvF'){var p=curP; if(!p) return;
    try{var r2=await sb.rpc('store_add_review',{p_slug:S.slug,p_product:p.id,p_name:f.elements.n.value,p_rating:rvStars,p_body:f.elements.b.value});
      if(r2.error) throw r2.error; toast(r2.data&&r2.data.approved?T.revOk2:T.revOk); f.reset(); delete reviewsCache[p.id]; loadReviews(p);}catch(x){toast(T.err);} return;}
  if(f.id==='trF'){var res=false;
    try{var r3=await sb.rpc('store_track_order',{p_slug:S.slug,p_order_no:f.elements.no.value,p_phone:f.elements.ph.value}); if(r3.data&&r3.data.ok) res=r3.data;}catch(x){}

});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if($('#lb').classList.contains('on')){$('#lb').classList.remove('on');return;}
    if($('#hsRes')&&$('#hsRes').classList.contains('show')){hideLiveSearch();return;}
    if(mOpen){closeModal();return;} if($('#srch').classList.contains('on')){closeSearch();return;}
    if(popOn){closePop();return;} if($('#ovC').classList.contains('on')){closeDrawer();return;}
    if($('#flt').classList.contains('on')){$('#flt').classList.remove('on');$('#ovF').classList.remove('on');lock(false);return;}
    if(curP){closePV();return;}
  }
  if((e.key==='Enter')&&e.target.classList&&e.target.classList.contains('card')) openProduct(e.target.dataset.id);
  if(e.key==='Enter'&&e.target.id==='sbIn'){e.preventDefault();headerSearch();}
