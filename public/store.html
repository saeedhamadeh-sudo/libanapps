<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="maison">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LibanApps Store</title>
<meta name="theme-color" content="#191512">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* ============================================================
   LibanApps Store — واجهة المتجر
   ٥ ثيمات: maison · fresh · volt · petal · atelier
   كل ثيم = ألوان + خطوط + شكل الهيرو + شكل كرت المنتج
   ============================================================ */

/* ---------- ثيم 1: MAISON — فخم داكن، سيريف، صور طولية بلا إطار ---------- */
[data-theme="maison"]{
  --bg:#191512; --surface:#221D18; --text:#F0E8DA; --muted:#A3968A;
  --line:rgba(240,232,218,.14); --brand:#C9AE7C; --brand-ink:#1A1512;
  --accent:#B8443A; --accent-ink:#fff; --radius:0px; --radius-lg:0px;
  --font-display:'Cormorant Garamond','Amiri',Georgia,serif;
  --font-body:'Tajawal',system-ui,sans-serif;
  --shadow:0 20px 50px rgba(0,0,0,.45); --cols:2; --cols-m:3; --cols-d:4;
}
/* ---------- ثيم 2: FRESH — أخضر فاتح، دائري، شبكة كثيفة ---------- */
[data-theme="fresh"]{
  --bg:#F2F6F1; --surface:#FFFFFF; --text:#17281E; --muted:#5E7266;
  --line:rgba(23,40,30,.10); --brand:#1F7A4D; --brand-ink:#FFFFFF;
  --accent:#FF7A1A; --accent-ink:#fff; --radius:14px; --radius-lg:22px;
  --font-display:'Cairo',system-ui,sans-serif; --font-body:'Cairo',system-ui,sans-serif;
  --shadow:0 12px 30px rgba(23,40,30,.12); --cols:2; --cols-m:4; --cols-d:5;
}
/* ---------- ثيم 3: VOLT — أبيض بحدود سوداء وظلال صلبة، كوبالت وأصفر ---------- */
[data-theme="volt"]{
  --bg:#FFFFFF; --surface:#F3F3F3; --text:#0E0E12; --muted:#55555F;
  --line:#0E0E12; --brand:#2340FF; --brand-ink:#FFFFFF;
  --accent:#FFD60A; --accent-ink:#0E0E12; --radius:6px; --radius-lg:10px;
  --font-display:'Space Grotesk','Cairo',system-ui,sans-serif; --font-body:'Cairo',system-ui,sans-serif;
  --shadow:6px 6px 0 #0E0E12; --cols:2; --cols-m:3; --cols-d:4;
}
/* ---------- ثيم 4: PETAL — وردي فاتح وعنابي، حواف ناعمة ---------- */
[data-theme="petal"]{
  --bg:#FFF1EE; --surface:#FFFFFF; --text:#3A1F35; --muted:#86677F;
  --line:rgba(107,45,92,.14); --brand:#6B2D5C; --brand-ink:#FFFFFF;
  --accent:#F0728A; --accent-ink:#fff; --radius:22px; --radius-lg:32px;
  --font-display:'El Messiri','Tajawal',serif; --font-body:'Tajawal',system-ui,sans-serif;
  --shadow:0 16px 40px rgba(107,45,92,.14); --cols:2; --cols-m:3; --cols-d:4;
}
/* ---------- ثيم 5: ATELIER — أبيض تحريري، مساحات واسعة، خط خفيف ---------- */
[data-theme="atelier"]{
  --bg:#FFFFFF; --surface:#F2F1EE; --text:#171717; --muted:#77756F;
  --line:rgba(0,0,0,.12); --brand:#171717; --brand-ink:#FFFFFF;
  --accent:#4F6B57; --accent-ink:#fff; --radius:2px; --radius-lg:4px;
  --font-display:'IBM Plex Sans Arabic',system-ui,sans-serif; --font-body:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --shadow:0 10px 30px rgba(0,0,0,.10); --cols:2; --cols-m:3; --cols-d:3;
}

/* ============================================================
   الأساس
   ============================================================ */
*{box-sizing:border-box}
:root{--danger:#C0392B}
[data-theme="maison"]{--danger:#E58A7D}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
  line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(14px,3vw,32px)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
[data-theme="maison"] :focus-visible{outline-color:var(--brand)}
bdi{unicode-bidi:isolate}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* شاشات الحالة (تحميل / خطأ / منتهي) */
.state{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.state .box{max-width:420px}
.state .lg{width:84px;height:84px;border-radius:50%;object-fit:cover;margin:0 auto 18px;background:var(--surface)}
.state h1{font-family:var(--font-display);font-size:clamp(26px,5vw,36px);margin:0 0 8px;line-height:1.2}
.state p{color:var(--muted);margin:0 0 18px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;
  animation:sp .8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* الأزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;
  padding:0 22px;border-radius:var(--radius);background:var(--brand);color:var(--brand-ink);
  font-weight:700;text-decoration:none;border:2px solid var(--brand);transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.alt{background:transparent;color:var(--text);border-color:var(--line)}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
[data-theme="volt"] .btn{border-color:#0E0E12;box-shadow:3px 3px 0 #0E0E12}
[data-theme="volt"] .btn:active{box-shadow:1px 1px 0 #0E0E12;transform:translate(2px,2px)}
[data-theme="volt"] .btn.alt{background:#fff}
[data-theme="maison"] .btn{letter-spacing:.04em}

/* شريط الإعلان */
.ann{background:var(--brand);color:var(--brand-ink);text-align:center;font-size:13.5px;
  padding:8px 14px;font-weight:600}
[data-theme="volt"] .ann{background:var(--accent);color:var(--accent-ink);border-bottom:2px solid #0E0E12}

/* الهيدر */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
[data-theme="volt"] .top{border-bottom:2px solid #0E0E12;background:#fff}
.top .in{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0;margin-inline-end:auto}
.brand img{width:42px;height:42px;object-fit:cover;border-radius:var(--radius);background:var(--surface)}
.brand b{font-family:var(--font-display);font-size:clamp(20px,3vw,26px);line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-theme="maison"] .brand b{font-size:clamp(24px,3.4vw,32px);letter-spacing:.02em}
[data-theme="atelier"] .brand b{font-weight:500;letter-spacing:.01em}
.iconbtn{position:relative;min-width:44px;height:44px;display:grid;place-items:center;
  border-radius:var(--radius);font-weight:700;font-size:14px;padding:0 10px}
.iconbtn:hover{background:var(--surface)}
.iconbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cnt{position:absolute;top:2px;inset-inline-end:0;min-width:19px;height:19px;border-radius:99px;
  background:var(--brand);color:var(--brand-ink);font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 5px}
[data-theme="volt"] .cnt{background:var(--accent);color:var(--accent-ink);border:2px solid #0E0E12}

/* ============================================================
   الهيرو (السلايدر) — شكل مختلف لكل ثيم
   ============================================================ */
.hero{position:relative}
.hero-wrap{padding-top:clamp(14px,2.4vw,28px)}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;min-width:0}
.s-img img{width:100%;height:100%;object-fit:cover}
.s-img.fb{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 55%,var(--bg)))}
.s-txt h2{font-family:var(--font-display);margin:0 0 10px;line-height:1.1;font-weight:700}
.s-txt p{margin:0 0 18px;font-size:clamp(15px,1.8vw,18px)}
.dots{display:flex;gap:8px;justify-content:center;padding:14px 0 0}
.dot{width:9px;height:9px;border-radius:99px;background:var(--line);transition:.25s}
.dot.on{width:26px;background:var(--brand)}
.arw{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  background:var(--bg);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow);z-index:3}
.arw.p{inset-inline-start:12px}.arw.n{inset-inline-end:12px}
.arw svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.arw.p svg{transform:scaleX(-1)}
[dir="rtl"] .arw.p svg{transform:none}
[dir="rtl"] .arw.n svg{transform:scaleX(-1)}
@media(max-width:700px){.arw{display:none}}

/* maison: صورة كاملة العرض، نص كبير سيريف أسفل البداية */
[data-theme="maison"] .hero-wrap{padding:0}
[data-theme="maison"] .hero .wrap{max-width:none;padding:0}
[data-theme="maison"] .slide{height:clamp(380px,66vh,660px);color:#F6EEE0}
[data-theme="maison"] .s-img{position:absolute;inset:0}
[data-theme="maison"] .s-img::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(10,7,5,.78),rgba(10,7,5,.05) 62%)}
[data-theme="maison"] .s-txt{position:absolute;inset-inline-start:clamp(22px,7vw,110px);
  bottom:clamp(34px,9vh,86px);max-width:600px;z-index:2}
[data-theme="maison"] .s-txt h2{font-size:clamp(38px,6.4vw,84px);font-weight:600;letter-spacing:-.01em}
[data-theme="maison"] .dots{position:absolute;inset-inline-end:clamp(22px,7vw,110px);bottom:30px;padding:0}
[data-theme="maison"] .dot{background:rgba(255,255,255,.35)}
[data-theme="maison"] .dot.on{background:var(--brand)}

/* fresh: بطاقة دائرية بحواف كبيرة، النص فوق تدرّج فاتح */
[data-theme="fresh"] .slide{height:clamp(190px,32vw,360px);border-radius:var(--radius-lg);overflow:hidden}
[data-theme="fresh"] .s-img{position:absolute;inset:0}
[data-theme="fresh"] .s-img::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to inline-end,rgba(12,40,25,.72),rgba(12,40,25,0) 62%)}
[data-theme="fresh"] .s-txt{position:absolute;inset-inline-start:clamp(18px,4vw,52px);top:50%;
  transform:translateY(-50%);max-width:min(440px,70%);color:#fff;z-index:2}
[data-theme="fresh"] .s-txt h2{font-size:clamp(22px,3.8vw,44px);font-weight:800}
[data-theme="fresh"] .s-txt .btn{background:var(--accent);border-color:var(--accent)}

/* volt: قسمين — كتلة كوبالت بنص أبيض + صورة بإطار */
[data-theme="volt"] .slide{display:grid;grid-template-columns:1fr 1fr;min-height:clamp(260px,38vw,440px);
  border:2px solid #0E0E12;background:var(--brand)}
[data-theme="volt"] .s-txt{display:flex;flex-direction:column;justify-content:center;
  padding:clamp(20px,4vw,56px);color:#fff;order:1}
[data-theme="volt"] .s-txt h2{font-size:clamp(28px,4.8vw,58px);font-weight:700;text-transform:none;letter-spacing:-.02em}
[data-theme="volt"] .s-txt .btn{background:var(--accent);color:var(--accent-ink);align-self:flex-start}
[data-theme="volt"] .s-img{order:2;border-inline-start:2px solid #0E0E12;min-height:200px}
[data-theme="volt"] .s-img.fb{background:var(--accent)}
@media(max-width:700px){[data-theme="volt"] .slide{grid-template-columns:1fr}
  [data-theme="volt"] .s-img{order:1;border:0;border-bottom:2px solid #0E0E12;height:190px}
  [data-theme="volt"] .s-txt{order:2}}

/* petal: صورة بحواف كبيرة وبطاقة بيضاء شفافة فوقها */
[data-theme="petal"] .slide{height:clamp(250px,40vw,470px);border-radius:var(--radius-lg);overflow:hidden}
[data-theme="petal"] .s-img{position:absolute;inset:0}
[data-theme="petal"] .s-txt{position:absolute;inset-inline-start:clamp(14px,3vw,40px);bottom:clamp(14px,3vw,40px);
  max-width:min(400px,calc(100% - 28px));background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-radius:var(--radius);padding:clamp(16px,2.6vw,28px);color:var(--text);z-index:2}
[data-theme="petal"] .s-txt h2{font-size:clamp(22px,3.2vw,38px);color:var(--brand)}
[data-theme="petal"] .s-txt p{margin-bottom:14px}

/* atelier: نص كبير خفيف على اليمين، صورة كبيرة بلا إطار */
[data-theme="atelier"] .slide{display:grid;grid-template-columns:5fr 7fr;min-height:clamp(320px,46vw,540px);
  background:var(--surface)}
[data-theme="atelier"] .s-txt{display:flex;flex-direction:column;justify-content:center;
  padding:clamp(22px,5vw,72px);order:1}
[data-theme="atelier"] .s-txt h2{font-size:clamp(30px,4.6vw,60px);font-weight:300;letter-spacing:-.02em}
[data-theme="atelier"] .s-txt p{color:var(--muted)}
[data-theme="atelier"] .s-txt .btn{align-self:flex-start}
[data-theme="atelier"] .s-img{order:2}
@media(max-width:760px){[data-theme="atelier"] .slide{grid-template-columns:1fr}
  [data-theme="atelier"] .s-img{order:1;height:240px}}

/* ============================================================
   التصنيفات
   ============================================================ */
.cats{position:sticky;top:68px;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
[data-theme="volt"] .cats{border-bottom:2px solid #0E0E12}
.cats .rail{display:flex;gap:10px;overflow-x:auto;padding:12px 0;scrollbar-width:none;align-items:center}
.cats .rail::-webkit-scrollbar{display:none}
.cat{flex:none;white-space:nowrap;font-weight:600;color:var(--muted);transition:.15s}
.cat .ci{display:none}
.cat[aria-pressed="true"]{color:var(--text)}
/* maison: نص مع خط سفلي */
[data-theme="maison"] .cat{padding:8px 4px;margin-inline-end:18px;font-family:var(--font-display);font-size:20px;
  border-bottom:1px solid transparent}
[data-theme="maison"] .cat[aria-pressed="true"]{border-color:var(--brand);color:var(--brand)}
/* fresh: دوائر بصورة التصنيف */
[data-theme="fresh"] .cats .rail{gap:18px;padding:14px 0}
[data-theme="fresh"] .cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;min-width:64px}
[data-theme="fresh"] .cat .ci{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;
  background:var(--surface);object-fit:cover;border:2px solid transparent;font-weight:800;font-size:20px;color:var(--brand)}
[data-theme="fresh"] .cat[aria-pressed="true"] .ci{border-color:var(--brand)}
[data-theme="fresh"] .cat[aria-pressed="true"]{color:var(--brand)}
/* volt: أزرار بحدود سوداء */
[data-theme="volt"] .cat{padding:6px 16px;border:2px solid #0E0E12;border-radius:var(--radius);color:var(--text);background:#fff}
[data-theme="volt"] .cat[aria-pressed="true"]{background:var(--brand);color:#fff;box-shadow:3px 3px 0 #0E0E12}
/* petal: حبوب ناعمة */
[data-theme="petal"] .cat{padding:8px 20px;border-radius:99px;background:#fff;color:var(--brand);
  box-shadow:0 2px 10px rgba(107,45,92,.08)}
[data-theme="petal"] .cat[aria-pressed="true"]{background:var(--brand);color:#fff}
/* atelier: نص بفواصل */
[data-theme="atelier"] .cat{padding:6px 0;margin-inline-end:26px;font-weight:400;font-size:15px}
[data-theme="atelier"] .cat[aria-pressed="true"]{color:var(--text);text-decoration:underline;text-underline-offset:8px}

/* ============================================================
   أقسام وعناوين
   ============================================================ */
.sec{padding:clamp(26px,5vw,56px) 0 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:clamp(14px,2.4vw,26px)}
.sec-h h2{font-family:var(--font-display);margin:0;font-size:clamp(26px,4vw,40px);line-height:1.15}
[data-theme="maison"] .sec-h h2{font-weight:600;font-size:clamp(30px,4.6vw,52px)}
[data-theme="atelier"] .sec-h h2{font-weight:300;letter-spacing:-.01em}
[data-theme="volt"] .sec-h h2{font-weight:700;letter-spacing:-.02em}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{height:44px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--radius);padding:0 14px;min-width:0}
[data-theme="volt"] .tools input,[data-theme="volt"] .tools select{border:2px solid #0E0E12;background:#fff}
.tools input{width:260px;max-width:100%}

/* Hot sale */
.hot{margin-top:clamp(26px,5vw,56px);padding:clamp(18px,3vw,32px) 0;background:var(--surface)}
[data-theme="maison"] .hot{background:linear-gradient(180deg,#221D18,#191512);border-block:1px solid var(--line)}
[data-theme="volt"] .hot{background:var(--accent);border-block:2px solid #0E0E12}
[data-theme="petal"] .hot{background:linear-gradient(135deg,#FFE0DE,#FFD1DC)}
[data-theme="fresh"] .hot{background:#FFF2E6}
.hot .sec-h{margin-bottom:16px}
.hot .sec-h h2{display:flex;align-items:center;gap:10px}
.flame{width:.9em;height:.9em;fill:var(--accent);flex:none}
[data-theme="volt"] .flame{fill:#0E0E12}
.cd{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}
.cd .u{min-width:52px;text-align:center;padding:6px 8px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--radius);line-height:1.1}
.cd .u b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.cd .u small{font-size:11px;color:var(--muted);font-weight:500}
[data-theme="volt"] .cd .u{border:2px solid #0E0E12;background:#fff}
.hrow{display:flex;gap:var(--gapc,16px);overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 12px;scrollbar-width:thin}
.hrow .card{flex:0 0 clamp(150px,42vw,230px);scroll-snap-align:start}

/* ============================================================
   الشبكة وكرت المنتج — يتغيّر شكله حسب الثيم
   ============================================================ */
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gapc,16px)}
@media(min-width:720px){.grid{grid-template-columns:repeat(var(--cols-m),minmax(0,1fr))}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(var(--cols-d),minmax(0,1fr))}}
[data-theme="maison"]{--gapc:clamp(14px,2.4vw,34px)}
[data-theme="atelier"]{--gapc:clamp(16px,3vw,44px)}
[data-theme="volt"]{--gapc:clamp(14px,2vw,26px)}

.card{position:relative;min-width:0;cursor:pointer;display:flex;flex-direction:column}
.ph{position:relative;overflow:hidden;background:var(--surface)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.ph .noimg{width:100%;height:100%;display:grid;place-items:center;font-family:var(--font-display);
  font-size:clamp(34px,6vw,56px);color:var(--muted);opacity:.55}
.card:hover .ph img{transform:scale(1.045)}
.cb{min-width:0}
.cb h3{margin:0;font-weight:600;font-size:15.5px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pr b{font-weight:800}
.pr s{color:var(--muted);font-size:.86em}
.bd{position:absolute;top:10px;inset-inline-start:10px;z-index:2;font-size:12px;font-weight:800;
  padding:3px 9px;border-radius:99px;background:var(--accent);color:var(--accent-ink);line-height:1.5}
.bd.so{inset:0;border-radius:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;
  font-size:15px;letter-spacing:.02em}
.quick{position:absolute;z-index:3;width:42px;height:42px;display:grid;place-items:center;
  background:var(--brand);color:var(--brand-ink);border-radius:var(--radius);transition:.15s}
.quick svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.quick:hover{filter:brightness(1.1);transform:scale(1.06)}
.card.sold .quick{display:none}

/* maison */

function slugFromUrl(){
  if(window.__STORE_SLUG__) return String(window.__STORE_SLUG__).toLowerCase();

function tx(o,f){ return L==='en' ? (o[f+'_en']||o[f+'_ar']||'') : (o[f+'_ar']||o[f+'_en']||''); }
function fmt(n){

  var t=(n%1===0)?n.toLocaleString('en-US'):n.toLocaleString('en-US',{minimumFractionDigits:D,maximumFractionDigits:D});
  var sym=S.currency_symbol||S.currency_code;
  return /[\u0600-\u06FF]/.test(sym)?(t+' '+sym):(sym+t);
}

function applyThemeTokens(theme){
  if(!FONTS[theme]) theme='maison';
  document.documentElement.setAttribute('data-theme',theme);
  var meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.content=BAR[theme]||'#fff';
  if(!document.getElementById('fontlink')){
    var lk=document.createElement('link'); lk.id='fontlink'; lk.rel='stylesheet';
    lk.href='https://fonts.googleapis.com/css2?'+FONTS[theme]+'&display=swap'; document.head.appendChild(lk);
  }
}
function setLang(l){
  L=l; T=I18N[l]; document.documentElement.lang=l; document.documentElement.dir=T.dir;
}
function showState(kind,store){
  var st=$('#state'); st.classList.remove('hidden'); $('#app').classList.add('hidden');
  var map={
    notfound:[T.notFoundT,T.notFoundS], notready:[T.notReadyT,T.notReadyS],
    closed:[T.closedT,T.closedS], err:[T.err,'']
  }[kind]||[T.err,''];
  var wa=store&&store.whatsapp?('<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+
    esc(String(store.whatsapp).replace(/\D/g,''))+'">WhatsApp</a>'):'';
  st.innerHTML='<div class="box">'+
    (store&&store.logo_url?'<img class="lg" alt="" src="'+esc(img(store.logo_url))+'">':'')+
    (store&&store.name?'<p style="margin:0 0 4px;font-weight:700">'+esc(store.name)+'</p>':'')+
    '<h1>'+esc(map[0])+'</h1><p>'+esc(map[1])+'</p>'+wa+'</div>';
}

   ============================================================ */
async function boot(){
  var slug=slugFromUrl();
  var pre=lsGet('lang:'+slug); setLang(pre==='en'?'en':'ar');
  if(!slug){ applyThemeTokens('maison'); showState('notfound'); return; }
  try{ sb=window.supabase.createClient(window.LIBANAPPS.SUPABASE_URL,window.LIBANAPPS.SUPABASE_ANON_KEY); }
  catch(e){ applyThemeTokens('maison'); showState('err'); return; }

  var r;
  try{ r=await sb.rpc('store_public',{p_slug:slug}); }catch(e){ r={error:e}; }
  if(r.error||!r.data){ applyThemeTokens('maison'); showState('err'); return; }
  var d=r.data;
  if(!d.ok){
    applyThemeTokens((d.store&&d.store.theme)||'maison');
    var k=d.reason==='not_found'?'notfound':d.reason==='not_ready'?'notready':'closed';
    showState(k,d.store); return;
  }
  S=d.store; CATS=d.categories||[]; PRODS=d.products||[]; SLIDES=d.slides||[]; POP=d.popup||null;
  PRODS.forEach(function(p){byId[p.id]=p});

  var pt=new URLSearchParams(location.search).get('theme');
  var theme=(pt&&FONTS[pt])?pt:S.theme;
  applyThemeTokens(theme);
  if(!lsGet('lang:'+slug)) setLang(S.default_lang==='en'?'en':'ar');
  if(/^#[0-9a-f]{6}$/i.test(S.primary_color||'')){
    var c=S.primary_color, n=parseInt(c.slice(1),16), r_=n>>16, g=(n>>8)&255, b=n&255;
    var lum=(0.299*r_+0.587*g+0.114*b)/255;
    var rs=document.documentElement.style; rs.setProperty('--brand',c);
    rs.setProperty('--brand-ink',lum>0.6?'#111111':'#FFFFFF');
  }
  document.title=S.name||'Store';
  if(S.logo_url){var fv=document.createElement('link');fv.rel='icon';fv.href=img(S.logo_url);document.head.appendChild(fv);}

  try{var saved=JSON.parse(lsGet('cart:'+S.slug)||'{}'); Object.keys(saved).forEach(function(id){
    if(byId[id]&&saved[id]>0) cart[id]=saved[id]; });}catch(e){}
  try{var cu=JSON.parse(lsGet('cust:'+S.slug)||'{}'); Object.keys(form).forEach(function(k){ if(cu[k]) form[k]=cu[k]; });}catch(e){}
  if(!S.delivery_enabled&&S.pickup_enabled) method='pickup';
  if(!S.cod_enabled&&S.whish_ready) pay='whish';

  $('#state').classList.add('hidden'); $('#app').classList.remove('hidden');
  renderAll();
  var pd=new URLSearchParams(location.search).get('paid');
  if(pd){ history.replaceState(null,'',location.pathname); showPayResult(pd); }
  else schedulePopup();
}

function renderHero(){
  var box=$('#slides'), dots=$('#dots'), wrap=box.parentNode;
  $$('.arw',wrap).forEach(function(a){a.remove()});
  clearInterval(sliderTimer);
  var sl=SLIDES.filter(function(s){return s.image_url});
  var fallback=false;
  if(!sl.length){fallback=true;sl=[{title:S.name||'',subtitle:S.tagline||'',cta:'',link_url:''}];}
  box.innerHTML=sl.map(function(s){
    var hasTxt=!!(s.title||s.subtitle||s.cta);
    var href=safeUrl(s.link_url)||'#shop';
    var ext=/^https?:/i.test(href)?' target="_blank" rel="noopener"':'';
    return '<div class="slide'+(hasTxt?'':' notxt')+'">'+
      '<div class="s-img'+(s.image_url?'':' fb')+'">'+(s.image_url?'<img alt="" loading="lazy" src="'+esc(img(s.image_url))+'">':'')+'</div>'+
      (hasTxt?'<div class="s-txt">'+(s.title?'<h2>'+esc(s.title)+'</h2>':'')+(s.subtitle?'<p>'+esc(s.subtitle)+'</p>':'')+
        (s.cta?'<a class="btn" href="'+esc(href)+'"'+ext+'>'+esc(s.cta)+'</a>':'')+'</div>':'')+
      '</div>';
  }).join('');
  $('#hero').classList.remove('hidden');
  sliderIdx=0;
  if(sl.length<2){dots.innerHTML='';return;}
  dots.innerHTML=sl.map(function(_,i){return '<button class="dot'+(i?'':' on')+'" type="button" data-dot="'+i+'" aria-label="'+(i+1)+'"></button>'}).join('');
  ['p','n'].forEach(function(k){
    var b=document.createElement('button'); b.type='button'; b.className='arw '+k; b.dataset.arw=k;
    b.setAttribute('aria-label',k==='p'?'previous':'next'); b.innerHTML=IC.chev;
    wrap.appendChild(b);

  var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!rm) sliderTimer=setInterval(function(){goSlide(sliderIdx+1)},5500);
}
function goSlide(i){
  var box=$('#slides'), n=box.children.length; if(!n) return;

  paintDots();
}
function paintDots(){$$('.dot').forEach(function(d,i){d.classList.toggle('on',i===sliderIdx)})}

function cardHTML(p){

function visible(){
  var q=query.trim().toLowerCase();
  var a=PRODS.filter(function(p){
    if(filter!=='all'&&p.category_id!==filter) return false;
    if(!q) return true;
    return (p.name_ar+' '+p.name_en+' '+p.desc_ar+' '+p.desc_en).toLowerCase().indexOf(q)>=0;
  });
  if(sortBy==='low') a.sort(function(x,y){return x.price-y.price});
  else if(sortBy==='high') a.sort(function(x,y){return y.price-x.price});
  else if(sortBy==='new') a.sort(function(x,y){return String(y.created_at).localeCompare(String(x.created_at))});
  return a;

function saveCart(){lsSet('cart:'+S.slug,JSON.stringify(cart))}
function cartLines(){return Object.keys(cart).map(function(id){var p=byId[id];return p?{p:p,q:cart[id]}:null}).filter(Boolean)}
function updateCount(){
  var n=0; Object.keys(cart).forEach(function(k){n+=cart[k]});
  var c=$('#cnt'); c.textContent=n; c.classList.toggle('hidden',!n);
}
function addToCart(id,q){
  var p=byId[id]; if(!p) return false;
  var max=p.stock!=null?p.stock:99, cur=cart[id]||0;
  if(cur>=max){toast(T.errStock.replace('{n}',tx(p,'name')));return false;}
  cart[id]=Math.min(max,cur+(q||1)); saveCart(); updateCount(); revalidateCoupon();
  toast(T.added); return true;
}
function setQty(id,q){
  var p=byId[id]; if(!p) return; var max=p.stock!=null?p.stock:99;
  if(q<=0) delete cart[id]; else cart[id]=Math.min(max,q);
  saveCart(); updateCount(); revalidateCoupon(); if($('#ovC').classList.contains('on')) renderDrawer();
}
function calc(){
  var sub=0; cartLines().forEach(function(l){sub+=l.p.price*l.q});
  sub=rnd(sub);
  var disc=coupon?Math.min(coupon.discount,sub):0, fee=0;
  if(method==='delivery'&&S.delivery_enabled){
    fee=Number(S.delivery_fee)||0;
    if(S.free_delivery_over!=null&&(sub-disc)>=Number(S.free_delivery_over)) fee=0;
  }
  return {sub:sub,disc:disc,fee:fee,total:rnd(sub-disc+fee)};
}
async function applyCoupon(code){
  var c=calc(); code=String(code||'').trim();
  if(!code) return;
  var r=await sb.rpc('check_store_coupon',{p_slug:S.slug,p_code:code,p_subtotal:c.sub});
  var d=r.data;
  if(r.error||!d||!d.ok){
    var why=d&&d.reason;
    return {ok:false,msg:why==='expired'?T.couponExp:why==='used_up'?T.couponUsed:
      why==='min_order'?T.couponMin.replace('{n}',fmt(d.min)):T.couponBad};
  }
  coupon={code:d.code,discount:Number(d.discount)}; return {ok:true,msg:T.couponOk};
}
async function revalidateCoupon(){
  if(!coupon) return; var code=coupon.code;
  var r=await applyCoupon(code); if(!r||!r.ok){ coupon=null; toast(r?r.msg:T.couponBad); }
  if($('#ovC').classList.contains('on')&&drawerView!=='done') renderDrawer();
}

  if(withFee&&method==='delivery') h+='<div class="tot"><span>'+esc(T.delivery)+'</span><span>'+(c.fee>0?money(c.fee):esc(T.free))+'</span></div>';
  h+='<div class="tot g"><span>'+esc(T.total)+'</span><span>'+money(withFee?c.total:rnd(c.sub-c.disc))+'</span></div>';
  return h;
}

      window.__payRes={paid:true,order_no:d.order_no,whatsapp:d.whatsapp}; renderDrawer(); return;}
    if(d&&(d.status==='failed'||d.status==='cancelled')){ window.__payRes={order_no:d.order_no,whatsapp:d.whatsapp}; renderDrawer(); return;}

async function placeOrder(){
  if(busy) return;
  var ok=true, msg=$('#coMsg'); msg.textContent='';
  function bad(id){var e=$('#f_'+id); if(e) e.classList.add('bad'); ok=false}
  $$('.fld.bad').forEach(function(e){e.classList.remove('bad')});
  if(form.name.trim().length<2) bad('name');
  if(form.phone.replace(/\D/g,'').length<7) bad('phone');
  if(method==='delivery'&&form.address.trim().length<3) bad('address');
  if(!ok){msg.textContent=T.required;return;}
  var c=calc(); if(c.sub<Number(S.min_order||0)){msg.textContent=T.minOrder.replace('{n}',fmt(S.min_order));return;}
  busy=true; var btn=$('#placeBtn'); btn.disabled=true; btn.textContent=T.sending;
  var lines=cartLines();
  var snap=lines.map(function(l){return {name:tx(l.p,'name'),q:l.q,price:l.p.price}});
  var r;
  try{
    r=await sb.rpc('store_place_order',{p_slug:S.slug,p_name:form.name,p_phone:form.phone,p_email:form.email,
      p_method:method,p_city:form.city,p_address:form.address,p_note:form.note,p_payment:pay,
      p_coupon:coupon?coupon.code:'',p_lines:lines.map(function(l){return {id:l.p.id,qty:l.q}})});
  }catch(e){r={error:e};}
  busy=false;
  if(r.error||!r.data){
    var m=String((r.error&&r.error.message)||'');
    btn.disabled=false; btn.textContent=T.confirm;
    if(/insufficient stock/i.test(m)) msg.textContent=T.errStock.replace('{n}',m.split(':').slice(1).join(':').trim());
    else if(/coupon/i.test(m)){coupon=null;msg.textContent=T.couponBad;}
    else if(/min order/i.test(m)) msg.textContent=T.minOrder.replace('{n}',fmt(S.min_order));
    else if(/unavailable/i.test(m)) msg.textContent=T.unavailable;
    else msg.textContent=T.err;
    return;
  }
  lsSet('cust:'+S.slug,JSON.stringify({name:form.name,phone:form.phone,email:form.email,city:form.city,address:form.address}));
  lastOrder={data:r.data,lines:snap,form:{name:form.name,phone:form.phone,city:form.city,address:form.address,note:form.note},method:method,pay:pay};
  cart={}; coupon=null; saveCart(); updateCount(); payErr=false;
  if(pay==='whish'){
    drawerView='paying'; renderDrawer();
    try{
      var res=await fetch('/api/store/whish/create',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({order_id:r.data.order_id,token:r.data.token,slug:S.slug})});
      var j=await res.json();
      if(j&&j.collectUrl){location.href=j.collectUrl;return;}
      throw new Error((j&&j.error)||'pay');
    }catch(e){payErr=true;}
  }
  drawerView='done'; renderDrawer();
}

  if((el=t.closest('[data-cq]'))){var id=el.dataset.cq;setQty(id,(cart[id]||0)+Number(el.dataset.d));return;}
  if((el=t.closest('[data-rm]'))){setQty(el.dataset.rm,0);return;}
  if(t.closest('[data-cpgo]')){var v=$('#cpIn').value;applyCoupon(v).then(function(r){
    if(r&&r.ok) renderDrawer(); else if(r){var m=$('#cpMsg');if(m)m.textContent=r.msg;}});return;}
  if(t.closest('[data-cprm]')){coupon=null;renderDrawer();return;}
  if((el=t.closest('[data-view]'))){drawerView=el.dataset.view;renderDrawer();return;}
  if((el=t.closest('[data-method]'))){method=el.dataset.method;renderDrawer();return;}
  if((el=t.closest('[data-pay]'))){pay=el.dataset.pay;renderDrawer();return;}
  if(t.closest('#placeBtn')){placeOrder();return;}
  if((el=t.closest('[data-copycode]'))){var code=el.dataset.copycode;
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(function(){toast(T.copied)},function(){toast(code)});
    else toast(code); return;}
  if(t.closest('[data-recheck]')){var tk=(window.__payRes||{}).token; if(tk) showPayResult(tk); return;}
  if(t.closest('[data-close]')){ closeSheet(); closeCart(); closePop(); return;}
  if(t.id==='ovP') return closeSheet();
  if(t.id==='ovC') return closeCart();
  if(t.id==='ovPop') return closePop();
  if(t.closest('#cartBtn')){openCart();return;}
  if(t.closest('#langBtn')){setLang(L==='ar'?'en':'ar');lsSet('lang:'+S.slug,L);renderAll();return;}
  if((el=t.closest('.card'))){openProduct(el.dataset.id);return;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closePop();closeSheet();closeCart();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('card')){e.preventDefault();openProduct(e.target.dataset.id);}
  if(e.key==='Enter'&&e.target.id==='cpIn'){e.preventDefault();var b=$('[data-cpgo]');if(b)b.click();}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f){form[t.dataset.f]=t.value;var f=$('#f_'+t.dataset.f);if(f)f.classList.remove('bad');}
  if(t.id==='q'){query=t.value;renderGrid();}
});
document.addEventListener('change',function(e){ if(e.target.id==='sortSel'){sortBy=e.target.value;renderGrid();} });
document.addEventListener('DOMContentLoaded',function(){
  var box=$('#slides'), to;
  box.addEventListener('scroll',function(){clearTimeout(to);to=setTimeout(function(){
    var i=Math.round(Math.abs(box.scrollLeft)/(box.clientWidth||1)); if(i!==sliderIdx){sliderIdx=i;paintDots();}},80)},{passive:true});
  ['pointerenter','touchstart'].forEach(function(ev){$('#hero').addEventListener(ev,function(){clearInterval(sliderTimer)},{passive:true})});
});

boot();
})();
</script>
</body>
</html>
