<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Store admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F6F9;--card:#fff;--ink:#0F1B2D;--muted:#667085;--line:#E4E8EE;--line2:#EEF1F5;
  --brand:#12324F;--brand2:#1D4E7A;--accent:#0FA592;--accent-soft:#E3F6F3;
  --ok:#0E9F6E;--ok-soft:#E5F6EE;--warn:#B7791F;--warn-soft:#FFF4DB;--bad:#D14343;--bad-soft:#FDECEC;--info-soft:#E8F0FB;
  --r:12px;--r-sm:8px;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--sh2:0 12px 40px rgba(16,24,40,.16);
  --side:264px;--font:'Inter','Cairo',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
[dir="rtl"] body{font-family:'Cairo','Inter',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--brand2);text-decoration:none}
a:hover{text-decoration:underline}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
bdi{unicode-bidi:isolate}

/* بوابة الدخول */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.gate .b{max-width:380px}.gate p{color:var(--muted)}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* الهيكل */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-inline-end:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:60}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 14px;border-bottom:1px solid var(--line2)}
.brand .lg{width:44px;height:44px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden;flex:none}
.brand .lg img{width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.brand b{display:block;line-height:1.25;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.brand small{color:var(--muted);font-size:12px}
.nav{flex:1;overflow:auto;padding:10px 12px 14px}
.nav h6{margin:16px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#98A2B3;font-weight:600}
[dir="rtl"] .nav h6{letter-spacing:0}
.nav button{width:100%;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:#344054;font-weight:500;text-align:start;transition:background .12s,color .12s}
.nav button:hover{background:#F2F4F7}
.nav button[aria-pressed="true"]{background:var(--brand);color:#fff}
.nav .bdg{margin-inline-start:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;padding:0 6px}
.side-f{padding:14px 16px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:8px;font-size:13px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;background:rgba(244,246,249,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:12px clamp(14px,3vw,32px);min-height:64px}
.top h1{font-size:20px;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.menu-b{display:none}
.content{padding:clamp(14px,3vw,32px);max-width:1240px;width:100%}
#banners .banner{background:var(--warn-soft);color:#7a4b06;border:1px solid #F1D9A0;border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
#banners .banner.bad{background:var(--bad-soft);color:#8a1f1f;border-color:#F3C3C3}
.scrim{position:fixed;inset:0;background:rgba(15,27,45,.45);z-index:55;display:none}
.scrim.on{display:block}
@media(max-width:920px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:min(300px,86vw);transform:translateX(-105%);transition:transform .25s;box-shadow:var(--sh2)}
  [dir="rtl"] .side{transform:translateX(105%)}
  .side.open{transform:none}
  .btn.menu-b{display:inline-flex}
}

/* أزرار وحقول */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;font-weight:600;font-size:14px;
  background:var(--brand);color:#fff;border:1px solid var(--brand);transition:filter .12s,background .12s,transform .05s;white-space:nowrap}
.btn:hover{filter:brightness(1.12);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.alt{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.alt:hover{background:#F9FAFB;filter:none}
.btn.dg{background:#fff;color:var(--bad);border-color:#F3C3C3}
.btn.dg:hover{background:var(--bad-soft);filter:none}
.btn.ok{background:#25D366;border-color:#25D366;color:#06361A}
.btn.acc{background:var(--accent);border-color:var(--accent)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.ic{width:36px;padding:0;min-height:36px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.f{display:block;margin-bottom:14px}
.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#344054}
.f small{display:block;color:var(--muted);font-size:12.5px;margin-top:5px}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=url],input[type=password],input[type=datetime-local],input[type=search],select,textarea{
  width:100%;min-height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;transition:border-color .12s,box-shadow .12s}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=color]{width:46px;height:42px;padding:3px;border:1px solid var(--line);border-radius:10px;background:#fff}
input[type=file]{width:100%;font-size:13px}
input[type=range]{width:100%;accent-color:var(--brand)}
.g2{display:grid;gap:0 16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{display:grid;gap:0 16px;grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{display:grid;gap:0 16px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;margin:4px 0 12px;user-select:none}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:99px;background:#CBD2DC;position:relative;transition:.18s;flex:none;cursor:pointer}
.sw input::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{inset-inline-start:19px}
.msg{min-height:20px;margin-top:10px;font-size:13.5px}
.msg.s{color:var(--ok)}.msg.e{color:var(--bad)}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:clamp(16px,2.2vw,24px);margin-bottom:18px}
.card>h3,.card-h h3{margin:0 0 4px;font-size:16.5px;font-weight:700}
.card>h3 small{color:var(--muted);font-weight:500;font-size:13px;margin-inline-start:6px}
.card .sub{color:var(--muted);margin:0 0 16px;font-size:13.5px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tools .sp{margin-inline-start:auto}
.tools input[type=search],.tools select{width:auto;min-width:200px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--ok-soft);color:#0B7A55;white-space:nowrap}
.tag.off{background:#F2F4F7;color:#667085}
.tag.low{background:var(--warn-soft);color:var(--warn)}
.tag.hot{background:#FDECEC;color:#C43B3B}
.tag.new{background:var(--info-soft);color:#1D5FB4}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:#F2F4F7;color:#475467}
.chip.ok{background:var(--ok-soft);color:#0B7A55}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:#B42323}.chip.info{background:var(--info-soft);color:#1D5FB4}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.wrapx{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl{width:100%;border-collapse:collapse;min-width:560px;background:#fff}
.tbl th{background:#F9FAFB;text-align:start;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:#667085;font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
[dir="rtl"] .tbl th{letter-spacing:0;text-transform:none;font-size:12.5px}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FAFBFC}
.tbl .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbl select{min-height:34px;padding:4px 8px;border-radius:8px}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;background:#EEF1F5;display:block}
.pcell{display:flex;align-items:center;gap:12px}
.pcell b{display:block;font-weight:600}
.empty{padding:38px 16px;text-align:center;color:var(--muted)}
.empty .ico{width:54px;height:54px;border-radius:50%;background:#F2F4F7;display:grid;place-items:center;margin:0 auto 12px;color:#98A2B3}
.empty .ico svg{width:24px;height:24px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:9px 14px;align-items:start}
.kv>b{color:var(--muted);font-weight:500}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.cd{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.cd>img{width:100%;aspect-ratio:16/7;object-fit:cover;background:#EEF1F5;display:block}
.cd .b{padding:12px 14px}
.cd .acts{display:flex;gap:8px;margin-top:10px}
.upl{display:flex;gap:14px;align-items:center}
.upl img{width:84px;height:84px;object-fit:contain;border-radius:10px;background:#F2F4F7;border:1px solid var(--line);padding:4px}
.copy{display:flex;gap:8px;align-items:center;background:#F2F4F7;border-radius:10px;padding:8px 8px 8px 12px;margin-top:6px}
.copy span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start;font-size:13px}
pre.dns{background:#0F1B2D;color:#D6E4F5;padding:14px;border-radius:10px;overflow:auto;direction:ltr;text-align:left;font-size:13px}
ol.steps{padding-inline-start:20px;color:#344054}

/* لوحة القيادة */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.kpi span{color:var(--muted);font-size:13px;display:block}
.kpi b{font-size:26px;letter-spacing:-.02em;display:block;margin-top:4px;line-height:1.2}
.kpi small{color:var(--muted);font-size:12.5px}
.chart{height:210px;display:flex;align-items:flex-end;gap:3px;padding-top:10px}
.chart .bar{flex:1;background:linear-gradient(to top,var(--brand),var(--brand2));border-radius:5px 5px 0 0;min-height:2px;position:relative;opacity:.9}
.chart .bar:hover{opacity:1;background:var(--accent)}
.chart .bar::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11.5px;padding:3px 8px;border-radius:6px;white-space:nowrap;display:none;z-index:3}
.chart .bar:hover::after{display:block}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px}
.seg{display:inline-flex;background:#F2F4F7;border-radius:10px;padding:3px}
.seg button{padding:6px 14px;border-radius:8px;font-weight:600;font-size:13px;color:#475467}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:var(--sh);color:var(--ink)}
.two{display:grid;gap:18px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media(max-width:1000px){.two{grid-template-columns:1fr}}
.list-i{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.list-i:last-child{border-bottom:0}
.list-i .n{flex:1;min-width:0}.list-i .n b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.check{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.check:last-child{border:0}
.check .d{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.check.done .d{background:var(--ok);border-color:var(--ok)}
.check.done b{text-decoration:line-through;color:var(--muted)}
.check .d svg{width:14px;height:14px;stroke-width:3}
.progress{height:8px;background:#EEF1F5;border-radius:99px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));border-radius:99px}

/* محرّر المنتج */
.pe{display:grid;gap:18px;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
@media(max-width:1000px){.pe{grid-template-columns:1fr}}
.pe .card{margin-bottom:18px}
.pe-h{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pe-h h2{margin:0;font-size:20px;flex:1}
.mgal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.mgal .m{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#F2F4F7}
.mgal .m img{width:100%;height:100%;object-fit:cover}
.mgal .m button{position:absolute;top:5px;inset-inline-end:5px;width:24px;height:24px;border-radius:50%;background:rgba(15,27,45,.75);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center}
.mgal .m .main{position:absolute;bottom:5px;inset-inline-start:5px;background:var(--accent);color:#fff;font-size:11px;padding:1px 7px;border-radius:99px;font-weight:600}
.mgal label.add{border:2px dashed var(--line);display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;font-size:13px;aspect-ratio:1;border-radius:10px}
.mgal label.add:hover{border-color:var(--accent);color:var(--accent)}
.mgal label.add input{display:none}
.rows .r{display:grid;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
.rows .r.sz{grid-template-columns:1.1fr auto .9fr .9fr 34px}
.rows .r.cl{grid-template-columns:46px 1.2fr .9fr auto 34px}
.rows .r.sp{grid-template-columns:1fr 1.4fr 34px}
.rows .r.zn{grid-template-columns:1.6fr 1fr 34px}
.rows .r.us{grid-template-columns:130px 1.2fr 1.2fr 34px}
.rows .r input,.rows .r select{min-height:38px}
.rows .r .sw{margin:0}
.rows .r .sw input{min-height:0;height:23px;width:40px}
.rows .hd{display:grid;gap:10px;color:var(--muted);font-size:12px;font-weight:600;padding-bottom:4px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 13px;font-size:13px;font-weight:600;color:#344054}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.swatches button{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.disc{display:inline-block;margin-inline-start:8px;color:var(--ok);font-weight:700;font-size:13px}
.stbar{position:sticky;bottom:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:flex-end;box-shadow:var(--sh2);margin-top:8px}
.stbar .msg{margin:0 auto 0 0;flex:1}
[dir="rtl"] .stbar .msg{margin:0 0 0 auto}

/* اختيار الثيم */
.themes{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tcard{text-align:start;border:2px solid var(--line);border-radius:14px;padding:12px;background:#fff;transition:.15s;display:block}
.tcard:hover{border-color:#B8C2D0}
.tcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tcard .nm{font-weight:700;margin:12px 2px 2px}.tcard .ds{color:var(--muted);font-size:12.5px;margin:0 2px 6px}
.tcard .fit{font-size:12px;margin:0 2px 8px}
.tcard .pvl{font-size:13px;font-weight:600;margin:0 2px}
.tp{height:150px;border-radius:9px;overflow:hidden;position:relative;border:1px solid rgba(0,0,0,.08);font-size:0}
.tp>*{position:absolute}
.tp[data-t="nova"]{background:#fff}
.tp[data-t="nova"] .h{inset:0 0 auto 0;height:16px;background:#fff;border-bottom:1px solid #eee}
.tp[data-t="nova"] .h::after{content:"";position:absolute;inset:5px auto 5px 12px;width:34px;background:#111}
.tp[data-t="nova"] .hero{inset:16px 0 auto 0;height:78px;background:linear-gradient(#444,#111)}
.tp[data-t="nova"] .hero::after{content:"";position:absolute;inset:auto auto 10px 12px;width:96px;height:20px;background:#fff;opacity:.95}
.tp[data-t="nova"] .a,.tp[data-t="nova"] .b,.tp[data-t="nova"] .c{top:100px;height:44px;width:28%;background:#ecebe6}
.tp[data-t="aurum"]{background:#0D1524}
.tp[data-t="aurum"] .h{inset:0 0 auto 0;height:26px;border-bottom:1px solid rgba(214,184,122,.3)}
.tp[data-t="aurum"] .h::after{content:"";position:absolute;inset:7px 50% 7px auto;width:38px;margin-right:-19px;background:#D6B87A}
.tp[data-t="aurum"] .hero{inset:32px 10px auto 10px;height:70px;border:1px solid rgba(214,184,122,.6);background:#141E31}
.tp[data-t="aurum"] .hero::after{content:"";position:absolute;inset:26px 30% auto 30%;height:14px;background:#D6B87A;opacity:.85}
.tp[data-t="aurum"] .a,.tp[data-t="aurum"] .b,.tp[data-t="aurum"] .c{top:110px;height:34px;width:28%;background:#1B2740;border:1px solid rgba(214,184,122,.35)}
.tp[data-t="pulse"]{background:#F3F5F9}
.tp[data-t="pulse"] .h{inset:0 0 auto 0;height:26px;background:#fff}
.tp[data-t="pulse"] .h::after{content:"";position:absolute;inset:7px 30% 7px 30%;border-radius:99px;background:#EEF1F7}
.tp[data-t="pulse"] .hero{inset:32px 8px auto 8px;height:62px;border-radius:12px;background:linear-gradient(115deg,#0B1226,#2456FF)}
.tp[data-t="pulse"] .hero::after{content:"";position:absolute;inset:22px 60% 22px 12px;background:#fff;border-radius:5px}
.tp[data-t="pulse"] .a,.tp[data-t="pulse"] .b,.tp[data-t="pulse"] .c{top:100px;height:44px;width:29%;background:#fff;border-radius:9px;border:1px solid #E1E6EF}
.tp[data-t="bloom"]{background:#FFF6F3}
.tp[data-t="bloom"] .h{inset:6px 10px auto 10px;height:20px;background:#fff;border-radius:99px;box-shadow:0 4px 12px rgba(94,38,76,.12)}

function catTree(){

  var by={}; CATS.forEach(function(c){var k=(c.parent_id&&ids[c.parent_id])?c.parent_id:'';(by[k]=by[k]||[]).push(c)});
  Object.keys(by).forEach(function(k){by[k].sort(function(a,b){return ((a.sort||0)-(b.sort||0))||String(a.name_ar).localeCompare(String(b.name_ar))})});
  var out=[]; (function walk(k,d){ (by[k]||[]).forEach(function(c){out.push({c:c,d:d}); if(d<6) walk(c.id,d+1)}) })('',0); return out;
}

function outType(f){var t=(f&&f.type)||''; return /png|webp|gif|svg/i.test(t)?{mime:'image/png',ext:'png'}:{mime:'image/jpeg',ext:'jpg'}}
function shrink(file,max){
  var out=outType(file);
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){var im=new Image();
      im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height));
        var cv=document.createElement('canvas'); cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s);
        var c=cv.getContext('2d'); c.clearRect(0,0,cv.width,cv.height); c.drawImage(im,0,0,cv.width,cv.height);
        cv.toBlob(function(b){b?res(b):rej(new Error(L('تعذّر تحويل الصورة','Could not process image')))},out.mime,0.88)};
      im.onerror=function(){rej(new Error(L('ملف الصورة غير صالح','Invalid image file')))}; im.src=fr.result};
    fr.onerror=function(){rej(new Error(L('تعذّرت قراءة الملف','Could not read file')))}; fr.readAsDataURL(file);
  });
}
async function upload(bucket,file,max){
  var out=outType(file), blob=await shrink(file,max||1000);
  var path='st-'+ST.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+out.ext;
  var up=await sb.storage.from(bucket).upload(path,blob,{contentType:out.mime});
  if(up.error) throw up.error;
  return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

function baseName(u){

  return n.toLowerCase();

function baseNameNoSize(n){ return n.replace(/-\d{2,5}x\d{2,5}(\.[a-z0-9]+)$/i,'$1'); }

function zipMime(name){ var ext=(name.split('.').pop()||'').toLowerCase(); return ZIP_MIME[ext]||''; }
function descImgUrls(html){
  var out=[], re=/<img[^>]+src=["']([^"']+)["']/gi, m;
  while((m=re.exec(String(html||'')))) if(isExtUrl(m[1])) out.push(m[1]);

function extPendingList(){

    if(isExtUrl(p.image_url)) out.push({p:p,field:'image_url',url:p.image_url});

async function processImageMap(map,notFoundLabel){

      Object.assign(c2.c,c2.upd);

  zm.className='msg '+(failed?'e':'s');
  zm.textContent=(zipState.stop?L('تم الإيقاف — ','Stopped — '):L('انتهى ✓ — ','Done ✓ — '))+uploaded+L(' صورة انرفعت، ',' images uploaded, ')+notFound+(notFoundLabel||L(' مش موجودة',' not found'))+(failed?' · '+failed+L(' فشلت',' failed'):'');

}

async function copyOneImage(u){
  for(var attempt=0;attempt<3;attempt++){
    if(attempt>0) await sleep(attempt===1?1500:4500);
    try{
      var tok=await accessToken();
      var r=await fetch('/api/store/import-image',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify({store_id:ST.id,url:u})});
      var j=await r.json();
      if(r.ok&&j.url) return {url:j.url};
      var reason=j.reason||'other';
      if(!RETRYABLE[reason]||attempt===2) return {error:reason};
    }catch(e){ if(attempt===2) return {error:'network'}; }
  }
  return {error:'other'};
}

      async function copyUrl(u){

        (fail&&blockedDominant?L(' — الموقع القديم عم يحظر النسخ (على الأغلب لأنو حسّ فيه طلبات كتير بوقت قصير). استنى شوي (ساعة أو أكتر) وجرّب «نسخ» مجدداً.',' — the old site is blocking the copier (likely rate-limiting). Wait a while (an hour or more) then press Copy again.'):

/* ============================================================
   نسخ احتياطي كامل (Backup / Restore) + فرمتة المتجر
   الملف: صف واحد لكل سجل بأي جدول: table, id, data(JSON كامل للسجل).
   بيغطّي: إعدادات المتجر، التصنيفات، المنتجات، السلايدر، البنرات،
   الماركات، الصفحات، الكوبونات. الصور نفسها بتضل بمخزن Supabase —
   الملف بيحفظ روابطها بس، مش الملفات الثنائية.
   لا يشمل: الطلبات والتقييمات والمشتركين (بيانات زبائن، مش إعداد متجر)،
   ولا مفاتيح بوابات الدفع (أسرار — ما بترجع للمتصفح أصلاً).
   ============================================================ */
var BACKUP_TABLES=['store_categories','store_products','store_slides','store_banners','store_brands','store_pages','store_coupons'];
async function fetchAllRows(table){
  var out=[], a=0;
  for(;;){ var r=await sb.from(table).select('*').eq('store_id',ST.id).range(a,a+999); if(r.error) throw r.error;
    out=out.concat(r.data||[]); if(!r.data||r.data.length<1000) break; a+=1000; }
  return out;
}
async function runBackup(){
  var rows=[['table','id','data']];
  var st=await sb.from('stores').select('*').eq('id',ST.id).single(); if(st.error) throw st.error;
  rows.push(['stores', ST.id, JSON.stringify(st.data)]);
  for(var i=0;i<BACKUP_TABLES.length;i++){
    var t=BACKUP_TABLES[i], list=await fetchAllRows(t);
    list.forEach(function(r){ rows.push([t, r.id, JSON.stringify(r)]); });
  }
  downloadCsv('backup-'+ST.slug+'-'+new Date().toISOString().slice(0,10)+'.csv', rows);
  return rows.length-1;
}
function groupBackupRows(text){
  var rows=parseCSV(text); if(!rows.length||rows[0][0]!=='table') throw new Error(L('هذا مش ملف نسخة احتياطية صحيح','This is not a valid backup file'));
  var by={}; rows.slice(1).forEach(function(r){ if(!r[0]) return; var d; try{d=JSON.parse(r[2]);}catch(e){return;} (by[r[0]]=by[r[0]]||[]).push(d); });
  return by;
}
async function insertRowsPlain(table,list){
  for(var i=0;i<list.length;i+=25){ var ch=list.slice(i,i+25).map(function(r){return Object.assign({},r,{store_id:ST.id})});
    var r=await sb.from(table).insert(ch); if(r.error) throw r.error; }
}
async function insertCategoriesOrdered(list){
  var byId={}; list.forEach(function(r){byId[r.id]=r});
  var done={}, left=list.slice();
  var guard=0;
  while(left.length&&guard++<50){
    var batch=left.filter(function(r){return !r.parent_id||done[r.parent_id]||!byId[r.parent_id];});
    if(!batch.length) batch=left; // كسر أي حلقة غير متوقعة
    await insertRowsPlain('store_categories', batch.map(function(r){return Object.assign({},r,{store_id:ST.id})}));
    batch.forEach(function(r){done[r.id]=1});
    var doneSet=done; left=left.filter(function(r){return !doneSet[r.id]});
  }
}
async function runRestore(text){
  var by=groupBackupRows(text);
  // 1) الحذف بالكامل قبل الاستعادة
  var delTables=BACKUP_TABLES.slice();
  for(var i=0;i<delTables.length;i++){ var r=await sb.from(delTables[i]).delete().eq('store_id',ST.id); if(r.error) throw r.error; }
  // 2) الاستعادة — التصنيفات أولاً (بترتيب يحترم الأب قبل الابن) لأن باقي الجداول بترجع لها
  if(by.store_categories) await insertCategoriesOrdered(by.store_categories);
  if(by.store_brands) await insertRowsPlain('store_brands', by.store_brands);
  if(by.store_products) await insertRowsPlain('store_products', by.store_products);
  if(by.store_slides) await insertRowsPlain('store_slides', by.store_slides);
  if(by.store_banners) await insertRowsPlain('store_banners', by.store_banners);
  if(by.store_pages) await insertRowsPlain('store_pages', by.store_pages);
  if(by.store_coupons) await insertRowsPlain('store_coupons', by.store_coupons);
  // 3) إعدادات المتجر — كل شي عدا هوية المتجر ذاتها
  if(by.stores&&by.stores[0]){
    var o=Object.assign({},by.stores[0]);
    ['id','client_id','slug','created_at','order_seq'].forEach(function(k){delete o[k];});
    var ru=await sb.from('stores').update(o).eq('id',ST.id); if(ru.error) throw ru.error;
    Object.assign(ST,o);
  }
  loaded={}; CATS=[]; PRODS=[]; BRANDS=[]; pe=null;
}

/* ============================================================
   نسخ احتياطي كامل (Backup / Restore) + فرمتة المتجر
   الملف: صف واحد لكل سجل بأي جدول: table, id, data(JSON كامل للسجل).
   بيغطّي: إعدادات المتجر، التصنيفات، المنتجات، السلايدر، البنرات،
   الماركات، الصفحات، الكوبونات. الصور نفسها بتضل بمخزن Supabase —
   الملف بيحفظ روابطها بس، مش الملفات الثنائية.
   لا يشمل: الطلبات والتقييمات والمشتركين (بيانات زبائن، مش إعداد متجر)،
   ولا مفاتيح بوابات الدفع (أسرار — ما بترجع للمتصفح أصلاً).
   ============================================================ */
var BACKUP_TABLES=['store_categories','store_products','store_slides','store_banners','store_brands','store_pages','store_coupons'];
async function fetchAllRows(table){
  var out=[], a=0;
  for(;;){ var r=await sb.from(table).select('*').eq('store_id',ST.id).range(a,a+999); if(r.error) throw r.error;
    out=out.concat(r.data||[]); if(!r.data||r.data.length<1000) break; a+=1000; }
  return out;
}
async function runBackup(){
  var rows=[['table','id','data']];
  var st=await sb.from('stores').select('*').eq('id',ST.id).single(); if(st.error) throw st.error;
  rows.push(['stores', ST.id, JSON.stringify(st.data)]);
  for(var i=0;i<BACKUP_TABLES.length;i++){
    var t=BACKUP_TABLES[i], list=await fetchAllRows(t);
    list.forEach(function(r){ rows.push([t, r.id, JSON.stringify(r)]); });
  }
  downloadCsv('backup-'+ST.slug+'-'+new Date().toISOString().slice(0,10)+'.csv', rows);
  return rows.length-1;
}
function groupBackupRows(text){
  var rows=parseCSV(text); if(!rows.length||rows[0][0]!=='table') throw new Error(L('هذا مش ملف نسخة احتياطية صحيح','This is not a valid backup file'));
  var by={}; rows.slice(1).forEach(function(r){ if(!r[0]) return; var d; try{d=JSON.parse(r[2]);}catch(e){return;} (by[r[0]]=by[r[0]]||[]).push(d); });
  return by;
}
async function insertRowsPlain(table,list){
  for(var i=0;i<list.length;i+=25){ var ch=list.slice(i,i+25).map(function(r){return Object.assign({},r,{store_id:ST.id})});
    var r=await sb.from(table).insert(ch); if(r.error) throw r.error; }
}
async function insertCategoriesOrdered(list){
  var byId={}; list.forEach(function(r){byId[r.id]=r});
  var done={}, left=list.slice();
  var guard=0;
  while(left.length&&guard++<50){
    var batch=left.filter(function(r){return !r.parent_id||done[r.parent_id]||!byId[r.parent_id];});
    if(!batch.length) batch=left; // كسر أي حلقة غير متوقعة
    await insertRowsPlain('store_categories', batch.map(function(r){return Object.assign({},r,{store_id:ST.id})}));
    batch.forEach(function(r){done[r.id]=1});
    var doneSet=done; left=left.filter(function(r){return !doneSet[r.id]});
  }
}
async function runRestore(text){
  var by=groupBackupRows(text);
  // 1) الحذف بالكامل قبل الاستعادة
  var delTables=BACKUP_TABLES.slice();
  for(var i=0;i<delTables.length;i++){ var r=await sb.from(delTables[i]).delete().eq('store_id',ST.id); if(r.error) throw r.error; }
  // 2) الاستعادة — التصنيفات أولاً (بترتيب يحترم الأب قبل الابن) لأن باقي الجداول بترجع لها
  if(by.store_categories) await insertCategoriesOrdered(by.store_categories);
  if(by.store_brands) await insertRowsPlain('store_brands', by.store_brands);
  if(by.store_products) await insertRowsPlain('store_products', by.store_products);
  if(by.store_slides) await insertRowsPlain('store_slides', by.store_slides);
  if(by.store_banners) await insertRowsPlain('store_banners', by.store_banners);
  if(by.store_pages) await insertRowsPlain('store_pages', by.store_pages);
  if(by.store_coupons) await insertRowsPlain('store_coupons', by.store_coupons);
  // 3) إعدادات المتجر — كل شي عدا هوية المتجر ذاتها
  if(by.stores&&by.stores[0]){
    var o=Object.assign({},by.stores[0]);
    ['id','client_id','slug','created_at','order_seq'].forEach(function(k){delete o[k];});
    var ru=await sb.from('stores').update(o).eq('id',ST.id); if(ru.error) throw ru.error;
    Object.assign(ST,o);
  }
  loaded={}; CATS=[]; PRODS=[]; BRANDS=[]; pe=null;
}
async function runFormatSite(){
  var tables=BACKUP_TABLES.concat(['store_subscribers','store_reviews','store_popups']);
  for(var i=0;i<tables.length;i++){ var r=await sb.from(tables[i]).delete().eq('store_id',ST.id); if(r.error) throw r.error; }
  loaded={}; CATS=[]; PRODS=[]; BRANDS=[]; pe=null;
}

async function saveSettings(){
  var b=$('#sSave'); b.disabled=true; showMsg('sMsg',L('عم نحفظ…','Saving…'));
  try{
    readZones();
    var nm=$('#sNm').value.trim(); if(!nm) throw new Error(L('اكتب اسم المتجر','Enter the store name'));
    var code=$('#sCur').value, dial=country($('#sCty').value)[3];
    var zones=setZones.filter(function(z){return String(z.n).trim()}).map(function(z){return {n:String(z.n).trim(),f:Number(z.f)||0}});
    var o={name:nm,tagline:$('#sTag').value.trim(),store_type:setType,country_code:$('#sCty').value,whatsapp:normPhone($('#sWa').value,dial),phone:$('#sPh').value.trim(),email:$('#sEm').value.trim(),
      address:$('#sAd').value.trim(),footer_note:$('#sFt').value.trim(),currency_code:code,currency_symbol:$('#sSym').value.trim()||CUR[code][0],currency_decimals:CUR[code][1],
      delivery_enabled:$('#sDel').checked,pickup_enabled:$('#sPick').checked,delivery_fee:num($('#sFee').value)||0,free_delivery_over:num($('#sFree').value),min_order:num($('#sMin').value)||0,
      shipping_zones:zones,size_guide:$('#sSG').value.trim(),seo_title:$('#sSeoT').value.trim(),seo_desc:$('#sSeoD').value.trim(),logo_height:Number($('#sLH').value)||44,
      instagram:$('#sIg').value.trim(),facebook:$('#sFb').value.trim(),tiktok:$('#sTk').value.trim(),is_active:$('#sAct').checked};
    if(!o.delivery_enabled&&!o.pickup_enabled) throw new Error(L('فعّل التوصيل أو الاستلام من المتجر','Enable delivery or store pickup'));
    if(setLogoPend) o.logo_url=await upload('logos',setLogoPend,1200);
    if(setFavPend) o.favicon_url=await upload('logos',setFavPend,256);
    if(setOgPend) o.og_image=await upload('logos',setOgPend,1200);
    var r=await sb.from('stores').update(o).eq('id',ST.id); if(r.error) throw r.error;
    Object.assign(ST,o); setLogoPend=null; setOgPend=null; setFavPend=null; paintShell(); showMsg('sMsg',L('تم الحفظ ✓','Saved ✓'),true); toast(L('تم حفظ الإعدادات ✓','Settings saved ✓'));
  }catch(e){showMsg('sMsg',errTxt(e),false);} b.disabled=false;
}

function gwModal(id){

    fields.map(function(f){

      else if(f.type==='textarea') h='<textarea data-gf="'+f.k+'" '+(f.ltr?'dir="ltr" ':'')+'placeholder="'+esc(f.secret&&has?L('محفوظ — اتركه فاضي لعدم التغيير','Saved — leave empty to keep'):(f.ph||''))+'" style="min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px">'+(f.secret?'':esc(hint))+'</textarea>';
      else h='<input type="'+(f.secret?'password':'text')+'" data-gf="'+f.k+'" autocomplete="off" '+(f.ltr?'dir="ltr" ':'')+'value="'+(f.secret||f.id?'':esc(hint))+'" placeholder="'+esc(f.secret&&has?L('محفوظ — اتركه فاضي لعدم التغيير','Saved — leave empty to keep'):(f.id&&hint?hint:(f.ph||'')))+'">';

    (g.test?'<button type="button" class="btn alt sm" id="gwTest">'+L('فحص المفاتيح','Test credentials')+'</button>':'');
  openModal(gwName(g),body,async function(){
    var cfg={}; $$('[data-gf]').forEach(function(e){cfg[e.dataset.gf]=e.value.trim()});

    var r=await sb.rpc('set_store_gateway',{p_store:ST.id,p_provider:id,p_enabled:$('#gwEn').checked,p_config:cfg}); if(r.error) throw r.error;
    await LOADERS.payments(); toast(L('تم الحفظ ✓','Saved ✓'));
  },L('حفظ','Save'),!!g.generic);
  var tb=$('#gwTest'); if(tb) tb.onclick=async function(){
    this.disabled=true; showMsg('mMsg',L('عم نفحص… (احفظ أولاً إذا غيّرت المفاتيح)','Testing… (save first if you changed the keys)'));

      if(j.ok) showMsg('mMsg','✓ '+(j.note||'OK'),true); else showMsg('mMsg',j.error||'Error',false);
    }catch(e){showMsg('mMsg',errTxt(e),false);} this.disabled=false;
  };
}

async function accessToken(){var s=await sb.auth.getSession(); return s.data.session&&s.data.session.access_token;}
async function domainApi(body){
  var tok=await accessToken();
  var r=await fetch('/api/store/domain',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify(Object.assign({store_id:ST.id},body))});
  var j={}; try{j=await r.json();}catch(e){}
  if(!r.ok||j.ok===false) throw new Error(j.error||('Error '+r.status));
  return j;
}

    return;}
  if(t.matches('[data-ost]')){
    var id=Number(t.dataset.ost), st=t.value, o={status:st}; if(st==='paid') o.paid_at=new Date().toISOString();
    sb.from('store_orders').update(o).eq('id',id).then(function(r){ if(r.error){alert(errTxt(r.error));LOADERS.orders();return;} var x=ORDERS.filter(function(z){return z.id===id})[0]; if(x) x.status=st; paintNav(); toast(L('تم تحديث الحالة','Status updated')); });return;}
  if(t.id==='rvOn'||t.id==='rvAuto'){ var o2={reviews_enabled:$('#rvOn').checked,reviews_auto:$('#rvAuto').checked}; sb.from('stores').update(o2).eq('id',ST.id).then(function(r){if(r.error)alert(errTxt(r.error));else{Object.assign(ST,o2);toast(L('تم الحفظ ✓','Saved ✓'));}});return;}
  if(t.id==='nlOn'){ var o3={newsletter_on:t.checked}; sb.from('stores').update(o3).eq('id',ST.id).then(function(r){if(r.error)alert(errTxt(r.error));else{Object.assign(ST,o3);toast(L('تم الحفظ ✓','Saved ✓'));}});return;}
  if(t.id==='codTgl'){ var o4={cod_enabled:t.checked}; sb.from('stores').update(o4).eq('id',ST.id).then(function(r){if(r.error){alert(errTxt(r.error));t.checked=!t.checked;}else{Object.assign(ST,o4);toast(L('تم الحفظ ✓','Saved ✓'));}});return;}
  if(t.id==='peFiles'){
    readPe(); var files=Array.prototype.slice.call(t.files).slice(0,60-pe.imgs.length); if(!files.length) return; showMsg('peMsg',L('عم نرفع الصور…','Uploading images…'));
    (async function(){ try{ for(var i=0;i<files.length;i++) pe.imgs.push(await upload('items',files[i],1200)); showMsg('peMsg',''); renderEditor(); }catch(x){showMsg('peMsg',errTxt(x),false);} })(); return;}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='peVid') ytPrev();
  if(t.id==='pePrice'||t.id==='peCmp'){ var p=Number($('#pePrice').value), c=Number($('#peCmp').value); $('#peDisc').textContent=(c>p&&p>0)?'-'+Math.round((1-p/c)*100)+'%':''; }
});

function gate(t,btn,href){ $('#gateNote').textContent=t; var b=$('#gateBtn'); if(btn){b.textContent=btn;b.href=href||'/login';b.classList.remove('hidden');} }
async function boot(){
  var s=await sb.auth.getSession();
  if(!s.data.session){ gate(L('لازم تسجّل دخولك أولاً — عم نحوّلك…','Please sign in first — redirecting…'));
    setTimeout(function(){location.href='/login?next='+encodeURIComponent(location.pathname)},800); return; }
  var seg=location.pathname.split('/').filter(Boolean), slug=(seg[0]==='portal-store'&&seg[1])?decodeURIComponent(seg[1]).toLowerCase():'';
  if(!slug){
    var mine=await sb.from('stores').select('slug').limit(1);
    if(mine.data&&mine.data[0]){ location.replace('/portal-store/'+mine.data[0].slug+'/admin'); return; }
    var lic=await sb.rpc('my_licenses'), l=(lic.data||[]).filter(function(x){return x.product==='store'&&x.slug})[0];
    if(l){ location.replace('/portal-store/'+l.slug+'/admin'); return; }
    gate(L('ما عندك متجر بعد. اشترك أو ابدأ تجربة مجانية من صفحة حسابك.','You do not have a store yet. Subscribe or start a free trial from your account.'),L('صفحة حسابي','My account'),'/account'); return;
  }
  var r=await sb.from('stores').select('*').eq('slug',slug).maybeSingle();
  if(r.error){ gate(errTxt(r.error),L('صفحة حسابي','My account'),'/account'); return; }
  if(r.data) ST=r.data;
  else{
    var e=await sb.rpc('ensure_store',{p_slug:slug});
    if(e.error||!e.data){ gate(L('هذا الحساب مش مربوط بهذا المتجر.','This account is not linked to this store.'),L('صفحة حسابي','My account'),'/account'); return; }
    ST=e.data;
  }
  var adm=await sb.rpc('is_admin'), cid=await sb.rpc('my_client_id');
  IMPERSONATE=!!(adm.data&&cid.data!==ST.client_id);
  var lc=await sb.rpc('store_license',{sid:ST.id}); LIC=lc.data||{ok:false};
  $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
  try{ var g=await sb.rpc('store_gateway_status',{p_store:ST.id}); GWS=g.data||{}; }catch(e2){}
  paintShell(); paintLic(); goTab('dashboard');
}
boot();
})();
</script>
