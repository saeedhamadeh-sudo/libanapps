<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المتجر — LibanApps</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#12324F;--ink2:#1B4670;--teal:#2C7A9E;--orange:#E08A2B;--bg:#F3F5F8;--card:#fff;
  --text:#1D2733;--muted:#66788A;--line:#E1E7EE;--ok:#1F8A55;--bad:#C0392B;--warn:#B7791F;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',system-ui,sans-serif;line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:13.5px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* دخول */
.gate{max-width:380px;margin:12vh auto;padding:28px;background:#fff;border-radius:16px;text-align:center;
  box-shadow:0 12px 40px rgba(18,50,79,.12)}
.gate h2{margin:0 0 8px;color:var(--ink)}

/* الهيكل */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--ink);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side .sb{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:10px}
.side .sb img{width:38px;height:38px;border-radius:10px;object-fit:cover;background:#fff2}
.side .sb b{font-size:16px;line-height:1.2;word-break:break-word}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 12px;border-radius:10px;
  color:#cfe0ee;font-weight:600;margin-bottom:2px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.nav .badge{margin-inline-start:auto;background:var(--orange);color:#fff;border-radius:99px;font-size:12px;padding:0 8px;min-width:22px;text-align:center}
.nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.main{padding:22px clamp(14px,3vw,34px) 60px;min-width:0}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar h1{margin:0;font-size:22px;color:var(--ink);margin-inline-end:auto}
.chip{display:inline-block;padding:2px 12px;border-radius:99px;font-size:13px;font-weight:700;background:#E8EEF4;color:var(--ink)}
.chip.ok{background:#DDF3E7;color:var(--ok)}.chip.warn{background:#FCEFD6;color:var(--warn)}.chip.bad{background:#FADDD9;color:var(--bad)}
.banner{background:#FCEFD6;color:#7A4E0F;border-radius:var(--r);padding:12px 16px;margin-bottom:16px;font-weight:600}
.banner.bad{background:#FADDD9;color:#8A2A20}
.menu-btn{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;
  background:var(--ink);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--ink2)}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.alt:hover{background:#F3F6FA}
.btn.dg{background:#fff;color:var(--bad);border:1px solid #F0C6C1}
.btn.ok{background:var(--ok)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}

.panel{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(18,50,79,.06)}
.panel h3{margin:0 0 12px;font-size:17px;color:var(--ink)}
.panel h3 small{font-weight:500;color:var(--muted);font-size:13px;margin-inline-start:8px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tools .sp{margin-inline-start:auto}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=url],input[type=password],input[type=datetime-local],select,textarea{
  width:100%;border:1px solid #CDD6E0;border-radius:9px;padding:9px 12px;background:#fff;min-height:40px}
textarea{resize:vertical;min-height:74px}
.tools input,.tools select{width:auto;min-width:150px}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-weight:700;font-size:13.5px;margin-bottom:4px}
label.f>small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px}
.g2{display:grid;gap:0 16px;grid-template-columns:1fr}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{display:grid;gap:0 16px;grid-template-columns:repeat(3,1fr)}}
.sw{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-weight:600}
.sw input{width:20px;height:20px;accent-color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 3px rgba(18,50,79,.06)}
.stat b{display:block;font-size:24px;color:var(--ink)}
.stat span{color:var(--muted);font-size:13px}

.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:start;font-size:12.5px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid #EEF2F6;vertical-align:middle}
.tbl tr:hover td{background:#FAFCFE}
.wrapx{overflow-x:auto}
.thumb{width:46px;height:46px;border-radius:9px;object-fit:cover;background:#E8EEF4;display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.tag{font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;background:#E8EEF4;color:var(--ink);margin-inline-end:4px;white-space:nowrap}
.tag.hot{background:#FDE3D0;color:#B4501A}.tag.off{background:#EEE;color:#777}.tag.low{background:#FADDD9;color:var(--bad)}

.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cd{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cd img{width:100%;aspect-ratio:16/8;object-fit:cover;background:#E8EEF4;display:block}
.cd .b{padding:12px}

/* الثيمات */
.themes{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tcard{border:2px solid var(--line);border-radius:14px;padding:10px;background:#fff;text-align:start;transition:.15s;position:relative}
.tcard:hover{border-color:#9DB5CC}
.tcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px rgba(18,50,79,.14)}
.tcard .nm{font-weight:800;margin:8px 2px 0;color:var(--ink)}
.tcard .ds{font-size:12.5px;color:var(--muted);margin:0 2px 6px}
.tcard .pv{display:block;margin-top:4px;font-size:13px}
.tp{border-radius:8px;overflow:hidden;background:var(--pbg);padding:8px;height:132px;display:flex;flex-direction:column;gap:6px;border:1px solid rgba(0,0,0,.08)}
.tp .h{height:12px;border-radius:3px;background:var(--pbrand);opacity:.95}
.tp .hero{flex:1.2;background:var(--pbrand);border-radius:var(--prad)}
.tp .row{display:flex;gap:6px;flex:1.4}
.tp .t{flex:1;background:var(--psurf);border-radius:var(--prad)}
.tp[data-t="maison"]{--pbg:#191512;--pbrand:#C9AE7C;--psurf:#3a3229;--prad:0}
.tp[data-t="maison"] .hero{background:linear-gradient(135deg,#6a4a2a,#191512)}
.tp[data-t="fresh"]{--pbg:#F2F6F1;--pbrand:#1F7A4D;--psurf:#fff;--prad:9px}
.tp[data-t="fresh"] .t{border:1px solid #d5e2d8}
.tp[data-t="volt"]{--pbg:#fff;--pbrand:#2340FF;--psurf:#FFD60A;--prad:3px}
.tp[data-t="volt"] .t,.tp[data-t="volt"] .hero{border:2px solid #0E0E12}
.tp[data-t="volt"] .t{box-shadow:2px 2px 0 #0E0E12}
.tp[data-t="petal"]{--pbg:#FFF1EE;--pbrand:#6B2D5C;--psurf:#fff;--prad:14px}
.tp[data-t="petal"] .t{background:linear-gradient(#f0728a55,#fff)}
.tp[data-t="atelier"]{--pbg:#fff;--pbrand:#171717;--psurf:#F2F1EE;--prad:0}
.tp[data-t="atelier"] .hero{background:#F2F1EE}
.tp[data-t="atelier"] .h{background:#171717}

/* نوافذ */
.ov{position:fixed;inset:0;background:rgba(15,25,36,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;
  overflow:auto;padding:4vh 12px}
.ov.on{display:flex}
.modal{background:#fff;border-radius:16px;width:min(720px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:18px;color:var(--ink)}
.modal .mb{padding:18px 20px}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:var(--muted)}
.x:hover{background:#EEF2F6}
.msg{min-height:20px;font-size:13.5px;font-weight:600;margin-top:6px}
.msg.e{color:var(--bad)}.msg.s{color:var(--ok)}
.upl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.upl img{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#E8EEF4}
.gal{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.gal .gi{position:relative}
.gal img{width:64px;height:64px;border-radius:9px;object-fit:cover}
.gal .gi button{position:absolute;top:-6px;inset-inline-end:-6px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font-size:14px;line-height:22px}
.yt{display:flex;gap:12px;align-items:center;margin-top:8px}
.yt img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#E8EEF4}
.copy{display:flex;gap:8px;align-items:center;background:#F3F6FA;border-radius:10px;padding:8px 12px;direction:ltr;font-family:monospace;font-size:14px;word-break:break-all}
.steps{margin:10px 0 0;padding-inline-start:20px}
.steps li{margin-bottom:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.kv b{color:var(--muted);font-weight:600}
pre.dns{background:#0F1B28;color:#D8E6F2;border-radius:10px;padding:12px 14px;direction:ltr;text-align:left;overflow:auto;font-size:13px;margin:8px 0}

@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:250px;z-index:90;transform:translateX(100%);transition:.2s;height:100vh}
  [dir="rtl"] .side{inset:0 0 0 auto}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
}
/* scrim خارج الـgrid دائماً */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:none}
.scrim.on{display:block}
@media print{.side,.bar .btn,.tools{display:none}}
</style>
</head>

function country(iso){return COUNTRIES.filter(function(c){return c[0]===iso})[0]||COUNTRIES[0]}
function normPhone(v,dial){
  var d=String(v||'').replace(/\D/g,''); if(!d) return '';
  if(d.indexOf('00')===0) d=d.slice(2);
  else if(d.indexOf(dial)===0&&d.length>dial.length+5) return d;
  else if(d.charAt(0)==='0') d=dial+d.replace(/^0+/,'');
  else if(d.length<=9) d=dial+d;
  return d;
}

function fm(n){
  n=Number(n)||0; var D=ST.currency_decimals;
  var t=n.toLocaleString('en-US',{minimumFractionDigits:n%1===0?0:D,maximumFractionDigits:D});
  var sym=ST.currency_symbol||ST.currency_code;
  return /[\u0600-\u06FF]/.test(sym)?(t+' '+sym):(sym+t);
}
function dt(d){ if(!d) return ''; var x=new Date(d); return x.toLocaleDateString('en-GB')+' '+x.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function toLocalInput(d){ if(!d) return ''; var x=new Date(d); x=new Date(x.getTime()-x.getTimezoneOffset()*60000); return x.toISOString().slice(0,16); }
function fromLocalInput(v){ return v?new Date(v).toISOString():null; }
function num(v){ v=String(v==null?'':v).trim(); if(v==='') return null; var n=Number(v); return isNaN(n)?null:n; }
function ytId(u){ u=String(u||'').trim(); if(/^[A-Za-z0-9_-]{11}$/.test(u)) return u;
  var m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
  return m?m[1]:'' }

function outType(f){var t=(f&&f.type)||''; return /png|webp|gif|svg/i.test(t)?{mime:'image/png',ext:'png'}:{mime:'image/jpeg',ext:'jpg'}}
function shrink(file,max){
  var out=outType(file);
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){var im=new Image();
      im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height));
        var cv=document.createElement('canvas'); cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s);
        var c=cv.getContext('2d'); c.clearRect(0,0,cv.width,cv.height); c.drawImage(im,0,0,cv.width,cv.height);
        cv.toBlob(function(b){b?res(b):rej(new Error('تعذّر تحويل الصورة'))},out.mime,0.86)};
      im.onerror=function(){rej(new Error('ملف الصورة غير صالح'))}; im.src=fr.result};
    fr.onerror=function(){rej(new Error('تعذّرت قراءة الملف'))}; fr.readAsDataURL(file);
  });
}
async function upload(bucket,file,max){
  var out=outType(file), blob=await shrink(file,max||900);
  var path='st-'+ST.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+out.ext;
  var up=await sb.storage.from(bucket).upload(path,blob,{contentType:out.mime});
  if(up.error) throw up.error;
  return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}
function thumbOf(u){ if(!u) return ''; var m=String(u).match(/\/storage\/v1\/object\/public\/(.+)$/); return m?('/img/'+m[1]):u; }

async function accessToken(){var s=await sb.auth.getSession(); return s.data.session&&s.data.session.access_token;}
async function domainApi(body){
  var tok=await accessToken();
  var r=await fetch('/api/store/domain',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
    body:JSON.stringify(Object.assign({store_id:ST.id},body))});
  var j={}; try{j=await r.json();}catch(e){}
  if(!r.ok||j.ok===false) throw new Error(j.error||('خطأ '+r.status));
  return j;
}

document.addEventListener('click',function(e){
  var t=e.target, el, id;

    if(r.error)alert(errTxt(r.error)); else LOADERS.products();}); return;}
  // سلايدر
  if(t.closest('#sNew')){slideModal();return;}
  if((el=t.closest('[data-se]'))){slideModal(el.dataset.se);return;}

    if(r.error)alert(errTxt(r.error)); else LOADERS.slides();}); return;}

    $$('.tcard').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.theme===pickedTheme))}); return;}
  if(t.closest('#dSave')){
    var b=t.closest('#dSave'); b.disabled=true; showMsg('dMsg','عم نحفظ…');
    var o={theme:pickedTheme,primary_color:$('#dCust').checked?$('#dColor').value:'',default_lang:$('#dLang').value,announcement:$('#dAnn').value.trim()};
    sb.from('stores').update(o).eq('id',ST.id).then(function(r){
      b.disabled=false; if(r.error) return showMsg('dMsg',errTxt(r.error),false);
      Object.assign(ST,o); showMsg('dMsg','تم الحفظ ✓ — شوف المتجر',true);});
    return;}

  if(t.closest('#dmAdd')){

    var bb=t.closest('#dmAdd'); bb.disabled=true; showMsg('dmMsg','عم نسجّل الدومين…');
    domainApi({action:'add',domain:dom}).then(function(j){DOMAINS=[j.domain];renderDomain(j);if(j.manual) showMsg('dmMsg',j.message||'',true);})
      .catch(function(er){showMsg('dmMsg',errTxt(er),false);bb.disabled=false;});

document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='oQ'){ordQ=t.value;renderOrders();var i=$('#oQ');i.focus();i.setSelectionRange(i.value.length,i.value.length);}
  if(t.id==='pQ'){prodQ=t.value;renderProds();var p=$('#pQ');p.focus();p.setSelectionRange(p.value.length,p.value.length);}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='oF'){ordFilter=t.value;renderOrders();}
  if(t.id==='pC'){prodCat=t.value;renderProds();}
  if(t.dataset&&t.dataset.ost){
    var id=Number(t.dataset.ost), v=t.value, o={status:v}; if(v==='paid') o.paid_at=new Date().toISOString();
    sb.from('store_orders').update(o).eq('id',id).then(function(r){
      if(r.error){alert(errTxt(r.error));LOADERS.orders();return;}
      ORDERS.forEach(function(x){if(x.id===id)Object.assign(x,o)}); renderOrders(); toastMsg('تم تحديث الحالة');});
  }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });

/* ---------- الإقلاع ---------- */
function gate(t,btn,href){ $('#gateNote').textContent=t; var b=$('#gateBtn'); if(btn){b.textContent=btn;b.href=href||'/login';b.classList.remove('hidden');} }
async function boot(){
  var s=await sb.auth.getSession();
  if(!s.data.session){ gate('لازم تسجّل دخولك أولاً — عم نحوّلك…');
    setTimeout(function(){location.href='/login?next='+encodeURIComponent(location.pathname)},800); return; }
  var seg=location.pathname.split('/').filter(Boolean), slug=(seg[0]==='portal-store'&&seg[1])?decodeURIComponent(seg[1]).toLowerCase():'';
  if(!slug){
    var mine=await sb.from('stores').select('slug').limit(1);
    if(mine.data&&mine.data[0]){ location.replace('/portal-store/'+mine.data[0].slug+'/admin'); return; }
    var lic=await sb.rpc('my_licenses'), l=(lic.data||[]).filter(function(x){return x.product==='store'&&x.slug})[0];
    if(l){ location.replace('/portal-store/'+l.slug+'/admin'); return; }
    gate('ما عندك متجر بعد. اشترك أو ابدأ تجربة مجانية من صفحة حسابك.','صفحة حسابي','/account'); return;
  }
  var r=await sb.from('stores').select('*').eq('slug',slug).maybeSingle();
  if(r.error){ gate(errTxt(r.error),'صفحة حسابي','/account'); return; }
  if(r.data) ST=r.data;
  else{
    var e=await sb.rpc('ensure_store',{p_slug:slug});
    if(e.error||!e.data){ gate('هذا الحساب مش مربوط بهذا المتجر.','صفحة حسابي','/account'); return; }
    ST=e.data;
  }
  var adm=await sb.rpc('is_admin'), cid=await sb.rpc('my_client_id');
  IMPERSONATE=!!(adm.data&&cid.data!==ST.client_id);
  var lc=await sb.rpc('store_license',{sid:ST.id}); LIC=lc.data||{ok:false};
  $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
  paintShell(); paintLic(); loaded.orders=1; LOADERS.orders();
}
boot();
})();
</script>
</body>
</html>
