<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--tc:#18181b;--bc:#18181b;--bt:#fff;--rad:14px;--bg:#f4f4f5;--bg2:#e4e4e7;--ff:'Tajawal'}
html,body{min-height:100%}
body{font-family:var(--ff),'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--tc);background:var(--bg);

html{background:var(--bg)}
html.g{background:var(--bg2)}
body.bg-gradient{background:linear-gradient(160deg,var(--bg),var(--bg2))}
body.bg-image{background:#111}
.bgimg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
.bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.55))}
.wrap{max-width:580px;margin:0 auto;padding:44px 18px 28px;display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh}
.topbar{position:fixed;top:12px;inset-inline-end:12px;display:flex;gap:8px;z-index:5}
.topbar button{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;font-size:16px;color:var(--tc);
  background:rgba(255,255,255,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.av{width:104px;height:104px;object-fit:cover;border-radius:50%;margin-bottom:14px;box-shadow:0 6px 24px rgba(0,0,0,.12);background:#fff}
.av.rounded{border-radius:26px}.av.square{border-radius:6px}
.av.ph{display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc);box-shadow:none}
h1{font-size:22px;font-weight:800;text-align:center;line-height:1.35;word-break:break-word}
.bio{margin-top:8px;font-size:15px;line-height:1.7;text-align:center;opacity:.85;white-space:pre-line;word-break:break-word;max-width:460px}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:16px 0 4px}
.socials a{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--tc);border-radius:50%;text-decoration:none;transition:transform .15s}
.socials a:hover{transform:translateY(-2px) scale(1.06)}
.list{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:22px}
.btn{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px;width:100%;
  border-radius:var(--rad);text-decoration:none;font-weight:700;font-size:15.5px;line-height:1.4;cursor:pointer;
  transition:transform .15s,box-shadow .15s,filter .15s;border:2px solid transparent;color:var(--bt);background:var(--bc)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.98)}
.btn .lbl{flex:1;text-align:center;min-width:0;word-break:break-word}
.btn .lbl small{display:block;font-weight:500;font-size:12.5px;opacity:.8;margin-top:1px}
.btn .th{width:42px;height:42px;border-radius:calc(var(--rad) * .6);object-fit:cover;flex:none}
.btn .ic{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.btn .sp{width:42px;flex:none}
.st-outline .btn{background:transparent;color:var(--bc);border-color:var(--bc)}
.st-soft .btn{background:color-mix(in srgb,var(--bc) 14%,transparent);color:var(--tc)}
.st-shadow .btn{box-shadow:0 8px 22px rgba(0,0,0,.18)}
.st-glass .btn{background:rgba(255,255,255,.16);color:var(--tc);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hdr{text-align:center;font-weight:800;font-size:16px;margin-top:10px;opacity:.9;word-break:break-word}
.sec{width:100%;margin-top:26px}
.sec>.sh{display:flex;align-items:center;gap:12px;font-weight:800;font-size:17px;margin-bottom:12px;word-break:break-word}
.sec>.sh::before,.sec>.sh::after{content:"";flex:1;height:1px;background:currentColor;opacity:.22}
.sec>.list{margin-top:0}
.map{width:100%;border-radius:min(var(--rad),22px);overflow:hidden;background:color-mix(in srgb,var(--tc) 8%,transparent);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.map .cap{background:var(--bc);color:var(--bt);font-weight:700;font-size:14.5px;padding:10px 14px;text-align:center}
.map iframe{display:block;width:100%;height:260px;border:0}
.map .go{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;font-weight:700;font-size:14px;text-decoration:none;color:var(--bt);background:var(--bc)}
.map .go small{opacity:.8;font-weight:500}
.st-outline .map .cap,.st-soft .map .cap,.st-glass .map .cap,.st-outline .map .go,.st-soft .map .go,.st-glass .map .go{background:rgba(0,0,0,.4);color:#fff}
.yt.short{max-width:340px;margin:0 auto}
.yt.short .fr{padding-top:177.78%}
.txt{text-align:center;font-size:14.5px;line-height:1.75;white-space:pre-line;opacity:.88;word-break:break-word;padding:0 6px}
.yt{width:100%;border-radius:min(var(--rad),22px);overflow:hidden;background:#000;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.yt .cap{background:var(--bc);color:var(--bt);font-weight:700;font-size:14.5px;padding:10px 14px;text-align:center}
.st-outline .yt .cap,.st-soft .yt .cap,.st-glass .yt .cap{background:rgba(0,0,0,.4);color:#fff}
.yt .fr{position:relative;padding-top:56.25%}
.yt iframe,.yt .poster{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt .poster{background-size:cover;background-position:center;cursor:pointer;display:flex;align-items:center;justify-content:center}
.yt .poster i{font-size:58px;color:#ff0033;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4));background:#fff;border-radius:16px;line-height:.8}
.hl-pulse{animation:pulse 1.8s ease-in-out infinite}
.hl-shake{animation:shake 3s ease-in-out infinite}
.hl-glow{animation:glow 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes shake{0%,84%,100%{transform:rotate(0)}87%{transform:rotate(-2deg)}90%{transform:rotate(2deg)}93%{transform:rotate(-1.5deg)}96%{transform:rotate(1deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bc) 55%,transparent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--bc) 0%,transparent)}}
@media (prefers-reduced-motion:reduce){.hl-pulse,.hl-shake,.hl-glow{animation:none}}
.vcard{margin-top:18px}
.brand{margin-top:auto;padding-top:36px;font-size:12.5px;opacity:.75;text-align:center}
.brand a{color:inherit;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:color-mix(in srgb,var(--tc) 12%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.gone{margin:auto;text-align:center;padding:40px 20px}
.gone .em{font-size:52px;margin-bottom:12px}
.gone h2{font-size:20px;margin-bottom:8px}
.gone p{opacity:.7;font-size:14.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 18px;border-radius:999px;
  font-size:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{width:100%;max-width:520px;margin:60px auto;display:flex;flex-direction:column;align-items:center;gap:14px}
.skel div{background:rgba(0,0,0,.07);border-radius:14px}
</style>

function safeUrl(u){
  u=String(u||'').trim(); if(!u) return '';
  if(/^(https?:|mailto:|tel:|sms:|geo:)/i.test(u)) return u;
  if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return '';            // أي بروتوكول تاني (javascript: ...) ممنوع

  spotify:['fa-brands fa-spotify',''], soundcloud:['fa-brands fa-soundcloud','https://soundcloud.com/'], github:['fa-brands fa-github','https://github.com/'],
  behance:['fa-brands fa-behance','https://behance.net/'], website:['fa-solid fa-globe',''], email:['fa-solid fa-envelope',''],
  phone:['fa-solid fa-phone',''], location:['fa-solid fa-location-dot','']

  if(/^https?:\/\//i.test(u) || /\.[a-z]{2,}(\/|$)/i.test(u)) return safeUrl(u);
  var base=(SOC[k]||[])[1]; return base?base+encodeURIComponent(u.replace(/^@/,'')):safeUrl(u);

function waNum(u){ var d=digits(u); if(/^00/.test(d)) d=d.slice(2); else if(/^0\d{7}$/.test(d)) d='961'+d.slice(1); else if(/^[378]\d{6,7}$/.test(d)&&d.length<=8) d='961'+d; return d; }
// خرائط Google: نستخرج المكان من الرابط لنعرض الخريطة داخل الصفحة
function mapQuery(u){
  u=String(u||'').trim(); if(!u) return '';
  if(!/^https?:/i.test(u)) return u;
  var m=u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return m[1]+','+m[2];
  try{ var x=new URL(u), q=x.searchParams.get('q')||x.searchParams.get('query')||x.searchParams.get('destination')||x.searchParams.get('ll');
    if(q) return q;
    var pl=x.pathname.match(/\/place\/([^/]+)/); if(pl) return decodeURIComponent(pl[1].replace(/\+/g,' '));
  }catch(e){}
  return '';
}
function itemHref(it){
  var u=String(it.url||'').trim();
  switch(it.kind){

  }
}
var KIND_IC={whatsapp:'fa-brands fa-whatsapp',phone:'fa-solid fa-phone',email:'fa-solid fa-envelope',location:'fa-solid fa-location-dot'};
function iconFor(it){
  var i=String(it.icon||'');
  if(i && SOC[i]) return '<span class="ic"><i class="'+SOC[i][0]+'"></i></span>';
  if(i && !/^[a-z-]+$/.test(i)) return '<span class="ic">'+esc(i.slice(0,4))+'</span>';   // إيموجي

    // قسم: يجمع كل ما بعده حتى القسم التالي
    if(it.kind==='header'){ h+='</div>'+(secOpen?'</section>':'')+'<section class="sec">'+(it.title?'<h2 class="sh" dir="auto">'+esc(it.title)+'</h2>':'')+'<div class="list">'; secOpen=true; return; }
    if(it.kind==='text'){ h+='<div class="txt" dir="auto">'+(it.title?'<b>'+esc(it.title)+'</b><br>':'')+esc(it.note)+'</div>'; return; }
    if(it.kind==='youtube'){
      var id=ytId(it.url); if(!id) return;
      var sh=/\/shorts\//i.test(it.url);
      h+='<div class="yt'+(sh?' short':'')+hl+'" data-yt="'+esc(it.id)+'">'+(it.title?'<div class="cap" dir="auto">'+esc(it.title)+'</div>':'');
      if(INAPP && !PREVIEW){
        // جوّا تيك توك وأمثاله: صورة الفيديو + زر تشغيل بيفتحه بيوتيوب مباشرة
        h+='<div class="fr"><a class="poster" href="'+esc(ytAppUrl(id))+'" data-item="'+esc(it.id)+'" data-ytid="'+esc(id)+'" aria-label="'+esc(t('play'))+'" style="background-image:url(\'https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg\')"><i class="fa-brands fa-youtube"></i></a></div></div>';
        return;
      }
      h+='<div class="fr"><iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?rel=0&playsinline=1" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="'+esc(it.title||'YouTube')+'"></iframe></div></div>';
      return;
    }
    if(it.kind==='location'){
      var q=mapQuery(it.url), go=itemHref(it);
      if(!go) return;
      h+='<div class="map'+hl+'">'+(it.title?'<div class="cap" dir="auto">'+esc(it.title)+'</div>':'')+
         (q?'<iframe src="https://maps.google.com/maps?q='+encodeURIComponent(q)+'&z=15&output=embed&hl='+LANG+'" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="'+esc(it.title||t('open_map'))+'"></iframe>':'')+
         '<a class="go" href="'+esc(go)+'" target="_blank" rel="noopener" data-item="'+esc(it.id)+'"><i class="fa-solid fa-diamond-turn-right"></i><span dir="auto">'+esc(t('open_map'))+(it.note?' <small>· '+esc(it.note)+'</small>':'')+'</span></a></div>';
      return;
    }
    var href=itemHref(it); if(!href) return;
    var th=img(it.thumb_url,160);
    var lead= th ? '<img class="th" src="'+esc(th)+'" alt="" loading="lazy">' : iconFor(it);
    var ext=/^https?:/i.test(href);
    h+='<a class="btn'+hl+'" href="'+esc(href)+'"'+(ext?' target="_blank" rel="noopener"':'')+' data-item="'+esc(it.id)+'">'+
       (lead||'<span class="sp"></span>')+
       '<span class="lbl" dir="auto">'+esc(it.title||it.url)+(it.note && it.kind!=='whatsapp'?'<small>'+esc(it.note)+'</small>':'')+'</span>'+
       '<span class="sp"></span></a>';
  });
  h+='</div>'+(secOpen?'</section>':'');
  h=h.replace(/<div class="list"><\/div>/g,'');
  if(soc && p.socials_pos==='bottom') h+='<div class="socials" style="margin-top:22px">'+soc+'</div>';
  if(p.show_vcard && (p.contact_phone||p.contact_email))
    h+='<div class="list vcard"><a class="btn" href="#" id="vcBtn"><span class="ic"><i class="fa-solid fa-address-card"></i></span><span class="lbl">'+esc(t('save_contact'))+'</span><span class="sp"></span></a></div>';
  if(!p.hide_brand) h+='<div class="brand"><a href="https://libanapps.com/link-info" target="_blank" rel="noopener"><i class="fa-solid fa-link"></i> '+esc(t('made_with'))+' LibanApps</a></div>';
  h+='</div>';
  root.innerHTML=h;
}

function vcard(){
  var p=PAGE||{};
  var nm=p.contact_name||p.title||'';
  var lines=['BEGIN:VCARD','VERSION:3.0','FN:'+nm,'N:'+nm+';;;;'];
  if(p.contact_org) lines.push('ORG:'+p.contact_org);
  if(p.contact_phone) lines.push('TEL;TYPE=CELL:'+String(p.contact_phone).replace(/[^\d+]/g,''));
  if(p.contact_email) lines.push('EMAIL:'+p.contact_email);
  lines.push('URL:'+pageUrl());
  lines.push('END:VCARD');
  var blob=new Blob([lines.join('\r\n')],{type:'text/vcard;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(p.slug||'contact')+'.vcf';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}

document.addEventListener('click',function(e){
  var a=e.target.closest('[data-item]');
  if(a && a.classList.contains('poster')){ hit(a.getAttribute('data-item')); return; }   // الرابط بيفتح يوتيوب لحاله
  if(a){ hit(a.getAttribute('data-item')); if(PREVIEW){ e.preventDefault(); } return; }
  if(e.target.closest('#vcBtn')){ e.preventDefault(); if(!PREVIEW) vcard(); return; }
  if(e.target.closest('#shareBtn')){
    var url=pageUrl(), title=(PAGE&&PAGE.title)||'';
    if(PREVIEW) return;
    if(navigator.share){ navigator.share({title:title,url:url}).catch(function(){}); return; }
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(function(){ toast(t('copied')); },function(){ prompt('',url); });
  }
});

function slugFromPath(){
  var m=location.pathname.match(/^\/(?:l|portal-link)\/([^/]+)/);
  return m?decodeURIComponent(m[1]).toLowerCase():'';
}
async function fetchPublic(){
  var r=await fetch(SB_URL+'/rest/v1/rpc/link_public',{method:'POST',
    headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},
    body:JSON.stringify({p_slug:SLUG})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
async function boot(){
  SLUG=slugFromPath();
  if(PREVIEW){
    window.addEventListener('message',function(e){
      if(e.origin!==location.origin || !e.data || e.data.type!=='lp-preview') return;
      render({ok:true,page:e.data.page,items:e.data.items});
    });
    try{ parent.postMessage({type:'lp-ready'},location.origin); }catch(e){}
    return;
  }
  var el=document.getElementById('lp-data'), d=null;
  if(el){ try{ d=JSON.parse(el.textContent); }catch(e){ d=null; } }
  if(!d){
    try{ d=await fetchPublic(); if(d && d.ok && !/[?&]_x=1/.test(location.search)) hit(null); }
    catch(e){
      document.getElementById('root').innerHTML='<div class="wrap"><div class="gone"><div class="em">⚠️</div><h2>'+esc(t('error'))+'</h2><p><button onclick="location.reload()" style="margin-top:12px;padding:10px 18px;border-radius:999px;border:0;background:#111;color:#fff;font:inherit;cursor:pointer">'+esc(t('retry'))+'</button></p></div></div>';
      return;
    }
  }
  render(d);
  // شيل علامة _x من الرابط بعد ما انفتحت بالمتصفح
  if(/[?&]_x=1/.test(location.search)){ try{ var cu=new URL(location.href); cu.searchParams.delete('_x'); history.replaceState(null,'',cu.pathname+cu.search+cu.hash); }catch(e){} }
  // جوّا تيك توك وأمثاله وفي فيديو بالصفحة: افتحها تلقائياً بالمتصفح الحقيقي (مرّة وحدة بس)
  else if(INAPP && d && d.ok && (d.items||[]).some(function(it){ return it.kind==='youtube' && ytId(it.url); })){
    var tried=false; try{ tried=sessionStorage.getItem('lp_ext')==='1'; sessionStorage.setItem('lp_ext','1'); }catch(e){}
    if(!tried) setTimeout(openExternal,400);
  }
}
window.__lpRender=render;
boot();
})();
</script>
