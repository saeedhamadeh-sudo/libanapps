<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>وصلة — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#7c3aed;--p2:#a855f7;--ink:#18181b;--mut:#71717a;--line:#e4e4e7;--bg:#f6f5fb;--card:#fff;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
html,body{min-height:100%}
body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--p)}
.hidden{display:none!important}
.muted{color:var(--mut)}
/* top */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.urlchip{display:flex;align-items:center;gap:6px;background:#f4f4f5;border-radius:999px;padding:6px 6px 6px 12px;min-width:0;flex:1;max-width:420px}
html[dir=rtl] .urlchip{padding:6px 12px 6px 6px}
.urlchip span{direction:ltr;unicode-bidi:plaintext;font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.ib{border:0;background:#fff;border-radius:999px;height:32px;min-width:32px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.ib:hover{background:#ede9fe}
.sp1{flex:1}
.lang{display:flex;background:#f4f4f5;border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font-weight:800;font-size:12.5px;cursor:pointer}
.lang button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
/* layout */
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding:18px 16px 110px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer;white-space:nowrap;color:var(--mut);display:flex;align-items:center;gap:8px}
.tabs button.on{background:#fff;color:var(--p);box-shadow:0 1px 6px rgba(0,0,0,.06)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:500;color:var(--mut);font-size:13px}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.banner.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.banner.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.banner .sp1{min-width:10px}
/* forms */
label.f,div.f{display:block;margin-bottom:12px}
.f>span{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
label.f>small,div.f>small{display:block;color:var(--mut);font-size:12.5px;margin-top:4px}
.in-t,select.in-t,textarea.in-t{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none;font-size:15px}
.in-t:focus{border-color:var(--p);box-shadow:0 0 0 3px #ede9fe}
textarea.in-t{resize:vertical;min-height:80px;line-height:1.6}
.ltr{direction:ltr;text-align:left}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--p)}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--p);color:#fff;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:default}
.btn.g{background:#f4f4f5;color:var(--ink)}
.btn.r{background:#fef2f2;color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btn.full{width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13.5px}
.seg button.on{border-color:var(--p);background:#f5f3ff;color:var(--p)}
.colr{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:5px 8px;background:#fff}
.colr input[type=color]{width:36px;height:30px;border:0;background:none;padding:0;cursor:pointer}
.colr input[type=text]{border:0;outline:none;width:100%;direction:ltr;font-weight:700;font-size:14px}
.upl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.upl .pv{width:72px;height:72px;border-radius:16px;background:#f4f4f5 center/cover no-repeat;border:1px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:22px}
/* items */
.add{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.add .btn{flex:1;min-width:180px;padding:14px;font-size:16px;border-radius:14px}
.items{display:flex;flex-direction:column;gap:10px}
.it{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.it.off{opacity:.55}
.it.drag{opacity:.4}
.it.over{outline:2px dashed var(--p)}
.it .hd{cursor:grab;color:#a1a1aa;padding:6px 2px;font-size:16px;flex:none}
.it .kic{width:40px;height:40px;border-radius:12px;background:#f5f3ff;color:var(--p);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;overflow:hidden}
.it .kic img{width:100%;height:100%;object-fit:cover}
.it .bd{flex:1;min-width:0}
.it .tt{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .uu{font-size:12.5px;color:var(--mut);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;unicode-bidi:plaintext}
.it .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--mut)}
.it .meta b{color:var(--ink)}
.it .acts{display:flex;align-items:center;gap:4px;flex:none}
.ic-b{width:36px;height:36px;border-radius:10px;border:0;background:#f4f4f5;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ic-b:hover{background:#ede9fe;color:var(--p)}
.ic-b.r:hover{background:#fef2f2;color:var(--bad)}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#d4d4d8;border-radius:999px;cursor:pointer;transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--ok)}
html[dir=ltr] .sw input:checked+span::after{transform:translateX(18px)}
html[dir=rtl] .sw input:checked+span::after{transform:translateX(-18px)}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.empty i{font-size:34px;color:#c4b5fd;margin-bottom:10px;display:block}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:#f4f4f5;color:var(--mut)}
.tag.sch{background:#eff6ff;color:#1d4ed8}
/* kinds picker */
.kinds{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kinds button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:start}
.kinds button:hover{border-color:var(--p);background:#faf5ff}
.kinds i{width:38px;height:38px;border-radius:11px;background:#f5f3ff;color:var(--p);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.kinds b{display:block;font-size:14.5px}
.kinds small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
/* socials */
.soc-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.soc-row select{width:150px;flex:none}
.soc-row .in-t{flex:1;min-width:0}
/* themes */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.th{border:2px solid var(--line);border-radius:16px;padding:0;cursor:pointer;overflow:hidden;background:#fff;text-align:center}
.th.on{border-color:var(--p);box-shadow:0 0 0 3px #ede9fe}
.th .sw2{height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
.th .sw2 i{display:block;width:80%;height:13px}
.th .nm{font-weight:800;font-size:12.5px;padding:7px 4px}
/* preview */
.pvw{position:sticky;top:76px;align-self:start}
.phone{width:340px;height:690px;margin:0 auto;border-radius:44px;background:#111;padding:12px;box-shadow:0 30px 60px -20px rgba(24,24,27,.45)}
.phone iframe{width:100%;height:100%;border:0;border-radius:34px;background:#fff}
.pvw .cap{text-align:center;margin-top:12px;font-size:13px;color:var(--mut)}
.mpv{display:none}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi small{color:var(--mut);font-weight:700;font-size:12.5px}
.kpi b{display:block;font-size:26px;font-weight:800;margin-top:4px}
.chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding-top:10px;border-bottom:1px solid var(--line)}
.chart .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;height:100%;position:relative}
.chart .v{background:#c4b5fd;border-radius:4px 4px 0 0;min-height:2px}
.chart .k{background:var(--p);border-radius:4px 4px 0 0}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
table.tb{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.tb td,.tb th{padding:9px 6px;border-bottom:1px solid #f4f4f5;text-align:start;word-break:normal;overflow-wrap:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb th{color:var(--mut);font-size:12.5px;font-weight:700}
.tb td.n,.tb th.n{width:70px;text-align:end}
.bar{display:flex;height:6px;border-radius:9px;background:#ede9fe;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--p);border-radius:9px}
/* qr */
.qrbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
#qr{background:#fff;padding:12px;border-radius:16px;border:1px solid var(--line);width:204px;height:204px}
#qr img,#qr canvas{width:180px!important;height:180px!important}
/* save bar */
.savebar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;background:#18181b;color:#fff;border-radius:16px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:calc(100% - 24px)}
html[dir=rtl] .savebar{padding:10px 18px 10px 10px}
.savebar .btn.g{background:#3f3f46;color:#fff}
/* modal */
.mdl{position:fixed;inset:0;z-index:50;background:rgba(24,24,27,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.mdl .box{background:#fff;border-radius:20px;width:100%;max-width:520px;box-shadow:0 30px 60px rgba(0,0,0,.25);margin-bottom:4vh}
.mdl .hd{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mdl .hd b{flex:1;font-size:17px}
.mdl .bd{padding:18px}
.mdl .ft{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 18px;flex-wrap:wrap}
.mdl .msg{margin:0 18px 12px}
.msg{border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.msg.e{background:#fef2f2;color:#991b1b}
.msg.o{background:#f0fdf4;color:#166534}
.mdl.pv .box{max-width:400px;background:transparent;box-shadow:none}
.mdl.pv .phone{width:100%;max-width:360px;height:calc(100vh - 140px);max-height:740px}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-10px);z-index:60;padding:11px 18px;border-radius:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;background:#18181b;color:#fff;max-width:calc(100% - 24px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.e{background:var(--bad)}
/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.gate .card{max-width:420px;text-align:center;padding:30px}
.gate .logo{justify-content:center;margin-bottom:16px}
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .pvw{display:none}
  .mpv{display:flex;position:fixed;bottom:16px;inset-inline-end:16px;z-index:25;width:56px;height:56px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:20px;box-shadow:0 10px 24px rgba(124,58,237,.45);align-items:center;justify-content:center;cursor:pointer}
  .savebar~.mpv{bottom:84px}
}
@media (max-width:620px){
  .top .in{flex-wrap:wrap;gap:8px}
  .urlchip{order:5;max-width:none;flex-basis:100%}
  .grid2,.grid3{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .soc-row select{width:120px}
  .it .hd{display:none}
  .it{padding:10px;gap:8px}
  .it .kic{width:34px;height:34px}
  .ic-b{width:32px;height:32px}
  .it{flex-wrap:wrap}
  .it .acts{gap:6px;width:100%;justify-content:flex-end;padding-top:8px;border-top:1px solid #f4f4f5}
  .tipdrag{display:none}
  .card{padding:14px}
}
</style>
</head>
<body>

<div class="gate" id="gate"><div class="card"><div class="logo"><i class="fa-solid fa-link"></i><span>وصلة</span></div><p id="gateNote" class="muted">…</p><a id="gateBtn" class="btn hidden" style="margin-top:16px" href="/account"></a>
  <form id="loginF" class="hidden" style="text-align:start;margin-top:14px" autocomplete="on">
    <p id="loginFor" class="muted" style="text-align:center;margin-bottom:14px;direction:ltr;font-weight:700"></p>
    <label class="f"><span data-t="lg_user"></span><input class="in-t ltr" id="lgUser" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="f"><span data-t="lg_pass"></span><input class="in-t ltr" id="lgPass" type="password" autocomplete="current-password" required></label>
    <div id="lgMsg"></div>
    <button class="btn full" type="submit" id="lgBtn" style="margin-top:6px"><i class="fa-solid fa-right-to-bracket"></i><span data-t="lg_btn"></span></button>
    <div class="lang" id="lgLang" style="margin:14px auto 0;width:max-content"></div>
  </form></div></div>

<div id="app" class="hidden">
  <header class="top"><div class="in">
    <a class="logo" id="logoLink" href="/account" title="LibanApps"><i class="fa-solid fa-link"></i><span data-t="brand"></span></a>
    <div class="urlchip"><span id="pubUrl"></span>
      <button class="ib" id="copyUrl" type="button"><i class="fa-regular fa-copy"></i><span data-t="copy"></span></button>
      <a class="ib" id="openUrl" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </div>
    <div class="sp1"></div>
    <div class="lang" id="langSw"></div>
    <a class="ib" id="acctLink" href="/account" style="background:#f4f4f5"><i class="fa-regular fa-user"></i><span data-t="my_account" class="hide-s"></span></a>
    <button class="ib hidden" id="logoutBtn" type="button" style="background:#f4f4f5"><i class="fa-solid fa-right-from-bracket"></i><span data-t="logout"></span></button>
  </div></header>

  <div class="shell">
    <main>
      <div id="banners"></div>
      <nav class="tabs" id="tabs"></nav>
      <div id="main"></div>
    </main>
    <aside class="pvw"><div class="phone"><iframe id="pvFrame" title="preview"></iframe></div><div class="cap" data-t="live_preview"></div></aside>
  </div>
  <div class="savebar hidden" id="saveBar"><span data-t="unsaved"></span><button class="btn g sm" id="discardBtn" type="button" data-t="discard"></button><button class="btn sm" id="saveBtn" type="button"><i class="fa-solid fa-check"></i><span data-t="save"></span></button></div>
  <button class="mpv" id="mpvBtn" type="button" aria-label="preview"><i class="fa-regular fa-eye"></i></button>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="/assets/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    (o.buttons&&o.buttons.length?'<div class="ft"></div>':'')+'</div>';
  document.body.appendChild(w); document.body.style.overflow='hidden';
  var api={el:w,$:function(s){return w.querySelector(s)},$$:function(s){return Array.prototype.slice.call(w.querySelectorAll(s))},
    close:function(){ w.remove(); if(!$('.mdl')) document.body.style.overflow=''; if(o.onClose) o.onClose(); },
    msg:function(m,k){ var el=w.querySelector('[data-msg]'); if(!m){ el.classList.add('hidden'); return; } el.className='msg '+(k||'e'); el.textContent=m; }};
  var x=w.querySelector('[data-x]'); if(x) x.onclick=api.close;

/* ================= رفع الصور ================= */
function shrink(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), im=new Image();
    im.onload=function(){ var s=Math.min(1,max/Math.max(im.width,im.height)), cv=document.createElement('canvas');
      cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s); var c=cv.getContext('2d');
      c.fillStyle='#fff'; c.fillRect(0,0,cv.width,cv.height); c.drawImage(im,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b?res(b):rej(new Error('image')); },'image/jpeg',q||0.86); };
    im.onerror=function(){ URL.revokeObjectURL(url); rej(new Error(t('img_only'))); };
    im.src=url;
  });
}
function pickFile(){ return new Promise(function(res){ var i=document.createElement('input'); i.type='file'; i.accept='image/*'; i.onchange=function(){ res(i.files&&i.files[0]||null); }; i.click(); }); }
async function uploadImg(folder,max){
  var f=await pickFile(); if(!f) return null;
  if(!/^image\//.test(f.type)) throw new Error(t('img_only'));
  var b=await shrink(f,max||800);
  var path='link-'+PG.id+'/'+folder+'/'+Date.now()+'-'+rnd(8)+'.jpg';
  chk(await sb.storage.from('link').upload(path,b,{contentType:'image/jpeg',upsert:false}));
  return sb.storage.from('link').getPublicUrl(path).data.publicUrl;
}

    var info=DOM.info||{}, altOk=info.alt_domain&&!info.alt_error;
    if(DOM.status!=='active'||(altOk&&info.alt_status!=='active')){
      var root=dmRoot(DOM.domain), hosts=[DOM.domain].concat(altOk?[info.alt_domain]:[]), hasRoot=false;
      function rel(n){n=String(n||'').replace(/\.$/,''); return n===root?'@':(n.slice(-(root.length+1))==='.'+root?n.slice(0,-(root.length+1)):n);}
      var rows=hosts.map(function(x){ if(x===root) hasRoot=true; return dnsRow('CNAME',rel(x),info.cname_target||DOM_T); }).join('');
      h+='<p style="font-weight:700;margin-bottom:8px">'+esc(t('dm_steps'))+'</p><table class="tb" style="table-layout:auto;margin-bottom:10px"><thead><tr><th>'+esc(t('dm_type'))+'</th><th>'+esc(t('dm_name'))+'</th><th>'+esc(t('dm_val'))+'</th></tr></thead><tbody>'+rows+'</tbody></table>';
      if(hasRoot) h+='<p class="muted" style="font-size:12.5px;margin:-4px 0 10px">'+esc(t('dm_alias'))+'</p>';
      var txts=(info.txt_name?dnsRow('TXT',rel(info.txt_name),info.txt_value):'')+(altOk&&info.alt_txt_name?dnsRow('TXT',rel(info.alt_txt_name),info.alt_txt_value):'');
      if(txts) h+='<p style="font-weight:700;margin-bottom:8px">'+esc(t('dm_txt'))+'</p><table class="tb" style="table-layout:auto;margin-bottom:10px"><tbody>'+txts+'</tbody></table>';
      h+='<p class="muted" style="font-size:12.5px">'+esc(t(DOM.cf_hostname_id?'dm_wait':'dm_manual'))+'</p>';
      if(info.errors&&info.errors.length) h+='<div class="msg e" style="margin-top:8px" dir="ltr">'+esc(info.errors.join(' · '))+'</div>';
    }
    h+='<div id="domMsg"></div><button class="btn r sm" type="button" id="domRm" style="margin-top:12px"><i class="fa-solid fa-link-slash"></i>'+esc(t('dm_rm'))+'</button>';
  }
  c.innerHTML=h;
  function msg(m,ok){ $('#domMsg').innerHTML=m?'<div class="msg '+(ok?'o':'e')+'" style="margin-top:10px">'+esc(m)+'</div>':''; }
  var add=$('#domAdd'); if(add) add.onclick=async function(){
    var v=$('#domIn').value.trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
    if(!/^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,24}$/.test(v)) return msg(t('e_dom_bad'));
    add.disabled=true; msg('');
    try{ var j=await domApi('add',{domain:v}); DOM=j.domain; paintDomain(); }catch(e){ msg(e.message); add.disabled=false; }
  };
  var ck=$('#domChk'); if(ck) ck.onclick=async function(){ ck.disabled=true;
    try{ var j=await domApi('refresh'); DOM=j.domain; var was=DOM.status; paintDomain(); paintShell(); msg(t(was==='active'?'dm_live':'dm_notyet'),was==='active'); }
    catch(e){ msg(e.message); ck.disabled=false; } };
  var rm=$('#domRm'); if(rm) rm.onclick=async function(){ if(!(await confirmBox(t('dm_rm_q')))) return; rm.disabled=true;
    try{ await domApi('remove'); DOM=null; paintDomain(); paintShell(); }catch(e){ msg(e.message); rm.disabled=false; } };
}

/* ================= دخول اللوحة وكلمة المرور ================= */
var PINFO=null;
async function loadPanelInfo(){ try{ var r=await sb.rpc('link_panel_info',{p_slug:PG.slug}); PINFO=r.data||null; }catch(e){ PINFO=null; } }
function paintPw(){
  var c=$('#pwCard'); if(!c) return;
  var u=panelUrl(), isPanel=!!(PINFO&&PINFO.is_panel);
  c.innerHTML='<h3><i class="fa-solid fa-key"></i>'+esc(t('pw_h'))+'</h3><p class="muted" style="font-size:13px;margin:-6px 0 10px">'+esc(t('pw_p'))+'</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><input class="in-t ltr" readonly value="'+esc(u)+'" style="flex:1;min-width:200px;font-weight:700"><button class="btn g" type="button" id="cpPanel"><i class="fa-regular fa-copy"></i>'+esc(t('copy'))+'</button></div>'+
    '<p style="margin-bottom:12px">'+esc(t('lg_user'))+': <b dir="ltr">'+esc((PINFO&&PINFO.username)||'admin')+'</b>'+(PINFO&&PINFO.is_default?' · '+esc(t('lg_pass'))+': <b dir="ltr">0000</b>':'')+'</p>'+
    (PINFO&&PINFO.is_default?'<div class="banner warn" style="margin-bottom:12px"><i class="fa-solid fa-triangle-exclamation"></i>'+esc(t('pw_default'))+'</div>':'')+
    '<div class="grid3">'+(isPanel?'<label class="f"><span>'+esc(t('pw_cur'))+'</span><input class="in-t ltr" type="password" id="pwCur" autocomplete="current-password"></label>':'')+
    '<label class="f"><span>'+esc(t('pw_new'))+'</span><input class="in-t ltr" type="password" id="pwNew" autocomplete="new-password"></label>'+
    '<label class="f"><span>'+esc(t('pw_new2'))+'</span><input class="in-t ltr" type="password" id="pwNew2" autocomplete="new-password"></label></div>'+
    '<div id="pwMsg"></div><button class="btn" type="button" id="pwBtn"><i class="fa-solid fa-key"></i>'+esc(t('pw_btn'))+'</button>';
  $('#cpPanel').onclick=function(){ (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){ toast(t('copied')); },function(){ prompt('',u); }); };
  function msg(m,ok){ $('#pwMsg').innerHTML=m?'<div class="msg '+(ok?'o':'e')+'" style="margin-bottom:10px">'+esc(m)+'</div>':''; }
  $('#pwBtn').onclick=async function(){
    var b=this, n1=$('#pwNew').value, n2=$('#pwNew2').value, cur=$('#pwCur')?$('#pwCur').value:'';
    if(n1.length<4) return msg(t('pw_short')); if(n1!==n2) return msg(t('pw_mismatch'));
    b.disabled=true; msg('');
    try{ var r=chk(await sb.rpc('link_panel_password',{p_page:PG.id,p_current:cur,p_new:n1}));
      if(!r||!r.ok){ msg(t(r&&r.reason==='current'?'pw_wrongcur':r&&r.reason==='short'?'pw_short':'err')); b.disabled=false; return; }
      await loadPanelInfo(); paintPw(); paintShell(); msg(t('pw_ok'),true); toast(t('pw_ok'));
    }catch(e){ msg(errText(e)); b.disabled=false; }
  };
}

/* ================= الحفظ ================= */
async function save(){
  var bt=$('#saveBtn'); bt.disabled=true; var old=bt.innerHTML; bt.textContent=t('saving');
  try{
    var patch={}; EDIT.forEach(function(k){ if(JSON.stringify(D[k])!==JSON.stringify(PG[k])) patch[k]=D[k]; });
    if(patch.socials) patch.socials=patch.socials.filter(function(s){ return s && s.u && String(s.u).trim(); }).map(function(s){ return {k:s.k,u:String(s.u).trim()}; });
    ['bg_color','bg_color2','text_color','btn_color','btn_text_color'].forEach(function(k){ if(k in patch && !/^#[0-9a-f]{6}$/i.test(patch[k])) throw new Error(t(k==='text_color'?'d_text':'d_color1')+': '+patch[k]); });
    var r=chk(await sb.from('link_pages').update(patch).eq('id',PG.id).select().single());
    PG=r; D=clone(pick(PG)); D.socials=Array.isArray(D.socials)?D.socials:[];
    $('#saveBar').classList.add('hidden'); toast(t('saved')); paintShell();
    if(TAB==='profile') paintSoc();
    preview();
  }catch(e){ toast(t('err')+': '+errText(e),true); }
  bt.disabled=false; bt.innerHTML=old;
}
function copyUrl(){ var u=pubUrl(); (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){ toast(t('copied')); },function(){ prompt('',u); }); }

/* ================= الأحداث ================= */
document.addEventListener('click',async function(e){
  var b;
  if((b=e.target.closest('[data-tab]'))){ go(b.dataset.tab); return; }
  if((b=e.target.closest('[data-lang]')) && !b.closest('#lgLang')){ LANG=b.dataset.lang; try{ localStorage.setItem('link_lang',LANG); }catch(x){} paintShell(); go(TAB); return; }
  if((b=e.target.closest('[data-seg] button'))){ var f=b.parentNode.dataset.seg; D[f]=b.dataset.v; $$('button',b.parentNode).forEach(function(z){ z.classList.toggle('on',z===b); });
    if(['bg_type'].indexOf(f)>=0) paintDesign(); if(['btn_style','btn_shape','bg_type'].indexOf(f)>=0) D.theme='custom'; markDirty(); if(TAB==='design') $$('.th').forEach(function(x){ x.classList.toggle('on',x.dataset.theme===D.theme); }); return; }
  if((b=e.target.closest('[data-theme]'))){ var th=THEMES[b.dataset.theme]; Object.keys(th).forEach(function(k){ if(k!=='n') D[k]=th[k]; }); D.theme=b.dataset.theme; paintDesign(); markDirty(); return; }
  if((b=e.target.closest('[data-edit]'))){ var it=ITEMS.filter(function(i){return i.id===b.dataset.edit})[0]; if(it) editItem(it); return; }
  if((b=e.target.closest('[data-del]'))){ var id=b.dataset.del; if(!(await confirmBox(t('confirm_del')))) return;
    try{ chk(await sb.from('link_items').delete().eq('id',id)); ITEMS=ITEMS.filter(function(i){return i.id!==id}); paintLinks(); preview(); }catch(x){ toast(errText(x),true); } return; }
  if((b=e.target.closest('[data-up]'))||(b=e.target.closest('[data-down]'))){ var ix=+(b.dataset.up!=null?b.dataset.up:b.dataset.down), to=b.dataset.up!=null?ix-1:ix+1;
    if(to<0||to>=ITEMS.length) return; var mv=ITEMS.splice(ix,1)[0]; ITEMS.splice(to,0,mv); paintLinks(); saveOrder(); return; }
  if((b=e.target.closest('[data-srm]'))){ D.socials.splice(+b.dataset.srm,1); paintSoc(); markDirty(); return; }
  if((b=e.target.closest('[data-sup]'))){ var si=+b.dataset.sup; if(si>0){ var s=D.socials.splice(si,1)[0]; D.socials.splice(si-1,0,s); paintSoc(); markDirty(); } return; }
});
document.addEventListener('change',async function(e){
  var el=e.target;
  if(el.dataset.tog){ var id=el.dataset.tog, v=el.checked; el.disabled=true;
    try{ var u=chk(await sb.from('link_items').update({is_active:v}).eq('id',id).select().single()); ITEMS=ITEMS.map(function(i){return i.id===id?u:i}); paintLinks(); preview(); }
    catch(x){ el.checked=!v; toast(errText(x),true); } el.disabled=false; return; }
  if(el.dataset.sk!=null){ D.socials[+el.dataset.sk].k=el.value; paintSoc(); markDirty(); return; }
  if(el.dataset.f && el.type==='checkbox'){ D[el.dataset.f]=el.checked; markDirty(); return; }
  if(el.dataset.f && el.tagName==='SELECT'){ D[el.dataset.f]=el.value; markDirty(); return; }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset.f && el.type!=='checkbox' && el.tagName!=='SELECT'){ D[el.dataset.f]=el.value; if(el.dataset.f==='bio'&&$('#bioN')) $('#bioN').textContent=el.value.length; markDirty(); return; }
  if(el.dataset.su!=null){ D.socials[+el.dataset.su].u=el.value; markDirty(); return; }
  if(el.dataset.cf){ D[el.dataset.cf]=el.value; var tx=$('[data-ct="'+el.dataset.cf+'"]'); if(tx) tx.value=el.value; D.theme='custom'; markDirty(); return; }
  if(el.dataset.ct){ var v=el.value.trim(); if(v && v[0]!=='#') v='#'+v; D[el.dataset.ct]=v; if(/^#[0-9a-f]{6}$/i.test(v)){ var c=$('[data-cf="'+el.dataset.ct+'"]'); if(c) c.value=v; } D.theme='custom'; markDirty(); return; }
});
$('#saveBtn').onclick=save;
$('#discardBtn').onclick=function(){ D=clone(pick(PG)); D.socials=Array.isArray(D.socials)?D.socials:[]; $('#saveBar').classList.add('hidden'); go(TAB); preview(); };
$('#copyUrl').onclick=copyUrl;
$('#mpvBtn').onclick=function(){
  var m=modal({cls:'pv',title:t('live_preview'),body:'<div class="phone"><iframe id="pvFrameM" title="preview"></iframe></div>'});
  m.$('#pvFrameM').src=pvSrc();
};
window.addEventListener('beforeunload',function(e){ if(D && PG && dirty()){ e.preventDefault(); e.returnValue=t('leave'); return t('leave'); } });

/* ================= البدء ================= */
function gate(txt,btn,href){ $('#gateNote').textContent=txt; var b=$('#gateBtn'); if(btn){ b.textContent=btn; b.href=href||'/account'; b.classList.remove('hidden'); } }
async function loadItems(){ ITEMS=chk(await sb.from('link_items').select('*').eq('page_id',PG.id).order('sort').order('created_at'))||[]; }
function showLogin(note){
  $('#gateBtn').classList.add('hidden'); $('#gateNote').textContent=t('lg_title');
  $('#loginFor').textContent=(ON_DOMAIN?location.host:location.host+'/l/'+PANEL.slug);
  $('#lgLang').innerHTML=LANGS.map(function(l){ return '<button type="button" data-lang="'+l+'" class="'+(l===LANG?'on':'')+'">'+({ar:'ع',en:'EN',fr:'FR'})[l]+'</button>'; }).join('');
  $('#loginF').classList.remove('hidden'); applyLang();
  $('#lgMsg').innerHTML=note?'<div class="msg e" style="margin-bottom:10px">'+esc(note)+'</div>':'';
  setTimeout(function(){ $('#lgUser').focus(); },50);
}
if(PANEL) $('#loginF').addEventListener('submit',async function(e){
  e.preventDefault(); var b=$('#lgBtn'); b.disabled=true; $('#lgMsg').innerHTML='';
  try{
    var r=await fetch('/api/link/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({slug:PANEL.slug,username:$('#lgUser').value.trim(),password:$('#lgPass').value})});
    var j={}; try{ j=await r.json(); }catch(x){}
    if(r.status===429) throw new Error(t('lg_locked',{m:1}));
    if(!j.ok){ throw new Error(j.error==='locked'?t('lg_locked',{m:j.minutes||15}):j.error==='bad'?t('lg_bad'):(t('lg_server')+(j.detail?' — '+j.detail:''))); }
    var v=await sb.auth.verifyOtp({token_hash:j.hashed_token,type:'magiclink'});
    if(v.error) throw v.error;
    $('#lgPass').value=''; $('#loginF').classList.add('hidden'); gate(t('loading')); boot();
  }catch(x){ $('#lgMsg').innerHTML='<div class="msg e" style="margin-bottom:10px">'+esc(errText(x))+'</div>'; }
  b.disabled=false;
});
$('#logoutBtn').onclick=async function(){ if(D&&PG&&dirty()&&!confirm(t('leave'))) return; try{ await sb.auth.signOut(); }catch(e){} location.reload(); };
document.addEventListener('click',function(e){ var b=e.target.closest('#lgLang [data-lang]'); if(!b) return; LANG=b.dataset.lang; try{ localStorage.setItem('link_lang',LANG); }catch(x){} showLogin(); });
async function boot(){
  applyLang();
  try{
    var s=await sb.auth.getSession();
    if(PANEL && !s.data.session){ showLogin(); return; }
    if(!s.data.session){ gate(t('need_login')); setTimeout(function(){ location.href='/login?next='+encodeURIComponent(location.pathname); },800); return; }
    var seg=location.pathname.split('/').filter(Boolean), slug=PANEL?PANEL.slug:((seg[0]==='portal-link'&&seg[1])?decodeURIComponent(seg[1]).toLowerCase():'');
    if(!slug){
      var mine=chk(await sb.from('link_pages').select('slug').order('created_at').limit(1));
      if(mine&&mine[0]){ location.replace('/portal-link/'+mine[0].slug+'/admin'); return; }
      var lic=chk(await sb.rpc('my_licenses'))||[]; var l=lic.filter(function(x){ return x.product==='link' && x.slug; })[0];
      if(l){ location.replace('/portal-link/'+l.slug+'/admin'); return; }
      gate(t('no_page'),t('my_account'),'/account'); return;
    }
    var r=await sb.from('link_pages').select('*').eq('slug',slug).maybeSingle();
    if(r.error){ gate(errText(r.error),t('my_account'),'/account'); return; }
    if(r.data) PG=r.data;
    else if(PANEL){ try{ await sb.auth.signOut(); }catch(x){} showLogin(); return; }
    else{ var e2=await sb.rpc('ensure_link_page',{p_slug:slug}); if(e2.error||!e2.data){ gate(t('not_linked'),t('my_account'),'/account'); return; } PG=e2.data; }
    var adm=await sb.rpc('is_admin'), cid=await sb.rpc('my_client_id');
    ADMIN=!!adm.data; IMP=!!(adm.data&&cid.data!==PG.client_id);
    LIC=chk(await sb.rpc('link_license',{pid:PG.id}))||{ok:false};
    await loadItems();
    try{ var dq=await sb.from('link_domains').select('*').eq('page_id',PG.id).maybeSingle(); DOM=dq.data||null; }catch(e){ DOM=null; }
    await loadPanelInfo();
    if(PANEL){ $('#acctLink').classList.add('hidden'); $('#logoutBtn').classList.remove('hidden'); $('#logoLink').href=pubUrl(); }
    D=clone(pick(PG)); D.socials=Array.isArray(D.socials)?D.socials:[];
    $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
    paintShell(); go('links');
    $('#pvFrame').src=pvSrc();
  }catch(e){ gate(errText(e),t('my_account'),'/account'); }
}
gate(t('loading'));
boot();
})();
</script>
