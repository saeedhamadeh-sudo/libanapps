var L=['ar','en','fr'], LANG='ar', TRIAL=7;

function t(k,v){ var a=T[k]; var r=a?(a[L.indexOf(LANG)]||a[0]):k; if(v) for(var x in v) r=r.split('{'+x+'}').join(v[x]); return r; }
function apply(){
  document.documentElement.lang=LANG; document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(el){ el.textContent=t(el.getAttribute('data-t')); });
  Array.prototype.forEach.call(document.querySelectorAll('#langSw button'),function(b){ b.classList.toggle('on',b.dataset.lang===LANG); });
  document.getElementById('pTrial').textContent=t('trial',{d:TRIAL});
}

var inp=document.getElementById('claimIn'), msg=document.getElementById('claimMsg');
inp.addEventListener('input',function(){ inp.value=inp.value.toLowerCase().replace(/[^a-z0-9-]/g,''); });

  e.preventDefault(); var v=inp.value.trim();
