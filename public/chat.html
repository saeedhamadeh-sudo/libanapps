*{box-sizing:border-box}html,body,#root{height:100%;margin:0}
body{font-family:Tajawal,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--txt);background:#d1d7db;-webkit-tap-highlight-color:transparent}

.hide{display:none!important}

.card{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:24px;width:100%;max-width:380px}

.in{width:100%;padding:11px 12px;border:1px solid #d1d7db;border-radius:9px;background:#fff;outline:none}.in:focus{border-color:var(--g2)}
.btn{border:0;border-radius:9px;padding:11px 16px;background:var(--g2);color:#fff;font-weight:700}.btn:disabled{opacity:.6}
.btn.full{width:100%;margin-top:16px}.btn.ghost{background:transparent;color:var(--g2);border:1px solid var(--line)}.btn.sm{padding:6px 10px;font-size:13px}.btn.red{background:var(--bad)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}.muted{color:var(--mut)}.link{color:var(--g2);background:none;border:0;padding:0;margin-top:14px;font-size:14px}
.langs{display:flex;gap:6px;justify-content:center;margin-top:14px}.langs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 10px;font-size:12px}

.top{height:60px;flex:0 0 60px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--hd);border-bottom:1px solid var(--line)}

.ib{border:0;background:transparent;width:38px;height:38px;border-radius:50%;font-size:19px;color:#54656f;display:inline-flex;align-items:center;justify-content:center}.ib:hover{background:rgba(0,0,0,.06)}

    '<label>'+esc(t('inbox_name'))+'</label><input class="in" id="sn" value="'+esc(INBOX.name)+'">'+
    '<label>'+esc(t('wc_key'))+' — '+(INBOX.has_key?'<span class="chip">'+esc(t('key_ok'))+'</span>':'<span class="chip off">'+esc(t('key_no'))+'</span>')+'</label><input class="in" id="sk" type="password" autocomplete="off" placeholder="'+esc(t('wc_key_ph'))+'" style="direction:ltr">'+
    (INBOX.motor?'<div class="muted" style="font-size:13px;margin-top:8px">🔗 '+esc(t('motor_link',{n:INBOX.motor_name||''}))+'</div>':
      '<label>'+esc(t('hook'))+'</label><div class="row"><div class="code" id="hk">'+esc(hook)+'</div><button class="btn sm" id="hc">'+esc(t('copy'))+'</button></div>'+
      '<label>'+esc(t('hook_secret'))+' — '+(INBOX.has_secret?'<span class="chip">'+esc(t('key_ok'))+'</span>':'<span class="chip off">'+esc(t('key_no'))+'</span>')+'</label><input class="in" id="ss" type="password" autocomplete="off" placeholder="whsec_…" style="direction:ltr">')+
    '<div class="row" style="margin-top:12px"><button class="btn" id="sv">'+esc(t('save'))+'</button><span class="err" id="se"></span></div>'+
    '<div class="sec"><div class="row" style="justify-content:space-between"><b>👥 '+esc(t('users'))+'</b><button class="btn sm" id="ua">+ '+esc(t('add_user'))+'</button></div><table class="ut" id="ut"></table></div>'+
    '<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" id="sx">'+esc(t('close'))+'</button></div>');
  function paintUsers(){ $('#ut',m).innerHTML=(USERS||[]).map(function(u,i){ return '<tr><td><b>'+esc(u.name)+'</b><div class="muted" style="font-size:12px;direction:ltr;text-align:start">'+esc(u.username)+'</div></td><td>'+esc(t(u.role==='main'?'r_main':'r_admin'))+'</td><td>'+(u.is_active?'<span class="chip">'+esc(t('active'))+'</span>':'<span class="chip off">'+esc(t('stopped'))+'</span>')+'</td><td style="text-align:end"><button class="btn ghost sm" data-ue="'+i+'">'+esc(t('edit'))+'</button></td></tr>'; }).join('');
    $$('[data-ue]',m).forEach(function(b){ b.onclick=function(){ userForm(USERS[+b.dataset.ue]); }; }); }
  paintUsers();
  $('#sx',m).onclick=function(){ m.remove(); };
  if($('#hc',m)) $('#hc',m).onclick=function(){ try{ navigator.clipboard.writeText(hook); toast(t('copied')); }catch(e){} };
  $('#ua',m).onclick=function(){ userForm(null); };
  $('#sv',m).onclick=async function(){ var b=this; b.disabled=true; $('#se',m).textContent='';
    try{ INBOX=await rpc('wa_settings_save',{p_token:TOK,p_data:{name:$('#sn',m).value.trim(),wc_api_key:$('#sk',m).value.trim(),wc_hook_secret:$('#ss',m)?$('#ss',m).value.trim():''}}); toast(t('saved')); m.remove(); var tt=$('.top .ttl'); if(tt&&tt.firstChild) tt.firstChild.textContent=INBOX.name||t('app'); }
    catch(e){ $('#se',m).textContent=errText(e); b.disabled=false; } };
  function userForm(u){
    var f=modal('<h3>'+esc(u?t('edit'):t('add_user'))+'</h3><label>'+esc(t('name'))+'</label><input class="in" id="un" value="'+esc(u?u.name:'')+'">'+
      '<label>'+esc(t('user'))+'</label><input class="in" id="uu" value="'+esc(u?u.username:'')+'" style="direction:ltr" autocapitalize="off">'+
      '<label>'+esc(u?t('new_pass'):t('pass'))+'</label><input class="in" id="up" type="password" autocomplete="new-password" style="direction:ltr">'+
      '<label>'+esc(t('role'))+'</label><select class="in" id="ur"><option value="admin">'+esc(t('r_admin'))+'</option><option value="main"'+(u&&u.role==='main'?' selected':'')+'>'+esc(t('r_main'))+'</option></select>'+
      (u?'<label style="display:flex;gap:8px;align-items:center;color:var(--txt)"><input type="checkbox" id="ua2"'+(u.is_active?' checked':'')+'> '+esc(t('active'))+'</label>':'')+
      '<div class="err" id="ue"></div><div class="row" style="justify-content:space-between;margin-top:10px">'+(u&&u.id!==ME.user_id?'<button class="btn red sm" id="ud">'+esc(t('del'))+'</button>':'<span></span>')+
      '<div class="row"><button class="btn ghost" id="uc">'+esc(t('cancel'))+'</button><button class="btn" id="us">'+esc(t('save'))+'</button></div></div>');
    $('#uc',f).onclick=function(){ f.remove(); };
    $('#us',f).onclick=async function(){ var b=this; b.disabled=true;
      try{ await rpc('wa_user_save',{p_token:TOK,p_data:{id:u?u.id:'',name:$('#un',f).value.trim(),username:$('#uu',f).value.trim(),password:$('#up',f).value,role:$('#ur',f).value,is_active:u?$('#ua2',f).checked:true}});
        var d=await rpc('wa_me',{p_token:TOK}); USERS=d.users; paintUsers(); f.remove(); toast(t('saved')); }
      catch(e){ $('#ue',f).textContent=errText(e); b.disabled=false; } };
    if($('#ud',f)) $('#ud',f).onclick=async function(){ if(!confirm(t('del_q',{n:u.name}))) return;
      try{ await rpc('wa_user_delete',{p_token:TOK,p_id:u.id}); var d=await rpc('wa_me',{p_token:TOK}); USERS=d.users; paintUsers(); f.remove(); }catch(e){ $('#ue',f).textContent=errText(e); } };
  }
}
// فتح محادثة من إشعار تطبيق الأندرويد
window.wachatOpen=function(ph){ if(ME) openChat(String(ph||'').replace(/\D/g,'')); };
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&ME){ loadChats(false); if(CUR) loadNew(); } });
if('serviceWorker' in navigator&&!BRIDGE){ try{ navigator.serviceWorker.register('/chat-sw.js',{scope:'/chat'}); }catch(e){} }
boot();
</script>
