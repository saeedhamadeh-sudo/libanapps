    const productionDate = wrap.querySelector('#wm_prod_date').value || '';
    const expiryDate = wrap.querySelector('#wm_exp_date').value || '';
    const expAlertRaw = wrap.querySelector('#wm_exp_alert').value.trim();
    const expiryAlertDays = expAlertRaw? Number(expAlertRaw) : null;
    const note = wrap.querySelector('#wm_note').value.trim();
    if(isNew){
      const qty = Number(wrap.querySelector('#wm_qty').value)||0;
      const date = wrap.querySelector('#wm_date').value || todayISO();
      if(qty<=0){ toast('لازم تحط كمية أكبر من صفر'); return; }
      const it = {id:uid(), createdAt:Date.now(), name, brand, type, barcode, productionDate, expiryDate, expiryAlertDays, note, purchaseDate:date};
      DB.warehouseItems.push(it);
      const stockIn = {id:uid(), createdAt:Date.now(), itemId:it.id, qty, date, number:nextStockInNumber(), note:'رصيد ابتدائي'};
      DB.stockIns.push(stockIn);
      const ok = await Promise.all([save(KEYS.warehouseItems, DB.warehouseItems), save(KEYS.stockIns, DB.stockIns)]);
      wrap.remove();
      toast(ok.every(Boolean)? 'تمت الإضافة إلى الستوك' : 'صار خطأ بالحفظ');
      go(`#/warehouse-item/${it.id}`);
    } else {
      item.name = name; item.brand = brand; item.type = type; item.barcode = barcode;
      item.productionDate = productionDate; item.expiryDate = expiryDate; item.expiryAlertDays = expiryAlertDays; item.note = note;
      const ok = await save(KEYS.warehouseItems, DB.warehouseItems);
      wrap.remove();
      toast(ok? 'تم حفظ التعديلات' : 'صار خطأ بالحفظ');
      render();
    }
  });
}
function openDeleteWarehouseItemModal(item){
  if(!item) return;
  const wrap = document.createElement('div');
  wrap.className='modal-bg';
  wrap.innerHTML = `<div class="modal">
    <h3 style="color:var(--debit)">⚠ حذف المنتج نهائيًا</h3>
    <p style="font-size:13.5px; color:var(--ink-soft); line-height:1.7;">
      رح يتحذف <b>${escapeHtml(item.name)}</b> نهائيًا مع كل سجلات الإضافة والسحب المرتبطة فيه. هيدا الإجراء ما بينرجع فيه.
    </p>
    <div class="field"><label>اكتب اسم المنتج بالكامل للتأكيد</label><input type="text" id="wdel_confirm" placeholder="${escapeHtml(item.name)}"></div>
    <div class="row">
      <button class="btn" id="wdel_cancel">إلغاء</button>
      <button class="btn btn-danger" id="wdel_confirm_btn">حذف نهائي</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#wdel_cancel').addEventListener('click', ()=>wrap.remove());
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector('#wdel_confirm_btn').addEventListener('click', async ()=>{
    const typed = wrap.querySelector('#wdel_confirm').value.trim();
    if(typed !== item.name){ toast('لازم تكتب الاسم متل ما هو بالضبط'); return; }
    DB.warehouseItems = DB.warehouseItems.filter(x=>x.id!==item.id);
    DB.stockIns = DB.stockIns.filter(x=>x.itemId!==item.id);
    DB.stockOuts = DB.stockOuts.filter(x=>x.itemId!==item.id);
    await Promise.all([save(KEYS.warehouseItems, DB.warehouseItems), save(KEYS.stockIns, DB.stockIns), save(KEYS.stockOuts, DB.stockOuts)]);
    wrap.remove();
    toast('تم حذف المنتج وكل بياناته نهائيًا');
    go('#/warehouse');
  });
}
function normalizePhone(raw){
  let p = String(raw||'').trim().replace(/[^0-9]/g,'');
  if(!p) return '';
  if(p.startsWith('961')) return p;
  if(p.startsWith('0')) return '961'+p.slice(1);
  return '961'+p;
}


/* ---------- Invoice form events (generic) ---------- */
function recalcItemRow(tr){
  const idx = Number(tr.getAttribute('data-idx'));
  const it = _itemDocDraft.items[idx];
  it.productId = tr.querySelector('.it-product').value;
  it.desc = tr.querySelector('.it-desc').value;
  it.qty = tr.querySelector('.it-qty').value;
  it.price = Number(tr.querySelector('.it-price').value)||0;
  it.total = autoTotalFromPrice(it);
}
function autoTotalFromPrice(it){
  const qty = Number(it.qty)||0;
  return Math.round((Number(it.price)||0) * qty * 100)/100;
}
function refreshInvoiceTotals(){
  const totals = computeInvoiceTotal(_itemDocDraft);
  const s = document.getElementById('totSubtotal'); if(s) s.textContent = fmtMoney(totals.subtotal);
  const dd = document.getElementById('totDiscount'); if(dd) dd.textContent = fmtMoney(totals.discount);
  const a = document.getElementById('totUSD'); if(a) a.textContent = fmtMoney(totals.totalUSD);
  const b = document.getElementById('totLBP'); if(b) b.textContent = fmtLBP(totals.totalLBP);
}
function bindItemDocFormEvents(){
  const body = document.getElementById('itemsBody');
  if(!body || !_itemDocDraft) return;
  const cfg = ITEMDOC_CFG[_itemDocDraft.__kind];

  document.getElementById('f_number').addEventListener('input', e=>_itemDocDraft.number=e.target.value);
  document.getElementById('f_date').addEventListener('input', e=>_itemDocDraft.date=e.target.value);
  document.getElementById('f_doctype').addEventListener('input', e=>_itemDocDraft.docType=e.target.value);
  document.getElementById('f_rate').addEventListener('input', e=>{ _itemDocDraft.exchangeRate=Number(e.target.value)||0; refreshInvoiceTotals(); });
  document.getElementById('f_discount').addEventListener('input', e=>{ _itemDocDraft.discount=Number(e.target.value)||0; refreshInvoiceTotals(); });

  body.querySelectorAll('.item-card').forEach(tr=>{
    const productSelect = tr.querySelector('.it-product');
    if(productSelect){
      productSelect.addEventListener('change', ()=>{
        const idx = Number(tr.getAttribute('data-idx'));
        const it = _itemDocDraft.items[idx];
        it.productId = productSelect.value;
        if(productSelect.value){
          const opt = productSelect.querySelector(`option[value="${productSelect.value}"]`);
          it.desc = opt ? opt.getAttribute('data-name') : it.desc;
        }
        render();
      });
    }
    tr.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        recalcItemRow(tr);
        const idx = Number(tr.getAttribute('data-idx'));
        const it = _itemDocDraft.items[idx];
        if(inp.classList.contains('it-price') || inp.classList.contains('it-qty')){
          it.total = autoTotalFromPrice(it);
          tr.querySelector('.it-total').value = it.total;
        }
        refreshInvoiceTotals();
      });
    });
  });
  body.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.getAttribute('data-rm'));
      if(_itemDocDraft.items.length<=1){ toast('لازم يبقى سطر واحد عالأقل'); return; }
      _itemDocDraft.items.splice(idx,1);
      render();
    });
  });
  const addItemBtn = document.getElementById('addItemBtn');
  if(addItemBtn) addItemBtn.addEventListener('click', ()=>{ _itemDocDraft.items.push(blankItem()); render(); });

  const saveBtn = document.getElementById('saveInvoiceBtn');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    if(!_itemDocDraft.number){ toast('لازم رقم '+cfg.title); return; }
    if(!_itemDocDraft.date){ toast('لازم تاريخ'); return; }
    if(cfg.numberUnique){
      const dupInv = DB[cfg.docArr].find(i=> i.number===_itemDocDraft.number && i.id!==_itemDocDraft.id);
      if(dupInv){ toast('رقم '+cfg.title+' هيدا مستخدم لفاتورة تانية — لازم يكون وحداني'); return; }
    }
    const hasItem = _itemDocDraft.items.some(it=>it.desc && Number(it.total)>0);
    if(!hasItem){ toast('ضيف سطر واحد عالأقل فيه وصف ومبلغ'); return; }
    let savedId;
    const isNewDoc = !_itemDocDraft.id;
    if(_itemDocDraft.id){
      const idx = DB[cfg.docArr].findIndex(i=>i.id===_itemDocDraft.id);
      const clean = {...(_itemDocDraft)}; delete clean.__editId; delete clean.__kind;
      DB[cfg.docArr][idx] = clean;
      savedId = clean.id;
    } else {
      const clean = {id:uid(), createdAt:Date.now(), [cfg.partyField]:_itemDocDraft[cfg.partyField], number:_itemDocDraft.number, date:_itemDocDraft.date, docType:_itemDocDraft.docType, exchangeRate:_itemDocDraft.exchangeRate, discount:_itemDocDraft.discount||0, items:_itemDocDraft.items};
      DB[cfg.docArr].push(clean);
      savedId = clean.id;
    }
    const ok = await save(KEYS[cfg.keyName], DB[cfg.docArr]);
    if(ok && isNewDoc && _itemDocDraft.__kind==='invoice'){
      const linkedItems = _itemDocDraft.items.filter(it=>it.productId && Number(it.qty)>0);
      if(linkedItems.length){
        linkedItems.forEach(it=>{
          DB.stockOuts.push({id:uid(), createdAt:Date.now(), itemId:it.productId, qty:Number(it.qty), date:_itemDocDraft.date, number:'INV-'+_itemDocDraft.number, note:'خصم تلقائي من فاتورة #'+_itemDocDraft.number});
        });
        await save(KEYS.stockOuts, DB.stockOuts);
      }
    }
    toast(ok? 'تم حفظ '+cfg.title:'صار خطأ بالحفظ');
    _itemDocDraft = null;
    go(cfg.viewRoute(savedId));
  });
}

/* ---------- Receipt form events ---------- */
function bindPaymentFormEvents(){
  const el = document.getElementById('r_number');
  if(!el || !_paymentDraft) return;
  const cfg = PAYMENT_CFG[_paymentDraft.__kind];
  el.addEventListener('input', e=>_paymentDraft.number=e.target.value);
  document.getElementById('r_date').addEventListener('input', e=>_paymentDraft.date=e.target.value);
  document.getElementById('r_amount').addEventListener('input', e=>_paymentDraft.amount=e.target.value);
  document.getElementById('r_details').addEventListener('input', e=>_paymentDraft.details=e.target.value);
  document.querySelectorAll('[data-method]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ _paymentDraft.method = btn.getAttribute('data-method'); render(); });
  });
  const saveBtn = document.getElementById('saveReceiptBtn');
  saveBtn.addEventListener('click', async ()=>{
    if(!_paymentDraft.number){ toast('لازم رقم'); return; }
    if(!_paymentDraft.date){ toast('لازم تاريخ'); return; }
    if(!(Number(_paymentDraft.amount)>0)){ toast('لازم مبلغ أكبر من صفر'); return; }
    let savedId;
    if(_paymentDraft.id){
      const idx = DB[cfg.arr].findIndex(r=>r.id===_paymentDraft.id);
      const clean = {...(_paymentDraft)}; delete clean.__editId; delete clean.__kind;
      DB[cfg.arr][idx] = clean;
      savedId = clean.id;
    } else {
      const clean = {id:uid(), createdAt:Date.now(), [cfg.partyField]:_paymentDraft[cfg.partyField], number:_paymentDraft.number, date:_paymentDraft.date, amount:Number(_paymentDraft.amount), method:_paymentDraft.method, details:_paymentDraft.details};
      DB[cfg.arr].push(clean);
      savedId = clean.id;
    }
    const ok = await save(KEYS[cfg.keyName], DB[cfg.arr]);
    toast(ok? 'تم حفظ '+cfg.title:'صار خطأ بالحفظ');
    _paymentDraft = null;
    go(cfg.viewRoute(savedId));
  });
}

/* ===== الإقلاع: التحقق من الاشتراك قبل فتح البرنامج ===== */
(async function(){
  const a = await bootPlatform();
  if(!a || !a.ok){
    if(a && a.reason === 'no_session') return;   // عم يتحوّل لصفحة الدخول
    platformBlockScreen(a || {reason:'error'});
    return;
  }
  if(PLATFORM_ADMIN){
    authenticated = true;
    currentUser = { id:'platform-admin', username:'PLATFORM', role:'superuser', permissions:[] };
    currentCustomerSession = null;
    init();
    if(document.readyState === 'loading')
      document.addEventListener('DOMContentLoaded', platformAdminBar);
    else platformAdminBar();
    return;
  }
  if(a.days_left <= 15){
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;inset-inline:0;bottom:0;z-index:9999;padding:9px;'+
      'text-align:center;font-family:system-ui;font-size:13.5px;font-weight:700;color:#fff;'+
      'background:'+(a.days_left<=5 ? '#C0392B' : '#E08A2B');
    bar.innerHTML = (a.trial ? 'تجربتك المجانية' : 'اشتراكك') + ' ينتهي بعد ' + a.days_left + ' يوم — ' +
      '<a href="/account?renew=' + (a.subscription_id||'') + '" style="color:#fff;text-decoration:underline">' +
      (a.trial ? 'اشترك الآن' : 'جدّد') + '</a>';
    document.addEventListener('DOMContentLoaded', ()=> document.body.appendChild(bar));
    setTimeout(()=>{ if(document.body) document.body.appendChild(bar); }, 1200);
  }
  init();
})();
</script>
