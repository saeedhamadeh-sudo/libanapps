<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>itech Accounting — دفتر الحسابات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2A38">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="itech Accounting">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-2:#EFEAE0;
    --ink:#1E2A38;
    --ink-soft:#4B5A68;
    --line:#D8D0BF;
    --bronze:#B08D57;
    --bronze-deep:#8C6D3F;
    --steel:#4A6670;
    --debit:#B54834;   /* فاتورة / قيد */
    --credit:#3F7D58;  /* قبض / دفعة */
    --white:#FFFFFF;
    --radius:10px;
    --shadow: 0 1px 2px rgba(30,42,56,.06), 0 6px 20px rgba(30,42,56,.06);
    --font-display:'Cairo', sans-serif;
    --font-body:'Tajawal', sans-serif;
    --font-num:'Roboto Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overscroll-behavior-y:contain;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    background-image:
      linear-gradient(var(--paper) 0%, var(--paper) 100%),
      repeating-linear-gradient(0deg, rgba(30,42,56,0.025) 0px, rgba(30,42,56,0.025) 1px, transparent 1px, transparent 28px);
  }
  ::selection{background:var(--bronze); color:#fff;}

  /* ---------- App shell ---------- */
  #app{max-width:1180px; margin:0 auto; padding:18px 16px 60px;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:14px 18px; margin-bottom:18px;
    background:var(--ink); color:var(--paper);
    border-radius:var(--radius); box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  .topbar::before{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(135deg, rgba(176,141,87,.10) 0 10px, transparent 10px 20px);
    pointer-events:none;
  }
  .brand{display:flex; flex-direction:column; gap:2px; position:relative;}
  .brand .name{font-family:var(--font-display); font-weight:800; font-size:20px; letter-spacing:.3px;}
  .brand .tag{font-size:11.5px; color:#C9D2D9; letter-spacing:.4px;}
  .brand .name b{color:var(--bronze);}
  .topbar-actions{display:flex; gap:8px; position:relative;}

  .btn{
    appearance:none; border:1px solid var(--line); background:var(--white);
    color:var(--ink); font-family:var(--font-body); font-weight:700; font-size:13.5px;
    padding:9px 14px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:hover{box-shadow:0 2px 10px rgba(30,42,56,.12); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:var(--bronze); border-color:var(--bronze-deep); color:#fff;}
  .btn-primary:hover{background:var(--bronze-deep);}
  .btn-ghost{background:transparent; border-color:rgba(255,255,255,.25); color:var(--paper);}
  .btn-ghost:hover{background:rgba(255,255,255,.08);}
  .btn-danger{color:var(--debit); border-color:#e3c3ba;}
  .btn-sm{padding:6px 10px; font-size:12.5px;}
  .btn-credit{background:var(--credit); border-color:#2f6144; color:#fff;}
  .btn-credit:hover{background:#33573c;}
  .btn-debit{background:var(--debit); border-color:#8f3a29; color:#fff;}
  .btn-debit:hover{background:#8f3a29;}

  .crumbs{display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:13px; color:var(--ink-soft);}
  .crumbs a{color:var(--steel); text-decoration:none; font-weight:700; cursor:pointer;}
  .crumbs a:hover{text-decoration:underline;}

  .card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px; margin-bottom:16px;
  }
  .card h2{font-family:var(--font-display); font-size:17px; margin:0 0 14px; display:flex; align-items:center; gap:8px;}
  .card h2 .dot{width:8px; height:8px; border-radius:50%; background:var(--bronze); display:inline-block;}

  .grid{display:grid; gap:12px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:700;}
  input[type=text], input[type=number], input[type=date], input[type=tel], input[type=password], select, textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px;
    font-family:var(--font-body); font-size:14.5px; background:var(--paper); color:var(--ink);
    outline:none; transition:border-color .12s ease, background .12s ease;
    -webkit-appearance:none; -moz-appearance:none; appearance:none;
    margin:0; line-height:1.4; min-height:40px;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--bronze); background:#fff;}
  .field{margin-bottom:12px;}
  .num{font-family:var(--font-num); direction:ltr; text-align:right;}

  /* ---------- Dashboard ---------- */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px;}
  @media(max-width:640px){.stats{grid-template-columns:1fr;}}
  .stat{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
  .stat .k{font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:6px;}
  .stat .v{font-family:var(--font-num); font-size:23px; font-weight:700;}
  .stat.owe .v{color:var(--debit);}
  .stat.credit .v{color:var(--credit);}

  .search-row{display:flex; gap:10px; margin-bottom:14px;}
  .search-row input{flex:1;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    background:var(--ink); color:var(--paper); font-family:var(--font-display); font-weight:700;
    padding:9px 10px; text-align:right; font-size:12.5px; letter-spacing:.2px;
  }
  thead th:first-child{border-radius:6px 0 0 0;}
  thead th:last-child{border-radius:0 6px 0 0;}
  tbody td{padding:10px; border-bottom:1px solid var(--paper-2);}
  tbody tr{cursor:pointer; transition:background .1s ease;}
  tbody tr:hover{background:var(--paper);}
  tbody tr:last-child td{border-bottom:none;}
  .bal-pos{color:var(--debit); font-weight:700; font-family:var(--font-num);}
  .bal-neg{color:var(--credit); font-weight:700; font-family:var(--font-num);}
  .bal-zero{color:var(--ink-soft); font-weight:700; font-family:var(--font-num);}
  .empty{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty .big{font-family:var(--font-display); font-size:16px; color:var(--ink); margin-bottom:6px; font-weight:700;}

  .pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
  .pill-debit{background:#F6E4DE; color:var(--debit);}
  .pill-credit{background:#E1EFE6; color:var(--credit);}

  /* ---------- customer page ---------- */
  .cust-head{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;}
  .cust-name{font-family:var(--font-display); font-size:21px; font-weight:800;}
  .cust-meta{color:var(--ink-soft); font-size:13px; margin-top:3px;}
  .action-row{display:flex; gap:8px; flex-wrap:wrap;}

  .item-card{border:1px solid var(--line); border-radius:9px; padding:12px; margin-bottom:10px; background:var(--paper);}
  .item-card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--bronze-deep);}
  .add-item-row{margin-top:8px;}
  .rm-btn{background:none; border:none; color:var(--debit); cursor:pointer; font-size:12.5px; font-weight:700; padding:2px 4px;}

  .totals-box{margin-top:14px; padding:14px; background:var(--paper); border-radius:8px; border:1px dashed var(--line);}
  .totals-box .row{display:flex; justify-content:space-between; padding:4px 0; font-size:14px;}
  .totals-box .row.big{font-weight:800; font-size:17px; border-top:1px solid var(--line); margin-top:6px; padding-top:10px;}
  .totals-box .row .v{font-family:var(--font-num);}

  /* ---------- printable documents ---------- */
  .doc{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; max-width:900px; margin:0 auto 16px;}
  .doc-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid var(--ink); padding-bottom:14px; margin-bottom:16px;}
  .doc-head .co-name{font-family:var(--font-display); font-weight:800; font-size:19px;}
  .doc-head .co-tag{font-size:11.5px; color:var(--ink-soft); margin-top:3px; line-height:1.6;}
  .doc-head .doc-title{font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--bronze-deep); text-align:left;}
  .doc-info{display:grid; grid-template-columns:1fr 1fr; gap:8px 24px; margin-bottom:16px; font-size:13.5px;}
  .doc-info .r{display:flex; justify-content:flex-start; align-items:baseline; gap:8px; border-bottom:1px dotted var(--line); padding:5px 0;}
  .doc-info .r b{font-family:var(--font-num);}
  .doc table{margin-top:6px;}
  .doc thead th{background:var(--paper-2); color:var(--ink); border-bottom:2px solid var(--ink); white-space:nowrap; font-size:11px;}
  .doc table th, .doc table td{border-left:1px solid var(--line);}
  .doc table th:last-child, .doc table td:last-child{border-left:none;}
  .invoice-items-table tbody td{border-bottom:none;}
  .invoice-items-table{border-bottom:2px solid var(--ink);}
  .ded-table th, .ded-table td{padding:8px 10px; font-size:13px;}
  .ded-table thead th{white-space:nowrap; font-size:12px;}
  .table-scroll{max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .doc{overflow-x:hidden;}
  .page-break-after{page-break-after:always; break-after:page;}
  @media print{ .page-break-after{margin-bottom:0;} }
  .ltr-doc{direction:ltr; text-align:left;}
  .ltr-doc .doc-info .r{justify-content:flex-start;}
  .ltr-doc .num{text-align:left; direction:ltr;}
  .ltr-doc table{direction:ltr;}
  .ltr-doc table th, .ltr-doc table td{border-left:none; border-right:1px solid var(--line);}
  .ltr-doc table th:last-child, .ltr-doc table td:last-child{border-right:none;}
  .ltr-doc .sig{text-align:right;}
  .ltr-doc .sig-line{margin-left:0; margin-right:auto;}
  .doc-foot{margin-top:16px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;}
  .words-box{flex:1; min-width:220px; font-size:13px; background:var(--paper); padding:10px 12px; border-radius:7px; border:1px dashed var(--line);}
  .amount-box{text-align:left;}
  .amount-box .line{font-family:var(--font-num); font-size:18px; font-weight:800;}
  .amount-box .line.lbp{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .sig{margin-top:8px; text-align:left; font-size:13px; color:var(--ink-soft);}
  .sig-line{margin-top:26px; width:180px; border-top:1px solid var(--ink-soft); margin-right:0; margin-left:auto;}

  .doc-actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; max-width:900px; margin:0 auto 10px;}

  @page{ size:A4; margin:10mm; }
  @media print{
    body{background:#fff;}
    .topbar, .crumbs, .doc-actions, .no-print{display:none !important;}
    #app{max-width:100%; padding:0;}
    .doc{box-shadow:none; border:none; margin:0; padding:0; transform-origin:top center;}
    .doc table th, .doc table td{padding:8px 14px;}
  }

  .modal-bg{position:fixed; inset:0; background:rgba(30,42,56,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal{background:#fff; border-radius:var(--radius); padding:20px; max-width:420px; width:100%; box-shadow:var(--shadow); max-height:calc(100vh - 32px); overflow-y:auto;}
  .modal h3{font-family:var(--font-display); margin:0 0 12px;}
  .modal .row{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13.5px; z-index:100; box-shadow:var(--shadow); opacity:0; transition:opacity .25s ease;}
  .toast.show{opacity:1;}

  .type-toggle{display:flex; gap:6px;}
  .type-toggle button{flex:1;}

  .settings-link{cursor:pointer; opacity:.85;}
  .settings-link:hover{opacity:1;}
  .app-footer{text-align:center; font-size:11.5px; color:var(--ink-soft); padding:18px 10px 6px; opacity:.75; letter-spacing:.2px;}
  .hub-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px;}
  @media(max-width:900px){.hub-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:640px){.hub-grid{grid-template-columns:1fr;}}
  .hub-card{background:var(--white); border:1px solid var(--line); border-radius:14px; padding:22px 18px; text-align:center; box-shadow:var(--shadow); cursor:pointer; transition:transform .1s ease, box-shadow .15s ease;}
  .hub-card:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(30,42,56,.14);}
  .hub-icon{font-size:32px; margin-bottom:8px;}
  .hub-title{font-family:var(--font-display); font-weight:800; font-size:18px; margin-bottom:4px;}
  .hub-sub{color:var(--ink-soft); font-size:12.5px; margin-bottom:8px;}
  .hub-amt{font-family:var(--font-num); font-weight:700; font-size:14px;}
  .hub-amt.owe{color:var(--debit);}

  @media(max-width:480px){
    #app{padding:10px 8px 40px;}
    .topbar{padding:10px 12px; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
    .brand{gap:0;}
    .brand img{height:26px !important;}
    .brand .name{font-size:14px; line-height:1.3;}
    .brand .tag{display:none;}
    .topbar-actions{width:100%; justify-content:flex-start; flex-wrap:wrap; gap:6px;}
    .topbar-actions .btn{padding:6px 10px; font-size:11.5px;}
    .card{padding:12px; margin-bottom:10px;}
    .card h2{font-size:14.5px; margin-bottom:10px;}
    .stats{gap:8px; margin-bottom:10px;}
    .stat{padding:10px 12px;}
    .stat .k{font-size:10.5px; margin-bottom:3px;}
    .stat .v{font-size:17px;}
    .cust-name{font-size:17px;}
    table{font-size:12px;}
    thead th{padding:7px 6px; font-size:10.5px;}
    tbody td{padding:7px 6px;}
    .action-row .btn{font-size:12px; padding:7px 10px;}
    .doc{padding:14px;}
    .doc-head .co-name{font-size:15px;}
    .doc-head .doc-title{font-size:16px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================= STORAGE ============================= */
const KEYS = {customers:'customers', invoices:'invoices', receipts:'receipts', settings:'settings',
  suppliers:'suppliers', purchaseInvoices:'purchaseInvoices', paymentVouchers:'paymentVouchers',
  workers:'workers', workEntries:'workEntries', workerPayments:'workerPayments',
  deductions:'deductions', quotes:'quotes',
  warehouseItems:'warehouseItems', stockIns:'stockIns', stockOuts:'stockOuts',
  cuttingOrders:'cuttingOrders', customerAccounts:'customerAccounts', workerAccounts:'workerAccounts',
  budgetCategories:'budgetCategories', budgetEntries:'budgetEntries'};

async function loadAll(){
  const [c,i,r,s,sup,pi,pv,wk,we,wp,ded,q,wi,si,so,co,ca,wa,bc,be] = await Promise.all([
    loadCustomers(),
    loadSyncedArray(KEYS.invoices, []),
    loadSyncedArray(KEYS.receipts, []),
    loadSettings({defaultExchangeRate:90000, invoiceStart:0, receiptStart:1000, companyName:'', companyTag:'', companyPhone:'', logo:'', auth:{username:'admin', password:'0000'}, autoBackupOnClose:false, quoteDescOptions:['شباك ألمنيوم','واجهة ألمنيوم','شباك حمام','باب مفصلات','شباك ثابت','زجاج'], customDeductionProfiles:[],
      specOptions:{
        systemName:['Sidem System','Technal System'],
        profile:['Sidem 2000','Technal GX'],
        aluType:['Qalex Qatar','Technal GX™'],
        color:['Dark Diamond Gray','Walnut Oak','Dark Marroun'],
        description:['Fixed Panels & Aluminum Sliding Doors.','Aluminum Sliding Windows.'],
        glazing:['6mm Annealed Clear / 6mm Space / 6mm Annealed Clear','6mm Annealed Clear / 9mm Space / 6mm Annealed Clear'],
        accessories:['Technal™','Burgh™','Folda™'],
        handles:['Technal™','Burgh™','Folda™'],
        gaskets:['Wrap Around Flush Gaskets EPDM'],
        fixings:['Concealed with matching endcaps, plugs and seals'],
        silicone:['Den Braven N+'],
        screws:['Stainless Steel SUS 316','Stainless Steel SUS 304'],
        flyScreen:['American Sliding Screen For Sliding Items'],
        note:['The Aluminum Doors & Windows will be sealed inside with PU and outside with Silicone Selant Den Braven No Acid.']
      }
    }),
    loadSyncedArray(KEYS.suppliers, []),
    loadSyncedArray(KEYS.purchaseInvoices, []),
    loadSyncedArray(KEYS.paymentVouchers, []),
    loadSyncedArray(KEYS.workers, []),
    loadSyncedArray(KEYS.workEntries, []),
    loadSyncedArray(KEYS.workerPayments, []),
    loadSyncedArray(KEYS.deductions, []),
    loadSyncedArray(KEYS.quotes, []),
    loadSyncedArray(KEYS.warehouseItems, []),
    loadSyncedArray(KEYS.stockIns, []),
    loadSyncedArray(KEYS.stockOuts, []),
    loadSyncedArray(KEYS.cuttingOrders, []),
    loadSyncedArray(KEYS.customerAccounts, []),
    loadSyncedArray(KEYS.workerAccounts, []),
    loadSyncedArray(KEYS.budgetCategories, []),
    loadSyncedArray(KEYS.budgetEntries, [])
  ]);
  return {customers:c, invoices:i, receipts:r, settings:s,
    suppliers:sup, purchaseInvoices:pi, paymentVouchers:pv,
    workers:wk, workEntries:we, workerPayments:wp,
    deductions:ded, quotes:q,
    warehouseItems:wi, stockIns:si, stockOuts:so,
    cuttingOrders:co, customerAccounts:ca, workerAccounts:wa,
    budgetCategories:bc, budgetEntries:be};
}
async function loadCustomers(){
  if(supabaseClient){
    const remote = await supabaseListCustomers();
    if(remote !== null){
      try{ localStorage.setItem('hmadeh_'+KEYS.customers, JSON.stringify(remote)); }catch(e){}
      return remote;
    }
    toast('ما قدرنا نوصل لقاعدة البيانات السحابية — عم نستخدم آخر نسخة محفوظة عالجهاز');
  }
  return safeGet(KEYS.customers, []);
}
async function safeGet(key, fallback){
  try{
    const raw = localStorage.getItem('hmadeh_'+key);
    if(raw !== null) return JSON.parse(raw);
    return fallback;
  }catch(e){ return fallback; }
}
async function save(key, value){
  try{
    localStorage.setItem('hmadeh_'+key, JSON.stringify(value));
  }catch(e){ console.error('storage error', key, e); return false; }
  if(key===KEYS.settings){
    syncSettingsToSupabase(value);
    syncUsersToSupabase(value.users||[]);
  } else {
    syncArrayToSupabase(key, value);
  }
  return true;
}

let DB = {customers:[], invoices:[], receipts:[], settings:{}, suppliers:[], purchaseInvoices:[], paymentVouchers:[], workers:[], workEntries:[], workerPayments:[], deductions:[], quotes:[], warehouseItems:[], stockIns:[], stockOuts:[], cuttingOrders:[], customerAccounts:[], workerAccounts:[], budgetCategories:[], budgetEntries:[]};
let authenticated = false;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============================= SUPABASE (CLOUD SYNC — CUSTOMERS PILOT) ============================= */
/* ===== الاتصال بمنصة LibanApps ===== */
const SUPABASE_URL = 'https://moriwmhlgugmjzddwfgv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ypfm_aulpcqBpeFpyD_7iw_mA4DNlR5';
let supabaseClient = null;
let lastSupabaseError = null;
try{
  if(window.supabase && window.supabase.createClient){
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
}catch(e){ console.error('Supabase init failed', e); }

/* ===== سياق الزبون: كل الجداول بسابقة alum_ ومربوطة بـclient_id ===== */
let CLIENT_ID = null;          // هوية المؤسسة المشتركة
let ACCESS = null;             // حالة الاشتراك
let PLATFORM_ADMIN = false;    // داخل كمشرف منصة (من لوحة /super)
let PLATFORM_CLIENT_NAME = '';
function T(name){ return 'alum_' + name; }            // اسم الجدول بالسحابة
function withClient(row){ return Object.assign({}, row, { client_id: CLIENT_ID }); }
function scoped(q){ return CLIENT_ID ? q.eq('client_id', CLIENT_ID) : q; }

function customerFromDb(row){
  return {
    id: row.id, name: row.name, accountNumber: row.account_number || '', phone: row.phone || '',

async function syncUsersToSupabase(users){
  if(!supabaseClient) return;
  try{
    if(users.length){
      const rows = users.map(userToDb).map(withClient);
      const { error } = await supabaseClient.from(T('app_users')).upsert(rows.map(withClient), {onConflict:'client_id,id'});
      if(error){
        lastSupabaseError = describeSupabaseError(error);
        console.error('app_users upsert error:', lastSupabaseError);
        toast('تم الحفظ محليًا بس صار خطأ بمزامنة المستخدمين مع السحابة');
        setTimeout(()=>{ if(lastSupabaseError) alert('تفاصيل خطأ مزامنة المستخدمين (خذ لقطة شاشة وابعتها):\n\n'+lastSupabaseError); }, 400);
        return;
      }
    }
    const usernames = users.map(u=>u.username);
    const delQuery = scoped(supabaseClient.from(T('app_users')).delete());
    const { error: delErr } = usernames.length
      ? await delQuery.not('username','in', `(${usernames.map(u=>`"${String(u).replace(/"/g,'""')}"`).join(',')})`)
      : await delQuery.neq('username','__none__');
    if(delErr){
      lastSupabaseError = describeSupabaseError(delErr);
      console.error('app_users cleanup error:', lastSupabaseError);
    }
    const { data: freshRows, error: fetchErr } = await scoped(supabaseClient.from(T('app_users')).select('*'));
    if(!fetchErr && freshRows && freshRows.length){
      DB.settings.users = freshRows.map(userFromDb);
      try{ localStorage.setItem('hmadeh_'+KEYS.settings, JSON.stringify(DB.settings)); }catch(e){}
    }
  }catch(e){
    lastSupabaseError = 'threw: '+(e && e.message);
    console.error('app_users sync threw:', e && e.message);
    toast('تم الحفظ محليًا بس صار خطأ بمزامنة المستخدمين مع السحابة');
    setTimeout(()=>{ if(lastSupabaseError) alert('تفاصيل خطأ مزامنة المستخدمين (خذ لقطة شاشة وابعتها):\n\n'+lastSupabaseError); }, 400);
  }
}
async function loadSettings(defaults){

  if(!supabaseClient) return local;
  let merged = local;
  try{
    const { data, error } = await scoped(supabaseClient.from(T('app_settings')).select('*')).maybeSingle();
    if(!error && data) merged = applySettingsFromDb(data, merged);
    else if(error){ lastSupabaseError = describeSupabaseError(error); console.error('app_settings load error:', lastSupabaseError); }
  }catch(e){ lastSupabaseError = 'threw: '+(e && e.message); console.error('app_settings load threw:', e && e.message); }
  try{
    const { data, error } = await scoped(supabaseClient.from(T('app_users')).select('*'));
    if(!error && data && data.length) merged.users = data.map(userFromDb);
    else if(error){ lastSupabaseError = describeSupabaseError(error); console.error('app_users load error:', lastSupabaseError); }
  }catch(e){ lastSupabaseError = 'threw: '+(e && e.message); console.error('app_users load threw:', e && e.message); }

/* ============================= TOTP (2FA) — RFC 6238 ============================= */
const TOTP_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function base32Encode(bytes){
  let bits = '', output = '';
  for(const byte of bytes) bits += byte.toString(2).padStart(8,'0');
  for(let i=0;i+5<=bits.length;i+=5) output += TOTP_ALPHABET[parseInt(bits.substr(i,5),2)];
  if(bits.length % 5 !== 0){
    const remainder = bits.slice(bits.length - (bits.length%5));
    output += TOTP_ALPHABET[parseInt(remainder.padEnd(5,'0'),2)];
  }
  return output;
}
function base32Decode(str){
  str = String(str||'').replace(/=+$/,'').toUpperCase().replace(/[^A-Z2-7]/g,'');
  let bits = '';
  for(const c of str){ const idx = TOTP_ALPHABET.indexOf(c); if(idx===-1) continue; bits += idx.toString(2).padStart(5,'0'); }
  const bytes = [];
  for(let i=0;i+8<=bits.length;i+=8) bytes.push(parseInt(bits.substr(i,8),2));
  return new Uint8Array(bytes);
}
function generateTotpSecret(){
  const bytes = new Uint8Array(20);
  crypto.getRandomValues(bytes);
  return base32Encode(bytes);
}
async function computeTotp(secretBase32, forTime){
  const key = base32Decode(secretBase32);
  const counter = Math.floor((forTime===undefined? Date.now() : forTime)/1000/30);
  const buf = new ArrayBuffer(8);
  new DataView(buf).setBigUint64(0, BigInt(counter), false);
  const cryptoKey = await crypto.subtle.importKey('raw', key, {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
  const hmac = new Uint8Array(await crypto.subtle.sign('HMAC', cryptoKey, buf));
  const offset = hmac[hmac.length-1] & 0xf;
  const binCode = ((hmac[offset]&0x7f)<<24) | ((hmac[offset+1]&0xff)<<16) | ((hmac[offset+2]&0xff)<<8) | (hmac[offset+3]&0xff);
  return (binCode % 1000000).toString().padStart(6,'0');
}
async function verifyTotp(secretBase32, token){
  token = String(token||'').trim();
  if(!/^\d{6}$/.test(token)) return false;
  const now = Date.now();
  for(let w=-1; w<=1; w++){
    const code = await computeTotp(secretBase32, now + w*30000);
    if(code === token) return true;
  }
  return false;
}
function totpAuthUri(username, secret){
  const issuer = encodeURIComponent(DB.settings.companyName || 'LibanApps');
  const label = encodeURIComponent(`${DB.settings.companyName||'دفتر الحسابات'}:${username}`);
  return `otpauth://totp/${label}?secret=${secret}&issuer=${issuer}&digits=6&period=30`;
}

/* ---------- Fit any invoice/statement onto a single A4 page when printing ---------- */
function fitDocsToPage(){
  const isLandscape = !!document.getElementById('print-orientation-style');
  const PAGE_H_PX = (isLandscape ? (210-20) : (297-20)) * 3.7795; // A4 height minus 10mm top+bottom margins, at 96dpi
  document.querySelectorAll('.doc:not(.no-autofit)').forEach(doc=>{
    doc.style.transform=''; doc.style.width=''; doc.style.transformOrigin='top center';
    const h = doc.scrollHeight;
    if(h > PAGE_H_PX){
      const scale = Math.max(PAGE_H_PX / h, 0.45);
      doc.style.transform = `scale(${scale})`;
      doc.style.width = `${100/scale}%`;
    }
  });
}

/* ---------- Arabic number to words (for currency lines) ---------- */
const ONES=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];
const TEENS=['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const TENS=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const HUNDREDS=['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];
function threeDigits(n){
  n=Math.floor(n);
  let parts=[];
  const h=Math.floor(n/100), r=n%100;
  if(h) parts.push(HUNDREDS[h]);
  if(r>=10 && r<20) parts.push(TEENS[r-10]);
  else{
    const t=Math.floor(r/10), o=r%10;
    let sub=[];
    if(o) sub.push(ONES[o]);
    if(t) sub.push(TENS[t]);
    if(sub.length) parts.push(sub.join(' و'));
  }
  return parts.join(' و');
}
function scaleWord(n, singular, dual, plural){
  if(n===1) return singular;
  if(n===2) return dual;
  if(n>=3 && n<=10) return threeDigits(n)+' '+plural;
  return threeDigits(n)+' '+singular;
}
function numberToArabicWords(num){
  num = Math.round(Number(num)||0);
  if(num===0) return 'صفر';
  const million=Math.floor(num/1000000);
  const thousand=Math.floor((num%1000000)/1000);
  const rest=num%1000;
  let parts=[];
  if(million) parts.push(scaleWord(million,'مليون','مليونان','ملايين'));
  if(thousand) parts.push(scaleWord(thousand,'ألف','ألفان','آلاف'));
  if(rest) parts.push(threeDigits(rest));
  return parts.join(' و');
}
function amountWords(usd){
  const whole = Math.floor(usd);
  const cents = Math.round((usd-whole)*100);
  let s = 'فقط ' + numberToArabicWords(whole) + ' دولار أمريكي';
  if(cents>0) s += ' و' + numberToArabicWords(cents) + ' سنت';
  s += ' لا غير';
  return s;
}

/* ============================= LEDGER LOGIC ============================= */
// Build combined, sorted ledger entries for a customer, with running balance.
function buildLedger(customerId){
  const cust = DB.customers.find(c=>c.id===customerId);
  const inv = DB.invoices.filter(i=>i.customerId===customerId && !i.deleted).map(i=>({
    date:i.date, type:'قيد', label:'فاتورة بالحساب', number:i.number,
    from:0, to:computeInvoiceTotal(i).totalUSD, ref:'invoice', id:i.id, sortKey:i.createdAt||0
  }));
  const rec = DB.receipts.filter(r=>r.customerId===customerId && !r.deleted).map(r=>({
    date:r.date, type:'قبض', label:r.details? r.details : 'دفعة بالحساب', number:r.number,
    from:Number(r.amount)||0, to:0, ref:'receipt', id:r.id, sortKey:r.createdAt||0
  }));
  let rows=[...inv,...rec];
  rows.sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date?-1:1;
    if(a.ref!==b.ref) return a.ref==='receipt' ? -1 : 1;
    return (a.sortKey||0)-(b.sortKey||0);
  });
  let bal = 0;
  const out = rows.map(r=>{
    bal = bal - r.from + r.to;
    return {...r, balance:bal};
  });
  const totFrom = rows.reduce((s,r)=>s+r.from,0);
  const totTo = rows.reduce((s,r)=>s+r.to,0);
  return {rows:out, totFrom, totTo, finalBalance:bal};
}
function customerBalance(customerId){
  return buildLedger(customerId).finalBalance;
}
function computeInvoiceTotal(inv){
  const subtotal = (inv.items||[]).reduce((s,it)=>s+(Number(it.total)||0),0);
  const discount = Number(inv.discount)||0;
  const totalUSD = Math.max(subtotal - discount, 0);
  const totalLBP = totalUSD * (Number(inv.exchangeRate)||DB.settings.defaultExchangeRate||90000);
  return {subtotal, discount, totalUSD, totalLBP};
}

function getDeductionType(key){
  if(DEDUCTION_TYPES[key]) return DEDUCTION_TYPES[key];
  const custom = (DB.settings.customDeductionProfiles||[]).find(p=>p.key===key);
  if(custom) return custom;
  return DEDUCTION_TYPES.single;
}
function applyDeductionOp(value, op){
  const n = Number(op.value)||0;
  if(op.op==='add') return value+n;
  if(op.op==='subtract') return value-n;
  if(op.op==='multiply') return value*n;
  if(op.op==='divide') return n!==0? value/n : value;
  return value;
}
function computeDeductionRow(width, height, fields){
  const w = Number(width)||0;
  const h = Number(height)||0;
  const round2 = n=>Math.round(n*100)/100;
  const defs = fields || BUILTIN_DEDUCTION_FIELDS;
  const computed = {width:w, height:h};
  defs.forEach(f=>{
    let val;
    if(f.base==='width') val = w;
    else if(f.base==='height') val = h;
    else val = Number(computed[f.base])||0;
    (f.ops||[]).forEach(op=>{ val = applyDeductionOp(val, op); });
    computed[f.key] = round2(val);
  });
  if(computed.glassWidth===undefined) computed.glassWidth = 0;
  if(computed.glassHeight===undefined) computed.glassHeight = 0;
  computed.glassQty = 2;
  return computed;
}

function buildStockLedger(itemId){
  const ins = DB.stockIns.filter(s=>s.itemId===itemId && !s.deleted).map(s=>({
    date:s.date, type:'إضافة', label:s.note? s.note : 'إضافة للمستودع', number:s.number,
    from:0, to:Number(s.qty)||0, ref:'stockin', id:s.id, sortKey:s.createdAt||0
  }));
  const outs = DB.stockOuts.filter(s=>s.itemId===itemId && !s.deleted).map(s=>{
    const wk = DB.workers.find(w=>w.id===s.workerId);
    return {
      date:s.date, type:'سحب', label:(wk?wk.name:'عامل')+(s.note?' — '+s.note:''), number:s.number,
      from:Number(s.qty)||0, to:0, ref:'stockout', id:s.id, sortKey:s.createdAt||0
    };
  });
  let rows=[...ins,...outs];
  rows.sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date?-1:1;
    return (a.sortKey||0)-(b.sortKey||0);
  });
  let bal = 0;
  const out = rows.map(r=>{
    bal = bal - r.from + r.to;
    return {...r, balance:bal};
  });
  const totFrom = rows.reduce((s,r)=>s+r.from,0);
  const totTo = rows.reduce((s,r)=>s+r.to,0);
  return {rows:out, totFrom, totTo, finalBalance:bal};
}
function currentStock(itemId){ return buildStockLedger(itemId).finalBalance; }

function ensureOrderResultsComplete(order){
  const missing = CUT_TYPES.some(ct => !order.results || !order.results[ct.key]);
  if(missing){
    const deduction = DB.deductions.find(d=>d.id===order.deductionId);
    if(deduction){
      order.results = computeCuttingOrder(deduction, order.barLength);
      save(KEYS.cuttingOrders, DB.cuttingOrders);
    }
  }
  return order;
}
function packBars(pieces, barLengthCm){
  const sorted = [...pieces].sort((a,b)=>b.length-a.length);
  const bars = [];
  sorted.forEach(piece=>{
    if(piece.length > barLengthCm){
      bars.push({items:[piece], used:piece.length, remaining:barLengthCm-piece.length, overflow:true});
      return;
    }
    let best = null, bestRemaining = Infinity;
    bars.forEach(bar=>{
      if(bar.overflow) return;
      const rem = bar.remaining - piece.length;
      if(rem >= -0.0001 && bar.remaining < bestRemaining){ best = bar; bestRemaining = bar.remaining; }
    });
    if(best){
      best.items.push(piece);
      best.used = Math.round((best.used+piece.length)*100)/100;
      best.remaining = Math.round((best.remaining-piece.length)*100)/100;
    } else {
      bars.push({items:[piece], used:piece.length, remaining:Math.round((barLengthCm-piece.length)*100)/100});
    }
  });
  return bars;
}
function computeCuttingOrder(deduction, barLengthM){
  const barLengthCm = Number(barLengthM)*100;
  const results = {};
  CUT_TYPES.forEach(ct=>{
    if(ct.mirrorOf){
      const src = results[ct.mirrorOf];
      results[ct.key] = src ? JSON.parse(JSON.stringify(src)) : {pieces:0, bars:[]};
      return;
    }
    const pieces = [];
    (deduction.rows||[]).forEach((r,idx)=>{
      const c = computeDeductionRow(r.width, r.height);
      ct.sources.forEach(src=>{
        const raw = c[src.field];
        const pieceLen = Math.round((raw + ct.kerf)*100)/100;
        for(let i=0;i<src.qty;i++) pieces.push({length:pieceLen, rowIndex:idx+1});
      });
    });
    results[ct.key] = {pieces:pieces.length, bars:packBars(pieces, barLengthCm)};
  });
  return results;
}

function computePeriodRange(type, a, b){
  const today = todayISO();
  if(type==='month'){
    const val = a || today.slice(0,7);
    const [y,m] = val.split('-');
    const lastDay = new Date(Number(y), Number(m), 0).getDate();
    return {from:`${y}-${m}-01`, to:`${y}-${m}-${String(lastDay).padStart(2,'0')}`};
  }
  if(type==='year'){
    const y = a || today.slice(0,4);
    return {from:`${y}-01-01`, to:`${y}-12-31`};
  }
  if(type==='range'){
    return {from:a||'0000-01-01', to:b||'9999-12-31'};
  }
  return {from:'0000-01-01', to:'9999-12-31'};
}

const LICENSE_PUBLIC_JWK = {"key_ops":["verify"],"ext":true,"kty":"EC","x":"jjQeWIhBYsBXxYPxzH7zmKApYni_ajVuXh4JKoGz7ww","y":"CkjZSZjKFiyxRcXLv7djbS3mhXAROtvyGFuDNvlygw4","crv":"P-256"};
const TRIAL_DAYS = 3;
let _licensePublicKey = null;
function b64urlToBytes(str){
  str = String(str||'').replace(/-/g,'+').replace(/_/g,'/');
  while(str.length%4) str+='=';
  const bin = atob(str);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
function strToBytes(str){ return new TextEncoder().encode(str); }
async function getLicensePublicKey(){
  if(_licensePublicKey) return _licensePublicKey;
  _licensePublicKey = await crypto.subtle.importKey('jwk', LICENSE_PUBLIC_JWK, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
  return _licensePublicKey;
}
async function verifyLicenseSerial(serial){
  try{
    const parts = String(serial||'').trim().split('.');
    if(parts.length!==3 || parts[0]!=='HMDH1') return null;
    const pubKey = await getLicensePublicKey();
    const sigBytes = b64urlToBytes(parts[2]);
    const ok = await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, pubKey, sigBytes, strToBytes(parts[1]));
    if(!ok) return null;
    const payload = JSON.parse(new TextDecoder().decode(b64urlToBytes(parts[1])));
    if(!payload || typeof payload.exp !== 'number') return null;
    return payload;
  }catch(e){ console.error('verifyLicenseSerial error:', e && e.message); return null; }
}
function ensureTrialStarted(){
  if(!DB.settings.trialStartedAt){
    DB.settings.trialStartedAt = Date.now();
    try{ localStorage.setItem('hmadeh_'+KEYS.settings, JSON.stringify(DB.settings)); }catch(e){}
  }
}
function licenseStatus(){
  const s = DB.settings;
  if(s.licenseExpiresAt && s.licenseExpiresAt > Date.now()){
    return { active:true, mode:'licensed', expiresAt:s.licenseExpiresAt, label:s.licenseLabel||'' };
  }
  const trialStart = s.trialStartedAt || Date.now();
  const trialEnd = trialStart + TRIAL_DAYS*86400000;
  if(Date.now() < trialEnd){
    return { active:true, mode:'trial', expiresAt:trialEnd, daysLeft: Math.max(1, Math.ceil((trialEnd-Date.now())/86400000)) };
  }
  return { active:false, mode:'expired', expiresAt: s.licenseExpiresAt||trialEnd };
}
async function activateLicenseSerial(serial){
  const payload = await verifyLicenseSerial(serial);
  if(!payload) return {ok:false, reason:'invalid'};
  if(payload.exp <= Date.now()) return {ok:false, reason:'expired'};
  DB.settings.licenseSerial = serial;
  DB.settings.licenseExpiresAt = payload.exp;
  DB.settings.licenseLabel = payload.label || '';
  const ok = await save(KEYS.settings, DB.settings);
  return {ok: !!ok, reason: ok?null:'save-failed'};
}

function renderCustomerPortal(){
  const parts = currentRoute();
  const cust = DB.customers.find(c=>c.id===currentCustomerSession.customerId);
  if(!cust){
    root().innerHTML = `<div class="topbar"><div class="brand"><div class="name">حسابك</div></div><div class="topbar-actions"><button class="btn btn-ghost btn-sm" id="customerLogoutBtn">🔒 خروج</button></div></div>` + emptyState('صار خطأ بحسابك، تواصل مع الإدارة');
    const btn = document.getElementById('customerLogoutBtn');
    if(btn) btn.addEventListener('click', ()=>{ authenticated=false; currentCustomerSession=null; go('#/'); render(); });
    return;
  }
  let inner = '';
  if(parts.length===0){
    inner = customerPortalHome(cust);
  } else if(parts[0]==='invoice' && parts[1]){
    const inv = DB.invoices.find(i=>i.id===parts[1] && i.customerId===cust.id && !i.deleted);
    inner = inv ? (crumbs([['كشف حسابي','#/'],['فاتورة #'+inv.number,null]]) + invoicePrintView(inv)) : emptyState('ما لقينا هيدي الفاتورة');
  } else if(parts[0]==='receipt' && parts[1]){
    const rec = DB.receipts.find(r=>r.id===parts[1] && r.customerId===cust.id && !r.deleted);
    inner = rec ? (crumbs([['كشف حسابي','#/'],['إيصال #'+rec.number,null]]) + receiptPrintView(rec)) : emptyState('ما لقينا هيدا الإيصال');
  } else {
    inner = customerPortalHome(cust);
  }
  root().innerHTML = customerPortalTopbar(cust) + inner;
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); go(el.getAttribute('data-nav')); });
  });
  const btn = document.getElementById('customerLogoutBtn');
  if(btn) btn.addEventListener('click', ()=>{ authenticated=false; currentCustomerSession=null; go('#/'); render(); });
}

function totpVerifyView(){
  return `

    ${appFooter()}
  </div>`;
}
function bindTotpVerifyEvents(){
  const verify = async ()=>{
    const code = document.getElementById('totp_code').value.trim();
    const ok = await verifyTotp(pendingTotpUser.totpSecret, code);
    if(ok){
      await ensureSupabaseAuthSession(pendingTotpUser.username, pendingTotpUser.__pw);
      authenticated = true;
      currentUser = pendingTotpUser;
      delete currentUser.__pw;
      pendingTotpUser = null;
      currentCustomerSession = null;
      currentWorkerSession = null;
      await reloadAllAfterAuth();
      go('#/');
      render();
    } else {
      document.getElementById('totp_err').textContent = 'الكود غلط، جرب كمان';
    }
  };
  document.getElementById('totpVerifyBtn').addEventListener('click', verify);

function authSafePassword(pw){
  pw = String(pw||'');
  const pad = 'Hx7aQ9zP2k';
  let out = pw;
  let i = 0;
  while(out.length < 6){ out += pad[i % pad.length]; i++; }
  return out;
}

/* ===== بوابة المنصة: هوية الزبون + صلاحية الاشتراك ===== */
async function bootPlatform(){
  if(!supabaseClient) return { ok:false, reason:'no_client' };
  const ses = await supabaseClient.auth.getSession();
  if(!ses.data.session){
    location.href = '/login?next=' + encodeURIComponent(location.pathname + location.search);
    return { ok:false, reason:'no_session' };
  }

  // دخول مشرف المنصة على مؤسسة زبون: /alum?c=<client_id>
  const wantClient = new URLSearchParams(location.search).get('c');
  if(wantClient){
    const adm = await supabaseClient.rpc('is_admin');
    if(adm.data === true){
      const cl = await supabaseClient.from('clients')
        .select('id,name,business').eq('id', wantClient).maybeSingle();
      if(cl.data){
        CLIENT_ID = cl.data.id;
        PLATFORM_ADMIN = true;
        PLATFORM_CLIENT_NAME = cl.data.business || cl.data.name || '';
        ACCESS = { ok:true, admin:true, client_id: CLIENT_ID, days_left: 9999 };
        return ACCESS;
      }
    }
    return { ok:false, reason:'error', message:'ما فيك تفتح مؤسسة هذا الزبون' };
  }

  const acc = await supabaseClient.rpc('app_access', { p_product: 'alum' });
  if(acc.error) return { ok:false, reason:'error', message: acc.error.message };
  ACCESS = acc.data || {};
  // إذا حسابك ما ربط تلقائياً بسجل زبونك (نفس اللي بتعمله صفحة حسابي) —
  // منجرب نربطه مرة، وبعدين منعيد التحقق
  if(ACCESS.reason === 'no_client'){
    try{ await supabaseClient.rpc('autolink_my_client'); }catch(e){}
    const acc2 = await supabaseClient.rpc('app_access', { p_product: 'alum' });
    if(!acc2.error) ACCESS = acc2.data || {};
  }
  CLIENT_ID = ACCESS.client_id || null;
  return ACCESS;
}

function bindLoginEvents(){
  const btn = document.getElementById('loginBtn');
  let _loginBusy = false;
  const tryLogin = async ()=>{
    if(_loginBusy) return;
    _loginBusy = true;
    if(btn) btn.disabled = true;
    try{
      await doTryLogin();
    } finally {
      _loginBusy = false;
      if(btn) btn.disabled = false;
    }
  };
  const doTryLogin = async ()=>{
    const u = document.getElementById('login_user').value.trim();
    const p = document.getElementById('login_pass').value;
    const users = DB.settings.users || [];
    const match = users.find(x=>String(x.username||'').toLowerCase()===u.toLowerCase() && x.password===p);
    if(match){
      if(match.totpEnabled){
        pendingTotpUser = match;
        pendingTotpUser.__pw = p;
        render();
        return;
      }
      ensureSupabaseAuthSession(u, p);
      if(seedBudgetCategoriesLocal()) save(KEYS.budgetCategories, DB.budgetCategories);
      if(!DB.settings.trialStartedAt){ DB.settings.trialStartedAt = Date.now(); save(KEYS.settings, DB.settings); }
      authenticated = true;
      currentUser = match;
      currentCustomerSession = null;
      currentWorkerSession = null;
      go('#/');
      render();
      return;
    }
    const custMatch = (DB.customerAccounts||[]).find(x=>String(x.username||'').toLowerCase()===u.toLowerCase() && x.password===p);
    if(custMatch){
      ensureSupabaseAuthSession(u, p);
      authenticated = true;
      currentUser = null;
      currentCustomerSession = custMatch;
      currentWorkerSession = null;
      go('#/');
      render();
      return;
    }
    const workerMatch = (DB.workerAccounts||[]).find(x=>String(x.username||'').toLowerCase()===u.toLowerCase() && x.password===p);
    if(workerMatch){
      ensureSupabaseAuthSession(u, p);
      authenticated = true;
      currentUser = null;
      currentCustomerSession = null;
      currentWorkerSession = workerMatch;
      go('#/');
      render();
      return;
    }
    // المستخدمون بينجلبوا من السحابة ضمن نطاق المؤسسة (الجلسة من المنصة)
    if(supabaseClient && CLIENT_ID){
      try{
        const [usersRes, custRes, workerAccRes] = await Promise.all([
          scoped(supabaseClient.from(T('app_users')).select('*')),
          scoped(supabaseClient.from(T('customer_accounts')).select('*')),
          scoped(supabaseClient.from(T('worker_accounts')).select('*'))
        ]);
        if(!usersRes.error && Array.isArray(usersRes.data)){
          DB.users = usersRes.data.map(userFromDb);
          save(KEYS.users, DB.users);
        }
        if(!custRes.error && Array.isArray(custRes.data)){
          DB.customerAccounts = custRes.data.map(customerAccountFromDb);
          save(KEYS.customerAccounts, DB.customerAccounts);
        }
        if(!workerAccRes.error && Array.isArray(workerAccRes.data)){
          DB.workerAccounts = workerAccRes.data.map(workerAccountFromDb);
          save(KEYS.workerAccounts, DB.workerAccounts);
        }
        const again = (DB.users||[]).find(x=>String(x.username||'').toLowerCase()===u.toLowerCase() && x.password===p);
        if(again){
          authenticated = true; currentUser = again;
          currentCustomerSession = null; currentWorkerSession = null;
          go('#/'); render(); return;
        }
        const custAgain = (DB.customerAccounts||[]).find(x=>String(x.username||'').toLowerCase()===u.toLowerCase() && x.password===p);
        if(custAgain){
          authenticated = true; currentUser = null;
          currentCustomerSession = custAgain; currentWorkerSession = null;
          go('#/'); render(); return;
        }
        const wAgain = (DB.workerAccounts||[]).find(x=>String(x.username||'').toLowerCase()===u.toLowerCase() && x.password===p);
        if(wAgain){
          authenticated = true; currentUser = null;
          currentCustomerSession = null; currentWorkerSession = wAgain;
          go('#/'); render(); return;
        }
      }catch(e){ console.error('users fetch failed', e && e.message); }
    }
    document.getElementById('login_err').textContent = 'اسم المستخدم أو كلمة السر غلط';
  };
  btn.addEventListener('click', tryLogin);
  document.getElementById('login_pass').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
  document.getElementById('login_user').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
}

function crumbs(items){
  return `<div class="crumbs">` + items.map(([label,href],idx)=>{
    const sep = idx>0 ? '<span>‹</span>' : '';
    return sep + (href? `<a data-nav="${href}">${label}</a>` : `<span>${label}</span>`);
  }).join(' ') + `</div>`;
}
function emptyState(msg){
  return `<div class="card"><div class="empty"><div class="big">${msg}</div></div></div>`;
}

function dashboardView(){

function customerTable(rows){
  if(!rows.length) return `<div class="empty"><div class="big">ما في زبائن بعد</div>ضيف أول زبون تلقائيًا</div>`;
  return `<table><thead><tr>
    <th>الاسم</th><th>رقم الحساب</th><th>الهاتف</th><th>الرصيد الحالي</th>
  </tr></thead><tbody>
  ${rows.map(c=>{
    const bal = customerBalance(c.id);
    const cls = bal>0.004?'bal-pos':(bal<-0.004?'bal-neg':'bal-zero');
    const lbl = bal>0.004? '(مستحق منه)' : (bal<-0.004? '(دائن له)' : '');
    return `<tr data-nav="#/customer/${c.id}">
      <td><b>${escapeHtml(c.name)}</b></td>
      <td class="num">${escapeHtml(c.accountNumber||'—')}</td>
      <td class="num">${escapeHtml(c.phone||'—')}</td>
      <td class="${cls}">${fmtMoney(bal)} <span style="font-size:11px;font-weight:500">${lbl}</span></td>
    </tr>`;
  }).join('')}
  </tbody></table>`;
}

function periodFilterHtml(idPrefix, period, a, b){
  return `

        <option value="month" ${period==='month'?'selected':''}>شهري</option>

        <option value="range" ${period==='range'?'selected':''}>من تاريخ - إلى تاريخ</option>
      </select>
    </div>
    <div class="field" id="${idPrefix}_wrap_month" style="${period==='month'?'':'display:none;'}">
      <label>الشهر</label><input type="month" id="${idPrefix}_month" value="${period==='month'&&a? a : todayISO().slice(0,7)}">
    </div>
    <div class="field" id="${idPrefix}_wrap_year" style="${period==='year'?'':'display:none;'}">
      <label>السنة</label><input type="number" id="${idPrefix}_year" class="num" value="${period==='year'&&a? a : todayISO().slice(0,4)}">
    </div>
    <div class="field" id="${idPrefix}_wrap_range_from" style="${period==='range'?'':'display:none;'}">
      <label>من تاريخ</label><input type="date" id="${idPrefix}_from" value="${period==='range'&&a? a : todayISO()}">
    </div>
    <div class="field" id="${idPrefix}_wrap_range_to" style="${period==='range'?'':'display:none;'}">
      <label>إلى تاريخ</label><input type="date" id="${idPrefix}_to" value="${period==='range'&&b? b : todayISO()}">
    </div>
  </div>
  <button class="btn btn-sm btn-primary" id="${idPrefix}_apply">تطبيق</button>`;
}
function bindPeriodFilter(idPrefix, onApply){
  const typeSel = document.getElementById(idPrefix+'_type');
  if(!typeSel) return;
  const monthWrap = document.getElementById(idPrefix+'_wrap_month');
  const yearWrap = document.getElementById(idPrefix+'_wrap_year');
  const fromWrap = document.getElementById(idPrefix+'_wrap_range_from');
  const toWrap = document.getElementById(idPrefix+'_wrap_range_to');
  typeSel.addEventListener('change', ()=>{
    const v = typeSel.value;
    monthWrap.style.display = v==='month'?'':'none';
    yearWrap.style.display = v==='year'?'':'none';
    fromWrap.style.display = v==='range'?'':'none';
    toWrap.style.display = v==='range'?'':'none';
  });
  document.getElementById(idPrefix+'_apply').addEventListener('click', ()=>{
    const type = typeSel.value;
    let a='', b='';
    if(type==='month') a = document.getElementById(idPrefix+'_month').value;
    else if(type==='year') a = document.getElementById(idPrefix+'_year').value;
    else if(type==='range'){ a = document.getElementById(idPrefix+'_from').value; b = document.getElementById(idPrefix+'_to').value; }
    onApply(type, a, b);
  });
}

function refHref(ref, id){
  const map = {
    invoice: `#/invoice/${id}`, receipt: `#/receipt/${id}`,
    purchase: `#/purchase/${id}`, voucher: `#/voucher/${id}`,
    workentry: `#/workentry/${id}`, workerpay: `#/workerpay/${id}`,
    stockin: `#/stockin/${id}`, stockout: `#/stockout/${id}`
  };
  return map[ref] || '#/';
}
function fmtQty(n){
  n = Number(n)||0;

}
function ledgerTable(ledger, isQty){
  if(!ledger.rows.length) return `<div class="empty"><div class="big">ما في حركات بعد</div></div>`;
  const fmt = isQty ? fmtQty : fmtMoney;
  const rows = ledger.rows.map(r=>{
    const href = refHref(r.ref, r.id);
    const pillClass = r.to>0 ? 'pill-debit' : 'pill-credit';
    const balCls = r.balance>0.004?'bal-pos':(r.balance<-0.004?'bal-neg':'bal-zero');
    return `<tr data-nav="${href}">
      <td class="num">${fmtDate(r.date)}</td>
      <td><span class="pill ${pillClass}">${escapeHtml(r.type)}</span></td>
      <td class="num">${escapeHtml(r.number)}</td>
      <td>${escapeHtml(r.label)}</td>
      <td class="num">${r.from? fmt(r.from):''}</td>
      <td class="num">${r.to? fmt(r.to):''}</td>
      <td class="${balCls}">${fmt(r.balance)}</td>
    </tr>`;
  }).join('');
  return `<div class="table-scroll"><table><thead><tr>
    <th>التاريخ</th><th>النوع</th><th>الرقم</th><th>التفاصيل</th><th>من</th><th>الى</th><th>الرصيد</th>

    <td class="num">${fmt(ledger.totTo)}</td>
    <td class="num">${fmt(ledger.finalBalance)}</td>
  </tr></tfoot></table></div>`;
}

function bindWorkEntryFormEvents(){
  const el = document.getElementById('w_number');
  if(!el || !_workEntryDraft) return;
  const refresh = ()=>{
    const t = document.getElementById('wTotal');
    if(t) t.textContent = fmtMoney(computeWorkEntryTotal(_workEntryDraft));
  };
  el.addEventListener('input', e=>_workEntryDraft.number=e.target.value);
  document.getElementById('w_date').addEventListener('input', e=>_workEntryDraft.date=e.target.value);
  document.getElementById('w_daily').addEventListener('input', e=>{ _workEntryDraft.dailyWage=Number(e.target.value)||0; refresh(); });
  document.getElementById('w_othours').addEventListener('input', e=>{ _workEntryDraft.overtimeHours=Number(e.target.value)||0; refresh(); });
  document.getElementById('w_otrate').addEventListener('input', e=>{ _workEntryDraft.overtimeRate=Number(e.target.value)||0; refresh(); });
  document.getElementById('w_kg').addEventListener('input', e=>{ _workEntryDraft.weightKg=Number(e.target.value)||0; refresh(); });
  document.getElementById('w_kgrate').addEventListener('input', e=>{ _workEntryDraft.kgRate=Number(e.target.value)||0; refresh(); });
  document.getElementById('w_details').addEventListener('input', e=>_workEntryDraft.details=e.target.value);

  const saveBtn = document.getElementById('saveWorkEntryBtn');
  saveBtn.addEventListener('click', async ()=>{
    if(!_workEntryDraft.number){ toast('لازم رقم يومية'); return; }
    if(!_workEntryDraft.date){ toast('لازم تاريخ'); return; }
    if(computeWorkEntryTotal(_workEntryDraft)<=0){ toast('لازم تحدد قيمة وحدة عالأقل (يومية أو ساعات أو كيلو)'); return; }
    let savedId;
    if(_workEntryDraft.id){
      const idx = DB.workEntries.findIndex(x=>x.id===_workEntryDraft.id);
      const clean = {...(_workEntryDraft)}; delete clean.__editId;
      DB.workEntries[idx] = clean;
      savedId = clean.id;
    } else {
      const clean = {id:uid(), createdAt:Date.now(), workerId:_workEntryDraft.workerId, number:_workEntryDraft.number, date:_workEntryDraft.date,
        dailyWage:_workEntryDraft.dailyWage||0, overtimeHours:_workEntryDraft.overtimeHours||0, overtimeRate:_workEntryDraft.overtimeRate||0,
        weightKg:_workEntryDraft.weightKg||0, kgRate:_workEntryDraft.kgRate||0, details:_workEntryDraft.details||''};
      DB.workEntries.push(clean);
      savedId = clean.id;
    }
    const ok = await save(KEYS.workEntries, DB.workEntries);
    toast(ok? 'تم حفظ اليومية':'صار خطأ بالحفظ');
    _workEntryDraft = null;
    go(`#/workentry/${savedId}`);
  });
}

function bindDeductionProfileFormEvents(){
  if(!_dedProfileDraft) return;
  const recalcPreview = ()=>{
    document.querySelectorAll('.item-card[data-fidx]').forEach(card=>{
      const idx = Number(card.getAttribute('data-fidx'));
      const f = _dedProfileDraft.fields[idx];
      const c = computeDeductionRow(100, 150, _dedProfileDraft.fields);
      const val = c[f.key];
      const prev = card.querySelector('.dp-preview');
      if(prev) prev.textContent = (f.label||'الخانة')+' = '+(val!=null? val.toFixed(2) : '—');
    });
  };
  document.getElementById('dp_label').addEventListener('input', e=>_dedProfileDraft.label=e.target.value);
  const glassLabelEl = document.getElementById('dp_glasslabel');
  if(glassLabelEl) glassLabelEl.addEventListener('input', e=>_dedProfileDraft.glassLabel=e.target.value);

  document.querySelectorAll('.item-card[data-fidx]').forEach(card=>{
    const idx = Number(card.getAttribute('data-fidx'));
    const f = _dedProfileDraft.fields[idx];
    card.querySelector('.dp-field-label').addEventListener('input', e=>{ f.label=e.target.value; recalcPreview(); });
    card.querySelector('.dp-field-base').addEventListener('change', e=>{ f.base=e.target.value; recalcPreview(); });
    card.querySelectorAll('[data-oidx]').forEach(opRow=>{
      const oidx = Number(opRow.getAttribute('data-oidx'));
      opRow.querySelector('.dp-op-type').addEventListener('change', e=>{ f.ops[oidx].op=e.target.value; recalcPreview(); });
      opRow.querySelector('.dp-op-value').addEventListener('input', e=>{ f.ops[oidx].value=Number(e.target.value)||0; recalcPreview(); });
    });
    card.querySelectorAll('[data-rm-op]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const oidx = Number(btn.getAttribute('data-rm-op'));
        if(f.ops.length<=1){ toast('لازم تضل خطوة وحدة عالأقل'); return; }
        f.ops.splice(oidx,1);
        render();
      });
    });
    const addOpBtn = card.querySelector('[data-add-op]');
    if(addOpBtn) addOpBtn.addEventListener('click', ()=>{ f.ops.push({op:'subtract', value:0}); render(); });
  });
  document.querySelectorAll('[data-rm-field]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(_dedProfileDraft.fields.length<=1){ toast('لازم تضل خانة وحدة عالأقل'); return; }
      _dedProfileDraft.fields.splice(Number(btn.getAttribute('data-rm-field')),1);
      render();
    });
  });
  const addFieldBtn = document.getElementById('addDpFieldBtn');
  if(addFieldBtn) addFieldBtn.addEventListener('click', ()=>{ _dedProfileDraft.fields.push(blankDedProfileField()); render(); });

  const saveBtn = document.getElementById('saveDpBtn');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    if(!_dedProfileDraft.label.trim()){ toast('لازم تكتب اسم البروفيل'); return; }
    if(_dedProfileDraft.fields.some(f=>!f.label.trim())){ toast('لازم كل خانة يكون إلها اسم'); return; }
    const list = DB.settings.customDeductionProfiles||[];
    if(_dedProfileDraft.id){
      const idx = list.findIndex(p=>p.id===_dedProfileDraft.id);
      const clean = {...(_dedProfileDraft)}; delete clean.__editId;
      list[idx] = clean;
    } else {
      const clean = {...(_dedProfileDraft), id:uid(), key:'custom_'+uid()};
      delete clean.__editId;
      list.push(clean);
    }
    DB.settings.customDeductionProfiles = list;
    const ok = await save(KEYS.settings, DB.settings);
    toast(ok? 'تم حفظ البروفيل':'صار خطأ بالحفظ');
    _dedProfileDraft = null;
    go('#/deduction-profiles');
  });
  recalcPreview();
}

function computeQuoteTotal(q){
  const dp = q.specs && q.specs.deductionPage;
  if(!dp || !dp.items || !dp.items.length) return 0;
  const price = Number(dp.price)||0;
  return dp.items.reduce((sum,it)=>{
    const w = Number(it.width)||0, l = Number(it.length)||0, c = Number(it.count)||1;
    const sqm = Math.round(w*l*c*10000)/10000;
    return sum + Math.round(sqm*price*100)/100;
  }, 0);
}

  <div class="doc no-autofit">
    ${docHead('مقاسات زجاج')}
    <div style="text-align:center; margin:-6px 0 14px; font-family:var(--font-display); font-weight:800; font-size:16px; color:var(--bronze-deep);">
      نوع الشغلة: ${escapeHtml(t.label)}
    </div>
    <div class="doc-info">
      <div class="r"><span>الزبون:</span><b>${escapeHtml(cust?cust.name:'')}</b></div>
      <div class="r"><span>رقم الورقة:</span><b class="num">${escapeHtml(doc.number)}</b></div>
      <div class="r"><span>التاريخ:</span><b class="num">${fmtDate(doc.date)}</b></div>

      <td colspan="4">مجموع تربيع الزجاج</td>

    </tr></tfoot></table>
    <div class="sig">التوقيع</div>
  </div>`;

/* ---------- Print views ---------- */
function docHead(title){
  const s = DB.settings;
  return `<div class="doc-head">
    <div style="display:flex; align-items:center; gap:12px;">
      ${s.logo? `<img src="${s.logo}" alt="logo" style="height:54px; width:auto; object-fit:contain;">` : ''}
      <div>
        <div class="co-name">${escapeHtml(s.companyName)}</div>
        <div class="co-tag">${escapeHtml(s.companyTag)}<br>${escapeHtml(s.companyPhone)}</div>
      </div>
    </div>
    <div class="doc-title">${title}</div>
  </div>`;
}
function invoicePrintView(inv){ return itemDocPrintView('invoice', inv); }
function purchasePrintView(p){ return itemDocPrintView('purchase', p); }
function quotePrintView(q){
  if(q.isCustomText) return customQuotePrintView(q);
  if(q.isPdf) return quotePdfView(q);
  return itemDocPrintView('quote', q);
}
function quotePdfView(q){
  const cust = DB.customers.find(c=>c.id===q.customerId);
  return `
  <div class="doc-actions no-print">
    <a class="btn btn-primary" href="${q.pdfData}" download="${escapeHtml(q.pdfFileName||('Quote-'+q.number+'.pdf'))}">⬇ تحميل الـPDF</a>
    <button class="btn btn-danger" data-del-doc="${q.id}" data-doc-kind="quote">🗑 حذف</button>
  </div>
  <div class="card">
    <h2><span class="dot"></span> عرض سعر #${escapeHtml(q.number)} — ${escapeHtml(cust?cust.name:'')}</h2>
    <div style="color:var(--ink-soft); font-size:13px; margin-bottom:10px;">التاريخ: ${fmtDate(q.date)} — ملف: ${escapeHtml(q.pdfFileName||'')}</div>
    <iframe src="${q.pdfData}" style="width:100%; height:70vh; border:1px solid var(--line); border-radius:8px;"></iframe>
  </div>`;
}
let _customQuoteDraft = null;
function customQuoteFormView(doc){
  if(!_customQuoteDraft || _customQuoteDraft.__editId !== (doc?doc.id:'new')){
    if(doc){
      _customQuoteDraft = JSON.parse(JSON.stringify(doc));
      _customQuoteDraft.__editId = doc.id;
    } else {
      _customQuoteDraft = {id:null, number:nextQuoteNumber(), date:todayISO(), customerName:'', scope:'', location:'', content:'', direction:'rtl', __editId:'new'};
    }
  }
  const d = _customQuoteDraft;
  return `
  <div class="card">
    <h2><span class="dot"></span> ${doc?'تعديل عرض سعر مخصص':'عرض سعر مخصص جديد'}</h2>
    <div class="grid grid-2">
      <div class="field"><label>Customer Name *</label><input type="text" id="cq_customerName" value="${escapeHtml(d.customerName)}"></div>
      <div class="field"><label>Scope *</label><input type="text" id="cq_scope" value="${escapeHtml(d.scope)}"></div>
    </div>
    <div class="grid grid-2">
      <div class="field"><label>Location *</label><input type="text" id="cq_location" value="${escapeHtml(d.location)}"></div>
      <div class="field"><label>Date *</label><input type="date" id="cq_date" value="${d.date}"></div>
    </div>
    <div class="field">
      <label>النص (Paste أو اكتب — بيتحدد الاتجاه تلقائي حسب اللغة)</label>
      <textarea id="cq_content" dir="${d.direction}" style="width:100%; min-height:320px; padding:12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:14px; line-height:1.8; resize:vertical;">${escapeHtml(d.content)}</textarea>
    </div>
    <div class="action-row" style="margin-top:16px">
      <button class="btn btn-primary" id="saveCustomQuoteBtn">💾 حفظ</button>
      <button class="btn" data-nav="#/quotes">إلغاء</button>
    </div>
  </div>`;
}
function customQuotePrintView(doc){
  return `
  <div class="doc-actions no-print">
    <button class="btn" data-nav="#/custom-quote/edit/${doc.id}">✎ تعديل</button>
    <button class="btn btn-danger" data-del-doc="${doc.id}" data-doc-kind="customquote">🗑 حذف</button>
    <button class="btn btn-primary" onclick="printWithFilename('CustomQuote-${safeText(doc.number)}')">🖨 طباعة</button>
  </div>
  <div class="doc">
    ${docHead('Quotation')}
    <div class="doc-info" dir="${doc.direction==='ltr'?'ltr':'rtl'}" style="${doc.direction==='ltr'?'text-align:left;':''}">
      <div class="r" ${doc.direction==='ltr'?'style="justify-content:flex-start;"':''}><span>Customer Name:</span><b>${escapeHtml(doc.customerName)}</b></div>
      <div class="r" ${doc.direction==='ltr'?'style="justify-content:flex-start;"':''}><span>Scope:</span><b>${escapeHtml(doc.scope)}</b></div>
      <div class="r" ${doc.direction==='ltr'?'style="justify-content:flex-start;"':''}><span>Location:</span><b>${escapeHtml(doc.location)}</b></div>
      <div class="r" ${doc.direction==='ltr'?'style="justify-content:flex-start;"':''}><span>Date:</span><b class="num">${fmtDate(doc.date)}</b></div>
    </div>
    <div dir="${doc.direction}" style="margin-top:18px; white-space:pre-wrap; line-height:1.9; font-size:14.5px; text-align:${doc.direction==='ltr'?'left':'right'};">${escapeHtml(doc.content)}</div>
    <div class="sig">${doc.direction==='ltr'?'Signature':'التوقيع'}</div>
  </div>`;
}

function hasGXCover(specs){
  if(!specs) return false;
  return (specs.systems||[]).some(sys=>sys.profile==='Technal GX');
}
function gxCoverPrintView(){
  return `<div class="doc no-autofit quote-gx-cover-page" style="padding:0; max-width:900px;">
    <img src="data:image/jpeg;base64,${GX_COVER_IMAGE_B64}" style="width:100%; display:block; border-radius:6px;">
  </div>`;
}
function hasSpecsContent(specs){
  if(!specs) return false;
  if(specs.project || specs.location || specs.phone || specs.scope) return true;
  return (specs.systems||[]).some(sys=>Object.keys(sys).some(k=>k!=='id' && sys[k]));
}
function specsCoverPrintView(doc){
  const s = doc.specs;
  const fields = ['profile','aluType','color','description','glazing','accessories','handles','gaskets','fixings','silicone','screws','flyScreen'];
  const sysHtml = (s.systems||[]).map((sys,idx)=>{
    const letter = String.fromCharCode(97+idx);
    const rows = fields.filter(f=>sys[f]).map(f=>`<tr><td style="width:170px; padding:3px 8px; border:none;">${SPEC_FIELD_LABELS[f]}</td><td style="width:16px; border:none;">:</td><td style="border:none;">${escapeHtml(sys[f])}</td></tr>`);
    if(sys.note) rows.push(`<tr><td style="width:170px; padding:3px 8px; border:none; vertical-align:top;">Note</td><td style="width:16px; border:none; vertical-align:top;">:</td><td style="border:none;">${escapeHtml(sys.note)}</td></tr>`);
    return `<div style="margin-bottom:16px;">
      <div style="font-weight:700; text-decoration:underline; margin-bottom:4px;">${letter}. ${escapeHtml(sys.systemName||'System')}:</div>
      <table style="width:100%;">${rows.join('')}</table>
      ${sys.price? `<div style="margin-top:6px; text-align:left; font-weight:700;">Price: ${escapeHtml(sys.price)} $/M</div>` : ''}
    </div>`;
  }).join('');
  return `
  <div class="doc no-autofit ltr-doc quote-specs-page" dir="ltr">
    ${docHead('Quotation')}
    <div class="doc-info">
      <div class="r"><span>Project:</span><b>${escapeHtml(s.project||'')}</b></div>
      <div class="r"><span>Location:</span><b>${escapeHtml(s.location||'')}</b></div>
      <div class="r"><span>Phone Number:</span><b class="num">${escapeHtml(s.phone||'')}</b></div>
      <div class="r"><span>Scope:</span><b>${escapeHtml(s.scope||'')}</b></div>
      <div class="r"><span>Date:</span><b class="num">${fmtDate(s.date||doc.date)}</b></div>
    </div>
    <div style="font-weight:800; text-decoration:underline; margin:14px 0 4px;">Specifications:</div>
    <div style="font-size:13px; text-decoration:underline; margin-bottom:10px;">Aluminum Panels:</div>
    ${sysHtml}
  </div>`;
}
function quoteDeductionPagePrintView(doc){
  const dp = doc.specs && doc.specs.deductionPage;
  if(!dp || !dp.deductionId) return '';
  const deduction = DB.deductions.find(d=>d.id===dp.deductionId);
  if(!deduction) return '';
  const price = Number(dp.price)||0;
  const items = dp.items && dp.items.length ? dp.items : deduction.rows.map(r=>({
    type:'', width:(Number(r.width)||0)/100, length:(Number(r.height)||0)/100, count:1
  }));
  let grandTotal = 0;
  const rows = items.map((it,idx)=>{
    const w = Number(it.width)||0, l = Number(it.length)||0, c = Number(it.count)||1;
    const sqm = Math.round(w*l*c*10000)/10000;
    const total = Math.round(sqm*price*100)/100;
    grandTotal += total;
    return `<tr>
      <td class="num">${idx+1}</td>
      <td>${escapeHtml(it.type||'—')}</td>

    {kind:'workentry', arr:'workEntries', title:'يوميات العمال المحذوفة', partyArr:'workers', partyField:'workerId', numLabel:'رقم اليومية', amtFn:e=>computeWorkEntryTotal(e)},
    {kind:'workerpay', arr:'workerPayments', title:'دفعات العمال المحذوفة', partyArr:'workers', partyField:'workerId', numLabel:'رقم الدفعة', amtFn:p=>p.amount},

    {kind:'quote', arr:'quotes', title:'عروض أسعار محذوفة', partyArr:'customers', partyField:'customerId', numLabel:'رقم العرض', amtFn:q=>computeQuoteTotal(q)},
    {kind:'stockout', arr:'stockOuts', title:'أوامر سحب محذوفة', partyArr:'warehouseItems', partyField:'itemId', numLabel:'رقم الأمر', amtLabel:'الكمية', rawFn:s=>s.qty},
    {kind:'order', arr:'cuttingOrders', title:'طلبيات محذوفة', partyArr:'customers', partyField:'customerId', numLabel:'رقم الطلبية', amtLabel:'طول القضيب', rawFn:o=>o.barLength+' م'},

  ];
  const cards = sections.map(sec=>{

    </tr>`).join('');
    return `<div class="card">
      <h2><span class="dot"></span> ${sec.title}</h2>

    </div>`;
  }).join('');
  return cards;
}

function trashTotalCount(){

    + DB.workEntries.filter(e=>e.deleted).length + DB.workerPayments.filter(p=>p.deleted).length
    + DB.deductions.filter(d=>d.deleted).length + DB.quotes.filter(q=>q.deleted).length
    + DB.stockOuts.filter(s=>s.deleted).length + DB.cuttingOrders.filter(o=>o.deleted).length;

function usersTableHtml(){
  const allUsers = DB.settings.users || [];
  const isSuperuserSession = currentUser && currentUser.role==='superuser';
  // حساب SUPERADMIN مخفي — بيظهر بس لما يكون هو المسجّل دخول
  const amSuper = currentUser && String(currentUser.username||'').toUpperCase()==='SUPERADMIN';
  const users = allUsers.filter(u =>
    amSuper || String(u.username||'').toUpperCase() !== 'SUPERADMIN');
  const rows = users.map(u=>{
    const priv = isPrivilegedUser(u);
    const permsText = priv ? 'كل الصلاحيات' : ((u.permissions||[]).map(p=>{
      const m = PERMISSION_MODULES.find(x=>x.key===p); return m? m.label : p;
    }).join('، ') || '— بلا صلاحيات —');
    const totpCell = u.totpEnabled
      ? `✅ مفعّل ${isSuperuserSession? `<button class="btn btn-sm btn-danger" data-del-2fa="${u.id}" style="margin-right:6px;">🗑 حذف 2FA</button>` : ''}`
      : `❌ غير مفعّل <button class="btn btn-sm" data-setup-2fa="${u.id}" style="margin-right:6px;">🔐 إعداد 2FA</button>`;
    return `<tr>
      <td><b>${escapeHtml(u.username)}</b></td>
      <td>${u.role==='superuser'?'SUPERADMIN':(u.role==='admin'?'ADMIN':'مستخدم')}</td>
      <td style="font-size:12px;">${permsText}</td>
      <td style="font-size:12px; white-space:nowrap;">${totpCell}</td>
      <td>
        <button class="btn btn-sm" data-edit-user="${u.id}">✎ تعديل</button>
        ${!priv? `<button class="btn btn-sm btn-danger" data-del-user="${u.id}">🗑 حذف</button>` : ''}
      </td>
    </tr>`;
  }).join('');
  return `<div class="table-scroll"><table><thead><tr><th>اسم المستخدم</th><th>النوع</th><th>الصلاحيات</th><th>2FA</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function openCustomerAccountModal(account){
  const isNew = !account;
  const wrap = document.createElement('div');
  wrap.className='modal-bg';
  const custOptions = DB.customers.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'))
    .map(c=>`<option value="${c.id}" ${account&&account.customerId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');
  wrap.innerHTML = `<div class="modal">
    <h3>${isNew? 'إنشاء مستخدم للزبون' : 'تعديل حساب الزبون'}</h3>
    <div class="field"><label>الزبون *</label>
      <select id="ca_customer" ${!isNew?'disabled':''}>
        <option value="">— اختار الزبون —</option>
        ${custOptions}
      </select>
    </div>
    <div class="field"><label>اسم المستخدم *</label><input type="text" id="ca_username" value="${account?escapeHtml(account.username):''}"></div>
    <div class="field"><label>كلمة السر *</label><input type="text" id="ca_password" class="num" value="${account?escapeHtml(account.password):''}"></div>
    <div class="row">
      <button class="btn" id="ca_cancel">إلغاء</button>
      <button class="btn btn-primary" id="ca_save">${isNew?'إضافة':'حفظ'}</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#ca_cancel').addEventListener('click', ()=>wrap.remove());
  wrap.addEventListener('click', (e)=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector('#ca_save').addEventListener('click', async ()=>{
    const customerId = isNew ? wrap.querySelector('#ca_customer').value : account.customerId;
    const username = wrap.querySelector('#ca_username').value.trim();
    const password = wrap.querySelector('#ca_password').value.trim();
    if(!customerId){ toast('لازم تختار الزبون'); return; }
    if(!username){ toast('لازم تكتب اسم المستخدم'); return; }
    if(!password){ toast('لازم تكتب كلمة السر'); return; }
    const dupCust = (DB.customerAccounts||[]).find(a=> String(a.username||'').toLowerCase()===username.toLowerCase() && (!account || a.id!==account.id));
    const dupStaff = (DB.settings.users||[]).find(u=> String(u.username||'').toLowerCase()===username.toLowerCase());
    if(dupCust || dupStaff){ toast('اسم المستخدم هيدا مستخدم لحد تاني'); return; }
    if(isNew){
      const na = {id:uid(), createdAt:Date.now(), customerId, username, password};
      DB.customerAccounts = [...(DB.customerAccounts||[]), na];
    } else {
      account.username = username; account.password = password;
      if(currentCustomerSession && currentCustomerSession.id===account.id) currentCustomerSession = account;
    }
    const ok = await save(KEYS.customerAccounts, DB.customerAccounts);
    wrap.remove();
    toast(ok? (isNew?'تمت إضافة الحساب':'تم حفظ التعديلات') : 'صار خطأ بالحفظ');
    render();
  });
}

function detectTextDirection(text){
  const arabicChars = (text.match(/[\u0600-\u06FF]/g)||[]).length;
  const latinChars = (text.match(/[A-Za-z]/g)||[]).length;
  return arabicChars >= latinChars ? 'rtl' : 'ltr';
}
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function safeText(s){ return String(s??'').replace(/[^\w-]/g,''); }
function printWithFilename(name){
  const prevTitle = document.title;
  document.title = name;
  window.print();
  setTimeout(()=>{ document.title = prevTitle; }, 1000);
}
function printLandscape(name){
  const prevTitle = document.title;
  document.title = name;
  const styleEl = document.createElement('style');
  styleEl.id = 'print-orientation-style';
  styleEl.textContent = '@page{ size: A4 landscape; margin:6mm; }';
  document.head.appendChild(styleEl);
  window.print();
  setTimeout(()=>{
    document.title = prevTitle;
    styleEl.remove();
  }, 1000);
}
function printQuoteSpecsOnly(name){
  const specsEl = document.querySelector('.quote-specs-page');
  const gxEl = document.querySelector('.quote-gx-cover-page');
  const measEl = document.querySelector('.quote-meas-page');
  if(measEl) measEl.style.display='none';
  printWithFilename(name);
  setTimeout(()=>{ if(measEl) measEl.style.display=''; }, 1200);
}
function printQuoteMeasurementsOnly(name){
  const specsEl = document.querySelector('.quote-specs-page');
  const gxEl = document.querySelector('.quote-gx-cover-page');
  const measEl = document.querySelector('.quote-meas-page');
  if(specsEl) specsEl.style.display='none';
  if(gxEl) gxEl.style.display='none';
  printLandscape(name);
  setTimeout(()=>{
    if(specsEl) specsEl.style.display='';
    if(gxEl) gxEl.style.display='';
  }, 1200);
}

      toast(`تم استرجاع ${cfg.label}`);
      render();
    });
  });

    btn.addEventListener('click', async ()=>{
      if(!confirm('حذف نهائي وما بينرجع فيه — متأكد؟')) return;
      const kind = btn.getAttribute('data-doc-kind');
      const cfg = DOC_KIND_MAP[kind];
      const id = btn.getAttribute('data-purge-doc');
      const isSuperadmin = currentUser && currentUser.role==='superuser';
      if(isSuperadmin){
        DB[cfg.arr] = DB[cfg.arr].filter(x=>x.id!==id);
        await save(KEYS[cfg.key], DB[cfg.arr]);
      } else {
        const item = DB[cfg.arr].find(x=>x.id===id);
        if(item) item.adminPurged = true;
        await save(KEYS[cfg.key], DB[cfg.arr]);
      }
      toast('تم الحذف النهائي');
      render();
    });
  });
}

  wrap.querySelector('#um_save').addEventListener('click', async ()=>{
    const username = wrap.querySelector('#um_username').value.trim();

    if(dup){ toast('اسم المستخدم هيدا مستخدم لحد تاني'); return; }
    if(isNew){
      const perms = Array.from(wrap.querySelectorAll('.user-perm-chk:checked')).map(c=>c.value);
      const nu = {id:uid(), username, password, role:'custom', permissions:perms};
      DB.settings.users = [...(DB.settings.users||[]), nu];
    } else {
      const oldPassword = user.password;
      const passwordChanged = user.password !== password;
      user.username = username; user.password = password;
      if(!isPriv){
        user.permissions = Array.from(wrap.querySelectorAll('.user-perm-chk:checked')).map(c=>c.value);
      }
      const isSelf = currentUser && currentUser.id===user.id;
      if(isSelf) currentUser = user;
      if(passwordChanged && isSelf && supabaseClient && supabaseClient.auth){
        (async ()=>{
          try{
            const { error } = { error: null }; // كلمات مرور مستخدمي البرنامج داخلية
            if(error){
              lastSupabaseError = describeSupabaseError(error);
              console.error('supabase auth password update error:', lastSupabaseError);
              setTimeout(()=>{ alert('تفاصيل خطأ تحديث كلمة السر بالسحابة (خذ لقطة شاشة وابعتها):\n\n'+lastSupabaseError); }, 400);
            }
          }catch(e){
            lastSupabaseError = 'threw: '+(e && e.message);
            console.error('supabase auth password update threw:', e && e.message);
            setTimeout(()=>{ alert('تفاصيل خطأ تحديث كلمة السر بالسحابة (خذ لقطة شاشة وابعتها):\n\n'+lastSupabaseError); }, 400);
          }
        })();
      }
    }
    const ok = await save(KEYS.settings, DB.settings);
    wrap.remove();
    toast(ok? (isNew?'تمت إضافة المستخدم':'تم حفظ التعديلات') : 'صار خطأ بالحفظ');
    render();
  });
}

function autoAccountNumber(){
  const prefix = '41110';
  let maxSuffix = 0;
  DB.customers.forEach(c=>{
    const acc = String(c.accountNumber||'');
    if(acc.startsWith(prefix)){
      const suf = parseInt(acc.slice(prefix.length))||0;
      if(suf>maxSuffix) maxSuffix = suf;
    }
  });
  return prefix + String(maxSuffix+1).padStart(4,'0');
}

function normalizePhone(raw){
  let p = String(raw||'').trim().replace(/[^0-9]/g,'');
  if(!p) return '';
  if(p.startsWith('961')) return p;
  if(p.startsWith('0')) return '961'+p.slice(1);
  return '961'+p;
}

function recalcItemRow(tr){
  const idx = Number(tr.getAttribute('data-idx'));
  const it = _itemDocDraft.items[idx];
  it.desc = tr.querySelector('.it-desc').value;
  it.weight = tr.querySelector('.it-weight').value;
  it.width = tr.querySelector('.it-width').value;
  it.length = tr.querySelector('.it-length').value;
  it.count = tr.querySelector('.it-count').value;
  it.price = Number(tr.querySelector('.it-price').value)||0;
  it.sqm = computeItemDims(it).sqm;
  it.total = autoTotalFromPrice(it);
}
function effectiveDim(v){
  const n = Number(v);
  return (v!==''&&v!=null&&!isNaN(n)&&n>0) ? n : 1;
}
function computeItemDims(it){
  const weight = effectiveDim(it.weight);
  const width = effectiveDim(it.width);
  const length = effectiveDim(it.length);
  const count = effectiveDim(it.count);
  const sqm = Math.round(weight*width*length*count*10000)/10000;
  return {weight, width, length, count, sqm};
}
function autoSqmFromDims(it){
  // طول × عرض × وزن × عدد — أي خانة فاضية بتتعامل معها كأنها 1 (ما بتأثر بالضرب)
  return computeItemDims(it).sqm;
}
function autoTotalFromPrice(it){
  const qty = computeItemDims(it).sqm;
  return Math.round((Number(it.price)||0) * qty * 100)/100;
}
