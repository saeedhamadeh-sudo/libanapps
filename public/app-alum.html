<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>itech Accounting — دفتر الحسابات</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2A38">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="itech Accounting">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --paper-2:#EFEAE0;
    --ink:#1E2A38;
    --ink-soft:#4B5A68;
    --line:#D8D0BF;
    --bronze:#B08D57;
    --bronze-deep:#8C6D3F;
    --steel:#4A6670;
    --debit:#B54834;   /* فاتورة / قيد */
    --credit:#3F7D58;  /* قبض / دفعة */
    --white:#FFFFFF;
    --radius:10px;
    --shadow: 0 1px 2px rgba(30,42,56,.06), 0 6px 20px rgba(30,42,56,.06);
    --font-display:'Cairo', sans-serif;
    --font-body:'Tajawal', sans-serif;
    --font-num:'Roboto Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overscroll-behavior-y:contain;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    background-image:
      linear-gradient(var(--paper) 0%, var(--paper) 100%),
      repeating-linear-gradient(0deg, rgba(30,42,56,0.025) 0px, rgba(30,42,56,0.025) 1px, transparent 1px, transparent 28px);
  }
  ::selection{background:var(--bronze); color:#fff;}

  /* ---------- App shell ---------- */
  #app{max-width:1180px; margin:0 auto; padding:18px 16px 60px;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:14px 18px; margin-bottom:18px;
    background:var(--ink); color:var(--paper);
    border-radius:var(--radius); box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  .topbar::before{
    content:""; position:absolute; inset:0;
    background: repeating-linear-gradient(135deg, rgba(176,141,87,.10) 0 10px, transparent 10px 20px);
    pointer-events:none;
  }
  .brand{display:flex; flex-direction:column; gap:2px; position:relative;}
  .brand .name{font-family:var(--font-display); font-weight:800; font-size:20px; letter-spacing:.3px;}
  .brand .tag{font-size:11.5px; color:#C9D2D9; letter-spacing:.4px;}
  .brand .name b{color:var(--bronze);}
  .topbar-actions{display:flex; gap:8px; position:relative;}

  .btn{
    appearance:none; border:1px solid var(--line); background:var(--white);
    color:var(--ink); font-family:var(--font-body); font-weight:700; font-size:13.5px;
    padding:9px 14px; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:hover{box-shadow:0 2px 10px rgba(30,42,56,.12); transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:var(--bronze); border-color:var(--bronze-deep); color:#fff;}
  .btn-primary:hover{background:var(--bronze-deep);}
  .btn-ghost{background:transparent; border-color:rgba(255,255,255,.25); color:var(--paper);}
  .btn-ghost:hover{background:rgba(255,255,255,.08);}
  .btn-danger{color:var(--debit); border-color:#e3c3ba;}
  .btn-sm{padding:6px 10px; font-size:12.5px;}
  .btn-credit{background:var(--credit); border-color:#2f6144; color:#fff;}
  .btn-credit:hover{background:#33573c;}
  .btn-debit{background:var(--debit); border-color:#8f3a29; color:#fff;}
  .btn-debit:hover{background:#8f3a29;}

  .crumbs{display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:13px; color:var(--ink-soft);}
  .crumbs a{color:var(--steel); text-decoration:none; font-weight:700; cursor:pointer;}
  .crumbs a:hover{text-decoration:underline;}

  .card{
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px; margin-bottom:16px;
  }
  .card h2{font-family:var(--font-display); font-size:17px; margin:0 0 14px; display:flex; align-items:center; gap:8px;}
  .card h2 .dot{width:8px; height:8px; border-radius:50%; background:var(--bronze); display:inline-block;}

  .grid{display:grid; gap:12px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:1fr 1fr 1fr;}
  @media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:700;}
  input[type=text], input[type=number], input[type=date], input[type=tel], input[type=password], select, textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:7px;
    font-family:var(--font-body); font-size:14.5px; background:var(--paper); color:var(--ink);
    outline:none; transition:border-color .12s ease, background .12s ease;
    -webkit-appearance:none; -moz-appearance:none; appearance:none;
    margin:0; line-height:1.4; min-height:40px;
  }
  input:focus, select:focus, textarea:focus{border-color:var(--bronze); background:#fff;}
  .field{margin-bottom:12px;}
  .num{font-family:var(--font-num); direction:ltr; text-align:right;}

  /* ---------- Dashboard ---------- */
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px;}
  @media(max-width:640px){.stats{grid-template-columns:1fr;}}
  .stat{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
  .stat .k{font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:6px;}
  .stat .v{font-family:var(--font-num); font-size:23px; font-weight:700;}
  .stat.owe .v{color:var(--debit);}
  .stat.credit .v{color:var(--credit);}

  .search-row{display:flex; gap:10px; margin-bottom:14px;}
  .search-row input{flex:1;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    background:var(--ink); color:var(--paper); font-family:var(--font-display); font-weight:700;
    padding:9px 10px; text-align:right; font-size:12.5px; letter-spacing:.2px;
  }
  thead th:first-child{border-radius:6px 0 0 0;}
  thead th:last-child{border-radius:0 6px 0 0;}
  tbody td{padding:10px; border-bottom:1px solid var(--paper-2);}
  tbody tr{cursor:pointer; transition:background .1s ease;}
  tbody tr:hover{background:var(--paper);}
  tbody tr:last-child td{border-bottom:none;}
  .bal-pos{color:var(--debit); font-weight:700; font-family:var(--font-num);}
  .bal-neg{color:var(--credit); font-weight:700; font-family:var(--font-num);}
  .bal-zero{color:var(--ink-soft); font-weight:700; font-family:var(--font-num);}
  .empty{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty .big{font-family:var(--font-display); font-size:16px; color:var(--ink); margin-bottom:6px; font-weight:700;}

  .pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700;}
  .pill-debit{background:#F6E4DE; color:var(--debit);}
  .pill-credit{background:#E1EFE6; color:var(--credit);}

  /* ---------- customer page ---------- */
  .cust-head{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;}
  .cust-name{font-family:var(--font-display); font-size:21px; font-weight:800;}
  .cust-meta{color:var(--ink-soft); font-size:13px; margin-top:3px;}
  .action-row{display:flex; gap:8px; flex-wrap:wrap;}

  .item-card{border:1px solid var(--line); border-radius:9px; padding:12px; margin-bottom:10px; background:var(--paper);}
  .item-card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--bronze-deep);}
  .add-item-row{margin-top:8px;}
  .rm-btn{background:none; border:none; color:var(--debit); cursor:pointer; font-size:12.5px; font-weight:700; padding:2px 4px;}

  .totals-box{margin-top:14px; padding:14px; background:var(--paper); border-radius:8px; border:1px dashed var(--line);}
  .totals-box .row{display:flex; justify-content:space-between; padding:4px 0; font-size:14px;}
  .totals-box .row.big{font-weight:800; font-size:17px; border-top:1px solid var(--line); margin-top:6px; padding-top:10px;}
  .totals-box .row .v{font-family:var(--font-num);}

  /* ---------- printable documents ---------- */
  .doc{background:#fff; border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:26px; max-width:900px; margin:0 auto 16px;}
  .doc-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid var(--ink); padding-bottom:14px; margin-bottom:16px;}
  .doc-head .co-name{font-family:var(--font-display); font-weight:800; font-size:19px;}
  .doc-head .co-tag{font-size:11.5px; color:var(--ink-soft); margin-top:3px; line-height:1.6;}
  .doc-head .doc-title{font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--bronze-deep); text-align:left;}
  .doc-info{display:grid; grid-template-columns:1fr 1fr; gap:8px 24px; margin-bottom:16px; font-size:13.5px;}
  .doc-info .r{display:flex; justify-content:flex-start; align-items:baseline; gap:8px; border-bottom:1px dotted var(--line); padding:5px 0;}
  .doc-info .r b{font-family:var(--font-num);}
  .doc table{margin-top:6px;}
  .doc thead th{background:var(--paper-2); color:var(--ink); border-bottom:2px solid var(--ink); white-space:nowrap; font-size:11px;}
  .doc table th, .doc table td{border-left:1px solid var(--line);}
  .doc table th:last-child, .doc table td:last-child{border-left:none;}
  .invoice-items-table tbody td{border-bottom:none;}
  .invoice-items-table{border-bottom:2px solid var(--ink);}
  .ded-table th, .ded-table td{padding:8px 10px; font-size:13px;}
  .ded-table thead th{white-space:nowrap; font-size:12px;}
  .table-scroll{max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .doc{overflow-x:hidden;}
  .page-break-after{page-break-after:always; break-after:page;}
  @media print{ .page-break-after{margin-bottom:0;} }
  .ltr-doc{direction:ltr; text-align:left;}
  .ltr-doc .doc-info .r{justify-content:flex-start;}
  .ltr-doc .num{text-align:left; direction:ltr;}
  .ltr-doc table{direction:ltr;}
  .ltr-doc table th, .ltr-doc table td{border-left:none; border-right:1px solid var(--line);}
  .ltr-doc table th:last-child, .ltr-doc table td:last-child{border-right:none;}
  .ltr-doc .sig{text-align:right;}
  .ltr-doc .sig-line{margin-left:0; margin-right:auto;}
  .doc-foot{margin-top:16px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;}
  .words-box{flex:1; min-width:220px; font-size:13px; background:var(--paper); padding:10px 12px; border-radius:7px; border:1px dashed var(--line);}
  .amount-box{text-align:left;}
  .amount-box .line{font-family:var(--font-num); font-size:18px; font-weight:800;}
  .amount-box .line.lbp{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .sig{margin-top:8px; text-align:left; font-size:13px; color:var(--ink-soft);}
  .sig-line{margin-top:26px; width:180px; border-top:1px solid var(--ink-soft); margin-right:0; margin-left:auto;}

  .doc-actions{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; max-width:900px; margin:0 auto 10px;}

  @page{ size:A4; margin:10mm; }
  @media print{
    body{background:#fff;}
    .topbar, .crumbs, .doc-actions, .no-print{display:none !important;}
    #app{max-width:100%; padding:0;}
    .doc{box-shadow:none; border:none; margin:0; padding:0; transform-origin:top center;}
    .doc table th, .doc table td{padding:8px 14px;}
  }

  .modal-bg{position:fixed; inset:0; background:rgba(30,42,56,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal{background:#fff; border-radius:var(--radius); padding:20px; max-width:420px; width:100%; box-shadow:var(--shadow); max-height:calc(100vh - 32px); overflow-y:auto;}
  .modal h3{font-family:var(--font-display); margin:0 0 12px;}
  .modal .row{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13.5px; z-index:100; box-shadow:var(--shadow); opacity:0; transition:opacity .25s ease;}
  .toast.show{opacity:1;}

  .type-toggle{display:flex; gap:6px;}
  .type-toggle button{flex:1;}

  .settings-link{cursor:pointer; opacity:.85;}
  .settings-link:hover{opacity:1;}
  .app-footer{text-align:center; font-size:11.5px; color:var(--ink-soft); padding:18px 10px 6px; opacity:.75; letter-spacing:.2px;}
  .hub-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px;}
  @media(max-width:900px){.hub-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:640px){.hub-grid{grid-template-columns:1fr;}}
  .hub-card{background:var(--white); border:1px solid var(--line); border-radius:14px; padding:22px 18px; text-align:center; box-shadow:var(--shadow); cursor:pointer; transition:transform .1s ease, box-shadow .15s ease;}
  .hub-card:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(30,42,56,.14);}
  .hub-icon{font-size:32px; margin-bottom:8px;}
  .hub-title{font-family:var(--font-display); font-weight:800; font-size:18px; margin-bottom:4px;}
  .hub-sub{color:var(--ink-soft); font-size:12.5px; margin-bottom:8px;}
  .hub-amt{font-family:var(--font-num); font-weight:700; font-size:14px;}
  .hub-amt.owe{color:var(--debit);}

  @media(max-width:480px){
    #app{padding:10px 8px 40px;}
    .topbar{padding:10px 12px; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
    .brand{gap:0;}
    .brand img{height:26px !important;}
    .brand .name{font-size:14px; line-height:1.3;}
    .brand .tag{display:none;}
    .topbar-actions{width:100%; justify-content:flex-start; flex-wrap:wrap; gap:6px;}
    .topbar-actions .btn{padding:6px 10px; font-size:11.5px;}
    .card{padding:12px; margin-bottom:10px;}
    .card h2{font-size:14.5px; margin-bottom:10px;}
    .stats{gap:8px; margin-bottom:10px;}
    .stat{padding:10px 12px;}
    .stat .k{font-size:10.5px; margin-bottom:3px;}
    .stat .v{font-size:17px;}
    .cust-name{font-size:17px;}
    table{font-size:12px;}
    thead th{padding:7px 6px; font-size:10.5px;}
    tbody td{padding:7px 6px;}
    .action-row .btn{font-size:12px; padding:7px 10px;}
    .doc{padding:14px;}
    .doc-head .co-name{font-size:15px;}
    .doc-head .doc-title{font-size:16px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================= STORAGE ============================= */
const KEYS = {customers:'customers', invoices:'invoices', receipts:'receipts', settings:'settings',
  suppliers:'suppliers', purchaseInvoices:'purchaseInvoices', paymentVouchers:'paymentVouchers',
  workers:'workers', workEntries:'workEntries', workerPayments:'workerPayments',
  deductions:'deductions', quotes:'quotes',
  warehouseItems:'warehouseItems', stockIns:'stockIns', stockOuts:'stockOuts',
  cuttingOrders:'cuttingOrders', customerAccounts:'customerAccounts', workerAccounts:'workerAccounts',
  budgetCategories:'budgetCategories', budgetEntries:'budgetEntries'};

async function loadAll(){
  const [c,i,r,s,sup,pi,pv,wk,we,wp,ded,q,wi,si,so,co,ca,wa,bc,be] = await Promise.all([
    loadCustomers(),
    loadSyncedArray(KEYS.invoices, []),
    loadSyncedArray(KEYS.receipts, []),
    loadSettings({defaultExchangeRate:90000, invoiceStart:0, receiptStart:1000, companyName:'', companyTag:'', companyPhone:'', logo:'', auth:{username:'admin', password:'0000'}, autoBackupOnClose:false, quoteDescOptions:['شباك ألمنيوم','واجهة ألمنيوم','شباك حمام','باب مفصلات','شباك ثابت','زجاج'], customDeductionProfiles:[],
      specOptions:{
        systemName:['Sidem System','Technal System'],
        profile:['Sidem 2000','Technal GX'],
        aluType:['Qalex Qatar','Technal GX™'],
        color:['Dark Diamond Gray','Walnut Oak','Dark Marroun'],
        description:['Fixed Panels & Aluminum Sliding Doors.','Aluminum Sliding Windows.'],
        glazing:['6mm Annealed Clear / 6mm Space / 6mm Annealed Clear','6mm Annealed Clear / 9mm Space / 6mm Annealed Clear'],
        accessories:['Technal™','Burgh™','Folda™'],
        handles:['Technal™','Burgh™','Folda™'],
        gaskets:['Wrap Around Flush Gaskets EPDM'],
        fixings:['Concealed with matching endcaps, plugs and seals'],
        silicone:['Den Braven N+'],
        screws:['Stainless Steel SUS 316','Stainless Steel SUS 304'],
        flyScreen:['American Sliding Screen For Sliding Items'],
        note:['The Aluminum Doors & Windows will be sealed inside with PU and outside with Silicone Selant Den Braven No Acid.']
      }
    }),
    loadSyncedArray(KEYS.suppliers, []),
    loadSyncedArray(KEYS.purchaseInvoices, []),
    loadSyncedArray(KEYS.paymentVouchers, []),
    loadSyncedArray(KEYS.workers, []),
    loadSyncedArray(KEYS.workEntries, []),
    loadSyncedArray(KEYS.workerPayments, []),
    loadSyncedArray(KEYS.deductions, []),
    loadSyncedArray(KEYS.quotes, []),
    loadSyncedArray(KEYS.warehouseItems, []),
    loadSyncedArray(KEYS.stockIns, []),
    loadSyncedArray(KEYS.stockOuts, []),
    loadSyncedArray(KEYS.cuttingOrders, []),
    loadSyncedArray(KEYS.customerAccounts, []),
    loadSyncedArray(KEYS.workerAccounts, []),
    loadSyncedArray(KEYS.budgetCategories, []),
    loadSyncedArray(KEYS.budgetEntries, [])
  ]);
  return {customers:c, invoices:i, receipts:r, settings:s,
    suppliers:sup, purchaseInvoices:pi, paymentVouchers:pv,
    workers:wk, workEntries:we, workerPayments:wp,
    deductions:ded, quotes:q,
    warehouseItems:wi, stockIns:si, stockOuts:so,
    cuttingOrders:co, customerAccounts:ca, workerAccounts:wa,
    budgetCategories:bc, budgetEntries:be};
}
async function loadCustomers(){
  if(supabaseClient){
    const remote = await supabaseListCustomers();
    if(remote !== null){
      try{ localStorage.setItem(skey(KEYS.customers), JSON.stringify(remote)); }catch(e){}
      return remote;
    }
    toast('ما قدرنا نوصل لقاعدة البيانات السحابية — عم نستخدم آخر نسخة محفوظة عالجهاز');
  }
  return safeGet(KEYS.customers, []);
}
async function safeGet(key, fallback){
  try{
    const raw = localStorage.getItem(skey(key));
    if(raw !== null) return JSON.parse(raw);
    return fallback;
  }catch(e){ return fallback; }
}
async function save(key, value){
  try{
    localStorage.setItem(skey(key), JSON.stringify(value));
  }catch(e){ console.error('storage error', key, e); return false; }
  if(key===KEYS.settings){
    syncSettingsToSupabase(value);
    syncUsersToSupabase(value.users||[]);
  } else {
    syncArrayToSupabase(key, value);
  }
  return true;
}

let DB = {customers:[], invoices:[], receipts:[], settings:{}, suppliers:[], purchaseInvoices:[], paymentVouchers:[], workers:[], workEntries:[], workerPayments:[], deductions:[], quotes:[], warehouseItems:[], stockIns:[], stockOuts:[], cuttingOrders:[], customerAccounts:[], workerAccounts:[], budgetCategories:[], budgetEntries:[]};
let authenticated = false;

// خروج من البرنامج لازم يلغي جلسة المنصة كمان (يلي فتحناها تلقائياً عبر رابط
// /portal/<slug>) وإلا الجهاز/المتصفح بيضل يذكر آخر زبون فتح البرنامج فيه،
// وأي رابط portal تاني بينفتح على حسابه بالغلط
async function signOutEverywhere(){
  try{ if(supabaseClient) await supabaseClient.auth.signOut(); }catch(e){}
  // حذف إجباري مباشر لأي أثر لجلسة Supabase بالتخزين المحلي — بغض النظر
  // عن نجاح/فشل الاتصال بالسيرفر فوق، حتى نضمن الجلسة انمسحت فعلياً
  try{
    Object.keys(localStorage).forEach(k=>{
      if(k.startsWith('sb-') || k.includes('supabase')) localStorage.removeItem(k);
    });
  }catch(e){}
  authenticated = false;
  currentUser = null;
  currentCustomerSession = null;
  currentWorkerSession = null;
  location.href = location.pathname;
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============================= SUPABASE (CLOUD SYNC — CUSTOMERS PILOT) ============================= */
/* ===== الاتصال بمنصة LibanApps ===== */

/* ===== سياق الزبون: كل الجداول بسابقة alum_ ومربوطة بـclient_id ===== */
let CLIENT_ID = null;          // هوية المؤسسة المشتركة
let ACCESS = null;             // حالة الاشتراك
let PLATFORM_ADMIN = false;    // داخل كمشرف منصة (من لوحة /super)
let PLATFORM_CLIENT_NAME = '';
function T(name){ return 'alum_' + name; }            // اسم الجدول بالسحابة
function withClient(row){ return Object.assign({}, row, { client_id: CLIENT_ID }); }
function scoped(q){ return CLIENT_ID ? q.eq('client_id', CLIENT_ID) : q; }
// مفتاح التخزين المحلي — لازم يكون مربوط بهوية الزبون (CLIENT_ID)، وإلا
// بيانات زبون (الشعار، الإعدادات، رمز التفعيل) ممكن تظهر لزبون تاني استخدم
// نفس الجهاز/المتصفح قبلو
function skey(key){ return 'la_' + (CLIENT_ID || 'anon') + '_' + key; }

function customerFromDb(row){
  return {
    id: row.id, name: row.name, accountNumber: row.account_number || '', phone: row.phone || '',
    createdAt: row.created_at || 0, deleted: !!row.deleted, deletedAt: row.deleted_at || null
  };
}
function customerToDb(c){
  return {
    id: c.id, name: c.name, account_number: c.accountNumber || null, phone: c.phone || null,
    created_at: c.createdAt || Date.now(), deleted: !!c.deleted, deleted_at: c.deletedAt || null
  };
}
function describeSupabaseError(error){
  if(!error) return 'unknown error';
  return `message: ${error.message||'?'} | code: ${error.code||'?'} | details: ${error.details||'?'} | hint: ${error.hint||'?'}`;
}
async function supabaseListCustomers(){
  if(!supabaseClient) return null;
  try{
    const { data, error } = await scoped(supabaseClient.from(T('customers')).select('*')).order('name');
    if(error){ lastSupabaseError = describeSupabaseError(error); console.error('supabaseListCustomers error:', lastSupabaseError); return null; }
    return data.map(customerFromDb);
  }catch(e){
    lastSupabaseError = 'threw: '+(e && e.message);
    console.error('supabaseListCustomers threw:', e && e.message);
    return null;
  }
}
async function supabaseUpsertCustomer(customer){
  if(!supabaseClient) return false;
  try{
    const { error } = await supabaseClient.from(T('customers')).upsert(withClient(customerToDb(customer)));
    if(error){ lastSupabaseError = describeSupabaseError(error); console.error('supabaseUpsertCustomer error:', lastSupabaseError); return false; }
    return true;
  }catch(e){
    lastSupabaseError = 'threw: '+(e && e.message);
    console.error('supabaseUpsertCustomer threw:', e && e.message);
    return false;
  }
}
async function supabaseDeleteCustomer(id){
  if(!supabaseClient) return false;
  try{
    const { error } = await scoped(supabaseClient.from(T('customers')).delete()).eq('id', id);
    if(error){ lastSupabaseError = describeSupabaseError(error); console.error('supabaseDeleteCustomer error:', lastSupabaseError); return false; }
    return true;
  }catch(e){
    lastSupabaseError = 'threw: '+(e && e.message);
    console.error('supabaseDeleteCustomer threw:', e && e.message);
    return false;
  }
}
async function saveCustomerRemote(customer){
  try{ localStorage.setItem(skey(KEYS.customers), JSON.stringify(DB.customers)); }catch(e){}
  if(supabaseClient){
    const ok = await supabaseUpsertCustomer(customer);
    if(!ok){
      toast('تم الحفظ محليًا بس صار خطأ بالمزامنة مع السحابة');
      setTimeout(()=>{ if(lastSupabaseError) alert('تفاصيل خطأ المزامنة (خذ لقطة شاشة وابعتها):\n\n'+lastSupabaseError); }, 400);
    }
    return ok;
  }
  return true;
}
async function deleteCustomerRemote(id){
  try{ localStorage.setItem(skey(KEYS.customers), JSON.stringify(DB.customers)); }catch(e){}
  if(supabaseClient){
    const ok = await supabaseDeleteCustomer(id);
    if(!ok) toast('تم الحذف محليًا بس صار خطأ بالمزامنة مع السحابة');
    return ok;
  }
  return true;
}

async function syncUsersToSupabase(users){
  if(!supabaseClient) return;
  try{
    if(users.length){
      const rows = users.map(userToDb).map(withClient);
      const { error } = await supabaseClient.from(T('app_users')).upsert(rows.map(withClient), {onConflict:'client_id,id'});
      if(error){
        lastSupabaseError = describeSupabaseError(error);
        console.error('app_users upsert error:', lastSupabaseError);
        toast('تم الحفظ محليًا بس صار خطأ بمزامنة المستخدمين مع السحابة');
        setTimeout(()=>{ if(lastSupabaseError) alert('تفاصيل خطأ مزامنة المستخدمين (خذ لقطة شاشة وابعتها):\n\n'+lastSupabaseError); }, 400);
        return;
      }
    }
    const usernames = users.map(u=>u.username);
    const delQuery = scoped(supabaseClient.from(T('app_users')).delete());
    const { error: delErr } = usernames.length
      ? await delQuery.not('username','in', `(${usernames.map(u=>`"${String(u).replace(/"/g,'""')}"`).join(',')})`)
      : await delQuery.neq('username','__none__');
    if(delErr){
      lastSupabaseError = describeSupabaseError(delErr);
      console.error('app_users cleanup error:', lastSupabaseError);
    }
    const { data: freshRows, error: fetchErr } = await scoped(supabaseClient.from(T('app_users')).select('*'));
    if(!fetchErr && freshRows && freshRows.length){
      DB.settings.users = freshRows.map(userFromDb);
      try{ localStorage.setItem(skey(KEYS.settings), JSON.stringify(DB.settings)); }catch(e){}
    }
  }catch(e){
    lastSupabaseError = 'threw: '+(e && e.message);
    console.error('app_users sync threw:', e && e.message);
    toast('تم الحفظ محليًا بس صار خطأ بمزامنة المستخدمين مع السحابة');
    setTimeout(()=>{ if(lastSupabaseError) alert('تفاصيل خطأ مزامنة المستخدمين (خذ لقطة شاشة وابعتها):\n\n'+lastSupabaseError); }, 400);
  }
}
async function loadSettings(defaults){
  const local = await safeGet(KEYS.settings, defaults);
  if(!supabaseClient) return local;
  let merged = local;
  try{
    const { data, error } = await scoped(supabaseClient.from(T('app_settings')).select('*')).maybeSingle();
    if(!error && data) merged = applySettingsFromDb(data, merged);
    else if(error){ lastSupabaseError = describeSupabaseError(error); console.error('app_settings load error:', lastSupabaseError); }
  }catch(e){ lastSupabaseError = 'threw: '+(e && e.message); console.error('app_settings load threw:', e && e.message); }
  try{
    const { data, error } = await scoped(supabaseClient.from(T('app_users')).select('*'));
    if(!error && data && data.length) merged.users = data.map(userFromDb);
    else if(error){ lastSupabaseError = describeSupabaseError(error); console.error('app_users load error:', lastSupabaseError); }
  }catch(e){ lastSupabaseError = 'threw: '+(e && e.message); console.error('app_users load threw:', e && e.message); }
  try{ localStorage.setItem(skey(KEYS.settings), JSON.stringify(merged)); }catch(e){}
  return merged;
}

async function syncArrayToSupabase(localKey, arr){
  const cfg = SUPABASE_TABLES[localKey];
  if(!cfg || !supabaseClient) return;
  try{
    if(arr.length){
      const rows = arr.map(cfg.toDb);
      const { error } = await supabaseClient.from(T(cfg.table)).upsert(rows.map(withClient));
      if(error){
        lastSupabaseError = describeSupabaseError(error);
        console.error(cfg.table+' upsert error:', lastSupabaseError);
        toast('تم الحفظ محليًا بس صار خطأ بمزامنة '+cfg.label+' مع السحابة');
        setTimeout(()=>{ if(lastSupabaseError) alert('تفاصيل خطأ مزامنة '+cfg.label+' (خذ لقطة شاشة وابعتها):\n\n'+lastSupabaseError); }, 400);
        return;
      }
    }
    const ids = arr.map(r=>r.id);
    const delQuery = scoped(supabaseClient.from(T(cfg.table)).delete());
    const { error: delErr } = ids.length ? await delQuery.not('id','in', `(${ids.join(',')})`) : await delQuery.neq('id','__none__');
    if(delErr){
      lastSupabaseError = describeSupabaseError(delErr);
      console.error(cfg.table+' cleanup delete error:', lastSupabaseError);
    }
  }catch(e){
    lastSupabaseError = 'threw: '+(e && e.message);
    console.error(cfg.table+' sync threw:', e && e.message);
    toast('تم الحفظ محليًا بس صار خطأ بمزامنة '+cfg.label+' مع السحابة');
    setTimeout(()=>{ if(lastSupabaseError) alert('تفاصيل خطأ مزامنة '+cfg.label+' (خذ لقطة شاشة وابعتها):\n\n'+lastSupabaseError); }, 400);
  }
}

/* ============================= TOTP (2FA) — RFC 6238 ============================= */
const TOTP_ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function base32Encode(bytes){
  let bits = '', output = '';
  for(const byte of bytes) bits += byte.toString(2).padStart(8,'0');
  for(let i=0;i+5<=bits.length;i+=5) output += TOTP_ALPHABET[parseInt(bits.substr(i,5),2)];
  if(bits.length % 5 !== 0){
    const remainder = bits.slice(bits.length - (bits.length%5));
    output += TOTP_ALPHABET[parseInt(remainder.padEnd(5,'0'),2)];
  }
  return output;
}
function base32Decode(str){
  str = String(str||'').replace(/=+$/,'').toUpperCase().replace(/[^A-Z2-7]/g,'');
  let bits = '';
  for(const c of str){ const idx = TOTP_ALPHABET.indexOf(c); if(idx===-1) continue; bits += idx.toString(2).padStart(5,'0'); }
  const bytes = [];
  for(let i=0;i+8<=bits.length;i+=8) bytes.push(parseInt(bits.substr(i,8),2));
  return new Uint8Array(bytes);
}
function generateTotpSecret(){
  const bytes = new Uint8Array(20);
  crypto.getRandomValues(bytes);
  return base32Encode(bytes);
}
async function computeTotp(secretBase32, forTime){
  const key = base32Decode(secretBase32);
  const counter = Math.floor((forTime===undefined? Date.now() : forTime)/1000/30);
  const buf = new ArrayBuffer(8);
  new DataView(buf).setBigUint64(0, BigInt(counter), false);
  const cryptoKey = await crypto.subtle.importKey('raw', key, {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
  const hmac = new Uint8Array(await crypto.subtle.sign('HMAC', cryptoKey, buf));
  const offset = hmac[hmac.length-1] & 0xf;
  const binCode = ((hmac[offset]&0x7f)<<24) | ((hmac[offset+1]&0xff)<<16) | ((hmac[offset+2]&0xff)<<8) | (hmac[offset+3]&0xff);
  return (binCode % 1000000).toString().padStart(6,'0');
}
async function verifyTotp(secretBase32, token){
  token = String(token||'').trim();
  if(!/^\d{6}$/.test(token)) return false;
  const now = Date.now();
  for(let w=-1; w<=1; w++){
    const code = await computeTotp(secretBase32, now + w*30000);
    if(code === token) return true;
  }
  return false;
}
function totpAuthUri(username, secret){
  const issuer = encodeURIComponent(DB.settings.companyName || 'LibanApps');
  const label = encodeURIComponent(`${DB.settings.companyName||'دفتر الحسابات'}:${username}`);
  return `otpauth://totp/${label}?secret=${secret}&issuer=${issuer}&digits=6&period=30`;
}

}

/* ---------- Fit any invoice/statement onto a single A4 page when printing ---------- */
function fitDocsToPage(){
  const isLandscape = !!document.getElementById('print-orientation-style');
  const PAGE_H_PX = (isLandscape ? (210-20) : (297-20)) * 3.7795; // A4 height minus 10mm top+bottom margins, at 96dpi
  document.querySelectorAll('.doc:not(.no-autofit)').forEach(doc=>{
    doc.style.transform=''; doc.style.width=''; doc.style.transformOrigin='top center';
    const h = doc.scrollHeight;
    if(h > PAGE_H_PX){
      const scale = Math.max(PAGE_H_PX / h, 0.45);
      doc.style.transform = `scale(${scale})`;
      doc.style.width = `${100/scale}%`;
    }
  });
}
window.addEventListener('beforeprint', fitDocsToPage);
window.addEventListener('afterprint', ()=>{
  document.querySelectorAll('.doc').forEach(doc=>{ doc.style.transform=''; doc.style.width=''; });
});

/* ---------- Arabic number to words (for currency lines) ---------- */
const ONES=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة'];
const TEENS=['عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const TENS=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const HUNDREDS=['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];
function threeDigits(n){
  n=Math.floor(n);
  let parts=[];
  const h=Math.floor(n/100), r=n%100;
  if(h) parts.push(HUNDREDS[h]);
  if(r>=10 && r<20) parts.push(TEENS[r-10]);
  else{
    const t=Math.floor(r/10), o=r%10;
    let sub=[];
    if(o) sub.push(ONES[o]);
    if(t) sub.push(TENS[t]);
    if(sub.length) parts.push(sub.join(' و'));
  }
  return parts.join(' و');
}
function scaleWord(n, singular, dual, plural){
  if(n===1) return singular;
  if(n===2) return dual;
  if(n>=3 && n<=10) return threeDigits(n)+' '+plural;
  return threeDigits(n)+' '+singular;
}
function numberToArabicWords(num){
  num = Math.round(Number(num)||0);
  if(num===0) return 'صفر';
  const million=Math.floor(num/1000000);
  const thousand=Math.floor((num%1000000)/1000);
  const rest=num%1000;
  let parts=[];
  if(million) parts.push(scaleWord(million,'مليون','مليونان','ملايين'));
  if(thousand) parts.push(scaleWord(thousand,'ألف','ألفان','آلاف'));
  if(rest) parts.push(threeDigits(rest));
  return parts.join(' و');
}
function amountWords(usd){
  const whole = Math.floor(usd);
  const cents = Math.round((usd-whole)*100);
  let s = 'فقط ' + numberToArabicWords(whole) + ' دولار أمريكي';
  if(cents>0) s += ' و' + numberToArabicWords(cents) + ' سنت';
  s += ' لا غير';
  return s;
}

/* ============================= LEDGER LOGIC ============================= */
// Build combined, sorted ledger entries for a customer, with running balance.
function buildLedger(customerId){
  const cust = DB.customers.find(c=>c.id===customerId);
  const inv = DB.invoices.filter(i=>i.customerId===customerId && !i.deleted).map(i=>({
    date:i.date, type:'قيد', label:'فاتورة بالحساب', number:i.number,
    from:0, to:computeInvoiceTotal(i).totalUSD, ref:'invoice', id:i.id, sortKey:i.createdAt||0
  }));
  const rec = DB.receipts.filter(r=>r.customerId===customerId && !r.deleted).map(r=>({
    date:r.date, type:'قبض', label:r.details? r.details : 'دفعة بالحساب', number:r.number,
    from:Number(r.amount)||0, to:0, ref:'receipt', id:r.id, sortKey:r.createdAt||0
  }));
  let rows=[...inv,...rec];
  rows.sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date?-1:1;
    if(a.ref!==b.ref) return a.ref==='receipt' ? -1 : 1;
    return (a.sortKey||0)-(b.sortKey||0);
  });
  let bal = 0;
  const out = rows.map(r=>{
    bal = bal - r.from + r.to;
    return {...r, balance:bal};
  });
  const totFrom = rows.reduce((s,r)=>s+r.from,0);
  const totTo = rows.reduce((s,r)=>s+r.to,0);
  return {rows:out, totFrom, totTo, finalBalance:bal};
}
function customerBalance(customerId){
  return buildLedger(customerId).finalBalance;
}
function computeInvoiceTotal(inv){
  const subtotal = (inv.items||[]).reduce((s,it)=>s+(Number(it.total)||0),0);
  const discount = Number(inv.discount)||0;
  const totalUSD = Math.max(subtotal - discount, 0);
  const totalLBP = totalUSD * (Number(inv.exchangeRate)||DB.settings.defaultExchangeRate||90000);
  return {subtotal, discount, totalUSD, totalLBP};
}

  double: {key:'double', label:'سيدم دوبل فيتراج فراغ 9 ملم', glassLabel:'دوبل فيتراج فراغ 9 ملم', fields:BUILTIN_DEDUCTION_FIELDS, builtin:true}

function getDeductionType(key){
  if(DEDUCTION_TYPES[key]) return DEDUCTION_TYPES[key];
  const custom = (DB.settings.customDeductionProfiles||[]).find(p=>p.key===key);
  if(custom) return custom;
  return DEDUCTION_TYPES.single;

function applyDeductionOp(value, op){
  const n = Number(op.value)||0;
  if(op.op==='add') return value+n;
  if(op.op==='subtract') return value-n;
  if(op.op==='multiply') return value*n;
  if(op.op==='divide') return n!==0? value/n : value;
  return value;
}
function computeDeductionRow(width, height, fields){
  const w = Number(width)||0;
  const h = Number(height)||0;
  const round2 = n=>Math.round(n*100)/100;
  const defs = fields || BUILTIN_DEDUCTION_FIELDS;
  const computed = {width:w, height:h};
  defs.forEach(f=>{
    let val;
    if(f.base==='width') val = w;
    else if(f.base==='height') val = h;
    else val = Number(computed[f.base])||0;
    (f.ops||[]).forEach(op=>{ val = applyDeductionOp(val, op); });
    computed[f.key] = round2(val);
  });
  if(computed.glassWidth===undefined) computed.glassWidth = 0;
  if(computed.glassHeight===undefined) computed.glassHeight = 0;
  computed.glassQty = 2;
  return computed;
}

function buildStockLedger(itemId){
  const ins = DB.stockIns.filter(s=>s.itemId===itemId && !s.deleted).map(s=>({
    date:s.date, type:'إضافة', label:s.note? s.note : 'إضافة للمستودع', number:s.number,
    from:0, to:Number(s.qty)||0, ref:'stockin', id:s.id, sortKey:s.createdAt||0
  }));
  const outs = DB.stockOuts.filter(s=>s.itemId===itemId && !s.deleted).map(s=>{
    const wk = DB.workers.find(w=>w.id===s.workerId);
    return {
      date:s.date, type:'سحب', label:(wk?wk.name:'عامل')+(s.note?' — '+s.note:''), number:s.number,
      from:Number(s.qty)||0, to:0, ref:'stockout', id:s.id, sortKey:s.createdAt||0
    };
  });
  let rows=[...ins,...outs];
  rows.sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date?-1:1;
    return (a.sortKey||0)-(b.sortKey||0);
  });
  let bal = 0;
  const out = rows.map(r=>{
    bal = bal - r.from + r.to;
    return {...r, balance:bal};
  });
  const totFrom = rows.reduce((s,r)=>s+r.from,0);
  const totTo = rows.reduce((s,r)=>s+r.to,0);
  return {rows:out, totFrom, totTo, finalBalance:bal};
}

  {key:'shankal', label:'الشنكل', sources:[{field:'shankal', qty:2}], kerf:0.5},
  {key:'maskeh', label:'مسكة', mirrorOf:'shankal'},

function ensureOrderResultsComplete(order){
  const missing = CUT_TYPES.some(ct => !order.results || !order.results[ct.key]);
  if(missing){
    const deduction = DB.deductions.find(d=>d.id===order.deductionId);
    if(deduction){
      order.results = computeCuttingOrder(deduction, order.barLength);
      save(KEYS.cuttingOrders, DB.cuttingOrders);
    }
  }
  return order;
}
function packBars(pieces, barLengthCm){
  const sorted = [...pieces].sort((a,b)=>b.length-a.length);
  const bars = [];
  sorted.forEach(piece=>{
    if(piece.length > barLengthCm){
      bars.push({items:[piece], used:piece.length, remaining:barLengthCm-piece.length, overflow:true});
      return;
    }
    let best = null, bestRemaining = Infinity;
    bars.forEach(bar=>{
      if(bar.overflow) return;
      const rem = bar.remaining - piece.length;
      if(rem >= -0.0001 && bar.remaining < bestRemaining){ best = bar; bestRemaining = bar.remaining; }
    });
    if(best){
      best.items.push(piece);
      best.used = Math.round((best.used+piece.length)*100)/100;
      best.remaining = Math.round((best.remaining-piece.length)*100)/100;
    } else {
      bars.push({items:[piece], used:piece.length, remaining:Math.round((barLengthCm-piece.length)*100)/100});
    }
  });
  return bars;
}
function computeCuttingOrder(deduction, barLengthM){
  const barLengthCm = Number(barLengthM)*100;
  const results = {};
  CUT_TYPES.forEach(ct=>{
    if(ct.mirrorOf){
      const src = results[ct.mirrorOf];
      results[ct.key] = src ? JSON.parse(JSON.stringify(src)) : {pieces:0, bars:[]};
      return;
    }
    const pieces = [];
    (deduction.rows||[]).forEach((r,idx)=>{
      const c = computeDeductionRow(r.width, r.height);
      ct.sources.forEach(src=>{
        const raw = c[src.field];
        const pieceLen = Math.round((raw + ct.kerf)*100)/100;
        for(let i=0;i<src.qty;i++) pieces.push({length:pieceLen, rowIndex:idx+1});
      });
    });
    results[ct.key] = {pieces:pieces.length, bars:packBars(pieces, barLengthCm)};
  });
  return results;
}

function computePeriodRange(type, a, b){
  const today = todayISO();
  if(type==='month'){
    const val = a || today.slice(0,7);
    const [y,m] = val.split('-');
    const lastDay = new Date(Number(y), Number(m), 0).getDate();
    return {from:`${y}-${m}-01`, to:`${y}-${m}-${String(lastDay).padStart(2,'0')}`};
  }
  if(type==='year'){
    const y = a || today.slice(0,4);
    return {from:`${y}-01-01`, to:`${y}-12-31`};
  }
  if(type==='range'){
    return {from:a||'0000-01-01', to:b||'9999-12-31'};
  }
  return {from:'0000-01-01', to:'9999-12-31'};
}

/* ============================= LICENSING (3-day trial + serial activation) ============================= */
const LICENSE_PUBLIC_JWK = {"key_ops":["verify"],"ext":true,"kty":"EC","x":"jjQeWIhBYsBXxYPxzH7zmKApYni_ajVuXh4JKoGz7ww","y":"CkjZSZjKFiyxRcXLv7djbS3mhXAROtvyGFuDNvlygw4","crv":"P-256"};
const TRIAL_DAYS = 3;
let _licensePublicKey = null;
function b64urlToBytes(str){
  str = String(str||'').replace(/-/g,'+').replace(/_/g,'/');
  while(str.length%4) str+='=';
  const bin = atob(str);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
function strToBytes(str){ return new TextEncoder().encode(str); }
async function getLicensePublicKey(){
  if(_licensePublicKey) return _licensePublicKey;
  _licensePublicKey = await crypto.subtle.importKey('jwk', LICENSE_PUBLIC_JWK, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
  return _licensePublicKey;
}
async function verifyLicenseSerial(serial){
  try{
    const parts = String(serial||'').trim().split('.');
    if(parts.length!==3 || parts[0]!=='HMDH1') return null;
    const pubKey = await getLicensePublicKey();
    const sigBytes = b64urlToBytes(parts[2]);
    const ok = await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, pubKey, sigBytes, strToBytes(parts[1]));
    if(!ok) return null;
    const payload = JSON.parse(new TextDecoder().decode(b64urlToBytes(parts[1])));
    if(!payload || typeof payload.exp !== 'number') return null;
    return payload;
  }catch(e){ console.error('verifyLicenseSerial error:', e && e.message); return null; }
}
function ensureTrialStarted(){

  }
}
function licenseStatus(){
  const s = DB.settings;
  if(s.licenseExpiresAt && s.licenseExpiresAt > Date.now()){
    return { active:true, mode:'licensed', expiresAt:s.licenseExpiresAt, label:s.licenseLabel||'' };
  }
  const trialStart = s.trialStartedAt || Date.now();
  const trialEnd = trialStart + TRIAL_DAYS*86400000;
  if(Date.now() < trialEnd){
    return { active:true, mode:'trial', expiresAt:trialEnd, daysLeft: Math.max(1, Math.ceil((trialEnd-Date.now())/86400000)) };
  }
  return { active:false, mode:'expired', expiresAt: s.licenseExpiresAt||trialEnd };
}
async function activateLicenseSerial(serial){
  const payload = await verifyLicenseSerial(serial);
  if(!payload) return {ok:false, reason:'invalid'};
  if(payload.exp <= Date.now()) return {ok:false, reason:'expired'};
  DB.settings.licenseSerial = serial;
  DB.settings.licenseExpiresAt = payload.exp;
  DB.settings.licenseLabel = payload.label || '';
  const ok = await save(KEYS.settings, DB.settings);
  return {ok: !!ok, reason: ok?null:'save-failed'};
}
