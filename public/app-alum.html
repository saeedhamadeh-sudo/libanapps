            const trimmed = newVal.trim();
            if(!DB.settings.quoteDescOptions) DB.settings.quoteDescOptions = [];
            if(!DB.settings.quoteDescOptions.includes(trimmed)){
              DB.settings.quoteDescOptions.push(trimmed);
              await save(KEYS.settings, DB.settings);
            }
            val = trimmed;
          } else { render(); return; }
        }
        s.deductionPage.items[idx].type = val;
        render();
      });
    });
    dedItemsBody.querySelectorAll('.dpi-count').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const idx = Number(inp.getAttribute('data-idx'));
        s.deductionPage.items[idx].count = Number(inp.value)||1;
      });
    });
  }

  specBody.querySelectorAll('.spec-opt-select').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const key = sel.getAttribute('data-spec-key');
      const idx = Number(sel.getAttribute('data-sys-idx'));
      let val = sel.value;
      if(val==='__add_new__'){
        const newVal = prompt('اكتب القيمة الجديدة:');
        if(newVal && newVal.trim()){
          const trimmed = newVal.trim();
          if(!DB.settings.specOptions) DB.settings.specOptions = {};
          if(!DB.settings.specOptions[key]) DB.settings.specOptions[key] = [];
          if(!DB.settings.specOptions[key].includes(trimmed)){
            DB.settings.specOptions[key].push(trimmed);
            await save(KEYS.settings, DB.settings);
          }
          val = trimmed;
        } else { render(); return; }
      }
      s.systems[idx][key] = val;
      render();
    });
  });
  specBody.querySelectorAll('.sys-price').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const idx = Number(inp.getAttribute('data-sys-idx'));
      s.systems[idx].price = inp.value;
    });
  });
  specBody.querySelectorAll('[data-rm-sys]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.getAttribute('data-rm-sys'));
      s.systems.splice(idx,1);
      render();
    });
  });
  const addSysBtn = document.getElementById('addSpecSysBtn');
  if(addSysBtn) addSysBtn.addEventListener('click', ()=>{ s.systems.push(blankSpecSystem()); render(); });
}
function bindQuoteSaveButton(){
  if(!_itemDocDraft || _itemDocDraft.__kind!=='quote') return;
  const saveBtn = document.getElementById('saveInvoiceBtn');
  if(!saveBtn) return;
  saveBtn.addEventListener('click', async ()=>{
    if(!_itemDocDraft.specs) _itemDocDraft.specs = blankSpecs();
    if(!_itemDocDraft.specs.deductionPage || !_itemDocDraft.specs.deductionPage.deductionId){
      toast('لازم تختار ورقة خصميات — إلزامية لعرض السعر');
      return;
    }
    if(!_itemDocDraft.number) _itemDocDraft.number = nextQuoteNumber();
    if(!_itemDocDraft.date) _itemDocDraft.date = _itemDocDraft.specs.date || todayISO();
    let savedId;
    if(_itemDocDraft.id){
      const idx = DB.quotes.findIndex(q=>q.id===_itemDocDraft.id);
      const clean = {...(_itemDocDraft)}; delete clean.__editId; delete clean.__kind;
      DB.quotes[idx] = clean;
      savedId = clean.id;
    } else {
      const clean = {id:uid(), createdAt:Date.now(), customerId:_itemDocDraft.customerId, number:_itemDocDraft.number, date:_itemDocDraft.date, docType:_itemDocDraft.docType||'Quotation', specs:_itemDocDraft.specs};
      DB.quotes.push(clean);
      savedId = clean.id;
    }
    const ok = await save(KEYS.quotes, DB.quotes);
    toast(ok? 'تم حفظ عرض السعر':'صار خطأ بالحفظ');
    _itemDocDraft = null;
    go(`#/quote/${savedId}`);
  });
}
function bindItemDocFormEvents(){
  const body = document.getElementById('itemsBody');
  if(!body || !_itemDocDraft) return;
  const cfg = ITEMDOC_CFG[_itemDocDraft.__kind];

  document.getElementById('f_number').addEventListener('input', e=>_itemDocDraft.number=e.target.value);
  document.getElementById('f_date').addEventListener('input', e=>_itemDocDraft.date=e.target.value);
  document.getElementById('f_doctype').addEventListener('input', e=>_itemDocDraft.docType=e.target.value);
  document.getElementById('f_rate').addEventListener('input', e=>{ _itemDocDraft.exchangeRate=Number(e.target.value)||0; refreshInvoiceTotals(); });
  document.getElementById('f_discount').addEventListener('input', e=>{ _itemDocDraft.discount=Number(e.target.value)||0; refreshInvoiceTotals(); });

  body.querySelectorAll('.item-card').forEach(tr=>{
    const descSelect = tr.querySelector('.it-desc-select');
    if(descSelect){
      descSelect.addEventListener('change', async ()=>{
        const val = descSelect.value;
        if(val==='__add_new__'){
          const newVal = prompt('اكتب الوصف الجديد:');
          if(newVal && newVal.trim()){
            const trimmed = newVal.trim();
            if(!(DB.settings.quoteDescOptions||[]).includes(trimmed)){
              DB.settings.quoteDescOptions = [...(DB.settings.quoteDescOptions||[]), trimmed];
              await save(KEYS.settings, DB.settings);
            }
            const idx = Number(tr.getAttribute('data-idx'));
            _itemDocDraft.items[idx].desc = trimmed;
          } else {
            const idx = Number(tr.getAttribute('data-idx'));
            descSelect.value = _itemDocDraft.items[idx].desc || '';
            return;
          }
        } else {
          const idx = Number(tr.getAttribute('data-idx'));
          _itemDocDraft.items[idx].desc = val;
        }
        render();
      });
    }
    tr.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        recalcItemRow(tr);
        const idx = Number(tr.getAttribute('data-idx'));
        const it = _itemDocDraft.items[idx];
        if(inp.classList.contains('it-weight') || inp.classList.contains('it-width') || inp.classList.contains('it-length') || inp.classList.contains('it-count')){
          it.sqm = autoSqmFromDims(it);
          tr.querySelector('.it-sqm').value = it.sqm;
        }
        if(inp.classList.contains('it-price') || inp.classList.contains('it-sqm') || inp.classList.contains('it-weight') || inp.classList.contains('it-width') || inp.classList.contains('it-length') || inp.classList.contains('it-count')){
          it.total = autoTotalFromPrice(it);
          tr.querySelector('.it-total').value = it.total;
        }
        refreshInvoiceTotals();
      });
    });
  });
  body.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.getAttribute('data-rm'));
      if(_itemDocDraft.items.length<=1){ toast('لازم يبقى سطر واحد عالأقل'); return; }
      _itemDocDraft.items.splice(idx,1);
      render();
    });
  });
  const addItemBtn = document.getElementById('addItemBtn');
  if(addItemBtn) addItemBtn.addEventListener('click', ()=>{ _itemDocDraft.items.push(blankItem()); render(); });

  const saveBtn = document.getElementById('saveInvoiceBtn');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{
    if(!_itemDocDraft.number){ toast('لازم رقم '+cfg.title); return; }
    if(!_itemDocDraft.date){ toast('لازم تاريخ'); return; }
    if(cfg.numberUnique){
      const dupInv = DB[cfg.docArr].find(i=> i.number===_itemDocDraft.number && i.id!==_itemDocDraft.id);
      if(dupInv){ toast('رقم '+cfg.title+' هيدا مستخدم لفاتورة تانية — لازم يكون وحداني'); return; }
    }
    const hasItem = _itemDocDraft.items.some(it=>it.desc && Number(it.total)>0);
    if(!hasItem){ toast('ضيف سطر واحد عالأقل فيه وصف ومبلغ'); return; }
    let savedId;
    if(_itemDocDraft.id){
      const idx = DB[cfg.docArr].findIndex(i=>i.id===_itemDocDraft.id);
      const clean = {...(_itemDocDraft)}; delete clean.__editId; delete clean.__kind;
      DB[cfg.docArr][idx] = clean;
      savedId = clean.id;
    } else {
      const clean = {id:uid(), createdAt:Date.now(), [cfg.partyField]:_itemDocDraft[cfg.partyField], number:_itemDocDraft.number, date:_itemDocDraft.date, docType:_itemDocDraft.docType, exchangeRate:_itemDocDraft.exchangeRate, discount:_itemDocDraft.discount||0, items:_itemDocDraft.items};
      if(_itemDocDraft.__kind==='quote') clean.specs = _itemDocDraft.specs || blankSpecs();
      DB[cfg.docArr].push(clean);
      savedId = clean.id;
    }
    const ok = await save(KEYS[cfg.keyName], DB[cfg.docArr]);
    toast(ok? 'تم حفظ '+cfg.title:'صار خطأ بالحفظ');
    _itemDocDraft = null;
    go(cfg.viewRoute(savedId));
  });
}

/* ---------- Receipt form events ---------- */
function bindPaymentFormEvents(){
  const el = document.getElementById('r_number');
  if(!el || !_paymentDraft) return;
  const cfg = PAYMENT_CFG[_paymentDraft.__kind];
  el.addEventListener('input', e=>_paymentDraft.number=e.target.value);
  document.getElementById('r_date').addEventListener('input', e=>_paymentDraft.date=e.target.value);
  document.getElementById('r_amount').addEventListener('input', e=>_paymentDraft.amount=e.target.value);
  document.getElementById('r_details').addEventListener('input', e=>_paymentDraft.details=e.target.value);
  document.querySelectorAll('[data-method]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ _paymentDraft.method = btn.getAttribute('data-method'); render(); });
  });
  const saveBtn = document.getElementById('saveReceiptBtn');
  saveBtn.addEventListener('click', async ()=>{
    if(!_paymentDraft.number){ toast('لازم رقم'); return; }
    if(!_paymentDraft.date){ toast('لازم تاريخ'); return; }
    if(!(Number(_paymentDraft.amount)>0)){ toast('لازم مبلغ أكبر من صفر'); return; }
    let savedId;
    if(_paymentDraft.id){
      const idx = DB[cfg.arr].findIndex(r=>r.id===_paymentDraft.id);
      const clean = {...(_paymentDraft)}; delete clean.__editId; delete clean.__kind;
      DB[cfg.arr][idx] = clean;
      savedId = clean.id;
    } else {
      const clean = {id:uid(), createdAt:Date.now(), [cfg.partyField]:_paymentDraft[cfg.partyField], number:_paymentDraft.number, date:_paymentDraft.date, amount:Number(_paymentDraft.amount), method:_paymentDraft.method, details:_paymentDraft.details};
      DB[cfg.arr].push(clean);
      savedId = clean.id;
    }
    const ok = await save(KEYS[cfg.keyName], DB[cfg.arr]);
    toast(ok? 'تم حفظ '+cfg.title:'صار خطأ بالحفظ');
    _paymentDraft = null;
    go(cfg.viewRoute(savedId));
  });
}

/* ===== الإقلاع: التحقق من الاشتراك قبل فتح البرنامج ===== */
(async function(){
  const a = await bootPlatform();
  if(!a || !a.ok){
    if(a && a.reason === 'no_session') return;   // عم يتحوّل لصفحة الدخول
    platformBlockScreen(a || {reason:'error'});
    return;
  }
  // مشرف المنصة: دخول مباشر بلا حساب داخلي ولا 2FA
  if(PLATFORM_ADMIN){
    authenticated = true;
    currentUser = { id:'platform-admin', username:'PLATFORM', role:'superuser', permissions:[] };
    currentCustomerSession = null; currentWorkerSession = null;
    init();
    if(document.readyState === 'loading')
      document.addEventListener('DOMContentLoaded', platformAdminBar);
    else platformAdminBar();
    return;
  }

  // تنبيه قرب الانتهاء
  if(a.days_left <= 15){
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;inset-inline:0;bottom:0;z-index:9999;padding:9px;'+
      'text-align:center;font-family:system-ui;font-size:13.5px;font-weight:700;color:#fff;'+
      'background:'+(a.days_left<=5 ? '#C0392B' : '#E08A2B');
    bar.innerHTML = (a.trial ? 'تجربتك المجانية' : 'اشتراكك') + ' ينتهي بعد ' + a.days_left + ' يوم — ' +
      '<a href="/account?renew=' + (a.subscription_id||'') + '" style="color:#fff;text-decoration:underline">' +
      (a.trial ? 'اشترك الآن' : 'جدّد') + '</a>';
    document.addEventListener('DOMContentLoaded', ()=> document.body.appendChild(bar));
    setTimeout(()=>{ if(document.body) document.body.appendChild(bar); }, 1200);
  }
  init();
})();
</script>
