<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>الدفع — LibanApps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0E2438;--ink:#12324F;--sky:#2C7A9E;--orange:#E08A2B;--bg:#F3F6F9;--card:#fff;--line:#E3E8EE;--mut:#6B7A8C;--ok:#1F9D63;--bad:#D64545;--whish:#E6093F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#121B2D;--ink:#E7EEF5;--line:#22304A;--mut:#93A3B8;--navy:#0B1220}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#121B2D;--ink:#E7EEF5;--line:#22304A;--mut:#93A3B8;--navy:#0B1220}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
.top{background:linear-gradient(135deg,#0E2438,#16324B);height:170px}
.wrap{max-width:460px;margin:-120px auto 30px;padding:0 16px}
.card{background:var(--card);border-radius:20px;box-shadow:0 14px 34px rgba(14,36,56,.14);padding:22px 20px;border:1px solid var(--line)}
.logo{display:flex;justify-content:center;align-items:center;height:48px;margin-bottom:6px}
.logo img{max-height:48px;max-width:200px;object-fit:contain}
.logo .tx{font-weight:800;font-size:26px;direction:ltr;color:var(--ink)}.logo .tx b{color:var(--orange)}
.to{text-align:center;font-size:15px;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:12px;margin:8px 0 14px}
.to b{color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--mut);margin:6px 0}
.row.tot{color:var(--ink);font-weight:800;font-size:18px}
.row .v{direction:ltr}
h4{margin:18px 0 10px;font-size:15px;text-align:center}
.app{display:none;margin:4px 0 6px}
@media (max-width:640px),(pointer:coarse){.app{display:block}}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:13px 16px;font:inherit;font-weight:800;font-size:16px;text-align:center;text-decoration:none;cursor:pointer}
.btn.wh{background:linear-gradient(90deg,#FF0A46,var(--whish));color:#fff}
.btn.gh{background:transparent;color:var(--sky);border:1px solid var(--line);font-size:14px;padding:9px 14px}
.box{display:grid;grid-template-columns:1fr 1fr;gap:12px;border:1px solid var(--line);border-radius:16px;padding:14px;background:color-mix(in srgb,var(--bg) 55%,var(--card))}
@media (max-width:380px){.box{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0}
.col .t{font-weight:700;font-size:14px}
.code{direction:ltr;white-space:nowrap;font:800 clamp(20px,6.4vw,28px)/1.1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;background:linear-gradient(90deg,#FF0A46,var(--whish));color:#fff;border-radius:12px;padding:10px 12px;max-width:100%;cursor:pointer;user-select:all}
.code.exp{background:var(--line);color:var(--mut)}
.cd{font-size:12px;color:var(--mut)}.cd.exp{color:var(--bad)}
.nc{background:none;border:0;color:var(--sky);font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:2px}
.nc:disabled{opacity:.5}
#qr{background:#fff;padding:8px;border-radius:10px;line-height:0}
#qr img,#qr canvas{width:120px!important;height:120px!important}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:10px;line-height:1.7}
.st{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--mut);margin-top:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
.done{text-align:center;padding:24px 6px}
.done .ic{font-size:54px;line-height:1}
.done h2{margin:10px 0 6px}
.err{color:var(--bad);font-size:12px;text-align:center;min-height:16px}
.langs{display:flex;gap:6px;justify-content:center;margin-top:16px}
.langs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.langs button.on{border-color:var(--sky);color:var(--sky)}
.foot{text-align:center;font-size:11px;color:var(--mut);margin-top:14px}
</style>
</head>
<body>
<div class="top"></div>
<div class="wrap"><div class="card" id="c"><div class="logo" id="logo"><span class="tx">Liban<b>Apps</b></span></div><div class="st"><span class="dot"></span><span>…</span></div></div>
<div class="foot" id="foot"></div></div>
<script src="/assets/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
var L={
 title:['الدفع','Payment','Paiement'],
 to:['الدفع إلى','Payment to','Paiement à'],
 total:['المجموع','Total','Total'],
 how:['أكمل الدفع','Complete your payment','Finalisez votre paiement'],
 app:['افتح تطبيق Whish','Open Whish app','Ouvrir l’app Whish'],
 scan:['امسح الرمز من تطبيق Whish','Scan with the Whish app','Scannez avec l’app Whish'],
 bycode:['الدفع بالرمز','Pay by code','Payer par code'],
 exp_in:['ينتهي الرمز خلال {t}','Code expires in {t}','Le code expire dans {t}'],
 expired:['انتهت صلاحية الرمز','Code has expired','Le code a expiré'],
 newc:['رمز جديد','Get new code','Nouveau code'],
 limit:['لا يمكن إنشاء رموز إضافية — استعمل الـQR','No more codes can be generated — use the QR code','Plus de codes possibles — utilisez le QR'],
 code_hint:['أدخل الرمز في قسم المسح داخل تطبيق Whish','Enter the code in the scan section of the Whish app','Saisissez le code dans la section scan de l’app Whish'],
 copied:['تم نسخ الرمز','Code copied','Code copié'],
 waiting:['بانتظار الدفع… سيتم التأكيد تلقائياً','Waiting for payment… confirmed automatically','En attente du paiement… confirmation automatique'],
 paid:['تم الدفع بنجاح','Payment successful','Paiement réussi'],
 paid_d:['جارٍ تفعيل طلبك وتحويلك…','Activating your order and redirecting…','Activation et redirection…'],
 failed:['لم يتم الدفع','Payment not completed','Paiement non effectué'],
 back:['رجوع','Back','Retour'],
 link_exp:['انتهت صلاحية رابط الدفع — ارجع وأنشئ عملية دفع جديدة','This payment link has expired — go back and start a new payment','Ce lien a expiré — recommencez le paiement'],
 bad:['رابط الدفع غير صالح','Invalid payment link','Lien de paiement invalide'],
 secure:['دفع آمن عبر Whish Money','Secure payment via Whish Money','Paiement sécurisé via Whish Money']
};
var LANG='ar'; try{ LANG=localStorage.getItem('la_pay_lang')||'ar'; }catch(e){}
if(['ar','en','fr'].indexOf(LANG)<0) LANG='ar';
function t(k,o){ var a=L[k]||[k]; var s=a[{ar:0,en:1,fr:2}[LANG]]||a[0]; if(o) for(var x in o) s=s.split('{'+x+'}').join(o[x]); return s; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function $(s){ return document.querySelector(s); }
var Q=location.search, INFO=null, EXP=0, tick=null, poll=null, DONE=false, LOGO='';
function setLang(){ document.documentElement.lang=LANG; document.documentElement.dir=LANG==='ar'?'rtl':'ltr'; document.title=t('title')+' — LibanApps'; $('#foot').textContent='🔒 '+t('secure'); }
function logoHtml(){ return LOGO?'<img src="'+esc(LOGO)+'" alt="LibanApps">':'<span class="tx">Liban<b>Apps</b></span>'; }
function langs(){ return '<div class="langs">'+[['ar','العربية'],['en','English'],['fr','Français']].map(function(x){ return '<button data-l="'+x[0]+'"'+(LANG===x[0]?' class="on"':'')+'>'+x[1]+'</button>'; }).join('')+'</div>'; }
function bindLangs(){ Array.prototype.forEach.call(document.querySelectorAll('[data-l]'),function(b){ b.onclick=function(){ LANG=b.dataset.l; try{ localStorage.setItem('la_pay_lang',LANG); }catch(e){} setLang(); render(); }; }); }
function msg(icon,title,sub,go){ DONE=true; clearInterval(tick); clearInterval(poll);
  $('#c').innerHTML='<div class="logo">'+logoHtml()+'</div><div class="done"><div class="ic">'+icon+'</div><h2>'+esc(title)+'</h2><div style="color:var(--mut);font-size:14px">'+esc(sub||'')+'</div>'+
    (go?'<a class="btn gh" style="margin-top:16px" href="'+esc(go)+'">'+esc(t('back'))+'</a>':'')+'</div>'; }
function fmt(c){ c=String(c||''); return c?c.slice(0,3)+'-'+c.slice(3):'--- ---'; }
function render(){
  if(DONE||!INFO) return;
  var i=INFO;
  $('#c').innerHTML='<div class="logo">'+logoHtml()+'</div>'+
    '<div class="to">'+esc(t('to'))+' <b>LibanApps</b></div>'+
    (i.note?'<div class="row"><span>'+esc(i.note.replace(/^LibanApps\s*—\s*/,''))+'</span></div>':'')+
    '<div class="row tot"><span>'+esc(t('total'))+'</span><span class="v">'+esc(i.total||'')+'</span></div>'+
    '<h4>'+esc(t('how'))+'</h4>'+
    '<div class="app"><a class="btn wh" href="'+esc(i.qr)+'">'+esc(t('app'))+'</a><div style="height:12px"></div></div>'+
    '<div class="box">'+
      '<div class="col"><div class="t">'+esc(t('bycode'))+'</div><div class="code" id="code" title="copy">'+fmt(i.code)+'</div>'+
        '<div class="cd" id="cd"></div><button class="nc" id="nc">↻ '+esc(t('newc'))+'</button></div>'+
      '<div class="col"><div class="t">QR</div><div id="qr"></div><div class="cd">'+esc(t('scan'))+'</div></div>'+
    '</div><div class="err" id="er"></div>'+
    '<div class="hint">'+esc(t('code_hint'))+'</div>'+
    '<div class="st"><span class="dot"></span><span>'+esc(t('waiting'))+'</span></div>'+langs();
  bindLangs();
  try{ new QRCode($('#qr'),{text:i.qr,width:240,height:240,correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
  $('#nc').onclick=newCode;
  $('#code').onclick=function(){ if(!INFO.code||Date.now()>EXP) return; try{ navigator.clipboard.writeText(INFO.code); flash(t('copied')); }catch(e){} };
  count();
}
function flash(m){ var e=$('#er'); if(!e) return; e.style.color='var(--ok)'; e.textContent=m; setTimeout(function(){ if($('#er')){ $('#er').textContent=''; $('#er').style.color=''; } },1800); }
function count(){
  clearInterval(tick);
  function u(){ var cd=$('#cd'), c=$('#code'); if(!cd) return;
    var d=EXP-Date.now();
    if(!EXP||d<=0){ cd.textContent=t('expired'); cd.className='cd exp'; if(c){ c.textContent='--- ---'; c.className='code exp'; } clearInterval(tick); return; }
    var s=Math.floor(d/1000); cd.className='cd'; if(c) c.className='code'; cd.textContent=t('exp_in',{t:String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}); }
  u(); tick=setInterval(u,1000);
}
async function newCode(){
  var b=$('#nc'); b.disabled=true; $('#er').textContent='';
  try{ var r=await fetch('/api/pay/code'+Q,{method:'POST'}); var j=await r.json();
    if(!j.ok){ $('#er').textContent=t('limit'); return; }
    INFO.code=j.code; EXP=j.expiry; var c=$('#code'); if(c) c.textContent=fmt(j.code); count();
  }catch(e){ $('#er').textContent='⚠️'; }
  finally{ if($('#nc')) $('#nc').disabled=false; }
}
async function check(){
  if(DONE) return;
  try{ var r=await fetch('/api/pay/status'+Q,{cache:'no-store'}); var j=await r.json();
    if(j.state==='paid'){ msg('✅',t('paid'),t('paid_d')); setTimeout(function(){ location.replace(j.go); },1800); }
    else if(j.state==='failed'){ msg('❌',t('failed'),'',j.go); }
  }catch(e){}
}
async function start(){
  setLang();
  try{ var C=window.LIBANAPPS||{}; fetch(C.SUPABASE_URL+'/rest/v1/rpc/public_settings',{method:'POST',headers:{apikey:C.SUPABASE_ANON_KEY,Authorization:'Bearer '+C.SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:'{}'})
    .then(function(r){ return r.json(); }).then(function(s){ if(s&&s.logo_url){ LOGO=s.logo_url; var l=document.querySelector('.logo'); if(l) l.innerHTML=logoHtml(); } }).catch(function(){}); }catch(e){}
  var r, j={};
  try{ r=await fetch('/api/pay/info'+Q,{cache:'no-store'}); j=await r.json(); }catch(e){}
  if(!j.ok){ msg('⚠️',t('bad')); return; }
  INFO=j; EXP=j.expiry||0;
  await check(); if(DONE) return;
  if(j.expired){ msg('⌛',t('link_exp'),'',null); return; }
  render();
  if(!INFO.code||EXP<Date.now()) newCode();
  poll=setInterval(check,4000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) check(); });
}
start();
})();
</script>
</body>
</html>
