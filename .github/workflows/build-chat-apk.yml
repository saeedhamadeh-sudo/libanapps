name: Build LibanApps Chat (Android APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-chat-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        env:
          APK_CODE: ${{ github.run_number }}
          APK_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk LibanApps-Chat.apk
          ls -la LibanApps-Chat.apk
          gh release view chat-apk >/dev/null 2>&1 || gh release create chat-apk --title "LibanApps Chat (Android)" --notes "تطبيق محادثات واتساب — LibanApps Chat. نزّل الملف LibanApps-Chat.apk وثبّتو على الأندرويد."
          gh release upload chat-apk LibanApps-Chat.apk --clobber
