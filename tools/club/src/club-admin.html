/*@@CSS@@*/
/* ---------- admin layout ---------- */
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50;padding:20px;text-align:center}
.gate p{color:var(--ink2);margin:16px 0}
.top{position:sticky;top:0;z-index:20;background:var(--p);color:var(--on-p);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.top .logo{width:42px;height:42px;border-radius:50%;background:#fff;object-fit:contain;flex:none}
.top .logo.ph{display:flex;align-items:center;justify-content:center;color:var(--p);font-weight:800}
.top h1{font-size:17px;margin:0;line-height:1.2}
.top .sub{font-size:12px;opacity:.85}
.top .sp{flex:1}
.top a.tl,.top button.tl{color:inherit;background:rgba(255,255,255,.14);border:0;border-radius:9px;padding:7px 11px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap}
.imp{background:#7c3aed;color:#fff;text-align:center;font-size:13px;padding:6px;font-weight:700}
.licbar{text-align:center;font-size:13.5px;padding:7px 12px;font-weight:700}
.licbar.warn{background:var(--warnbg);color:#92400e}
.licbar.bad{background:var(--badbg);color:#991b1b}
.wrap{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;padding:18px 16px 90px}
.wrap>*{min-width:0}
.top-in>div:nth-child(2){min-width:0}
.top h1,.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{position:sticky;top:78px;align-self:start;display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--ink2);text-align:start}
.nav button .ic{width:22px;text-align:center;font-size:17px}
.nav button.on{background:var(--card);color:var(--p);box-shadow:var(--sh)}
.nav button .cnt{margin-inline-start:auto;background:var(--badbg);color:var(--bad);border-radius:99px;font-size:11.5px;padding:0 7px}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;padding-top:0}
  .nav{position:sticky;top:62px;z-index:15;flex-direction:row;overflow-x:auto;background:var(--bg);padding:8px 0;margin:0 -16px;padding-inline:12px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:none;padding:8px 12px;font-size:13.5px}
  .nav button .cnt{margin-inline-start:4px}
  .top .hide-m,.top .sub{display:none}
  .top-in{gap:8px;padding:8px 12px}
}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.hd h2{margin:0;font-size:20px}
.hd .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px;cursor:default}
.stat[data-go]{cursor:pointer}
.stat .n{font-size:28px;font-weight:800;line-height:1.2}
.stat .l{font-size:13px;color:var(--ink2);font-weight:600}
.stat.ok .n{color:var(--ok)} .stat.warn .n{color:var(--warn)} .stat.bad .n{color:var(--bad)} .stat.p .n{color:var(--p)}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:10px}
.bars{overflow:hidden}
.bars .b{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .b small{white-space:nowrap}
@media (max-width:640px){.bars{gap:3px}.bars .b small{font-size:9px}.bars .b:nth-child(even) small{visibility:hidden}}
html,body{overflow-x:clip}
.card,.stat{min-width:0}
.bars .b i{display:block;width:100%;max-width:34px;background:var(--p);border-radius:6px 6px 2px 2px;min-height:3px}
.bars .b small{font-size:10.5px;color:var(--mut)}
.bars .b em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink2)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.cols2{grid-template-columns:1fr}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{width:auto;flex:1 1 160px;min-width:0}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .av{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#e2e8f0;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#64748b;font-size:15px}
.row .main{flex:1;min-width:0}
.row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row.click{cursor:pointer}
.row.click:hover{background:#f8fafc}
.lv{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:800;border:1px solid rgba(0,0,0,.1)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.muted{color:var(--mut);font-size:13px}
.sec{margin-top:18px}
.sec h4{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.sec h4 .sp{flex:1}
.prof-h{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prof-h img,.prof-h .ph{width:110px;height:130px;border-radius:16px;object-fit:cover;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#64748b}
.prof-h .info{flex:1;min-width:200px}
.prof-h .info h3{margin:0 0 4px;font-size:21px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px 16px;font-size:14px}
.kv div b{display:block;font-size:12px;color:var(--mut);font-weight:600}
.medal{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.medal .md{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.md.gold{background:#fef3c7}.md.silver{background:#e5e7eb}.md.bronze{background:#fde4cf}.md.participation,.md.other{background:#e0f2fe}
.photo-pick{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.photo-pick .pv{width:96px;height:116px;border-radius:14px;background:#e2e8f0;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#64748b;font-weight:800;font-size:26px}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:60vh;margin:0 auto}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam .guide{position:absolute;inset:12% 18%;border:3px dashed rgba(255,255,255,.7);border-radius:50%}
.cardprev{display:flex;gap:12px;flex-wrap:wrap}
.cardprev canvas,.cardprev img{width:100%;max-width:340px;border-radius:14px;box-shadow:var(--sh);background:#fff}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);cursor:pointer;margin:0}
.chk input{width:18px;height:18px;flex:none}
.copybox{display:flex;gap:8px}
.copybox input{direction:ltr;font-size:12.5px}
.tag{font-size:11.5px;background:var(--nonebg);color:var(--ink2);border-radius:6px;padding:1px 7px;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
table.t th{font-size:12.5px;color:var(--ink2);font-weight:700}
.scrollx{overflow-x:auto}
.inl{display:flex;gap:8px;align-items:center}
.inl input[type=color]{width:46px;height:40px;padding:3px;flex:none}
.note{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--ink2)}
.note b{color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--p);width:0;transition:width .2s}
</style>
</head>

/* ---------- helpers ---------- */
function chk(r){ if(r.error) throw r.error; return r.data; }
function lvById(id){ for(var i=0;i<LV.length;i++) if(LV[i].id===id) return LV[i]; return null; }
function grById(id){ for(var i=0;i<GR.length;i++) if(GR[i].id===id) return GR[i]; return null; }
function stById(id){ for(var i=0;i<STS.length;i++) if(STS[i].id===id) return STS[i]; return null; }
function feeOf(s){ if(s.monthly_fee!=null) return Number(s.monthly_fee); var g=grById(s.group_id); if(g&&g.monthly_fee!=null) return Number(g.monthly_fee); return Number(CL.default_fee||0); }
function stStatus(s){ if(!s.is_active) return {state:'inactive',days_left:0,owed:0,owed_months:0,overdue_days:0}; return C.status(s.paid_until,feeOf(s),TODAY,CL.expiring_days,CL.grace_days); }
function money(v){ return C.money(v,CL.currency_symbol); }
function chip(s){ var x=stStatus(s); var txt=x.state==='inactive'?t('st_inactive'):(x.state==='none'?t('st_none'):C.statusLabel(x)); return '<span class="chip '+x.state+'">'+esc(txt)+'</span>'; }
function lvChip(id){ var l=lvById(id); return l?'<span class="lv" style="background:'+esc(l.color)+';color:'+C.readable(l.color)+'">'+esc(l.name)+'</span>':''; }
function avatar(s,size){ var u=C.imgUrl(s.photo_url,160); return u?'<img class="av" src="'+esc(u)+'" alt="" loading="lazy"'+(size?' style="width:'+size+'px;height:'+size+'px"':'')+'>':'<div class="av">'+esc(C.initials(s.full_name))+'</div>'; }
function opts(list,sel,empty){ return (empty!=null?'<option value="">'+esc(empty)+'</option>':'')+list.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===sel?' selected':'')+'>'+esc(x.name)+'</option>'}).join(''); }
function rnd(n){ var a='abcdefghjkmnpqrstuvwxyz23456789',s=''; var b=new Uint8Array(n); crypto.getRandomValues(b); for(var i=0;i<n;i++) s+=a[b[i]%a.length]; return s; }
function baseUrl(){ return location.origin+'/portal-club/'+CL.slug; }
function parentOf(s){ return s.parent_name||s.full_name; }
function phoneOf(s){ return s.parent_phone||s.phone; }
function remindLink(s){
  var x=stStatus(s);
  var msg = x.state==='expired'||x.state==='none'
    ? t('remind_msg_exp',{parent:parentOf(s),name:s.full_name,club:CL.name,d:C.fmtDate(s.paid_until||s.joined_at),owed:money(x.owed)})
    : t('remind_msg_soon',{parent:parentOf(s),name:s.full_name,club:CL.name,d:C.fmtDate(s.paid_until),fee:money(feeOf(s))});
  return C.waLink(phoneOf(s),msg);
}

/* ---------- رفع الصور ---------- */
function shrink(fileOrBlob,max,quality){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(fileOrBlob), im=new Image();
    im.onload=function(){ var s=Math.min(1,max/Math.max(im.width,im.height)); var cv=document.createElement('canvas');
      cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s); var c=cv.getContext('2d');
      c.fillStyle='#fff'; c.fillRect(0,0,cv.width,cv.height); c.drawImage(im,0,0,cv.width,cv.height); URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b?res(b):rej(new Error('image')); },'image/jpeg',quality||0.88); };
    im.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('image')); };
    im.src=url;
  });
}
async function upload(blob,folder,max){
  var b=await shrink(blob,max||900);
  var path='club-'+CL.id+'/'+folder+'/'+Date.now()+'-'+rnd(10)+'.jpg';
  chk(await sb.storage.from('club').upload(path,b,{contentType:'image/jpeg',upsert:false}));
  return { url: sb.storage.from('club').getPublicUrl(path).data.publicUrl, blob:b };
}
async function faceFromBlob(blob){
  var url=URL.createObjectURL(blob);
  try{ var im=await C.loadImg(url); if(!im) return null; var r=await C.faceDescriptor(im,{ssd:true}); return r?r.descriptor:null; }
  finally{ URL.revokeObjectURL(url); }
}

function camera(opts){
  return new Promise(function(resolve){
    var stream=null, facing='user', done=false;
    var m=C.modal({ title: opts.title||t('cam_title'),
      body:'<div class="cam"><video playsinline autoplay muted></video><div class="guide"></div></div>'+(opts.hint?'<p class="muted" style="margin:10px 0 0">'+esc(opts.hint)+'</p>':'')+'<div class="muted" id="camInfo" style="margin-top:8px;font-weight:700"></div>',
      buttons:[{text:t('cam_switch'),cls:'ghost',onClick:function(){ facing=facing==='user'?'environment':'user'; start(); }},
               {text:opts.captureText||t('cam_capture'),cls:'',onClick:async function(api,btn){ btn.disabled=true; try{ await opts.onCapture(grab(),api); } finally{ btn.disabled=false; } }}],
      onClose:function(){ stop(); if(!done) resolve(null); } });
    var v=m.$('video');

    async function start(){ stop();

    m.finish=function(val){ done=true; stop(); resolve(val); m.close(); };
    opts.api=m; start();
  });
}

    '<div class="fld"><label>'+t('primary')+'</label><div class="inl"><input type="color" id="cPc" value="'+esc(CL.primary_color)+'"><input id="cPt" dir="ltr" value="'+esc(CL.primary_color)+'"></div></div><div class="fld"><label>'+t('accent')+'</label><div class="inl"><input type="color" id="cAc" value="'+esc(CL.accent_color)+'"><input id="cAt" dir="ltr" value="'+esc(CL.accent_color)+'"></div></div>'+
    '<div class="fld"><label>'+t('default_fee')+'</label><input type="number" min="0" step="0.01" id="cF" value="'+esc(CL.default_fee)+'"></div><div class="fld"><label>'+t('currency')+'</label><input id="cC" value="'+esc(CL.currency_symbol)+'" maxlength="6"></div>'+
    '<div class="fld"><label>'+t('expiring_days')+'</label><input type="number" min="0" max="60" id="cE" value="'+esc(CL.expiring_days)+'"></div></div>'+
    '<div class="fld"><label>'+t('card_note')+'</label><input id="cNote" value="'+esc(CL.card_note||'')+'" placeholder="'+esc(t('card_note_ph'))+'"></div>'+
    '<div class="inl"><span class="sp" style="flex:1"></span><button class="cl-btn" id="cSave">'+t('save')+'</button></div><div class="cl-msg" id="cMsg"></div></div>'+
    '<div class="card" style="margin-top:16px"><div class="hd"><h2 style="font-size:17px">'+t('links')+'</h2></div><div class="list">'+
      [[t('portal_link'),baseUrl()],[t('nav_dash'),baseUrl()+'/admin'],[t('door_link'),baseUrl()+'/door']].map(function(x){ return '<div class="row"><div class="main"><div class="nm">'+esc(x[0])+'</div><div class="muted" dir="ltr" style="text-align:start">'+esc(x[1])+'</div></div><a class="cl-btn alt sm" target="_blank" href="'+esc(x[1])+'">'+t('open')+'</a></div>'; }).join('')+'</div></div>';
  $('#cL').value=CL.default_lang||'ar';
  [['#cPc','#cPt'],['#cAc','#cAt']].forEach(function(p){ $(p[0]).oninput=function(){ $(p[1]).value=this.value; }; $(p[1]).oninput=function(){ if(/^#[0-9a-f]{6}$/i.test(this.value)) $(p[0]).value=this.value; }; });
  $('#lgF').onchange=function(){ logo=this.files[0]||null; if(logo) $('#lgPv').innerHTML='<img class="pv" style="object-fit:contain;background:#fff" src="'+URL.createObjectURL(logo)+'">'; };
  $('#cSave').onclick=async function(){ var b=this, m=$('#cMsg'); b.disabled=true; m.className='cl-msg'; m.textContent=t('saving');
    try{ var row={name:$('#cN').value.trim()||CL.slug,sport:$('#cS').value.trim(),whatsapp:$('#cW').value.replace(/\D/g,''),phone:$('#cP').value.trim(),address:$('#cA').value.trim(),
        default_lang:$('#cL').value,primary_color:$('#cPt').value.trim()||'#0f766e',accent_color:$('#cAt').value.trim()||'#f59e0b',default_fee:Number($('#cF').value||0),
        currency_symbol:$('#cC').value.trim()||'$',expiring_days:Math.max(0,Math.min(60,Number($('#cE').value||0))),card_note:$('#cNote').value.trim()};
      if(logo){ m.textContent=t('uploading'); row.logo_url=(await upload(logo,'logo',600)).url; }
      CL=chk(await sb.from('clubs').update(row).eq('id',CL.id).select('*').single()); paintShell(); m.className='cl-msg s'; m.textContent=t('saved'); logo=null; }
    catch(e){ m.className='cl-msg e'; m.textContent=C.errText(e); } finally{ b.disabled=false; } };
}

/* ---------- الأحداث ---------- */
document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-tab],[data-lang],[data-act],[data-go],#outBtn,[data-csel]'); if(!el) return;
  if(el.hasAttribute('data-csel')){ var id0=el.getAttribute('data-csel'); if(el.checked) CSEL[id0]=1; else delete CSEL[id0]; $('#cN').textContent=t('selected_n',{n:Object.keys(CSEL).length}); return; }
  if(el.id==='outBtn'){ sb.auth.signOut().then(function(){ location.href='/login'; }); return; }
  if(el.hasAttribute('data-tab')){ go(el.getAttribute('data-tab')); return; }
  if(el.hasAttribute('data-lang')){ C.setLang(el.getAttribute('data-lang')); paintShell(); render(); return; }
  if(el.hasAttribute('data-go')){ var f=el.getAttribute('data-f'); if(el.getAttribute('data-go')==='students'){ F.st=f||''; } go(el.getAttribute('data-go')); return; }
  var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
  if(el.tagName==='A'&&el.getAttribute('href')==='#') e.preventDefault();
  if(act==='profile'){ if(e.target.closest('button,a:not([href="#"])')&&e.target.closest('button,a')!==el) return; openProfile(id); }
  else if(act==='pay'){ e.stopPropagation(); paymentForm(id); }
  else if(act==='new-st') studentForm(null);
  else if(act==='edit-st') studentForm(stById(id));
  else if(act==='checkin'){ try{ chk(await sb.rpc('club_manual_checkin',{p_student:id})); C.toast(t('checked_in'),'s'); refreshProfile(); }catch(er){ C.toast(C.errText(er),'e'); } }
  else if(act==='del-pay'){ if(!(await C.confirmBox(t('del_pay_q'),t('del'),true))) return; try{ chk(await sb.rpc('club_delete_payment',{p_id:id})); await reloadStudents(); paintShell(); refreshProfile(); if(TAB==='payments'||TAB==='dash') render(); else if(TAB==='students') paintStudents(); }catch(er){ C.toast(C.errText(er),'e'); } }
  else if(act==='new-medal') medalForm(null,id||(STS[0]&&STS[0].id));
  else if(act==='edit-medal'){ var r=await sb.from('club_achievements').select('*').eq('id',id).single(); if(!r.error) medalForm(r.data); }
  else if(act==='enroll') enroll(id);
  else if(act==='face-photo') faceFromPhoto(id);
  else if(act==='face-clear'){ if(!(await C.confirmBox(t('face_clear')+'?',t('face_clear'),true))) return; try{ chk(await sb.from('club_students').update({face:[]}).eq('id',id)); await reloadStudents(); refreshProfile(); }catch(er){ C.toast(C.errText(er),'e'); } }
  else if(act==='card-pdf'){ var s=stById(id); el.disabled=true; try{ C.download(await C.cardsPdf([cardData(s)],'cr80'),'card-'+s.code+'.pdf'); }catch(er){ C.toast(C.errText(er),'e'); } finally{ el.disabled=false; } }
  else if(act==='new-qr'){ if(!(await C.confirmBox(t('new_qr_q'),t('yes'),true))) return; try{ chk(await sb.rpc('club_new_card_token',{p_student:id})); await reloadStudents(); refreshProfile(); }catch(er){ C.toast(C.errText(er),'e'); } }
  else if(act==='manual-att') manualAtt();
  else if(act==='manage-opts') optionsModal(el.closest('.cl-modal'));
  else if(act==='add-opt'){ var col=el.getAttribute('data-col'), inp=el.parentNode.querySelector('input'), v=(inp.value||'').trim(), mm=el.closest('.card').querySelector('.cl-msg'); if(!v) return;
    var list=(CL[col]||[]).slice(); if(list.indexOf(v)>=0){ mm.className='cl-msg e'; mm.textContent=t('opt_exists'); return; }
    list.push(v); el.disabled=true; try{ await saveOpts(col,list); afterOpts(); }catch(er){ mm.className='cl-msg e'; mm.textContent=C.errText(er); el.disabled=false; } }
  else if(act==='del-opt'){ var col2=el.getAttribute('data-col'), i2=+el.getAttribute('data-i'), list2=(CL[col2]||[]).slice(), o=list2[i2];
    if(!(await C.confirmBox(t('del_opt_q',{o:o}),t('del'),true))) return; list2.splice(i2,1); try{ await saveOpts(col2,list2); afterOpts(); }catch(er){ C.toast(C.errText(er),'e'); } }
  else if(act==='new-lv') levelForm(null);
  else if(act==='edit-lv') levelForm(lvById(id));
  else if(act==='new-gr') groupForm(null);
  else if(act==='edit-gr') groupForm(grById(id));
  else if(act==='new-door') newDoor();
  else if(act==='revoke-door'){ if(!(await C.confirmBox(t('revoke_q'),t('revoke'),true))) return; try{ chk(await sb.rpc('club_revoke_door',{p_door:id})); render(); }catch(er){ C.toast(C.errText(er),'e'); } }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id&&e.target.id.indexOf('optIn-')===0){ e.preventDefault(); var b=e.target.parentNode.querySelector('[data-act=add-opt]'); if(b) b.click(); }
});
document.addEventListener('input',function(e){
  if(e.target.id==='fQ'){ F.q=e.target.value; paintStudents(); }
});
document.addEventListener('change',function(e){
  if(e.target.id==='fSt'){ F.st=e.target.value; paintStudents(); }
  if(e.target.id==='fGr'){ F.gr=e.target.value; paintStudents(); }
  if(e.target.id==='fLv'){ F.lv=e.target.value; paintStudents(); }
});

/* ---------- البدء ---------- */
function gate(txt,btn,href){ $('#gateNote').textContent=txt; var b=$('#gateBtn'); if(btn){ b.textContent=btn; b.href=href||'/login'; b.classList.remove('hidden'); } }
async function boot(){
  try{
    var s=await sb.auth.getSession();
    if(!s.data.session){ gate(t('need_login')); setTimeout(function(){ location.href='/login?next='+encodeURIComponent(location.pathname); },800); return; }
    var seg=location.pathname.split('/').filter(Boolean), slug=(seg[0]==='portal-club'&&seg[1])?decodeURIComponent(seg[1]).toLowerCase():'';
    if(!slug){ var mine=await sb.from('clubs').select('slug').limit(1);
      if(mine.data&&mine.data[0]){ location.replace('/portal-club/'+mine.data[0].slug+'/admin'); return; }
      gate(t('no_club'),t('my_account'),'/account'); return; }
    var r=await sb.from('clubs').select('*').eq('slug',slug).maybeSingle();
    if(r.error){ gate(C.errText(r.error),t('my_account'),'/account'); return; }
    if(r.data) CL=r.data;
    else{ var e2=await sb.rpc('ensure_club',{p_slug:slug}); if(e2.error||!e2.data){ gate(t('not_linked'),t('my_account'),'/account'); return; } CL=e2.data; }
    var adm=await sb.rpc('is_admin'), cid=await sb.rpc('my_client_id');
    IMP=!!(adm.data&&cid.data!==CL.client_id);
    var lc=await sb.rpc('club_license',{cid:CL.id}); LIC=lc.data||{ok:false};
    try{ if(!localStorage.getItem('club_lang')) C.setLang(CL.default_lang||'ar'); }catch(e){}
    await loadAll();
    $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden');
    document.title=(CL.name||CL.slug)+' — '+t('nav_dash');
    paintShell(); go('dash');
  }catch(e){ gate(C.errText(e),t('my_account'),'/account'); }
}
gate(t('loading')); boot();
})();
</script>
