<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f766e">
<title>Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/*@@CSS@@*/
body{background:linear-gradient(180deg,color-mix(in srgb,var(--p) 9%,#f4f6f8) 0,#f4f6f8 340px)}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:760px;margin:0 auto}
.top .logo{width:52px;height:52px;border-radius:50%;background:#fff;object-fit:contain;box-shadow:var(--sh);flex:none}
.top .logo.ph{display:flex;align-items:center;justify-content:center;color:var(--p);font-weight:800;font-size:18px}
.top h1{margin:0;font-size:18px;line-height:1.25}
.top .sub{font-size:12.5px;color:var(--ink2)}
.top .sp{flex:1}
.top .lang-sw{color:var(--ink)}
.wrapc{max-width:760px;margin:0 auto;padding:0 16px 110px}
.box{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.login{max-width:420px;margin:6vh auto 0}
.login h2{margin:0 0 4px;font-size:22px}
.login p{margin:0 0 16px;color:var(--ink2)}
.login .cl-btn{width:100%;padding:13px;font-size:16px;margin-top:6px}
.pw{position:relative}
.pw button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;font-size:18px;padding:6px}
.hero{display:flex;gap:16px;align-items:center}
.hero .ph{width:96px;height:116px;border-radius:18px;object-fit:cover;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#64748b;flex:none;border:3px solid var(--a)}
.hero h2{margin:0;font-size:22px;line-height:1.25}
.hero .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:13px;color:var(--ink2)}
.lv{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12.5px;font-weight:800;border:1px solid rgba(0,0,0,.1)}
.status{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{--v:0;width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--rc) calc(var(--v)*1%),#e5e7eb 0);display:flex;align-items:center;justify-content:center}
.ring>div{width:94px;height:94px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring b{font-size:32px}
.ring small{font-size:12px;color:var(--ink2);text-align:center;padding:0 6px}
.status h3{margin:0 0 6px;font-size:19px}
.status .big{font-size:24px;font-weight:800}
.status.active{--rc:var(--ok)} .status.expiring{--rc:var(--warn)} .status.expired,.status.none{--rc:var(--bad)}
.status.active h3{color:var(--ok)} .status.expiring h3{color:var(--warn)} .status.expired h3,.status.none h3{color:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;font-size:14px}
.kv b{display:block;font-size:12px;color:var(--mut);font-weight:600}
.h{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:16px}
.h .sp{flex:1}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.medal{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:linear-gradient(180deg,#fff,#fafafa)}
.medal .ic{font-size:36px;line-height:1}
.medal img{width:100%;height:110px;object-fit:cover;border-radius:12px;margin-top:8px}
.medal b{display:block;margin-top:6px;font-size:14px}
.medal small{display:block;color:var(--ink2);font-size:12px}
.mcount{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.mcount span{background:var(--nonebg);border-radius:12px;padding:6px 12px;font-weight:800}
.tl{position:relative;padding-inline-start:20px}
.tl:before{content:'';position:absolute;inset-inline-start:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .it{position:relative;padding:6px 0}
.tl .it i{position:absolute;inset-inline-start:-19px;top:12px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pay{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.pay:last-child{border:0}
.att{display:flex;gap:10px;margin-bottom:10px}
.att div{flex:1;background:var(--nonebg);border-radius:14px;padding:10px;text-align:center}
.att b{display:block;font-size:24px;color:var(--p)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots span{font-size:12px;background:var(--okbg);color:var(--ok);border-radius:8px;padding:3px 8px;font-weight:700}
.cardv{display:flex;flex-direction:column;gap:10px;align-items:center}
.cardv canvas{width:100%;max-width:420px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.empty{color:var(--mut);text-align:center;padding:10px}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.center{text-align:center;padding:12vh 20px}
@media (max-width:480px){.hero .ph{width:84px;height:100px}.ring{width:100px;height:100px}.ring>div{width:80px;height:80px}.ring b{font-size:26px}.kv{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><span id="logo"></span><div><h1 id="cName"></h1><div class="sub" id="cSport"></div></div><div class="sp"></div><div class="lang-sw" id="langSw"></div></header>
<main class="wrapc" id="main"><div class="center"><div class="spin"></div></div></main>

<script>
(function(){
'use strict';
var C=CLUB, t=C.t, esc=C.esc;
C.add({
  wa_us:['راسلنا على واتساب','Message us on WhatsApp','Écrivez-nous sur WhatsApp'],
  welcome:['مرحبًا بك','Welcome','Bienvenue'],
  login_hint:['سجّل الدخول باسم المستخدم وكلمة المرور التي أعطاك إياها النادي.','Sign in with the username and password given by the club.','Connectez-vous avec l’identifiant et le mot de passe fournis par le club.'],
  username:['اسم المستخدم','Username','Identifiant'],
  password:['كلمة المرور','Password','Mot de passe'],
  login:['دخول','Sign in','Se connecter'],
  bad_login:['اسم المستخدم أو كلمة المرور غير صحيحة','Wrong username or password','Identifiant ou mot de passe incorrect'],
  locked:['محاولات كثيرة. حاول مجددًا بعد {n} دقيقة.','Too many attempts. Try again in {n} minutes.','Trop de tentatives. Réessayez dans {n} minutes.'],
  forgot:['نسيت كلمة المرور؟ تواصل مع النادي على واتساب','Forgot your password? Contact the club on WhatsApp','Mot de passe oublié ? Contactez le club sur WhatsApp'],
  forgot_msg:['مرحبًا، نسيت كلمة مرور حسابي في النادي.','Hello, I forgot my club account password.','Bonjour, j’ai oublié mon mot de passe.'],
  club_off:['صفحة النادي غير متاحة حاليًا.','The club page is not available right now.','La page du club n’est pas disponible.'],
  not_found:['لم يتم العثور على هذا النادي.','Club not found.','Club introuvable.'],
  student_off:['حسابك موقوف. تواصل مع إدارة النادي.','Your account is paused. Contact the club.','Votre compte est suspendu. Contactez le club.'],
  logout:['تسجيل الخروج','Sign out','Déconnexion'],
  sub_active:['اشتراكك فعّال','Your subscription is active','Abonnement actif'],
  sub_expiring:['اشتراكك ينتهي قريبًا','Your subscription ends soon','Votre abonnement expire bientôt'],
  sub_expired:['انتهى اشتراكك','Your subscription has ended','Votre abonnement a expiré'],
  sub_none:['لا يوجد اشتراك مدفوع','No paid subscription','Aucun abonnement payé'],
  days:['يوم','days','jours'],
  remaining:['متبقٍ','left','restants'],
  ended_on:['انتهى بتاريخ {d}','Ended on {d}','Terminé le {d}'],
  until:['حتى {d}','Until {d}','Jusqu’au {d}'],
  owed_now:['المستحق عليك','Amount due','Montant dû'],
  pay_wa:['ادفع / تواصل على واتساب','Pay / contact on WhatsApp','Payer / contacter sur WhatsApp'],
  pay_msg:['مرحبًا، أريد تجديد اشتراك {name} (رقم {code}).','Hello, I would like to renew {name}’s subscription (no. {code}).','Bonjour, je souhaite renouveler l’abonnement de {name} (n° {code}).'],
  fee:['القسط الشهري','Monthly fee','Mensualité'],
  info:['معلوماتي','My details','Mes informations'],
  group:['الفرقة','Group','Groupe'],
  schedule:['المواعيد','Schedule','Horaires'],
  coach:['المدرّب','Coach','Entraîneur'],
  birth:['تاريخ الميلاد','Date of birth','Date de naissance'],
  number:['رقم العضوية','Member no.','N° de membre'],
  level_since:['في هذا المستوى منذ {d}','At this level since {d}','À ce niveau depuis le {d}'],
  medals:['ميدالياتي وإنجازاتي','My medals & achievements','Mes médailles et résultats'],
  no_medals:['لا يوجد ميداليات بعد — بالتوفيق في المباراة القادمة!','No medals yet — good luck in the next match!','Pas encore de médaille — bonne chance pour le prochain match !'],
  levels:['مسيرة المستويات','Level journey','Parcours des niveaux'],
  attendance:['الحضور','Attendance','Présences'],
  this_month:['هذا الشهر','This month','Ce mois-ci'],
  all_time:['المجموع','Total','Total'],
  payments:['سجل الدفعات','Payment history','Historique des paiements'],
  no_payments:['لا يوجد دفعات','No payments','Aucun paiement'],
  my_card:['بطاقتي','My card','Ma carte'],
  dl_card:['تنزيل البطاقة PDF','Download card PDF','Télécharger la carte PDF'],
  flip:['قلب البطاقة','Flip card','Retourner la carte'],
  change_pw:['تغيير كلمة المرور','Change password','Changer le mot de passe'],
  old_pw:['كلمة المرور الحالية','Current password','Mot de passe actuel'],
  new_pw:['كلمة المرور الجديدة','New password','Nouveau mot de passe'],
  bad_old:['كلمة المرور الحالية غير صحيحة','Current password is wrong','Mot de passe actuel incorrect'],
  short:['كلمة المرور قصيرة (4 أحرف على الأقل)','Password too short (min 4)','Mot de passe trop court (4 min.)'],
  pw_changed:['تم تغيير كلمة المرور ✓','Password changed ✓','Mot de passe modifié ✓'],
  months_n:['{n} شهر','{n} month(s)','{n} mois'],
  body:['بنيتي الجسدية','My body','Ma condition physique'],
  weight:['الوزن','Weight','Poids'],
  height:['الطول','Height','Taille'],
  kg:['كغ','kg','kg'],
  cm:['سم','cm','cm'],
  bmi:['مؤشر كتلة الجسم','BMI','IMC'],
  body_status:['البنية الجسدية','Physical condition','Condition physique'],
  injuries:['إصابات سابقة','Past injuries','Blessures antérieures'],
  no_injuries:['لا يوجد إصابات مسجّلة','No injuries recorded','Aucune blessure enregistrée'],
  body_hist:['تطوّر القياسات','Measurement progress','Évolution des mesures'],
  date:['التاريخ','Date','Date'],
  refresh:['تحديث','Refresh','Actualiser']
});
var CFG=window.LIBANAPPS, sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
var $=function(s,r){return (r||document).querySelector(s)};
var seg=location.pathname.split('/').filter(Boolean), SLUG=(seg[0]==='portal-club'&&seg[1])?decodeURIComponent(seg[1]).toLowerCase():'';
var TK='club_tok_'+SLUG, PUB=null, ME=null, SIDE='front';
function tok(){ try{ return localStorage.getItem(TK)||''; }catch(e){ return ''; } }
function setTok(v){ try{ if(v) localStorage.setItem(TK,v); else localStorage.removeItem(TK); }catch(e){} }

function brand(cl){
  var P=cl.primary_color||'#0f766e';
  document.documentElement.style.setProperty('--p',P); document.documentElement.style.setProperty('--a',cl.accent_color||'#f59e0b'); document.documentElement.style.setProperty('--on-p',C.readable(P));
  $('meta[name=theme-color]').setAttribute('content',P);
  $('#logo').innerHTML=cl.logo_url?'<img class="logo" src="'+esc(C.imgUrl(cl.logo_url,160))+'" alt="">':'<div class="logo ph">'+esc(C.initials(cl.name))+'</div>';
  $('#cName').textContent=cl.name||''; $('#cSport').textContent=cl.sport||'';
  document.title=cl.name||'Club';
  var fab=$('#waFab'); if(cl.whatsapp){ fab.href=C.waLink(cl.whatsapp); fab.innerHTML=C.WA_SVG; fab.classList.remove('hidden'); }
  paintLang(); C.applyAll();
}
function paintLang(){ $('#langSw').innerHTML=C.LANGS.map(function(l){ return '<button data-lang="'+l+'" class="'+(l===C.lang()?'on':'')+'">'+({ar:'ع',en:'EN',fr:'FR'})[l]+'</button>'; }).join(''); }
function msgBox(text){ $('#main').innerHTML='<div class="box center"><p style="font-weight:700">'+esc(text)+'</p></div>'; }

/* ---------- الدخول ---------- */
function vLogin(err){
  var cl=PUB.club;
  $('#main').innerHTML='<div class="box login"><h2>'+t('welcome')+'</h2><p>'+t('login_hint')+'</p>'+
    '<form id="lf" autocomplete="on"><div class="fld"><label for="u">'+t('username')+'</label><input id="u" name="username" dir="ltr" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>'+
    '<div class="fld"><label for="p">'+t('password')+'</label><div class="pw"><input id="p" name="password" type="password" dir="ltr" autocomplete="current-password" required><button type="button" id="eye" aria-label="show">👁</button></div></div>'+
    '<button class="cl-btn" type="submit" id="lb">'+t('login')+'</button><div class="cl-msg'+(err?' e':'')+'" id="lm">'+esc(err||'')+'</div></form>'+
    (cl.whatsapp?'<p style="margin:16px 0 0;text-align:center;font-size:13.5px"><a target="_blank" href="'+esc(C.waLink(cl.whatsapp,t('forgot_msg')))+'">'+t('forgot')+'</a></p>':'')+'</div>';
  $('#eye').onclick=function(){ var p=$('#p'); p.type=p.type==='password'?'text':'password'; };
  $('#lf').onsubmit=async function(e){ e.preventDefault(); var b=$('#lb'), m=$('#lm'); b.disabled=true; m.className='cl-msg'; m.textContent=t('please_wait');
    try{ var r=await sb.rpc('club_student_login',{p_slug:SLUG,p_username:$('#u').value.trim(),p_password:$('#p').value}); if(r.error) throw r.error;
      var d=r.data||{}; if(!d.ok){ m.className='cl-msg e'; m.textContent=d.reason==='locked'?t('locked',{n:d.minutes}):(d.reason==='student_inactive'?t('student_off'):(d.reason==='club_inactive'?t('club_off'):t('bad_login'))); b.disabled=false; return; }
      setTok(d.token); await loadMe(); }
    catch(er){ m.className='cl-msg e'; m.textContent=C.errText(er); b.disabled=false; } };
}

/* ---------- الملف ---------- */
async function loadMe(){
  var r=await sb.rpc('club_student_me',{p_token:tok()}); if(r.error) throw r.error;
  var d=r.data||{};
  if(!d.ok){ setTok(''); if(d.reason==='student_inactive'){ msgBox(t('student_off')); return; } vLogin(); return; }
  ME=d; brand(Object.assign({},PUB.club,d.club)); vProfile();
}
function medalIcon(p){ return {gold:'🥇',silver:'🥈',bronze:'🥉',participation:'🎖',other:'🏆'}[p]||'🏆'; }
function vProfile(){
  var s=ME.student, st=ME.status, cl=ME.club, lv=ME.level, g=ME.group, sym=cl.currency_symbol;
  var pct = st.state==='active'||st.state==='expiring' ? Math.min(100,Math.round(st.days_left/30*100)) : 100;
  var cnt={gold:0,silver:0,bronze:0}; ME.achievements.forEach(function(a){ if(cnt[a.place]!=null) cnt[a.place]++; });
  var wa=cl.whatsapp?C.waLink(cl.whatsapp,t('pay_msg',{name:s.full_name,code:s.code})):'';
  $('#main').innerHTML=
    '<section class="box"><div class="hero">'+(s.photo_url?'<img class="ph" src="'+esc(C.imgUrl(s.photo_url,320))+'" alt="">':'<div class="ph">'+esc(C.initials(s.full_name))+'</div>')+
      '<div style="min-width:0"><h2>'+esc(s.full_name)+'</h2><div class="meta"><span>'+t('number')+' #'+esc(s.code)+'</span>'+
      (lv?'<span class="lv" style="background:'+esc(lv.color)+';color:'+C.readable(lv.color)+'">'+esc(lv.name)+'</span>':'')+'</div>'+
      (lv&&s.level_since?'<div class="meta">'+esc(t('level_since',{d:C.fmtDate(s.level_since)}))+'</div>':'')+'</div></div></section>'+
    '<section class="box status '+esc(st.state)+'"><div class="ring" style="--v:'+pct+'"><div>'+
      (st.state==='active'||st.state==='expiring'?'<b>'+st.days_left+'</b><small>'+t('days')+' '+t('remaining')+'</small>':'<b>!</b><small>'+esc(t('st_'+st.state))+'</small>')+'</div></div>'+
      '<div><h3>'+t('sub_'+st.state)+'</h3>'+
      (s.paid_until?'<div class="muted">'+esc(st.state==='expired'?t('ended_on',{d:C.fmtDate(s.paid_until)}):t('until',{d:C.fmtDate(s.paid_until)}))+'</div>':'')+
      (st.owed>0?'<div style="margin-top:8px"><span class="muted">'+t('owed_now')+'</span><div class="big" style="color:var(--bad)">'+esc(C.money(st.owed,sym))+'</div></div>':'<div style="margin-top:8px" class="chip active">✓ '+t('paid_up')+'</div>')+
      (st.state!=='active'&&wa?'<div style="margin-top:12px"><a class="cl-btn wa sm" target="_blank" href="'+esc(wa)+'">'+t('pay_wa')+'</a></div>':'')+'</div></section>'+
    '<section class="box"><h3 class="h">ℹ '+t('info')+'</h3><div class="kv">'+
      '<div><b>'+t('fee')+'</b>'+esc(C.money(s.fee,sym))+'</div><div><b>'+t('member_since')+'</b>'+esc(C.fmtDate(s.joined_at))+'</div>'+
      (g?'<div><b>'+t('group')+'</b>'+esc(g.name)+'</div>'+(g.coach?'<div><b>'+t('coach')+'</b>'+esc(g.coach)+'</div>':'')+(g.schedule?'<div style="grid-column:1/-1"><b>'+t('schedule')+'</b>'+esc(g.schedule)+'</div>':''):'')+
      (s.birth_date?'<div><b>'+t('birth')+'</b>'+esc(C.fmtDate(s.birth_date))+'</div>':'')+'</div></section>'+
    '<section class="box"><h3 class="h">🏅 '+t('medals')+'</h3>'+(ME.achievements.length?
      '<div class="mcount"><span>🥇 '+cnt.gold+'</span><span>🥈 '+cnt.silver+'</span><span>🥉 '+cnt.bronze+'</span></div><div class="medals">'+
      ME.achievements.map(function(a){ return '<div class="medal"><div class="ic">'+medalIcon(a.place)+'</div><b>'+esc(a.title)+'</b><small>'+esc(t('medal_'+a.place))+(a.event_date?' · '+esc(C.fmtDate(a.event_date)):'')+'</small>'+
        (a.opponent?'<small>'+esc(a.opponent)+'</small>':'')+(a.category?'<small>'+esc(a.category)+'</small>':'')+(a.image_url?'<a href="'+esc(C.imgUrl(a.image_url))+'" target="_blank"><img src="'+esc(C.imgUrl(a.image_url,480))+'" alt="" loading="lazy"></a>':'')+'</div>'; }).join('')+'</div>'
      :'<div class="empty">'+t('no_medals')+'</div>')+'</section>'+
    bodyHtml()+
    (ME.level_history.length?'<section class="box"><h3 class="h">🎚 '+t('levels')+'</h3><div class="tl">'+ME.level_history.map(function(h){ return '<div class="it"><i style="background:'+esc(h.color||'#999')+'"></i><b>'+esc(h.name)+'</b> <span class="muted">· '+esc(C.fmtDate(h.at))+'</span></div>'; }).join('')+'</div></section>':'')+
    '<section class="box"><h3 class="h">🕑 '+t('attendance')+'</h3><div class="att"><div><b>'+ME.attendance.month+'</b><span class="muted">'+t('this_month')+'</span></div><div><b>'+ME.attendance.total+'</b><span class="muted">'+t('all_time')+'</span></div></div>'+
      '<div class="dots">'+ME.attendance.recent.slice(0,12).map(function(a){ return '<span>'+esc(C.fmtDate(a))+'</span>'; }).join('')+'</div></section>'+
    '<section class="box"><h3 class="h">💵 '+t('payments')+'</h3>'+(ME.payments.length?ME.payments.map(function(p){ return '<div class="pay"><div><b>'+esc(C.money(p.amount,sym))+'</b> <span class="muted">· '+esc(t('months_n',{n:p.months}))+'</span><div class="muted">'+esc(C.fmtDate(p.from))+' – '+esc(C.fmtDate(p.to))+'</div></div><div class="muted">'+esc(C.fmtDate(p.at))+'<br>'+esc(t('m_'+p.method))+'</div></div>'; }).join(''):'<div class="empty">'+t('no_payments')+'</div>')+'</section>'+
    '<section class="box"><h3 class="h">🪪 '+t('my_card')+'</h3><div class="cardv"><div id="cardBox" style="width:100%;display:flex;justify-content:center"><div class="spin"></div></div><div class="foot"><button class="cl-btn alt sm" id="flip">↻ '+t('flip')+'</button><button class="cl-btn sm" id="dl">⬇ '+t('dl_card')+'</button></div></div></section>'+
    '<div class="foot"><button class="cl-btn ghost sm" id="cpw">🔑 '+t('change_pw')+'</button><button class="cl-btn ghost sm" id="rf">↻ '+t('refresh')+'</button><button class="cl-btn ghost sm" id="out">'+t('logout')+'</button></div>';
  drawCard();
  $('#flip').onclick=function(){ SIDE=SIDE==='front'?'back':'front'; drawCard(); };
  $('#dl').onclick=async function(){ var b=this; b.disabled=true; try{ C.download(await C.cardsPdf([cardData()],'cr80'),'card-'+ME.student.code+'.pdf'); }catch(e){ C.toast(C.errText(e),'e'); } finally{ b.disabled=false; } };
  $('#out').onclick=async function(){ try{ await sb.rpc('club_student_logout',{p_token:tok()}); }catch(e){} setTok(''); ME=null; vLogin(); };
  $('#rf').onclick=function(){ loadMe().catch(function(e){ C.toast(C.errText(e),'e'); }); };
  $('#cpw').onclick=changePw;
}
function bmiOf(w,h){ w=Number(w); h=Number(h); if(!(w>0&&h>0)) return ''; return (w/((h/100)*(h/100))).toFixed(1); }
function bodyHtml(){
  var b=ME.body||{}, log=ME.body_log||[], inj=b.injuries||[];
  if(b.weight_kg==null&&b.height_cm==null&&!b.body_status&&!inj.length&&!log.length) return '';
  var bmi=bmiOf(b.weight_kg,b.height_cm);
  return '<section class="box"><h3 class="h">💪 '+t('body')+'</h3><div class="att">'+
    '<div><b>'+(b.weight_kg!=null?esc(b.weight_kg):'—')+'</b><span class="muted">'+t('weight')+' ('+t('kg')+')</span></div>'+
    '<div><b>'+(b.height_cm!=null?esc(b.height_cm):'—')+'</b><span class="muted">'+t('height')+' ('+t('cm')+')</span></div>'+
    '<div><b>'+(bmi||'—')+'</b><span class="muted">'+t('bmi')+'</span></div></div>'+
    '<div class="kv"><div><b>'+t('body_status')+'</b>'+esc(b.body_status||'—')+'</div>'+
    '<div style="grid-column:1/-1"><b>'+t('injuries')+'</b>'+(inj.length?'<div class="dots" style="margin-top:4px">'+inj.map(function(x){ return '<span style="background:var(--badbg);color:var(--bad)">'+esc(x)+'</span>'; }).join('')+'</div>':'<span class="muted">'+t('no_injuries')+'</span>')+'</div>'+
    (b.injury_notes?'<div style="grid-column:1/-1">'+esc(b.injury_notes)+'</div>':'')+'</div>'+
    (log.length>1?'<div style="margin-top:12px"><b style="font-size:13px">'+t('body_hist')+'</b>'+log.map(function(x){ return '<div class="pay"><span>'+esc(C.fmtDate(x.on))+'</span><span>'+(x.weight_kg!=null?esc(x.weight_kg)+' '+t('kg'):'')+(x.height_cm!=null?' · '+esc(x.height_cm)+' '+t('cm'):'')+(x.body_status?' · '+esc(x.body_status):'')+'</span></div>'; }).join('')+'</div>':'')+
    '</section>';
}
function cardData(){ return {club:Object.assign({},PUB.club,ME.club), student:ME.student, level:ME.level, group:ME.group}; }
function drawCard(){ C.renderCard(SIDE,cardData()).then(function(cv){ var b=$('#cardBox'); if(b){ b.innerHTML=''; b.appendChild(cv); } }).catch(function(e){ var b=$('#cardBox'); if(b) b.innerHTML='<div class="cl-msg e">'+esc(C.errText(e))+'</div>'; }); }
function changePw(){
  C.modal({title:t('change_pw'),body:'<div class="fld"><label>'+t('old_pw')+'</label><input type="password" id="o" dir="ltr" autocomplete="current-password"></div><div class="fld"><label>'+t('new_pw')+'</label><input type="password" id="n" dir="ltr" autocomplete="new-password"></div>',
    onSave:async function(api){ var r=await sb.rpc('club_student_password',{p_token:tok(),p_old:$('#o',api.el).value,p_new:$('#n',api.el).value}); if(r.error) throw r.error;
      var d=r.data||{}; if(!d.ok){ if(d.reason==='session'){ setTok(''); api.close(); vLogin(); return; } api.msg(t(d.reason==='bad_old'?'bad_old':'short'),'e'); return false; }
      C.toast(t('pw_changed'),'s'); }});
}

document.addEventListener('click',function(e){ var b=e.target.closest('[data-lang]'); if(!b) return; C.setLang(b.getAttribute('data-lang')); paintLang(); C.applyAll(); if(ME) vProfile(); else if(PUB&&PUB.ok) vLogin(); });

async function boot(){
  if(!SLUG){ msgBox(t('not_found')); return; }
  try{
    var r=await sb.rpc('club_public',{p_slug:SLUG}); if(r.error) throw r.error; PUB=r.data||{};
    C.initLang(PUB.club?PUB.club.default_lang:'ar');
    if(PUB.reason==='not_found'){ msgBox(t('not_found')); return; }
    brand(PUB.club);
    if(!PUB.ok){ msgBox(t('club_off')); return; }
    if(tok()) await loadMe(); else vLogin();
  }catch(e){ C.initLang('ar'); msgBox(C.errText(e)); }
}
boot();
})();
</script>
</body>
</html>
