[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---- API ----
[[redirects]]
  from = "/api/whish/create"
  to = "/.netlify/functions/whish-create"
  status = 200

[[redirects]]
  from = "/api/whish/callback-success"
  to = "/.netlify/functions/whish-callback-success"
  status = 200

[[redirects]]
  from = "/api/whish/callback-failure"
  to = "/.netlify/functions/whish-callback-failure"
  status = 200

[[redirects]]
  from = "/api/store-invoice"
  to = "/.netlify/functions/store-invoice"
  status = 200

# ---- pages ----
[[redirects]]
  from = "/i/*"
  to = "/invoice.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/super/*"
  to = "/super.html"
  status = 200

# لازم يبقى الأخير: أي مسار آخر = slug مطعم
[[redirects]]
  from = "/*"
  to = "/menu.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
